中期主线，但短期需警惕 <strong>\"高景气遇上高拥挤\"</strong> 的风险——成交占比与估值分化共振，板块内部波动率放大。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">情绪 积极</span></div>\n<p class=sn><strong>资金面：</strong>HBM概念是近期AI硬件主线中资金最活跃的方向之一。三星HBM4E样品交付强化了行业景气预期。</p>\n<p class=sn><strong>基本面：</strong></p>\n<ul>\n<li><strong>三星：</strong>5月29日宣布已向全球客户交付业内首批 <strong>12层48GB HBM4E样品</strong>（继2月首家量产HBM4后再度领先），性能较HBM4再提升20%+，采用1c DRAM工艺+4nm逻辑基片</li>\n<li><strong>HBF路线：</strong>SK海力士与闪迪推动HBF（高带宽闪存）标准化，计划2026年下半年推出首款原型样品</li>\n<li><strong>价格飙升：</strong>HBM3E现货价格半年暴涨超300%，有价无货，\"存力瓶颈\"取代GPU成为算力第一刚需</li>\n<li>Counterpoint预测AI ASIC对HBM需求到2028年将达2024年的 <strong>35倍</strong></li>\n</ul>\n<p class=sn><strong>情绪面：</strong>A股存储概念股（兆易创新、澜起科技等）5月29日仍是北向资金成交活跃标的。存储涨价周期叠加国产替代逻辑，中长期看多情绪浓厚。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">情绪 偏多</span></div>\n<p class=sn><strong>资金面：</strong>一级市场融资热度持续攀升：2026年截至5月26日国内机器人融资434起、金额746亿元（同比+238%）。二级市场机器人概念关注度持续提升，宇树科技科创板IPO于6月1日上会审议，募资42亿元。</p>\n<p class=sn><strong>基本面：</strong></p>\n<ul>\n<li><strong>重要时间节点：</strong>2026年6月1日，工信部批准发布的《人工智能 关键基础技术 具身智能基准测试方法》（YD/T 6770—2026）正式实施，具身智能评测迈入\"有标可依\"新阶段</li>\n<li><strong>人形机器人价格骤降：</strong>优必选Walker系列从598.8万元降至29.9万元（-95%），宇树科技均价从59万降至16.76万（-71.7%），松延动力Bumi小布米降至 <strong>9,998元</strong>——万元以下人形机器人已出现！</li>\n<li><strong>宇树科技：</strong>6月1日科创板IPO上会审议，\"具身智能体验馆\"亚洲首店已开业</li>\n<li><strong>美军方测试：</strong>美国公司计划向乌克兰发送升级版人形机器人进行军事用途测试</li>\n</ul>\n<p class=sn><strong>政策面：</strong>《人形机器人全生命周期管理规范》标准发布，\"一机一码\"全链条管理加速产业规模化。发改委明确\"加快推进具身智能训练基础设施建设\"。</p>\n<p class=sn><strong>情绪面：</strong>6月1日具身智能标准实施+宇树科技IPO上会+成本骤降至万元级别，三催化剂共振，机器人板块情绪偏多。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">情绪 乐观</span></div>\n<p class=sn><strong>资金面：</strong>5月29日主力资金大量涌入通信硬件方向——亨通光电（+39.76亿）、长芯博创（+13.31亿）、剑桥科技（+11.73亿）领衔，CPO/光模块方向连续5日累计净流入超255亿。</p>\n<p class=sn><strong>基本面：</strong></p>\n<ul>\n<li><strong>LightCounting预测：</strong>2026年全球光模块市场保持 <strong>60%增速</strong>，2031年市场规模近600亿美元</li>\n<li><strong>1.6T放量元年：</strong>英伟达将2026年1.6T光模块采购计划从700万只上调至 <strong>2000万只</strong>，硅光占比72%</li>\n<li>中际旭创2026Q1营收194.96亿元（+192%），净利润57.35亿（+262%），业绩高增验证行业景气度</li>\n<li><strong>台积电COUPE平台</strong>预计2026年进入量产，CPO技术从0到1落地关键里程碑</li>\n<li>黄仁勋今日演讲预计涉及GPU互联技术（CPO方向），市场高度敏感</li>\n</ul>\n<p class=sn><strong>情绪面：</strong>CPO是年初至今表现最强的AI细分方向之一，部分龙头年内涨幅超60%。上周五板块内部出现分化——龙头抗跌、二线补涨后回调，高位震荡格局。今日COMPUTEX黄仁勋演讲是短期情绪核心催化剂。</p>\n</div>\n\n<hr>\n\n<h2>三、主流净流入板块监控（上交易日回顾：5月29日）</h2>\n\n<p>5月29日A股三大指数集体收跌，但 <strong>风格切换信号明确</strong>——主力资金从高位科技大举撤出，转向防御与低位板块：</p>\n\n<table>\n<tr><th>排名</th><th>板块方向</th><th>主力净流入（估算）</th><th>驱动因素</th></tr>\n<tr><td>1</td><td><strong>通信线缆/光模块</strong></td><td><strong>≈130亿（2日累计）</strong></td><td>CPO景气度+亨通光电/长飞光纤领涨</td></tr>\n<tr><td>2</td><td><strong>酿酒</strong></td><td><strong>≈46.68亿</strong></td><td>防御+消费复苏+贵州茅台主力+9.19亿</td></tr>\n<tr><td>3</td><td><strong>电力</strong></td><td><strong>≈43亿</strong></td><td>算电协同概念+业绩稳健+估值低位</td></tr>\n<tr><td>4</td><td>新能源（宁德时代）</td><td>≈10.48亿</td><td>创业板权重+超跌反弹</td></tr>\n<tr><td>5</td><td>铁路公路（红利）</td><td>估计20亿+</td><td>防御属性+高股息</td></tr>\n<tr><td>6</td><td>煤炭</td><td>估计10亿+</td><td>红利策略扩散</td></tr>\n<tr><td>7</td><td>央企/中字头</td><td>资金零星流入</td><td>中国移动+中国广核获主力净流入</td></tr>\n<tr><td>8</td><td>半导体设备</td><td>资金分化</td><td>高位承压，但国产替代逻辑未变</td></tr>\n<tr><td>9</td><td>银行</td><td>估计净流出</td><td>科技兑现时银行承压</td></tr>\n<tr><td>10</td><td>AI算力（整体）</td><td>净流出</td><td>获利了结为主，但CPO/通信硬件方向逆势流入</td></tr>\n</table>\n\n<p><strong>分析：</strong>5月29日的资金切换是\"<strong>高位科技→防御+低位价值</strong>\"的典型轮动。通信线缆方向（亨通光电、长飞光纤、中天科技等）是例外——它们受益于CPO行业景气度扩散至\"光传输+线缆\"环节，资金继续加仓。AI板块整体热度排名从前期的\"第一梯队\"回落至\"分化格局\"，但CPO方向仍属全市场最热门赛道。</p>\n\n<p><strong>北向资金动态：</strong>5月29日北向资金成交4734亿，占A股总成交额14.26%。沪股通前三：工业富联（45.25亿）、澜起科技（42.03亿）、兆易创新（33.86亿）；深股通前三：宁德时代（97.55亿）、中际旭创（76.17亿）、天孚通信（62.43亿）。北向资金在AI科技股上交易极为活跃。</p>\n\n<hr>\n\n<h2>四、关键异动个股</h2>\n\n<div class=\"sect-card\">\n<p class=sn><strong>1️⃣ 亨通光电（600487）— 5月29日主力净流入39.76亿</strong></p>\n<p>光通信/线缆龙头，受益于CPO景气度扩散至光纤光缆环节。当日涨停（+9.42%），成交额创历史新高。市场逻辑：AI数据中心集群建设带动光纤基础设施需求爆发式增长。</p>\n</div>\n\n<div class=\"sect-card\">\n<p class=sn><strong>2️⃣ 宇树科技 — 今日科创板IPO上会审议</strong></p>\n<p>国产四足/人形机器人龙头，IPO计划募资42亿元。估值逻辑参考：一级市场\"百亿估值俱乐部\"持续扩容（银河通用投后估值超200亿、普渡科技跻身百亿）。美团的战略投资或成最大赢家。上会结果预计今日发布。</p>\n</div>\n\n<div class=\"sect-card\">\n<p class=sn><strong>3️⃣ 中际旭创（300308）— AI光模块绝对龙头</strong></p>\n<p>5月29日深股通成交额76.17亿，仅次于宁德时代。2026年Q1净利润57.35亿（+262%），1.6T硅光良率95%。黄仁勋今日演讲中提及CPO技术路线的可能性极大，中际旭创作为CPO核心标的高度敏感。</p>\n</div>\n\n<hr>\n\n<h2>五、总结与展望</h2>\n\n<h3>📋 今日关注清单（6月1日 周一）</h3>\n\n<ol>\n<li><strong>11:00 黄仁勋COMPUTEX主题演讲</strong> — 这是今日全市场最重要的单一事件。Rubin机架架构披露的散热/互联/供应商细节，可能直接引爆相关A股概念板块</li>\n<li><strong>宇树科技IPO上会</strong> — 若过会，将提振A股机器人板块情绪</li>\n<li><strong>具身智能评测标准正式实施</strong> — 产业规范化里程碑</li>\n<li><strong>上金所调降保证金</strong> — 白银保证金比例从24%降至21%，对贵金属市场偏积极</li>\n<li><strong>A股风格切换观察</strong> — 上周五科技高位的获利了结是否会延续，资金是否会回流AI主线</li>\n</ol>\n\n<h3>🔮 今日A股预判</h3>\n\n<p>6月首个交易日，受COMPUTEX催化，预计AI主线将出现\"<strong>低开高走</strong>\"或\"<strong>震荡分化</strong>\"格局：</p>\n<ul>\n<li>CPO/光模块（中际旭创、新易盛、天孚通信、亨通光电等）受黄仁勋演讲直接催化，大概率高开</li>\n<li>人形机器人板块（宇树IPO+标准实施）有望获得资金关注</li>\n<li>算力芯片（寒武纪、海光信息）短期消化估值，但中期国产替代逻辑坚固</li>\n<li>存储方向（澜起科技、兆易创新）受三星HBM4E发布利好，情绪偏正</li>\n<li>但需警惕\"<strong>冲高回落</strong>\"——华泰证券已提示\"结构脆弱性偏强\"，高拥挤交易下的盘中震荡可能加剧</li>\n</ul>\n\n<p>配置建议：<strong>科技主线逢低加仓</strong>，同时以红利（电力、铁路公路、煤炭）作组合稳定器。6月进入中美财报真空期，短期或存在风格再平衡需求，但AI产业趋势仍在、增量资金仍有基础，AI仍为中期主线。</p>\n\n<hr>\n\n<p class=footnote>免责声明：本报告基于公开信息整理，仅供参考，不构成投资建议。市场有风险，投资需谨慎。</p>"}, {"id": "mon-20260601-0707", "date": "2026-06-01 07:07", "title": "AI板块早间速览 · 白银跌至75美元 聚焦宇树上会+Computex开幕", "tags": ["早间速览", "白银大跌", "宇树科技", "Computex", "算力", "高切低", "戴尔财报"], "summary": "A股休市。COMEX白银跌至75美元(日内-3%)。宇树科技IPO今日上会，Computex明日开幕。戴尔AI营收+757%飙涨35%，产业基本面强劲。", "html": "\n<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">-0.73%</div><div class=\"lbs\">上证指数(上周五)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50(上周五)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">3.32万亿</div><div class=\"lbs\">成交额</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.01$</div><div class=\"lbs\">COMEX白银</div></div>\n</div>\n\n<h1>AI板块早间速览 · 白银跌至75美元 聚焦今日Computex开幕</h1>\n<p><strong>时间：</strong>2026-06-01 07:07（A股上周五已收盘，本周一尚未开盘）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>当前A股休市，本周一（6月1日）尚未开盘。今日是关键的<strong>催化日</strong>——宇树科技科创板IPO今日上会，Computex 2026大会明日(6/2)开幕。隔夜外盘：COMEX白银期货大跌至75美元附近，美股上周五AI板块全面走强。戴尔AI服务器营收+757%盘后飙升35%。整体格局：<strong>A股上周五科技高切低，但AI产业基本面强势不改，本周催化密集。</strong></div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.25 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.82%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.01 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.36%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">纽约期银</div><div class=\"iv\"><strong>73.55 美元/盎司</strong> <span class=\"pill pill-down\">日内 -3.00%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.00</strong> <span class=\"pill pill-up\">日内 +0.07%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货黄金</div><div class=\"iv\"><strong>4,506.56美元/盎司</strong> <span class=\"pill pill-down\">-1.40%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>~18,035元/千克</strong> <span class=\"pill pill-mid\">区间震荡</span></div></div>\n</div>\n\n<p><strong>最新行情（北京时间6月1日早间）：</strong>COMEX白银期货今日延续弱势，早盘一度跌破75美元整数关口，最低探至73.55美元（日内跌超3%），随后小幅反弹至75.25美元附近。现货白银同步走弱报75.01美元，日内跌0.36%。</p>\n\n<p><strong>近期趋势判断：</strong>白银经历剧烈波动——自1月29日创下121美元/盎司历史高点后已接近腰斩。5月初从70美元启动七连涨至89美元，随后因CPI数据超预期暴跌至73美元。近期在<strong>72-80美元区间宽幅震荡</strong>，今日盘中一度跌破75美元强支撑，短线空头力量增强。</p>\n\n<p><strong>驱动因素分析：</strong></p>\n<ul>\n  <li><strong>美元指数企稳：</strong>美元指数日内微涨0.07%至99.00，从前期低位略有反弹，对贵金属构成短线压力</li>\n  <li><strong>美联储6月维持利率不变概率99.3%：</strong>市场几乎100%定价6月不加息，短期贵金属缺乏货币政策的额外催化</li>\n  <li><strong>美伊和谈乐观预期：</strong>市场对霍尔木兹海峡通航的乐观情绪增强，地缘风险溢价下降</li>\n  <li><strong>工业需求：</strong>光伏+AI硬件（PCB/数据中心电力）对白银工业需求维持高位，但短期受宏观情绪拖累</li>\n  <li><strong>CFTC持仓：</strong>截至5月26日，COMEX白银投机净多头减少1517手至10,244手，短线看涨情绪降温</li>\n  <li><strong>波动率持续高位：</strong>5月中旬单日跌超9%后市场波动率系统性提升，价格急涨急跌特征明显</li>\n</ul>\n<blockquote>💡 白银自1月121美元高点回撤约38%，当前72-80美元区间震荡。日内跌破75美元显示空头压力加大，短线支撑看72美元（前低），上方压力80美元。波动剧烈，注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（上周五5/29回顾）</h2>\n<p>A股上周五三大指数高开低走全线收跌，科创50暴跌5.04%领跌全场：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong> 放量下跌</div></div>\n</div>\n\n<p>全市场仅<strong>1565只上涨</strong>，3867只下跌，涨跌比约3:7。主力资金净流出<strong>831.55亿元</strong>，连续多日净流出。北向资金总成交4734亿元（占两市14.26%）。食品饮料(+3.02%)、煤炭(+2.13%)、公用事业(+2%+)领涨；综合(-5.39%)、国防军工(-4.23%)、电子(-4%+)领跌。</p>\n\n<p><strong>周末重要资讯：</strong></p>\n<ul>\n  <li>财联社援引券商策略：<strong>A股6月将延续高位震荡</strong>，科技主线或内部聚焦。盘面高低切换是\"对极致结构化行情的消化，而非基本面趋势逆转\"。高风险偏好资金的情绪演绎与仓位博弈已趋于充分。</li>\n  <li>方正证券：AI主线继续演绎，同时兼顾HALO资产左侧布局机会。国产算力龙头逢低布局，关注AI缺电、科技新技术新材料等方向。</li>\n  <li>十大券商策略：短期波动或加大，但并非行情反转。AI已成为兼具产业增长与波动放大双重属性变量，景气尚未见顶。</li>\n  <li>A股已达\"盈利驱动的上行阶段\"（招商证券），预计6月指数呈\"震荡上行、高点抬升\"格局。</li>\n  <li>A股5月极端分化：584家公司股价创新高，近4000家公司月线下跌。资金抱团AI等热门赛道的集中体现。</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>上周五AI板块<strong>全面回调，集体退潮</strong>。人工智能指数(BK0800)收跌<strong>3.06%</strong>，成交额5398亿元。科创人工智能指数(950180)下跌<strong>3.52%</strong>。</p>\n<p>但需要关注<strong>核心矛盾</strong>：A股AI板块调整更多是\"<strong>高切低</strong>\"的资金博弈——产业基本面并未变化，甚至持续走强：</p>\n<ul>\n  <li><strong>戴尔财报：</strong>AI服务器营收161亿美元同比+757%，盘后飙升35%创历史新高，上调全年预期至600亿美元</li>\n  <li><strong>Cerebras上市：</strong>首日暴涨89%市值达750亿美元</li>\n  <li><strong>纳指七连涨创新高，</strong>费城半导体+1%，AI交易热潮仍在升温</li>\n  <li><strong>博通：</strong>2026财年Q1 AI半导体收入+106%至84亿美元，CEO预计2027年AI芯片收入达1000亿美元</li>\n  <li><strong>SpaceX 2万亿IPO：</strong>额外增加700亿美元AI基础设施支出，大部分流向亚洲供应链</li>\n</ul>\n<p><strong>上周整周回顾：</strong>周三\"冰\"（科技退潮科创50-5%），周四\"火\"（创业板首超沪指、易中天创新高），周五\"冰\"（全面回调）——两日极端的\"冰火两重天\"切换，反映市场情绪极度敏感、多空分歧剧烈。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">A股回调·美股强势·产业景气最强</span></div>\n<p class=\"sn\"><strong>资金面（A股）：</strong>上周五电子行业主力净流出372亿元居全行业第一。中芯国际主力净流出31.4亿居全市场第一。但算力ETF申购量在回调中有所增加，部分聪明资金已在低位承接。北向资金占成交额14.26%，外资仍在关注。</p>\n<p class=\"sn\"><strong>资金面（美股/海外）：</strong>隔夜美股AI全面大涨——高通+6%、ARM+5%创历史新高、博通+3.2%、美光+3.5%续创新高、微软+3%。Cerebras首日+89%。戴尔盘后飙升35%。海外资金加速布局亚洲AI供应链。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周<strong>Computex 2026（6/2-6/5）</strong>开幕，以\"AI Together\"为主题，预计英伟达黄仁勋、AMD苏姿丰等发表演讲。发改委明确\"指导国产大模型加快适配国产算力芯片\"——国产算力替代获得顶层设计背书。市场监管总局&发改委联合发布《人工智能计量体系建设指引(2026版)》。工信部发布具身智能基准测试方法标准，今日（6月1日）正式实施。</p>\n<p class=\"sn\"><strong>基本面：</strong>全球AI资本开支全面上修——四大云厂商2026年支出7250亿美元(+77%)。OpenAI及Anthropic超高速增长验证AI模型能力边界持续扩张。国泰海通维持海外AI算力及应用\"增持\"评级，建议关注GPU/ASIC、CPU、存储、先进封装等硬件供应链。君子乾乾程成：AI产业当前并未形成过大泡沫，长期看好科技成长机遇。</p>\n<p class=\"sn\"><strong>情绪面：</strong>A股短期情绪谨慎。但外资持续加仓中国硬科技资产（上周外资公募密集增资）。市场对AI的认知正在从\"题材炒作\"转向\"产业兑现\"——6月A股或呈现成长与价值再均衡，AI内部将进入基于业绩确定性的\"淘汰赛\"。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">产业基本面最确定环节</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五北向资金在存储龙头上交投活跃——澜起科技沪股通成交42亿、兆易创新33.86亿，整体偏流出但成交额维持高位，说明市场关注度未减。佰维存储逆势上涨0.94%。</p>\n<p class=\"sn\"><strong>基本面（全线超预期）：</strong>HBM3E现货价半年暴涨超300%。全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（环比+80%，同比+260%），创历史新高。三星率先交付首批12层48GB HBM4E样品。HBM在AI芯片成本占比已从52%升至63%。集邦预测2026年HBM需求再增70%+。东北证券：HBM涨价预计至少持续到2027年。Counterpoint：AI服务器ASIC对HBM需求到2028年将增长35倍。Yole：HBM市场规模将从2024年170亿美元增至2030年980亿美元（CAGR 33%）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>短期股价已充分反映涨价预期，获利资金兑现。但HBM是AI产业链中<strong>供需格局最紧张</strong>的环节——2026年是HBM4决战之年，围绕英伟达Vera Rubin架构展开，各厂商规模扩产，月产能有望高涨。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">今日关键催化：宇树科技IPO上会</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五机器人板块随大盘承压，执行器/减速器等方向回调，奥比中光相对抗跌(+0.84%)。板块成交缩量，抛压逐步消化。</p>\n<p class=\"sn\"><strong>基本面（今日最强催化）：</strong>今日（6月1日）<strong>宇树科技科创板IPO上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。同时工信部发布的<strong>《具身智能基准测试方法》</strong>今日正式实施，标志着具身智能评测进入\"有标可依\"新阶段。《人形机器人全生命周期管理规范》同步发布，通过\"一机一码\"全链条管理。北京AI企业已超2500家，AI核心产业规模约4500亿元。2026世界智能产业博览会闭幕，集中展示具身智能最新成果。</p>\n<p class=\"sn\"><strong>情绪面：</strong>宇树上会是机器人板块当前最强的情绪催化剂。若顺利过会将为板块注入强心剂，带动情绪企稳回升。2026年是人形机器人<strong>从0到1量产兑现阶段</strong>。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强·产业化元年</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五光模块龙头中际旭创高位震荡（成交225亿A股第一），但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>全市场第一，剑桥科技+11.73亿、长飞光纤+10.39亿。资金正寻找CPO产业链\"新面孔\"。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达明确Q4启动CPO量产。鸿海CPO全光交换机出货目标上调至5万台以上。台积电COUPE硅光整合平台预计2026年进入量产。LightCounting预测2030年CPO市场达100亿美元。中际旭创Q1营收195亿(+192%)，净利57亿(+262%)。1.6T CPO模块有望今年底至明年初少量出货。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业趋势确定性极高，但市场对CPO替代传统可插拔光模块存在阶段性格局分歧。通信线缆方向是近期资金重点挖掘的方向，英伟达黄仁勋近期投资光芯片和光材料赛道引发市场关注。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（上周五TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>驱动类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性 + 夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联新方向，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板(PCB)</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红低估</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618+防御配置</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿，消费回流</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>煤炭</td><td><span class=\"green\">+10.88</span></td><td>中国神华净流入2.83亿，防御配置</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li><strong>电子行业</strong>（含半导体/AI算力）净流出<strong>372.05亿元</strong>全行业第一，机械设备/电力设备均超100亿</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金全面从科技撤向防御方向。</li>\n  <li><strong>通信线缆</strong>（亨通光电/长飞光纤/中天科技等）是AI板块中<strong>唯一逆势获得集中配置</strong>的方向。</li>\n  <li>AI相关板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，在全市场中相对热度降至近期冰点。</li>\n  <li><strong>对比美股：</strong>A股AI是上周五主要\"失血\"方向，而美股AI是主要\"吸金\"方向——纳指七连涨创新高，AI产业热度不减。A股和美股对AI的定价出现阶段性背离。</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>戴尔科技</strong></td><td>NYSE:DELL</td><td><span class=\"pill pill-up\">财报后飙升+35%<br>创历史新高</span></td><td>AI服务器营收161亿美元同比+757%，全年AI预期上调至600亿美元。全球最强AI硬件业绩验证。</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>A股第一</span></td><td>通信线缆龙头，CPO/算力互联概念延伸，主力资金集中追棒的新方向</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>A股第一</span></td><td>半导体龙头获利回吐，昨日创历史新高后今日大幅回调，拖累AI板块</td></tr>\n  <tr><td><strong>博通</strong></td><td>NASDAQ:AVGO</td><td><span class=\"pill pill-up\">AI半导体收入106%增长</span></td><td>定制AI ASIC业务受益于超大规模企业自研芯片，谷歌TPU+Anthropic收入超预期，2027年目标千亿。</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3已下线投入内部测试，Q2启动量产，首代目标年产能100万台。今日宇树科技IPO上会是板块标志性事件。A股核心受益标的梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机，灵巧手核心驱动部件</td><td>⭐⭐</td></tr>\n</table>\n\n<p><strong>宇树科技IPO上会</strong>今日（6月1日）为关键节点。2026年是人形机器人<strong>从0到1量产兑现阶段</strong>。板块适合<strong>逢低布局</strong>，核心仓位以三花+绿的谐波为主，传感器/电机/灵巧手作为卫星仓位。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股休市中（上周五已收盘）。本日（周一）尚未开盘。A股上周五高切低全线回调，但隔夜美股AI全线大涨，AI产业基本面强劲不改。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 今日关键事件</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 宇树科技科创板IPO上会</strong>（人形机器人第一股，拟募资42亿）<br><strong>2) 《具身智能基准测试方法》正式实施</strong>（工信部发布）<br><strong>3) Computex 2026明日开幕预热</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">📅 本周重要日历</div><div class=\"iv\" style=\"font-size:14px\"><strong>周一6/1：</strong>宇树IPO上会 / 具身智能标准实施<br><strong>周二-周五6/2-6/5：</strong>Computex 2026（全球AI最强催化）<br>— 黄仁勋/苏姿丰主题演讲<br>— 可能发布Vera Rubin架构细节<br>— AI PC/AI服务器/液冷/机器人集中发布<br><strong>美国非农数据</strong>（影响美联储降息预期）</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 本周推演</div><div class=\"iv\" style=\"font-size:14px\">受戴尔财报+35%和美股AI全面上涨带动，A股AI板块周一有望<strong>企稳修复</strong>。通信线缆方向（亨通光电）可能延续强势。宇树上会若闯关成功将催化机器人板块。关键看成交量——若放量则有望开启反弹，若缩量则延续调整。方正证券建议\"核心标的逢低布局\"。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银日内跌至73.55-75.25美元区间，短线空头力量增强。美伊和谈乐观预期叠加美联储6月按兵不动概率99.3%，白银短期缺乏强力催化。72美元为关键支撑位，若跌破可能加速下探。沪银上周五夜盘+0.64%，相对抗跌。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">①A股主力连续多日大幅净流出（831亿单日），筹码消化需要时间；②美伊局势不确定性；③科技股估值高位需业绩验证；④A股5月极致分化（584家新高vs 4000家下跌），市场结构脆弱。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>1)</strong> 关注戴尔财报对A股AI服务器/算力产业链传导效应<br><strong>2)</strong> 逢低布局算力/光模块龙头，等待Computex催化剂<br><strong>3)</strong> CPO通信线缆方向（亨通/长飞/中天）值得重点跟踪<br><strong>4)</strong> 宇树上会结果决定机器人板块本周方向<br><strong>5)</strong> 保持均衡仓位，AI逢低加仓，布局供需双向改善品种（电力链等），红利做稳定器</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>\n"}, {"id": "mon-20260601-0807", "date": "2026-06-01 08:07", "title": "AI板块晨间速览 · 白银冲高回落 聚焦今日Computex开幕/黄仁勋演讲", "tags": ["晨间速览", "Computex", "白银", "高切低", "宇树科技IPO"], "summary": "A股今日休市（暂无交易）。聚焦Computex2026开幕+黄仁勋11点演讲+宇树科技上会。COMEX白银冲高回落，日内波动剧烈。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4068.57</div><div class=\"lbs\">上证(29日收盘)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50(29日)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.25</div><div class=\"lbs\">COMEX白银</div></div>\n  <div class=\"metric-box\"><div class=\"num\">0.82%↓</div><div class=\"lbs\">白银日内</div></div>\n</div>\n\n<h1>AI板块晨间速览 · 聚焦Computex开幕</h1>\n<p><strong>时间：</strong>2026-06-01 08:07（A股今日尚未开盘，周末消息面盘点）</p>\n\n<div class=\"tagline\">📌 <strong>今日核心看点：</strong>今日是6月首个交易日，A股尚未开盘（市场仍在上周五收盘状态）。但今日有三大重磅催化事件——<strong>1) Computex 2026大会开幕，黄仁勋11:00发表主题演讲；2) 宇树科技科创板IPO上会；3) 国际大宗商品市场波动剧烈，白银冲高回落。</strong></div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.25 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.82%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">盘中最低</div><div class=\"iv\"><strong>73.55 美元/盎司</strong> <span class=\"pill pill-down\">日内最深跌 -3%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.01 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.36%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.00</strong> <span class=\"pill pill-mid\">低位震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银T+D</div><div class=\"iv\"><strong>约18.28元/克</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货黄金</div><div class=\"iv\"><strong>4,534美元/盎司</strong> <span class=\"pill pill-down\">日内-0.06%</span></div></div>\n</div>\n\n<p><strong>日内行情回顾：</strong>今日亚盘白银走势剧烈波动。COMEX白银期货主力早盘一度急挫<strong>逾3%</strong>至73.55美元/盎司，随后快速反弹收复至75美元上方，当前报75.25美元/盎司，日内跌幅收窄至0.82%。现货白银报75.01美元，逼近75美元整数关口。</p>\n\n<p><strong>近期趋势判断：</strong>白银当前处于<strong>72-80美元宽幅震荡区间</strong>。5月走势呈现\"冲高-暴跌-反弹-再回落\"的剧烈波动特征——自5月初70美元启动后冲高至近90美元（5月13日高点），随后因美国CPI超预期暴跌至73美元，5月25日拉升至78美元，今日再次下探73.55后反弹。短期呈现<strong>高位宽幅震荡筑底</strong>特征，多空分歧极度激烈。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元走弱提供底部支撑：</strong>美元指数报99.00，创近期新低，对贵金属整体形成支撑。美伊谈判接近达成压制美元避险需求</li>\n  <li><strong>美联储政策反复：</strong>市场对今年降息节奏的预期摇摆不定。美国4月PCE同比+3.8%创三年新高，6月降息概率不足2%。利率期货市场甚至开始定价年底前加息概率约55%</li>\n  <li><strong>工业需求中长期利好：</strong>光伏+AI数据中心建设对白银工业需求持续维持高位，但短期被宏观负面情绪压制</li>\n  <li><strong>技术面关键位：</strong>日图枢轴点位于75.49，下方支撑区间72.28-74，上方压力78-80。今明两天可能迎来方向选择</li>\n</ul>\n\n<blockquote>💡 白银当前多空分歧极大，波动剧烈。短线支撑看72-73美元区间（5月低点），上方第一压力78美元，强压力80美元整数关口。亚盘波动剧烈，操作上注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、大盘回顾（上周五收盘）</h2>\n<p>A股上周五（5月29日）三大指数高开低走全线收跌，市场呈现明显的<strong>\"高切低\"</strong>风格切换：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n  <div class=\"info-item\"><div class=\"il\">主力净流出</div><div class=\"iv\">831亿元（连续流出）</div></div>\n</div>\n\n<p>全市场仅1542只上涨，3880只下跌。食品饮料(白酒)、公用事业(电力)、煤炭等防御板块逆势走强；半导体板块领跌6.22%，中芯国际A股大跌8.97%。</p>\n\n<p><strong>5月月度回顾：</strong></p>\n<ul>\n  <li>上证指数月线收跌<strong>-1.06%</strong>，但科创50月涨<strong>+11.47%</strong>领跑，创业板月涨<strong>+9.81%</strong></li>\n  <li>通信板块月涨<strong>+20.40%</strong>、电子板块月涨<strong>+17.88%</strong>，是绝对的多头核心阵地</li>\n  <li>石油石化月跌-15%、农林牧渔月跌超-10%，周期与消费板块持续失血</li>\n  <li>仅5个申万一级行业实现月正收益，行业涨跌幅中位数约-6.5%</li>\n  <li>584家公司股价创历史新高，2132家公司已跌破沪指3000点时的价格——<strong>极致分化</strong></li>\n</ul>\n\n<hr>\n\n<h2>二、今日盘前核心催化事件</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔥 Computex 2026 开幕 · 黄仁勋11:00主题演讲</div>\n<p>6月1日-5日，Computex 2026在台北开幕，以\"<strong>AI Together</strong>\"为主题。这是全球AI领域年度最强催化窗口：</p>\n<ul>\n  <li><strong>英伟达CEO黄仁勋</strong>将于今日<strong>上午11:00</strong>发表主题演讲，揭晓驱动新一代AI的<strong>突破性技术进展</strong></li>\n  <li>市场高度关注<strong>Vera Rubin</strong> AI计算平台和Vera CPU的最新进展</li>\n  <li>AMD、英特尔、高通等芯片巨头CEO也将发声</li>\n  <li>展会首次设立<strong>机器人专区</strong>，边缘AI PC、具身智能、AI服务机器人集中亮相</li>\n  <li>大会议题覆盖：Vera Rubin GPU/CPU、CPO/硅光、液冷、800V DC power、机器人</li>\n</ul>\n<p>中信建投、招商证券等多家券商明确提示<strong>关注Computex大会的催化效应</strong>，认为算力产业链景气度正由上游向下游整机厂商传递（联想/戴尔财报超预期验证）。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🎯 宇树科技科创板IPO今日上会</div>\n<p>国产人形机器人龙头<strong>宇树科技</strong>科创板IPO今日上会，冲刺A股\"人形机器人第一股\"，拟募资<strong>42.02亿元</strong>。若顺利过会，将为人形机器人板块注入强大催化。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🌐 宏观数据前瞻</div>\n<p>本周市场关注：</p>\n<ul>\n  <li><strong>6月5日（周五）</strong>美国5月非农就业数据——前两月超预期后，若再超预期将强化<strong>加息预期</strong></li>\n  <li>市场定价年底前加息概率约55%</li>\n  <li>全球流动性面临关键考验窗口</li>\n</ul>\n</div>\n\n<hr>\n\n<h2>三、AI板块上周回顾及今日展望</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">上周获利回吐</span> <span class=\"pill pill-up\">今日聚焦Computex催化</span></div>\n<p class=\"sn\"><strong>上周回顾：</strong>算力板块上周先扬后抑。周四（5月28日）\"易中天\"齐创历史新高，但周五科技股全线退潮，半导体领跌6.22%，中芯国际单日净流出31.4亿元。经历了一轮\"冰火两重天\"的极端切换。</p>\n<p class=\"sn\"><strong>今日方向：</strong>Computex大会是算力产业链短期最大催化剂。黄仁勋演讲若释放超预期信号（Vera Rubin架构、CPO量产时间表等），有望扭转上周五的悲观情绪。戴尔AI服务器营收同比+757%、联想大涨22%等财报信号表明<strong>产业基本面持续向好</strong>。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">景气度极高，等待催化</span></div>\n<p class=\"sn\"><strong>基本面亮点：</strong>HBM涨价周期延续，东北证券预计涨价至少持续到2027年。三星率先交付12层48GB HBM4E样品，集邦预测2026年HBM需求再增70%+。全球DRAM营收Q1逼近970亿美元（同比+260%）。产业数据极为强劲。</p>\n<p class=\"sn\"><strong>市场表现：</strong>但股价已充分反映涨价预期，获利资金同样选择兑现。板块短期处于<strong>\"基本面强、股价弱\"</strong>的背离状态，等待新一轮催化。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">今日聚焦宇树上会</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周机器人板块随科技整体调整，执行器/减速器等核心环节标的跟随大盘回调。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势加速——特斯拉Optimus Gen-3 Q2启动量产，首代产线设计年产能100万台。宇树科技IPO上会是今日核心事件。2026世界智能产业博览会在天津举行，400余款机器人产品展出。工信部发布《具身智能基准测试方法》标准于6月1日正式实施，\"一机一码\"全链条管理加速产业化。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">2026产业化元年，通信线缆成新方向</span></div>\n<p class=\"sn\"><strong>产业进展：</strong>2026年机构定义为<strong>CPO产业化元年</strong>。英伟达明确Q4启动CPO量产，台积电COUPE预计2026年量产。鸿海CPO全光交换机出货目标上调至5万台以上。</p>\n<p class=\"sn\"><strong>市场表现：</strong>上周五CPO板块内部分化——光模块龙头高位震荡，但<strong>通信线缆方向</strong>净流入39.83亿元逆势走强，亨通光电主力净流入39.76亿居全市场第一。资金在寻找CPO产业链的\"新面孔\"。</p>\n</div>\n\n<hr>\n\n<h2>四、主流板块资金回顾（上周五TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期+AI算力高耗能</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技全面切换至防御方向</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红，估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏预期+避险资金配置</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台主力净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>消费品龙头资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链受益</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831亿元</strong>，连续多日净流出</li>\n  <li><strong>电子行业</strong>净流出<strong>372亿元</strong>（全行业第一），机械设备/电力设备均超100亿</li>\n  <li>电力+公用事业合计约85亿净流入，资金从科技<strong>批量迁移至防御配置</strong></li>\n  <li>通信线缆（亨通光电、长飞光纤、剑桥科技）是AI板块中<strong>唯一的逆势吸金方向</strong></li>\n  <li>AI相关板块合计净流出超<strong>400亿元</strong>——相对热度降至全市场冰点</li>\n  <li>北向资金成交4734亿但整体呈净流出态势，外资同样在\"高切低\"</li>\n</ul>\n\n<hr>\n\n<h2>五、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus人形机器人量产在即，A股核心受益环节全面梳理：</p>\n\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证环节</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，工业自动化延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td>⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>丝杠</strong></td><td>恒立液压</td><td>601100</td><td>滚柱丝杠技术储备，人形机器人线性关节核心部件</td><td>⭐⭐</td></tr>\n</table>\n\n<p><strong>最新量产进展：</strong>特斯拉Optimus Gen-3于Q1推出，Q2启动规模化量产。首代产线（弗里蒙特工厂，原Model S/X产线改造）设计年产能<strong>100万台</strong>，2026年计划实现5万-10万台产量，2027年正式面向公众销售。德州超级工厂同步筹备二期产线，远期规划年产1000万台。</p>\n\n<hr>\n\n<h2>六、关键异动个股（周五+盘前）</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">涨停，主力净流入39.76亿</span></td><td>通信线缆龙头，CPO/算力互联延伸，获主力资金集中追捧，居全市场第一</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">大跌8.97%，主力净流出31.4亿</span></td><td>半导体权重龙头，因大基金减持及获利盘集中兑现大幅回调</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>0992.HK</td><td><span class=\"pill pill-up\">港股涨22.46%</span></td><td>财报超预期，AI服务器业务成为核心增长引擎，储备AI订单超200亿</td></tr>\n</table>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股今日尚未开盘（8:07），市场仍处上周五收盘状态。但今日是<strong>重磅催化窗口</strong>，盘中需密切跟踪黄仁勋演讲和宇树上会结果。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🔥 今日三大催化</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 11:00 黄仁勋Computex主题演讲</strong> — Vera Rubin/CPO/机器人<br><strong>2) 宇树科技IPO上会</strong> — 人形机器人第一股<br><strong>3) 白银波动加剧</strong> — 亚盘急跌3%后反弹，关注后续走势</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">上周五美股三大指数<strong>齐创新高</strong>（标普+5.15%月涨幅）。戴尔飙涨33%、费城半导体+1%。AI产业热度在海外仍在升温。</div></div>\n  <div class=\"info-item\"><div class=\"il\">📰 券商核心观点</div><div class=\"iv\" style=\"font-size:14px\">招商证券：6月A股处于盈利驱动的上行第三阶段，科技主线向盈利兑现方向聚焦，不会出现成长向价值的全面切换。华泰证券：结构脆弱性偏强，短期有风格再平衡需求，但AI仍为中期主线。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续净流出格局未改。若Computex大会催化不及预期，AI板块短期可能继续调整。关注周五美国非农数据对全球流动性的冲击。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">今日建议<strong>重点关注</strong>黄仁勋演讲是否超预期——若释放强信号，算力/光模块有望率先企稳反弹。逢低关注CPO通信线缆新方向（亨通光电）。宇树上会若通过，机器人板块将迎来情绪修复。中期仍看好AI主线，短期注意控制仓位。</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-0907", "date": "2026-06-01 09:07", "title": "AI板块开盘前瞻 · Computex开幕 黄仁勋今日演讲 宇树IPO上会", "tags": ["开盘前瞻", "Computex", "黄仁勋", "宇树科技", "机器人", "COMEX白银"], "summary": "6月首个交易日聚焦三重催化：黄仁勋11:00演讲+宇树IPO上会+Computex开幕。白银75.25美元震荡。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">9:07</div><div class=\"lbs\">开盘前</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.25</div><div class=\"lbs\">COMEX白银</div></div>\n  <div class=\"metric-box\"><div class=\"num\">📅</div><div class=\"lbs\">6/1 宇树IPO上会</div></div>\n  <div class=\"metric-box\"><div class=\"num\">🎤</div><div class=\"lbs\">黄仁勋11:00演讲</div></div>\n</div>\n\n<h1>AI板块开盘前瞻 · Computex开幕日 聚焦黄仁勋演讲</h1>\n<p><strong>时间：</strong>2026-06-01 09:07（A股开盘前）</p>\n\n<div class=\"tagline\">📌 <strong>今日关键词：</strong>6月首个交易日，A股尚未开盘。今日为<strong>超级事件驱动日</strong>——宇树科技科创板IPO上会 + 英伟达GTC Taipei（黄仁勋11:00演讲）+ COMPUTEX 2026开幕。多重催化剂叠加，AI板块开盘情绪有望回暖。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.25 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.82%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.01 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.36%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力（Ag）</div><div class=\"iv\"><strong>约18,284元/千克</strong> <span class=\"pill pill-mid\">窄幅波动</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.00</strong> <span class=\"pill pill-down\">日内 -0.05%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货黄金</div><div class=\"iv\"><strong>4,541美元/盎司</strong> <span class=\"pill pill-up\">日内 +0.01%</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>COMEX白银期货报75.25美元/盎司，日内下跌0.82%。市场整体呈现<strong>低位震荡承压</strong>态势。上周五白银大幅反弹至76.08美元（+3.81%）后，今日亚洲盘小幅回调，显示75美元关口多空博弈激烈。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元弱势提供底部支撑：</strong>美元指数报99.00，持续在99关口附近运行，较前期高点显著回落，对贵金属形成支撑</li>\n  <li><strong>美联储政策预期摇摆：</strong>市场对降息节奏的分歧仍在。美国4月PCE同比+3.8%创三年新高，通胀粘性制约降息空间，但经济增长放缓压力又要求宽松</li>\n  <li><strong>工业需求逻辑：</strong>光伏+AI数据中心建设对白银工业需求构成中长期支撑，但短期受宏观情绪扰动明显</li>\n  <li><strong>技术面：</strong>白银自1月121美元历史高点大幅回落后，当前在72-80美元区间宽幅震荡。日图枢轴点位于75.49美元，支撑区间72.28-78.47美元</li>\n  <li><strong>本周关注：</strong>美国5月ISM制造业PMI（今日公布）、5月非农就业数据（本周公布），将直接影响贵金属短期走势</li>\n</ul>\n\n<blockquote>💡 白银当前处于75美元关口拉锯阶段。短线支撑看72美元，上方压力80美元整数关口。本周非农数据是重要方向催化剂。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（开盘前展望）</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">前收 4068.57 <span class=\"pill pill-mid\">上周五 -0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">前收 15575.13 <span class=\"pill pill-down\">上周五 -1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">前收 4037.95 <span class=\"pill pill-down\">上周五 -2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">前收 1751.32 <span class=\"pill pill-down\">上周五 -5.04%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\">前日 3.32万亿 <span class=\"pill pill-mid\">放量下跌</span></div></div>\n</div>\n\n<p><strong>今日开盘展望：</strong></p>\n<ul>\n  <li>5月最后一个交易日（上周五）科技板块全面退潮，科创50暴跌5.04%。但经过周末消化，叠加多重催化事件，今日A股有望<strong>平开或小幅低开后企稳</strong></li>\n  <li>多家机构预判（中国银河、国信证券等）：6月A股将延续高位震荡，科技主线地位不变，但结构或进一步收敛分化</li>\n  <li>上证指数强支撑4050点，极限支撑4000点；上方压力4090-4120点</li>\n  <li>关键看成交量能否维持2.5万亿以上，以及今日多重催化能否有效提振市场情绪</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>A股今日尚未开盘。但<strong>今日是2026年AI板块最强催化日之一</strong>：</p>\n<ul>\n  <li><strong>🎤 英伟达GTC Taipei 2026（6/1-6/4）</strong>——黄仁勋将于<strong>北京时间11:00</strong>发表主题演讲，揭晓Vera Rubin AI架构、新一代GPU及机器人战略</li>\n  <li><strong>🏢 宇树科技科创板IPO上会</strong>——冲击A股\"人形机器人第一股\"，从受理到上会仅73天</li>\n  <li><strong>🖥️ COMPUTEX 2026开幕</strong>——以\"AI Together\"为主题，AMD/英特尔/高通/Marvell等巨头齐聚</li>\n</ul>\n<p>周末催化密集，全球AI产业热度不减。上周五的调整更多是<strong>交易层面的获利了结和风格再平衡</strong>，而非产业趋势逆转。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">情绪 谨慎偏暖</span></div>\n<p class=\"sn\"><strong>资金面（上周五）：</strong>电子行业主力净流出372亿元居全行业第一，中芯国际主力净流出31.4亿居全市场之首。但调整是高位获利了结性质。</p>\n<p class=\"sn\"><strong>政策面（今日催化）：</strong>🎯 <strong>黄仁勋11:00 GTC Taipei演讲</strong>——预计发布Vera Rubin AI计算平台、Rubin CPX GPU，是算力板块最强催化剂。中信建投研报重点推荐算力产业链。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势强劲——Cerebras在美上市首日涨89%。戴尔AI服务器营收161亿美元(+757%)。四大云厂商2026年资本支出7250亿美元(+77%)。AI芯片需求确定性极高。</p>\n<p class=\"sn\"><strong>情绪面：</strong>Computex大会预期驱动下，算力板块开盘情绪有望从谨慎转向偏暖。关键是黄仁勋演讲内容能否超预期。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">情绪 乐观</span></div>\n<p class=\"sn\"><strong>资金面（上周五）：</strong>存储板块跟随半导体回调，佰维存储盘中逆势上涨0.94%成为少有的红盘股。北向资金焦灼（澜起科技成交42亿、兆易创新33.86亿）。</p>\n<p class=\"sn\"><strong>基本面：</strong>🔥 <strong>重磅消息：</strong>高盛5月31日发布存储行业报告称——本轮AI驱动的存储超级周期比预期更强、持续时间更长，2027年供需紧张将比2026年更严重，DRAM供不应求将持续至2028年！瑞银同日报告称智能体AI引爆存储超级周期，DRAM缺货持续到2028年。三星/美光/SK海力士三家存储巨头均迈过万亿美元市值门槛。</p>\n<p class=\"sn\"><strong>政策面：</strong>四部门联合印发《2026年提升全民数字素养与技能工作要点》，其中强调AI赋能教育、AI人才培育、AI普及应用。</p>\n<p class=\"sn\"><strong>情绪面：</strong>高盛+瑞银两大投行同步看多存储超级周期，DRAM供不应求延续至2028年的判断将大幅提振市场信心。存储板块是AI产业链中<strong>供需格局最紧张的环节</strong>。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">情绪 乐观</span></div>\n<p class=\"sn\"><strong>资金面（上周五）：</strong>板块随大盘回调，天永智能、奥比中光等前期强势股调整。</p>\n<p class=\"sn\"><strong>基本面：</strong>🔥 <strong>今日最重磅事件：</strong>宇树科技科创板IPO将于今日上会审议！从3月20日受理到6月1日上会仅73天，彰显政策支持力度。公司预计2026年1-6月净利润2.58亿-3.06亿元，同比大幅扭亏。若顺利过会，将成为A股\"人形机器人第一股\"。</p>\n<p class=\"sn\"><strong>基本面延伸：</strong>特斯拉Optimus Gen-3 Q2启动量产，首代目标年产能100万台。2026年是人形机器人规模化验证关键期。汽车零部件企业密集布局机器人赛道。</p>\n<p class=\"sn\"><strong>情绪面：</strong>宇树上会是今日最大情绪催化剂之一。顺利过会将为机器人板块注入强心剂，带动执行器、减速器、传感器等产业链估值重估。黄仁勋演讲中机器人相关内容也值得关注。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">情绪 结构性乐观</span></div>\n<p class=\"sn\"><strong>资金面（上周五）：</strong>板块内部分化——光模块龙头高位震荡，但通信线缆方向逆势吸金39.83亿元。亨通光电主力净流入39.76亿居全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台。LightCounting预测2030年CPO市场规模达100亿美元。中际旭创2026Q1营收195亿（+192%）、净利57亿（+262%），业绩持续爆发。</p>\n<p class=\"sn\"><strong>政策面：</strong>工信部等四部门联合推动AI+产业融合，CPO作为AI数据中心高速互连的核心技术路线持续受益。</p>\n<p class=\"sn\"><strong>情绪面：</strong>Computex大会AMD/英伟达预计更新AI互联方案。CPO产业链逻辑清晰，通信线缆作为延伸方向获资金集中配置。但光模块龙头短期涨幅巨大，需注意获利回吐风险。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（上周五5/29数据）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联概念延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+防御配置</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>消费+外资回流</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>资金流向核心发现（上周五数据，今日开盘前参考）：</strong></p>\n<ul>\n  <li>上周五全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li><strong>电子行业</strong>净流出<strong>372亿</strong>居全行业第一——但这是高位获利了结，非趋势逆转</li>\n  <li><strong>防御板块（电力+公用事业+火电+消费）</strong>合计净流入超150亿，呈现典型\"高切低\"</li>\n  <li>通信线缆方向（亨通光电+39.76亿第一）是AI板块唯一逆势吸金方向</li>\n  <li>今日开盘关注：多重催化能否吸引资金<strong>回流AI科技方向</strong>，特别是算力/机器人/CPO</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股（今日关注）</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>关注点</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">上周五净流入39.76亿</span></td><td>通信线缆龙头，CPO延伸概念，全市场主力净流入第一。关注今日能否延续强势</td></tr>\n  <tr><td><strong>宇树科技产业链</strong></td><td>未上市</td><td><span class=\"pill pill-up\">今日上会审议</span></td><td>若顺利过会将带动执行器(三花智控)、减速器(绿的谐波)、传感器(柯力传感)等受益标的</td></tr>\n  <tr><td><strong>中际旭创</strong></td><td>300308</td><td><span class=\"pill pill-mid\">高位震荡</span></td><td>光模块龙头继续关注的CPO产业化催化。Computex大会AI互联方案更新是直接催化剂</td></tr>\n</table>\n\n<hr>\n\n<h2>六、今日关键事件日历（6月1日）</h2>\n<table>\n  <tr><th>时间</th><th>事件</th><th>影响板块</th><th>重要程度</th></tr>\n  <tr><td><strong>09:30</strong></td><td>A股开盘</td><td>全市场</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>11:00 台北</strong></td><td>🎤 <strong>黄仁勋GTC Taipei主题演讲</strong></td><td><strong>算力/机器人/CPO</strong></td><td>⭐⭐⭐⭐⭐</td></tr>\n  <tr><td><strong>今日</strong></td><td>🏢 <strong>宇树科技科创板IPO上会</strong></td><td><strong>机器人板块</strong></td><td>⭐⭐⭐⭐⭐</td></tr>\n  <tr><td><strong>全天</strong></td><td>COMPUTEX 2026开幕\"AI Together\"</td><td>算力/AI芯片/机器人</td><td>⭐⭐⭐⭐</td></tr>\n  <tr><td><strong>14:00</strong></td><td>英国5月Nationwide房价指数</td><td>贵金属（间接）</td><td>⭐⭐</td></tr>\n  <tr><td><strong>22:00</strong></td><td>美国5月ISM制造业PMI</td><td>贵金属/美元</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>港股通</strong></td><td>美团Q1财报（今日披露）</td><td>港股科技</td><td>⭐⭐⭐</td></tr>\n</table>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 今日定性</div><div class=\"iv\" style=\"font-size:14px\">A股尚未开盘。今日为<strong>超级事件驱动日</strong>——黄仁勋演讲+宇树上会+Computex开幕三重催化叠加，AI板块开盘情绪有望企稳回暖。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 需重点关注</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 11:00黄仁勋演讲内容</strong>——关注Vera Rubin架构细节<br><strong>2) 宇树上会结果</strong>——A股首个人形机器人IPO<br><strong>3) 成交量能否放大</strong>——决定反弹成色</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股上周五参考</div><div class=\"iv\" style=\"font-size:14px\">上周五美股三大指数齐创新高，纳指六连涨。AI产业热度不减。A股上周五调整更多是<strong>内部筹码博弈</strong>，今日催化事件有望带动情绪修复。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银报75.25美元(-0.82%)，75美元关口博弈激烈。关注本周美国PMI和非农数据对贵金属的指引。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>逢低关注</strong>：算力（中际旭创/中科曙光）、存储（HBM产业链）、机器人（三花智控/绿的谐波）。今日催化事件密集，适合提前布局。但需注意黄仁勋演讲预期差——若不及预期可能引发短线波动。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">上周五主力资金连续大额净流出，筹码结构仍脆弱。若今日催化不及预期，科技板块仍有调整压力。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-1207", "date": "2026-06-01 12:07", "title": "AI板块午间速览 · 冲高回落 AI应用爆发 算力CPO回调", "tags": ["午评", "冲高回落", "AI应用", "CPO回调", "机器人", "宇树IPO", "GTC Taipei", "白银"], "summary": "A股冲高回落AI应用爆发，算力CPO回调，黄仁勋GTC演讲在即，宇树科技IPO上会。COMEX白银75.25美元震荡下行。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4063</div><div class=\"lbs\">上证指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.12%</div><div class=\"lbs\">沪指午盘</div></div>\n  <div class=\"metric-box\"><div class=\"num\">1.96万亿</div><div class=\"lbs\">半日成交</div></div>\n  <div class=\"metric-box\"><div class=\"num\">3800+</div><div class=\"lbs\">个股上涨</div></div>\n</div>\n\n<h1>AI板块午间速览 · 冲高回落 AI应用爆发 算力CPO回调</h1>\n<p><strong>时间：</strong>2026-06-01 12:07</p>\n\n<div class=\"tagline\">📌 <strong>今日核心主线：</strong>三大催化共振——①英伟达GTC Taipei大会今日开幕，黄仁勋11:00主题演讲；②宇树科技科创板IPO上会（\"人形机器人第一股\"）；③国家数据局/工信部AI产业政策密集加码。AI应用爆发，但算力硬件/CPO高位回调。市场呈现鲜明的<strong>高低切换</strong>特征。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.25</strong> 美元/盎司 <span class=\"pill pill-down\">日内 -0.82%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.01</strong> 美元/盎司 <span class=\"pill pill-down\">日内 -0.36%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>18,323</strong> 元/千克 <span class=\"pill pill-up\">+0.64%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>98.98-99.00</strong> <span class=\"pill pill-down\">短期走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>4,541</strong> 美元/盎司 <span class=\"pill pill-mid\">+0.01%</span></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>白银处于<strong>74-76美元高位震荡</strong>格局。上周银价一度冲高至78美元后回落至75美元附近，今日延续弱势整理。月初迎来<strong>变盘窗口</strong>，枢轴点75.49美元附近多空博弈激烈，关键支撑位72.28美元，上方压力78.47美元。</p>\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元低位震荡：</strong>美元指数报98.98-99.00，日内短期回落走弱，为白银提供计价支撑</li>\n  <li><strong>美联储鹰派预期已被消化：</strong>新任美联储主席沃什的鹰派表态已部分定价，但美国最新经济数据疲软引发衰退担忧</li>\n  <li><strong>工业属性支撑：</strong>国内白银因人民币汇率及光伏产业需求支撑，表现强于国际</li>\n  <li><strong>金银比走阔：</strong>白银走势显著弱于黄金，金银比值再度走阔，反映白银市场核心利空因素</li>\n</ul>\n\n<hr>\n\n<h2>一、大盘解读（午间收盘）</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4063.72 <span class=\"pill pill-down\">-0.12%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15481.10 <span class=\"pill pill-down\">-0.60%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4001.52 <span class=\"pill pill-down\">-0.90%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1694.60 <span class=\"pill pill-down\">-3.24% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">半日成交</div><div class=\"iv\"><strong>1.96万亿</strong>（缩量1617亿）</div></div>\n  <div class=\"info-item\"><div class=\"il\">涨跌家数</div><div class=\"iv\" style=\"color:#22c55e\">超3800只上涨</div></div>\n</div>\n<p><strong>盘面特征鲜明：</strong></p>\n<ul>\n  <li>三大指数低开冲高后<strong>震荡回落</strong>，午前低位窄幅震荡</li>\n  <li><strong>黄白线严重分化</strong>——中小盘股走强（超3800只上涨），权重股承压</li>\n  <li>科创板<strong>暴跌3.24%</strong>领跌全场，半导体/算力硬件方向大幅回调</li>\n  <li>上周五（5月29日）科技股已大幅回调（科创50跌5%），今日延续调整</li>\n  <li>缩量下跌——成交量较上个交易日缩量1617亿，<strong>抛压有所减弱</strong></li>\n</ul>\n<p><strong>今日关键催化：</strong></p>\n<ul>\n  <li>🔥 <strong>英伟达GTC Taipei 2026大会</strong>今日开幕，黄仁勋<strong>11:00发表主题演讲</strong>（台北时间）</li>\n  <li>🔥 <strong>宇树科技科创板IPO今日上会</strong>，冲刺A股\"人形机器人第一股\"</li>\n  <li>🔥 <strong>英伟达预告\"PC新时代\"</strong>——N1/N1X Arm架构AI PC芯片预期亮相</li>\n  <li>⭐ 工信部部长李乐成在《求是》杂志发文：<strong>加快前瞻布局未来产业</strong></li>\n  <li>⭐ 国家数据局印发《2026年数字经济发展工作要点》，聚焦数据赋能AI</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>AI板块<strong>内部分化极为剧烈</strong>：</p>\n<ul>\n  <li><span class=\"pill pill-up\" style=\"background:#22c55e\">🔥 AI应用端爆发</span>——天地在线3连板，视觉中国/税友股份/掌阅科技涨停，星环科技涨超17%</li>\n  <li><span class=\"pill pill-up\" style=\"background:#22c55e\">🔥 AI PC概念高开</span>——英伟达N1X PC芯片催化，春秋电子/胜利精密/英力股份涨停</li>\n  <li><span class=\"pill pill-down\" style=\"background:#ef4444\">💧 CPO/光模块回调</span>——东山精密触及跌停，CPO概念持续走弱</li>\n  <li><span class=\"pill pill-down\" style=\"background:#ef4444\">💧 算力硬件调整</span>——半导体/PCB/光纤方向领跌</li>\n  <li><span class=\"pill pill-mid\" style=\"background:#f59e0b\">✨ 煤炭/燃气走强</span>——防御属性+低估值，大有能源/郑州煤电等涨停</li>\n</ul>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">内部分化</span> <span class=\"pill pill-down\">硬件回调</span></div>\n<p class=\"sn\"><strong>资金面：</strong>今日早盘主力资金净流入<strong>计算机、文化传媒、IT服务</strong>等板块，净流出<strong>电子、半导体、机械设备</strong>等板块，其中<strong>电子板块净流出超103亿元</strong>。东山精密遭净卖出超31亿元，胜宏科技、北方华创、天孚通信资金净流出居前。</p>\n<p class=\"sn\"><strong>政策面：</strong>英伟达GTC Taipei大会今日开幕，黄仁勋11:00发表主题演讲——预计介绍<strong>Vera Rubin GPU、Vera CPU及AI工厂方案</strong>。英伟达官方发布\"A new era of PC\"预告，微软/Arm同步预热，N1X PC芯片有望成最大焦点。</p>\n<p class=\"sn\"><strong>基本面：</strong>国内科技企业资本开支步入提速周期，字节跳动拟将2026年资本支出上调至700亿美元，主要用于数据中心与AI算力布局。湘财证券认为AI商业化已进入收益兑现阶段。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场对黄仁勋演讲预期较高但观望情绪浓烈。算力硬件（半导体/GPU/AI服务器）方向获利盘回吐压力持续释放。<strong>情绪处于\"利好等待兑现\"状态</strong>，若演讲超预期可能触发午后反转。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">结构性活跃</span> <span class=\"pill pill-up\">超级周期确认</span></div>\n<p class=\"sn\"><strong>资金面：</strong>存储芯片概念局部活跃，兆易创新主力资金净买入超9.85亿元位居全市场首位。风华高科、立讯精密、太极实业获主力资金净流入居前。</p>\n<p class=\"sn\"><strong>政策面：</strong>四部门联合印发《2026年提升全民数字素养与技能工作要点》，AI素养提升纳入国家战略。市场监管总局联合发改委印发《人工智能计量体系和能力建设指引(2026版)》。</p>\n<p class=\"sn\"><strong>基本面：</strong>瑞银最新报告——市场严重低估了<strong>智能体AI对整个存储产业链的拉动作用</strong>，DRAM缺货将持续到<strong>2028年Q2</strong>，NAND缺货至2027年Q4。三星、美光、SK海力士三家存储巨头市值均突破万亿美元，HBM需求从HBM3向HBM4切换。三星全球首发12层HBM4E样品。</p>\n<p class=\"sn\"><strong>情绪面：</strong>全球存储芯片产业价值超越传统石油资源的预期持续强化。市场对存储中长期景气保持高度乐观，但短期股价已反映涨价预期，等待新催化剂。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">今日最大催化</span> <span class=\"pill pill-up\">情绪高涨</span></div>\n<p class=\"sn\"><strong>资金面：</strong>板块整体走强，机器人ETF华夏(562500)上涨0.98%。新时达涨停(+10.04%)，中控技术涨8.30%，石头科技涨6.14%。</p>\n<p class=\"sn\"><strong>政策面：</strong><strong>宇树科技科创板IPO今日上会</strong>，冲刺A股\"人形机器人第一股\"。同时，宇树科技具身智能体验馆亚洲首店登陆上海。具身智能列入\"十五五\"未来产业，为产业发展注入强心剂。</p>\n<p class=\"sn\"><strong>基本面：</strong>宇树科技2025年营收16.99亿元，净利润2.78亿元。自研世界模型Genie Envisioner-Sim 2.0在全球评测基准World Arena榜单中位列第一。浙商证券表示三季度特斯拉机器人量产前，<strong>6月是配置机器人板块好时机</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>宇树IPO是<strong>里程碑事件</strong>，叠加COMPUTEX机器人专区和MWC\"人形机器人点球大战\"赛事，6月机器人板块催化密集，市场情绪积极。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-down\">盘中走弱</span> <span class=\"pill pill-mid\">短线调整</span></div>\n<p class=\"sn\"><strong>资金面：</strong>CPO概念盘中持续走弱，东山精密触及跌停（遭净卖出超31亿元），长盈通、长光华芯等纷纷下挫。上周通信ETF曾周净流入21.37亿，但今日获利了结压力集中释放。</p>\n<p class=\"sn\"><strong>基本面：</strong>光模块龙头此前发表声明——澄清网传不实高管演讲内容为杜撰，公司基本面未变，一季报业绩亮眼。CPO产业链需求逻辑未改变，假消息带来的波动大概率是<strong>短期的</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO龙头业绩确定性极强（中际旭创Q1净利57.35亿+262%），但\"假消息\"事件叠加高位获利盘共震，导致板块短线回调压力加大。等待情绪修复后，<strong>业绩兑现能力最强的方向将率先企稳</strong>。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（今日早盘TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块/方向</th><th>资金动向</th><th>核心驱动</th><th>驱动类型</th></tr>\n  <tr><td><strong>1</strong></td><td><strong>计算机(IT服务)</strong></td><td><span class=\"green\">早盘主力净流入</span></td><td>AI应用概念爆发，星环科技+17%，软通动力涨停</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>2</strong></td><td><strong>文化传媒</strong></td><td><span class=\"green\">早盘主力净流入</span></td><td>AI应用/AIGC概念轮动，天地在线3连板</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>3</strong></td><td><strong>AI PC概念</strong></td><td><span class=\"green\">早盘高开</span></td><td>英伟达N1X PC芯片发布预期+COMPUTEX</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td><strong>煤炭</strong></td><td><span class=\"green\">多股涨停</span></td><td>低估值+防御配置+供需格局失衡</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>5</strong></td><td><strong>钠离子电池</strong></td><td><span class=\"green\">概念活跃</span></td><td>振华新材涨超11%，新能源方向轮动</td><td><span class=\"pill pill-mid\">产业驱动</span></td></tr>\n  <tr><td><strong>6</strong></td><td><strong>燃气</strong></td><td><span class=\"green\">盘中异动</span></td><td>国新能源涨停，能源板块轮动</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td><strong>养鸡/农业</strong></td><td><span class=\"green\">涨幅居前</span></td><td>防御属性+猪周期预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>8</strong></td><td><strong>机器人</strong></td><td><span class=\"green\">ETF涨0.98%</span></td><td>宇树IPO上会+具身智能政策利好</td><td><span class=\"pill pill-up\">事件驱动</span></td></tr>\n  <tr><td><strong>9</strong></td><td><strong>存储芯片</strong></td><td><span class=\"green\">局部活跃</span></td><td>兆易创新主力净流入9.85亿居首</td><td><span class=\"pill pill-up\">基本面驱动</span></td></tr>\n  <tr><td><strong>10</strong></td><td><strong>绿色电力</strong></td><td><span class=\"green\">延续走强</span></td><td>AI用电需求+防御配置</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n</table>\n<p><strong>资金流向特征：</strong></p>\n<ul>\n  <li><strong>AI应用商业化成最大吸金方向</strong>——软件/传媒/IT服务等AI应用端全面爆发</li>\n  <li><strong>电子/半导体净流出超103亿</strong>——算力硬件端资金出逃明显，高低切换延续</li>\n  <li><strong>防御板块同步吸金</strong>——煤炭、燃气、农业等低估值方向获资金流入，显示市场避险情绪仍存</li>\n  <li><strong>AI板块相对热度：中等偏上</strong>——虽然硬件端回调，但AI应用端的爆发使AI板块整体热度仍居全市场前列，但\"内部分化\"是核心特征</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>星环科技</strong></td><td>688031</td><td><span class=\"pill pill-up\">大涨17.21%</span></td><td>AI应用概念龙头，中证人工智能产业指数成分股，AI产业指数走强带动，大数据/AI平台需求爆发</td></tr>\n  <tr><td><strong>兆易创新</strong></td><td>603986</td><td><span class=\"pill pill-up\">主力净买入9.85亿</span></td><td>存储芯片龙头，受益于存储超级周期+HBM需求扩散至DDR5/存储全品类，主力资金净买入居全市场首位</td></tr>\n  <tr><td><strong>东山精密</strong></td><td>002384</td><td><span class=\"pill pill-down\">触及跌停</span></td><td>CPO/PCB方向，遭主力净卖出超31亿元成为今日最大抛压个股。CPO概念全面回调，叠加高位获利了结</td></tr>\n  <tr><td><strong>软通动力</strong></td><td>301236</td><td><span class=\"pill pill-up\">涨停 +20.01%</span></td><td>AI全链条战略转型成效初显，AI业务营收占比超50%，完成定增募资超33亿，中信建投\"买入\"评级</td></tr>\n  <tr><td><strong>鸿博股份</strong></td><td>002229</td><td><span class=\"pill pill-up\">涨停 +9.99%</span></td><td>AI算力转型+审计整改+仲裁胜诉2.94亿债权确认，2025年AI算力营收占比超60%</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<p><strong>最新进展：</strong></p>\n<ul>\n  <li><strong>宇树科技科创板IPO今日上会</strong>——冲刺A股\"人形机器人第一股\"，拟募资42.02亿元</li>\n  <li><strong>宇树具身智能体验馆</strong>亚洲首店登陆上海，G1/R1人形机器人全系列亮相</li>\n  <li><strong>特斯拉Optimus</strong>三季度量产预期持续发酵，6月是配置窗口</li>\n  <li><strong>具身智能列入\"十五五\"未来产业</strong>，我国具身智能市场规模快速扩大</li>\n</ul>\n\n<p><strong>A股核心受益环节梳理：</strong></p>\n<table>\n  <tr><th>环节</th><th>代表公司</th><th>逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器/总成</strong></td><td>拓普集团、三花智控</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证环节</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>精密减速器</strong></td><td>绿的谐波、双环传动</td><td>谐波减速器国产龙头，最高壁垒环节</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>伺服电机</strong></td><td>汇川技术、卧龙电驱</td><td>驱控一体方案，工业自动化延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感、奥比中光</td><td>力矩/视觉传感器，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机/控制</strong></td><td>峰岹科技、恒帅股份</td><td>浙商证券6月配置重点推荐</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>长盈精密、科达利</td><td>轻量化结构件/精密件</td><td>⭐⭐</td></tr>\n</table>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 午间定性</div><div class=\"iv\" style=\"font-size:14px\">三大指数冲高回落，科创50跌3.24%延续调整。AI应用端爆发 vs 算力硬件/CPO回调——<strong>高低切换持续深化</strong>。超3800只个股上涨，黄白线分化明显。半日成交1.96万亿缩量。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 午后关键观察</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 黄仁勋GTC演讲内容</strong>（AI PC芯片/Vera Rubin）是否超预期<br><strong>2) 宇树IPO上会结果</strong>——若通过将引爆机器人板块<br><strong>3) CPO板块能否止跌</strong>——东山精密跌停后能否打开</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 策略建议</div><div class=\"iv\" style=\"font-size:14px\">AI应用端（软件/传媒）短期动能最强，但追高风险增大。CPO/算力硬件调整后性价比提升，逢低关注。机器人板块关注宇树上会结果——催化剂兑现前可持有，兑现后注意利好出尽。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">科创50两个交易日累跌超8%，科技板块情绪脆弱。市场风格若持续向防御方向切换，AI板块资金面承压。缩量环境下，热点轮动过快可能导致赚钱效应下降。</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-1407", "date": "2026-06-01 14:07", "title": "AI板块收盘前速览 · 硬切软轮动持续 存储超级周期确认 尾盘关注黄仁勋演讲影响", "tags": ["收盘前", "AI应用", "存储", "超级周期", "COMPUTEX", "CPO回调", "机器人", "白银"], "summary": "今日AI板块\"硬切软\"轮动持续，AI应用/软件接棒领涨，算力硬件回调。高盛/瑞银双重确认存储超级周期。宇树科技IPO上会+COMPUTEX开幕。", "html": "<h1>AI板块收盘前速览 · 硬切软轮动持续</h1>\n<p><strong>时间：</strong>2026-06-01 14:07（A股尾盘交易中，即将收盘）</p>\n<div class=\"tagline\">📌 <strong>今日核心基调：</strong>今日A股呈现\"硬切软\"轮动格局——AI应用/软件板块爆发领涨，算力硬件（CPO/PCB/半导体）普遍回调。科创50早盘一度跌超3.4%领跌。全市场超3800只个股上涨但指数收绿，说明调整集中在权重大盘科技股。三大催化齐聚——COMPUTEX开幕、黄仁勋演讲、宇树IPO上会。存储超级周期获高盛/瑞银双重确认。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货主力</div><div class=\"iv\"><strong>75.87 美元/盎司</strong> <span class=\"pill pill-up\">日内 +0.38%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银（伦敦银）</div><div class=\"iv\"><strong>75.20 美元/盎司</strong> <span class=\"pill pill-up\">日内 +0.53%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力（ag2608）</div><div class=\"iv\"><strong>18,226 元/千克</strong> <span class=\"pill pill-up\">+0.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">日内波动区间</div><div class=\"iv\" style=\"color:#f59e0b\">73.50 - 76.30 美元</div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\">约99.0</div></div>\n  <div class=\"info-item\"><div class=\"il\">现货黄金</div><div class=\"iv\"><strong>4,542 美元/盎司</strong> <span class=\"pill pill-mid\">日内 +0.06%</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>白银今日亚盘宽幅震荡，日内高低差约2.8美元。早盘一度失守74美元最低至73.50美元（日内跌2.47%），随后强势反弹突破76美元。整体处于<strong>74-76美元高位震荡区间</strong>，5月白银月线收阴但未破前低结构。月初迎来方向选择窗口。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元低位提供支撑：</strong>美元指数报99附近周线底部震荡，对贵金属形成计价支撑</li>\n  <li><strong>美联储政策预期：</strong>市场对今年降息预期反复摇摆，短期超跌后技术性修复</li>\n  <li><strong>工业需求端：</strong>光伏AI数据中心建设拉动白银需求，但整体工业属性弱于黄金金融属性</li>\n  <li><strong>金银比持续走阔：</strong>白银走势显著弱于黄金，金银比值再度扩大，压制银价上行空间</li>\n  <li><strong>技术面：</strong>日图中枢枢轴点75.49美元，支撑阻力区间72.28-78.47美元</li>\n</ul>\n\n<blockquote>💡 机构观点：美国银行预测银价Q4冲击100美元；瑞银下调年底预期至80美元。本周五美国非农就业数据将决定短线方向。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（盘中数据 - 临近收盘）</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">约4062 <span class=\"pill pill-down\">-0.15%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">约15438 <span class=\"pill pill-down\">-0.88%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">约3983 <span class=\"pill pill-down\">-1.36%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\" style=\"color:#ef4444\"><strong>-3.47% 💥 领跌</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">北证50</div><div class=\"iv\" style=\"color:#22c55e\"><strong>+1.52%</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">全市场半日成交</div><div class=\"iv\"><strong>1.97万亿</strong>（预计全天约3万亿）</div></div>\n  <div class=\"info-item\"><div class=\"il\">上涨家数</div><div class=\"iv\" style=\"color:#22c55e\"><strong>超3800只</strong></div></div>\n</div>\n\n<p><strong>盘面特征：</strong>指数整体冲高回落——创业板早盘一度涨超1%后跌近1%，科创50跌超3.4%。但全市场超3800只个股上涨，说明调整集中在权重科技股而非普跌。<strong>中小盘和AI应用方向表现活跃</strong>。</p>\n\n<p><strong>今日关键催化：</strong></p>\n<ul>\n  <li>🔥 <strong>COMPUTEX 2026今日盛大开幕</strong>，英伟达GTC Taipei同步举办，黄仁勋11:00发表主题演讲（发布N1X AI PC芯片+Vera Rubin GPU进展）</li>\n  <li>🔥 <strong>宇树科技科创板IPO今日上会</strong>，冲击A股\"人形机器人第一股\"</li>\n  <li>🔥 <strong>高盛/瑞银双重确认存储超级周期</strong>——DRAM供不应求持续至2028年</li>\n  <li>🔥 <strong>四部门联合印发AI素养提升工作要点</strong>，AI应用/软件板块爆发</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p><strong>AI应用端全面爆发：</strong>中证人工智能产业指数(931071)强势上涨1.20%，人工智能ETF华富(515980)上涨1.41%。但AI内部呈现显著的<strong>高低切换</strong>——AI应用/软件接棒领涨，算力硬件（PCB/CPO/光模块/半导体设备）高位回调。市场将此轮动特征归纳为\"<strong>硬切软</strong>\"逻辑。</p>\n\n<p><strong>强势方向：</strong></p>\n<ul>\n  <li><strong>AI应用/软件：</strong>星环科技涨超17%、深信服涨超14%、金山办公涨4.94亿主力净流入。AI应用概念天地在线3连板，掌阅科技4天2板</li>\n  <li><strong>信创方向：</strong>信创ETF华宝盘中涨3.63%，达梦数据涨超11%，博睿数据涨逾10%</li>\n  <li><strong>云计算方向：</strong>中证沪港深云计算产业指数上涨2%，金蝶国际涨近20%</li>\n  <li><strong>机器人方向：</strong>中证机器人指数上涨1.04%，新时达涨停，中控技术涨8%</li>\n</ul>\n\n<p><strong>弱势方向：</strong></p>\n<ul>\n  <li><strong>CPO概念：</strong>东山精密触及跌停，环旭电子、长盈通、长光华芯等跌超7%</li>\n  <li><strong>半导体：</strong>科创50跌超3.4%，半导体设备/PCB方向承压</li>\n  <li><strong>算力硬件：</strong>长芯博创跌超10%，剑桥科技跌停</li>\n</ul>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">剧烈分化</span> <span class=\"pill pill-down\">硬件回调/应用走强</span></div>\n<p class=\"sn\"><strong>资金面：</strong>电子板块半日主力净流出超<strong>103亿元</strong>（全市场流出最大）。东山精密主力净卖出超31亿居个股流出榜首，胜宏科技、北方华创、天孚通信也流出居前。但算力内部呈现显著高低切换——<strong>兆易创新</strong>获主力净买入<strong>9.85亿元</strong>逆势居首，太极实业+6.58亿、风华高科+6.18亿排名前列。软件开发行业获主力净流入超47亿元居所有申万二级行业第一。</p>\n<p class=\"sn\"><strong>政策面：</strong>工信部批复6GHz频段用于6G技术试验。四部门联合印发《2026年提升全民数字素养与技能工作要点》，AI素养提升为独立板块。监管层持续出台AI产业支持政策，算力基础设施建设基调明确。</p>\n<p class=\"sn\"><strong>基本面：</strong>中信建投继续推荐算力产业链，COMPUTEX 2026催化密集——AI基础设施从芯片向机柜与系统建设演进，联想戴尔财报均超预期（AI订单均超200亿元）。字节跳动拟将2026年资本支出上调至700亿美元。湘财证券认为AI商业化已进入收益兑现阶段。半导体涨价潮持续——意法半导体6月28日起涨价，英飞凌明确AI数据中心导致供应短缺。</p>\n<p class=\"sn\"><strong>情绪面：</strong>黄仁勋11:00的GTC台北演讲内容（N1X AI PC芯片/Vera Rubin GPU）备受关注，若超预期可能带动硬件方向尾盘修复。摩根士丹利认为中国AI叙事已从能力追赶转向价值捕获。整体AI主线信心未动摇，但短期追高意愿下降。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">超级周期确认</span> <span class=\"pill pill-up\">中长期高度乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>存储板块逆势获资金关注。兆易创新主力净流入9.85亿居全市场个股第一。太极实业净流入6.58亿。北向资金在存储龙头上交投活跃。</p>\n<p class=\"sn\"><strong>政策面：</strong>市场监管总局联合发改委印发AI计量体系指引。智能体AI应用成为存储需求新增长极。政策推动数据治理和服务赛道迎接新机遇。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>最强基本面催化——高盛和瑞银同日确认存储超级周期：</strong></p>\n<ul>\n  <li><strong>高盛重磅报告：</strong>由AI驱动的存储周期比市场预期更强且更持久，<strong>2027年供需紧张程度将比2026年更严重</strong>，供不应求有望持续到<strong>2028年</strong></li>\n  <li><strong>瑞银报告：</strong>市场严重低估智能体AI对存储产业链的拉动作用，存储需求从HBM扩散到DDR5、LPDDR5、SSD及NAND Flash等几乎所有品类</li>\n  <li><strong>DRAM供不应求</strong>持续至2028年Q2，<strong>NAND</strong>供不应求持续至2027年Q4</li>\n  <li>三星、美光、SK海力士三家存储巨头市值均突破<strong>万亿美元</strong>大关</li>\n  <li>《经济参考报》评论：AI热潮从算力芯片扩展至存储芯片</li>\n</ul>\n<p class=\"sn\"><strong>情绪面：</strong>存储产业链景气确定性极高，市场共识持续强化。\"存储芯片价值超越传统石油资源\"的观点引发广泛讨论。中长期板块信心充足。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">主要催化</span> <span class=\"pill pill-up\">情绪积极</span></div>\n<p class=\"sn\"><strong>资金面：</strong>机器人ETF华夏（562500）早盘涨0.98%，成分股新时达涨停（+10.04%）、中控技术涨8.30%、石头科技涨6.14%。随后随大盘回落至转跌0.54%。板块呈\"涨多回调\"特征，但资金关注度维持高位。</p>\n<p class=\"sn\"><strong>政策面：</strong>宇树科技科创板IPO今日上会，73天\"闪电过会\"进展，若成功将加冕A股\"人形机器人第一股\"（拟募资42亿）。国家矿山安全监察局与工信部联合启动\"矿山机器人应用验证试点\"，聚焦七大高危场景。\"十五五\"规划建议将具身智能列为未来产业。COMPUTEX首次设立机器人专区。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业催化密集——①宇树科技具身智能体验馆亚洲首店5月31日登陆上海久光百货；②智元机器人自研世界模型GE 2.0在全球World Arena榜单位列第一；③浙商证券：三季度特斯拉量产前6月是配置机器人板块好时机；④MWC上海6月24-25日将举办\"人形机器人点球大战\"；⑤2026世界智能产业博览会闭幕，具身智能展区首次独立成馆。</p>\n<p class=\"sn\"><strong>情绪面：</strong>宇树IPO上会为今日板块最大情绪催化剂。市场高度关注是否顺利过会。特斯拉Optimus量产预期+中国具身智能规模化元年，板块情绪积极但短期波动随大盘放大。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-down\">盘中持续走弱</span> <span class=\"pill pill-mid\">短期获利回吐</span></div>\n<p class=\"sn\"><strong>资金面：</strong>CPO概念今日持续走弱，为AI板块中跌幅最大细分方向。东山精密触及跌停（主力净卖出超31亿元），环旭电子、长盈通、蘅东光、长光华芯、东田微、长芯博创均跌超7%。通信ETF华夏跌超2%，成交额放大至9亿元。前期5月涨幅过大后获利回吐压力显著。</p>\n<p class=\"sn\"><strong>政策面：</strong>\"xPO赋能AI数据中心光互连论坛\"于5月28日上海举行。产业趋势上——台积电COUPE on Substrate（基板级CPO）5月官宣量产，CPO产业化元年正式开启。工信部此前要求新建智算中心CPO适配比例≥60%。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业确定性未变——2026年全球1.6T光模块需求约<strong>2700万只</strong>，硅光路线占比达80%，硅光芯片年需求超5500万只。英伟达CPO方案单台交换机需搭载144颗CW芯片。800G硅光方案较EML方案成本降低21%。LightCounting预测CPO预计2028年开始大规模部署。</p>\n<p class=\"sn\"><strong>情绪面：</strong>今日CPO板块大跌主要是<strong>技术性回调</strong>而非逻辑破坏。前期涨幅积累了大量获利盘。产业基本面未变，回调后性价比有所改善。尾盘关注黄仁勋演讲是否超预期带动修复。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控</h2>\n\n<table>\n  <tr><th>#</th><th>板块/行业</th><th>净流入参考</th><th>核心驱动</th><th>驱动类型</th></tr>\n  <tr><td><strong>1</strong></td><td>软件开发</td><td><span class=\"green\"><strong>+47亿+</strong></span></td><td>AI应用爆发+四部门AI素养政策催化+信创主线</td><td><span class=\"pill pill-up\">政策+产业驱动</span></td></tr>\n  <tr><td><strong>2</strong></td><td>IT服务</td><td><span class=\"green\"><strong>+21亿+</strong></span></td><td>AI应用商用化提速</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>3</strong></td><td>文化传媒</td><td><span class=\"green\"><strong>+20亿+</strong></span></td><td>AI+传媒游戏概念活跃</td><td><span class=\"pill pill-mid\">产业+事件驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>电池</td><td><span class=\"green\"><strong>+18亿+</strong></span></td><td>新能源板块轮动+储能需求</td><td><span class=\"pill pill-mid\">产业驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>计算机</td><td><span class=\"green\">净流入</span></td><td>AI应用+信创双主线共振</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>6</strong></td><td>消费电子</td><td><span class=\"green\">连续4日净流入</span></td><td>AI PC+英伟达N1X芯片发布</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>7</strong></td><td>煤炭</td><td><span class=\"green\">板块走强</span></td><td>防御配置+高分红逻辑</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>8</strong></td><td>电力</td><td><span class=\"green\">盘初走强</span></td><td>AI算力用电需求+夏季高温预期</td><td><span class=\"pill pill-mid\">预期驱动</span></td></tr>\n  <tr><td><strong>9</strong></td><td>AI PC</td><td><span class=\"green\">盘中活跃</span></td><td>英伟达Arm PC芯片发布催化</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>10</strong></td><td>机器人</td><td><span class=\"green\">盘中关注</span></td><td>宇树IPO上会+COMPUTEX专区</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li><strong>电子板块</strong>半日主力净流出超<strong>103亿元</strong>（全市场最大净流出），半导体/CPO/PCB流出居前</li>\n  <li><strong>软件开发</strong>板块获净流入<strong>47亿+</strong>，与电子板块形成鲜明\"<strong>硬切软</strong>\"轮动</li>\n  <li><strong>AI应用/软件+IT服务+文化传媒</strong>合计净流入近90亿元</li>\n  <li><strong>个股主力净流入TOP3：</strong>兆易创新(+9.85亿)、太极实业(+6.58亿)、风华高科(+6.18亿)</li>\n  <li><strong>个股主力净流出TOP3：</strong>东山精密(触跌停-31亿+)、胜宏科技、北方华创</li>\n  <li><strong>AI板块相对热度：</strong>AI应用方向充分吸金热度高，但硬件方向大幅失血。AI板块在全市场中处于\"<strong>结构性分化</strong>\"状态——不是整体弱而是\"<strong>一半海水一半火焰</strong>\"</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th><th>关注度</th></tr>\n  <tr><td><strong>软通动力</strong></td><td>301236</td><td><span class=\"pill pill-up\">涨停 +20.01%</span></td><td>AI全链条战略转型+定增募资33亿+AI营收占比超50%，业绩增长</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>兆易创新</strong></td><td>603986</td><td><span class=\"pill pill-up\">主力净买入9.85亿</span></td><td>存储芯片龙头，受益HBM超级周期+DRAM涨价，资金逆势加仓</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>东山精密</strong></td><td>002384</td><td><span class=\"pill pill-down\">触及跌停</span><br><span class=coral>主力净卖出-31亿</span></td><td>CPO/PCB概念前期涨幅巨大+获利兑现+控股股东质押公告扰动</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>星环科技</strong></td><td>688031</td><td><span class=\"pill pill-up\">涨超17%</span></td><td>AI应用龙头，四部门AI政策+AI商用化双重催化，领涨全场</td><td>⭐⭐</td></tr>\n  <tr><td><strong>鸿博股份</strong></td><td>002229</td><td><span class=\"pill pill-up\">涨停 +9.99%</span></td><td>AI算力转型+审计整改+仲裁胜诉2.94亿债权确认</td><td>⭐⭐</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n\n<p><strong>最新进展：</strong></p>\n<ul>\n  <li>特斯拉Optimus量产预期持续升温，三季度量产前6月被多家券商定义为\"<strong>配置窗口</strong>\"</li>\n  <li>宇树科技科创板IPO今日上会——为A股\"人形机器人第一股\"加冕</li>\n  <li>中信证券解读WIPO专利——特斯拉V3灵巧手核心升级点，执行器/自由度/传感器覆盖全面提升</li>\n  <li>特斯拉一季业绩会表示首个Optimus机器人工厂将于Q2动工，7-8月开始规模化量产</li>\n</ul>\n\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器/总成</strong></td><td>三花智控、拓普集团</td><td>002050/601689</td><td>线性/旋转执行器核心供应商</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>精密减速器</strong></td><td>绿的谐波、双环传动</td><td>688017/002472</td><td>谐波减速器/RV减速器，最高壁垒环节</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>伺服电机</strong></td><td>汇川技术、卧龙电驱</td><td>300124/600580</td><td>驱控一体方案</td><td>⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感、奥比中光</td><td>603662/688322</td><td>力矩传感器/3D视觉传感器</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>峰岹科技</td><td>688279</td><td>电机驱动芯片，WIPO灵巧手专利催化</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件/代工</strong></td><td>工业富联、长盈精密</td><td>601138/300115</td><td>整机代工+轻量化结构件</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电池/电源</strong></td><td>珠海冠宇</td><td>688772</td><td>机器人电池方案</td><td>⭐</td></tr>\n</table>\n\n<p><strong>机构重点推荐（浙商证券6月）：</strong>峰岹科技、科达利、恒帅股份、德昌股份、绿的谐波、长盈精密、奥比中光。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前特征</div><div class=\"iv\" style=\"font-size:14px\">AI板块\"硬切软\"逻辑持续演绎——AI应用/软件接棒领涨，算力硬件（PCB/CPO/半导体）高位回调。科创50跌超3.4%但全市场超3800只上涨。内部分化剧烈但非系统性风险。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 尾盘关键观察</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 黄仁勋GTC Taipei 11:00演讲</strong>——N1X PC芯片/Vera Rubin GPU发布情况<br><strong>2) 宇树科技IPO上会结果</strong>——人形机器人第一股能否顺利过会<br><strong>3) CPO/算力硬件能否企稳</strong>——决定尾盘是否修复</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 次日展望</div><div class=\"iv\" style=\"font-size:14px\">COMPUTEX大会6/2-6/5仍是AI最强催化窗口。硬件方向短期调整为正常获利回吐，产业基本面未变。存储超级周期逻辑最强。AI应用方向在政策+商用化双重催化下有望持续活跃。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">① 科技成交占比与估值分化共振，短期脆弱性偏强；② 主力资金从硬件方向大幅流出，若尾盘未企稳则调整延续；③ 6月进入中美财报真空期+美国通胀超预期风险</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">AI仍为中期主线，调整中<strong>逢低布局</strong>算力/光模块龙头（中际旭创/天孚通信/新易盛）。存储超级周期确认，关注兆易创新/存储ETF。AI应用短期活跃但需注意持续性。机器人板块关注宇树上会结果催化。</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>\n"}];
const reports = [{"id": "citic-pe", "title": "中信证券(600030) 近三年PE-TTM走势分析", "icon": "📈", "tags": ["中信证券", "PE-TTM", "估值分析"], "desc": "基于自建数据库对中信证券近三年PE-TTM走势的深度复盘与当前估值定位分析", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">16.72x</div><div class=\"lbs\">当前 PE-TTM</div></div>\n  <div class=\"metric-box\"><div class=\"num\">21.93x</div><div class=\"lbs\">近 3 年均值</div></div>\n  <div class=\"metric-box\"><div class=\"num\">13.33x</div><div class=\"lbs\">近 3 年最低</div></div>\n  <div class=\"metric-box\"><div class=\"num\">35.26x</div><div class=\"lbs\">近 3 年最高</div></div>\n</div>\n\n<h1>中信证券(600030) 近三年 PE-TTM 走势分析</h1>\n\n<div class=\"tagline\">📌 <strong>核心结论：</strong>当前 PE-TTM 16.72 倍，处于近三年偏低分位（约 30% 分位），较均值 21.93 倍折价约 23.7%。对于中长期投资者，具备较高安全边际。</div>\n\n<h2>一、PE-TTM 走势全景回顾</h2>\n<p>PE-TTM（滚动市盈率）= 股价 ÷ 最近 12 个月的实际每股收益。相比静态市盈率，它使用<strong>最新四个季度财务数据</strong>，更真实反映公司当前估值水平。</p>\n\n<h3>走势三阶段</h3>\n<p><strong>第一阶段：估值收缩期（2024 年）</strong><br>受证券行业\"降费让利\"政策预期影响，市场对券商盈利前景产生担忧。叠加成交量萎缩、自营承压，PE 从年初 20 倍区间持续下滑至年末 <strong>14.7 倍</strong>附近，全年估值中枢下移约 26%。</p>\n\n<p><strong>第二阶段：底部震荡期（2025 年初至年中）</strong><br>PE 在 <strong>13.33 ~ 15.5 倍</strong> 区间窄幅波动。市场对券商板块关注度降至低点。期间中信证券多次回购稳定投资者信心。<strong>13.33 倍</strong> 成为本轮调整的估值铁底。</p>\n\n<p><strong>第三阶段：估值修复期（2025 年下半年至今）</strong><br>市场活跃度回升 + 权益市场回暖，券商自营及经纪业务环比改善。PE 从历史底部区域反弹至 16~18 倍区间。当前 16.72 倍较底部反弹约 25.4%，但距均值仍有空间。</p>\n\n<hr>\n\n<h2>二、关键区间分析</h2>\n<table>\n  <tr><th>指标</th><th>数值</th><th>含义</th></tr>\n  <tr><td><strong>最低 PE</strong></td><td>13.33x</td><td>2025 年 7 月——近三年绝对底部，也是压力测试的极限值</td></tr>\n  <tr><td><strong>最高 PE</strong></td><td>35.26x</td><td>2024 年初\"中特估\"行情驱动</td></tr>\n  <tr><td><strong>均值 PE</strong></td><td>21.93x</td><td>近三年估值中枢</td></tr>\n  <tr><td><strong>中位数 PE</strong></td><td>18.77x</td><td>半数时间在此以下</td></tr>\n  <tr><td><strong>当前 PE</strong></td><td>16.72x</td><td>低于均值和中位数，折价约 23.7%</td></tr>\n</table>\n<p><strong>分位数：</strong>当前 16.72 倍处于近三年 PE 序列约 <strong>30% 分位</strong>——即过去三年中约 <strong>70% 的时间估值高于当前</strong>。从历史统计角度看具有明显安全边际。</p>\n\n<hr>\n\n<h2>三、驱动因素</h2>\n<ul>\n  <li><strong>市场周期：</strong>券商估值与日均成交额高度正相关。2024 日均<8000 亿 vs 2025 日均>1.2 万亿</li>\n  <li><strong>行业政策：</strong>\"降费让利\"冲击边际递减；注册制改革深化利好投行</li>\n  <li><strong>自营收益：</strong>权益市场修复是 PE 回升核心推动力</li>\n</ul>\n\n<hr>\n\n<h2>四、估值展望</h2>\n<p>当前已反映大部分不确定性，下行风险有限。若市场活跃度维持，PE 有望向均值 <strong>21.93 倍</strong> 修复，对应约 <strong>31% 上行空间</strong>。</p>\n<p><strong>操作参考：</strong>PE 进入 <strong>15 倍以下</strong> 逐步布局；PE 接近或突破 <strong>22 倍</strong> 时分批兑现。</p>\n\n<blockquote>⚠️ 以上分析仅基于公开数据和历史统计，不构成投资建议。PE 为滞后指标。</blockquote>"}, {"id": "hbm-chain", "title": "国产HBM产业链全景解析", "icon": "🔬", "tags": ["HBM", "长鑫存储", "长电科技", "安集科技"], "desc": "全面梳理国产HBM产业链现状、核心玩家与挑战，从DRAM到先进封装逐环节拆解", "html": "<h1>国产 HBM 产业链全景解析</h1>\n<p><strong>日期：</strong>2026-05-28</p>\n\n<div class=\"tagline\">国产 HBM 产业链目前处于 <strong>\"从 0 到 1，点状突破\"</strong> 的初级阶段。与国际顶尖水平（SK 海力士 HBM3E）存在 2~3 代差距，但代差已从 8 年缩至 4 年。</div>\n\n<h2>一、HBM 存储颗粒</h2>\n<table>\n  <tr><th>公司</th><th>上市</th><th>最新进展</th></tr>\n  <tr><td><strong>长鑫存储 (CXMT)</strong></td><td><span class=\"pill pill-mid\">未上市</span></td><td>HBM2 已于 2025H1 量产，HBM3 样品交付客户，目标 2027 年 HBM3E</td></tr>\n  <tr><td>武汉新芯 (XMC)</td><td><span class=\"pill pill-mid\">未上市</span></td><td>HBM2 开发中，月产能 3000 片 12 英寸工厂</td></tr>\n</table>\n<p>从成熟 DDR5 转向高性能 HBM DRAM，技术跨度大，长鑫的 HBM3 量产验证是关键一战。</p>\n\n<h2>二、先进封装</h2>\n<table>\n  <tr><th>公司</th><th>代码</th><th>技术布局</th><th>推荐</th></tr>\n  <tr><td><strong>长电科技</strong></td><td>600584</td><td>XDFOI 对标 CoWoS，2.5D/3D 封装最强竞争者</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>通富微电</strong></td><td>002156</td><td>绑定 AMD，已与长鑫合作 HBM2 样品</td><td>⭐⭐</td></tr>\n  <tr><td>华天科技</td><td>002185</td><td>TSV/3D 封装布局中</td><td>⭐</td></tr>\n</table>\n\n<h2>三、关键设备</h2>\n<ul>\n  <li><strong>TSV 刻蚀：</strong>北方华创 (002371) / 中微公司 (688012) ✅ 可国产化</li>\n  <li><strong>CMP 设备：</strong>华海清科 (688120) ✅ 国内龙头</li>\n  <li><strong>封装光刻：</strong>上海微电子——已量产出货</li>\n  <li><strong>键合设备：</strong>新益昌追赶中——<strong>最大短板之一</strong></li>\n</ul>\n\n<h2>四、关键材料</h2>\n<table>\n  <tr><th>环节</th><th>公司</th><th>代码</th><th>备注</th></tr>\n  <tr><td><strong>CMP 抛光液</strong></td><td>安集科技</td><td>688019</td><td>⭐⭐⭐ 龙头</td></tr>\n  <tr><td>光刻胶</td><td>南大光电</td><td>300346</td><td>ArF 光刻胶国产化</td></tr>\n  <tr><td>光刻胶</td><td>上海新阳</td><td>300236</td><td>KrF/ArF 光刻胶</td></tr>\n  <tr><td>电子特气</td><td>华特气体</td><td>688268</td><td>高纯气体供应商</td></tr>\n</table>\n\n<h2>五、链主：华为海思</h2>\n<p>华为定义需求 → 长鑫提 DRAM 规格 → 长电/通富开发封装 → 联合设备材料厂攻关 → 昇腾芯片落地验证。华为是整个链条的 <strong>火车头</strong>。</p>\n\n<h2>六、时间线</h2>\n<table>\n  <tr><th>时间</th><th>目标</th><th>意义</th></tr>\n  <tr><td><span class=\"pill pill-up\">2025H1 ✅</span></td><td>HBM2 量产</td><td>比预期提早约 2 年，突破意义重大</td></tr>\n  <tr><td><span class=\"pill pill-mid\">2025H2 🔄</span></td><td>HBM3 量产验证</td><td>与主流代差从 8 年缩至 4 年</td></tr>\n  <tr><td><span class=\"pill pill-mid\">2027E 🎯</span></td><td>HBM3E 量产</td><td>跳过 HBM2E 直接上 3E，追赶策略清晰</td></tr>\n</table>\n\n<blockquote>⚠️ 以上分析基于公开信息整理，不构成投资建议。</blockquote>"}, {"id": "semi-rpt", "title": "半导体投资分析：安集科技 · 源杰科技精选", "icon": "💎", "tags": ["半导体", "安集科技", "源杰科技", "CMP"], "desc": "基于野村亚太科技团队研报，梳理AI倒逼半导体工艺重构逻辑，精选筹码优良标的", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">+33%</div><div class=\"lbs\">安集 Q1 营收</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+321%</div><div class=\"lbs\">源杰 Q1 营收</div></div>\n  <div class=\"metric-box\"><div class=\"num\">77.8%</div><div class=\"lbs\">源杰毛利率</div></div>\n  <div class=\"metric-box\"><div class=\"num\">65.5%</div><div class=\"lbs\">安集机构持有</div></div>\n</div>\n\n<h1>半导体投资分析报告</h1>\n<p><strong>来源：</strong>野村证券亚太科技团队 · Donnie Teng<br><strong>日期：</strong>2026-05-27</p>\n\n<div class=\"tagline\">半导体行业增长逻辑已从\"晶体管密度提升\"转向 <strong>\"3D 晶体管 + 背面供电 + 新材料组合创新\"</strong>。AI 倒逼芯片制造底层工艺重写。</div>\n\n<h2>一、全产业链时间线</h2>\n<table>\n  <tr><th>时间</th><th>关键事件</th><th>投资方向</th></tr>\n  <tr><td><strong>2026 年</strong></td><td>GAA 晶体管、SoIC 混合键合、InP 衬底小批量</td><td>先进封装、化合物半导体</td></tr>\n  <tr><td><strong><span class=orange>2027 年（拐点）</span></strong></td><td><strong>背面供电、玻璃核心基板、晶圆键合 NAND 集中放量</strong></td><td><strong>材料+设备 配置核心窗口</strong></td></tr>\n  <tr><td>2028 年</td><td>DRAM-on-logic 规模化，边缘 AI + 汽车电子成新驱动力</td><td>异构集成、Chiplet</td></tr>\n  <tr><td>2029-2030</td><td>高 NA EUV 量产，金属氧化物光刻胶全面导入</td><td>光刻胶国产化、EUV 生态</td></tr>\n</table>\n\n<h3>野村关键论点</h3>\n<ol>\n  <li><strong>材料环节价值重估：</strong>工艺复杂度提升使材料单耗和价值量同步上升</li>\n  <li><strong>玻璃基板：</strong>博通有望 2027 年率先采用，国内厂商加速跟进</li>\n  <li><strong>硅片供需：</strong>12 英寸硅片 2027 年起供需由松转紧</li>\n  <li><strong>台积电资本开支：</strong>2027 年有望达 700 亿美元，设备端景气外溢</li>\n</ol>\n\n<hr>\n\n<h2>二、优选标的深度拆解</h2>\n\n<h3>🥇 安集科技 (688019) —— CMP 抛光液龙头</h3>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">2026Q1 营收</div><div class=\"iv\">7.24 亿 <span class=\"pill pill-up\">+33%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">净利润</div><div class=\"iv\">2.08 亿 <span class=\"pill pill-up\">+23%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">股东户数</div><div class=\"iv\">1.43 万户</div></div>\n  <div class=\"info-item\"><div class=\"il\">机构持有</div><div class=\"iv\">65.5%</div></div>\n</div>\n<ul>\n  <li>股东户数连续收敛，从 2025 年末的 1.8 万降至 1.43 万——筹码在不断集中</li>\n  <li>前十大股东集中度 58%，140 家机构持股 65.5%——机构深度锁仓</li>\n  <li>大股东零减持——管理层对股价的认可信号</li>\n  <li><strong>筹码评分：⭐⭐⭐⭐⭐</strong></li>\n</ul>\n\n<h3>🥈 源杰科技 (688498) —— 光芯片 IDM</h3>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">2026Q1 营收</div><div class=\"iv\">3.55 亿 <span class=\"pill pill-up\">+321%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">净利润</div><div class=\"iv\">1.79 亿 <span class=\"pill pill-up\">+1153%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">毛利率</div><div class=\"iv\">77.8%</div></div>\n  <div class=\"info-item\"><div class=\"il\">户均市值</div><div class=\"iv\">459 万</div></div>\n</div>\n<ul>\n  <li>营收暴增 321%，利润暴增 1153%——产业趋势爆发初期阶段</li>\n  <li>77.8% 毛利率——技术壁垒极高，IDM 模式带来强定
