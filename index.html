<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
header{background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border-bottom:1px solid #334155;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{background:#22c55e;width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ht{font-size:13px;color:#94a3b8}
.tabs{display:flex;gap:4px;padding:16px 24px 0;border-bottom:1px solid #334155;overflow-x:auto}
.tab{padding:8px 18px;border-radius:8px 8px 0 0;border:1px solid transparent;cursor:pointer;font-size:13px;color:#94a3b8;background:transparent;font-family:inherit;transition:all .15s;white-space:nowrap}
.tab.active{border-color:#334155 #334155 #0f172a;background:#0f172a;color:#f1f5f9;font-weight:600}
.tab .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.page{display:none;padding:16px 24px 24px;max-width:1200px;margin:0 auto}
.page.show{display:block}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px}
.card .lbl{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.card .val{font-size:22px;font-weight:700}
.card .sub{font-size:12px;margin-top:4px}
.green{color:#22c55e}.red{color:#ef4444}.orange{color:#f59e0b}.purple{color:#a855f7}.cyan{color:#06b6d4}.gray{color:#94a3b8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 6px;color:#94a3b8;font-weight:500;font-size:11px;text-transform:uppercase;text-align:left;border-bottom:1px solid #334155}
td{padding:7px 6px;border-bottom:1px solid rgba(51,65,85,.5)}
tr:hover td{background:rgba(59,130,246,.05)}
.code{font-size:11px;color:#64748b;font-family:monospace}
.fund-row{display:flex;align-items:center;margin-bottom:6px;font-size:12px}
.fund-row .n{width:80px;color:#94a3b8;text-align:right;padding-right:8px;flex-shrink:0}
.fund-row .b{flex:1;height:20px;border-radius:4px;overflow:hidden}
.fund-row .b div{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;color:#fff;font-size:10px;font-weight:600}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagcloud span{padding:4px 10px;border-radius:6px;font-size:12px;cursor:default}
.articles{display:flex;flex-direction:column;gap:10px}
.article{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:border .15s}
.article:hover{border-color:#3b82f6}
.article .meta{font-size:11px;color:#94a3b8;display:flex;gap:8px;margin-bottom:4px}
.article .meta .t{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:500}
.article .meta .t.mon{background:rgba(59,130,246,.15);color:#3b82f6}
.article .meta .t.rpt{background:rgba(168,85,247,.15);color:#a855f7}
.article h3{font-size:14px;font-weight:600;margin-bottom:3px}
.article p{font-size:12px;color:#94a3b8;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.article .tags span{font-size:10px;padding:1px 6px;background:rgba(59,130,246,.1);color:#3b82f6;border-radius:4px}
.search{width:100%;padding:10px 14px;border:1px solid #334155;border-radius:8px;font-size:13px;background:#1e293b;color:#f1f5f9;outline:none;font-family:inherit;margin-bottom:12px}
.search:focus{border-color:#3b82f6}
.filters{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.filters button{padding:4px 10px;border-radius:999px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:11px;cursor:pointer;font-family:inherit;transition:all .1s}
.filters button.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.rpt-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:16px;cursor:pointer;transition:border .15s}
.rpt-card:hover{border-color:#3b82f6}

.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:800px;max-height:88vh;background:#1e293b;border:1px solid #334155;border-radius:14px;z-index:201;flex-direction:column;box-shadow:0 25px 80px rgba(0,0,0,.5)}
.modal.show{display:flex}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;backdrop-filter:blur(6px)}
.overlay.show{display:block}
.modal .mh{padding:16px 20px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;flex-shrink:0}
.modal .mh button{background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;padding:0 4px}
.modal .mb{padding:20px;overflow-y:auto;line-height:1.7;font-size:14px}
.modal .mb h1{font-size:22px;margin:20px 0 8px;font-weight:700}
.modal .mb h2{font-size:17px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid #334155;font-weight:600}
.modal .mb h3{font-size:15px;margin:12px 0 4px;font-weight:600}
.modal .mb h4{font-size:13px;margin:10px 0 3px;font-weight:600}
.modal .mb p{margin-bottom:10px;font-size:14px;line-height:1.8}
.modal .mb strong{color:#fff}
.modal .mb blockquote{border-left:3px solid #3b82f6;margin:12px 0;padding:10px 16px;background:rgba(59,130,246,.08);border-radius:0 8px 8px 0;font-size:13px}
.modal .mb table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.modal .mb td,.modal .mb th{border:1px solid #334155;padding:6px 8px}
.modal .mb th{background:rgba(255,255,255,.04);font-weight:600}
.modal .mb hr{border:none;border-top:1px solid #334155;margin:16px 0}
.modal .mb ul,.modal .mb ol{padding-left:22px;margin-bottom:10px}
.modal .mb li{margin-bottom:4px;font-size:14px;line-height:1.7}
.modal .mb .metric-box{display:inline-block;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);border-radius:8px;padding:10px 16px;margin:4px;text-align:center}
.modal .mb .metric-box .num{font-size:22px;font-weight:700;color:#3b82f6}
.modal .mb .metric-box .lbs{font-size:11px;color:#94a3b8}
.modal .mb .metric-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.modal .mb .sect-card{background:rgba(255,255,255,.03);border-radius:8px;padding:14px;margin:12px 0;border:1px solid rgba(51,65,85,.5)}
.modal .mb .sect-card .sn{font-size:12px;color:#94a3b8;margin-bottom:6px}
.modal .mb .sect-card .sh{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.modal .mb .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.modal .mb .info-item{background:rgba(255,255,255,.03);border-radius:6px;padding:10px}
.modal .mb .info-item .il{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px}
.modal .mb .info-item .iv{font-size:16px;font-weight:700;margin-top:2px}
.modal .mb .tagline{font-size:13px;color:#94a3b8;padding:10px 14px;background:rgba(255,255,255,.02);border-radius:8px;margin:12px 0;border-left:3px solid #3b82f6}
.modal .mb .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
.modal .mb .pill-up{background:rgba(34,197,94,.15);color:#22c55e}
.modal .mb .pill-down{background:rgba(239,68,68,.15);color:#ef4444}
.modal .mb .pill-mid{background:rgba(245,158,11,.15);color:#f59e0b}
@media(max-width:800px){
  .grid2,.grid3{grid-template-columns:1fr}
  .page{padding:12px 14px}
  .row{grid-template-columns:repeat(2,1fr)}
  header{padding:10px 14px}
  header h1{font-size:14px}
  .modal .mb{padding:14px}
  .rpt-card{flex-direction:column;gap:8px}
}
</style>

const monitors = [{"id": "mon-20260601-1307", "date": "2026-06-01 13:07", "title": "AI板块盘中速览 · 午盘高低切换 硬件回调软件爆发 存储超级周期确认", "tags": ["盘中", "午盘", "高低切换", "AI应用", "存储", "CPO", "机器人", "白银"], "summary": "早盘冲高回落沪指微跌，AI硬件（PCB/CPO/半导体）重挫，AI应用/软件接棒领涨。存储超级周期获高盛/瑞银双重确认。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4062</div><div class=\"lbs\">上证午盘</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.15%</div><div class=\"lbs\">上证涨跌</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-3.47%</div><div class=\"lbs\">科创50</div></div>\n  <div class=\"metric-box\"><div class=\"num\">1.97万亿</div><div class=\"lbs\">半日成交</div></div>\n</div>\n\n<h1>AI板块盘中速览 · 午盘高低切换 存储超级周期确认</h1>\n<p><strong>时间：</strong>2026-06-01 13:07（A股交易中）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>今日A股早盘冲高回落，创业板指一度涨超1%后跌近1%。盘面\"硬切软\"逻辑如期演绎——AI硬件（PCB/CPO/半导体）普遍重挫，AI应用/软件板块爆发接棒。科创50午盘跌3.47%领跌。存储超级周期获高盛/瑞银双重确认，HBM/DDR5供不应求将延续至2028年。COMEX白银在74-76美元区间震荡。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.87 美元/盎司</strong> <span class=\"pill pill-up\">日内 +0.38%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银（伦敦银）</div><div class=\"iv\"><strong>75.20 美元/盎司</strong> <span class=\"pill pill-up\">日内 +0.53%</span>（收复75关口）</div></div>\n  <div class=\"info-item\"><div class=\"il\">国内白银T+D</div><div class=\"iv\"><strong>18.28 元/克</strong> <span class=\"pill pill-mid\">窄幅波动</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>18,226 元/千克</strong> <span class=\"pill pill-up\">+0.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>约99.0</strong> <span class=\"pill pill-down\">持续低位运行</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">日内波动区间</div><div class=\"iv\" style=\"color:#f59e0b\">73.50 - 76.30 美元（宽幅震荡）</div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>白银今日亚盘宽幅震荡，<strong>日内高低差近3美元</strong>，反映多空分歧剧烈。早盘一度失守74美元（最低73.50美元，日内跌2.47%），随后迅速反弹突破76美元关口，现报75.87美元。整体处于<strong>74-76美元高位震荡区间</strong>，月初迎来变盘窗口。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元指数低位运行：</strong>美元报99附近，周线级别底部震荡后进入右侧反弹阶段，但日内短期走弱，为白银提供计价支撑</li>\n  <li><strong>美联储政策预期：</strong>新任美联储主席沃什鹰派表态已被市场部分消化，美国最新经济数据疲软引发衰退担忧，避险情绪为银价提供支撑</li>\n  <li><strong>工业需求：</strong>光伏+AI数据中心建设对白银需求维持高位，国内光伏银浆需求强劲</li>\n  <li><strong>技术面：</strong>日图枢轴点位于75.49美元，支撑阻力区间72.28-78.47美元。74.63美元（61.8%回撤位）是关键心理关口</li>\n</ul>\n\n<blockquote>💡 机构观点分歧：美国银行预测银价Q4冲击100美元；瑞银则下调2026年底预测至80美元，关注\"去银化\"风险。本周五美国非农就业数据将决定短线方向。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（午盘数据）</h2>\n\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4062.44 <span class=\"pill pill-down\">-0.15%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15437.75 <span class=\"pill pill-down\">-0.88%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">3983.10 <span class=\"pill pill-down\">-1.36%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\" style=\"color:#ef4444\"><strong>-3.47% 💥 领跌</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">北证50</div><div class=\"iv\" style=\"color:#22c55e\"><strong>+1.52%</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">半日成交</div><div class=\"iv\"><strong>1.97万亿元</strong>（缩量1617亿）</div></div>\n  <div class=\"info-item\"><div class=\"il\">上涨家数</div><div class=\"iv\" style=\"color:#22c55e\"><strong>超3800只</strong></div></div>\n</div>\n\n<p><strong>盘面特征：</strong>今日市场呈现经典\"冰火两重天\"格局——指数虽然冲高回落表现不佳，但全市场<strong>超3800只个股上涨</strong>，说明调整主要集中在权重大盘科技股。科创50跌3.47%领跌，主要是AI算力硬件权重股（PCB/半导体/CPO）大幅回调拖累。中小盘和AI应用方向表现活跃。</p>\n\n<p><strong>半日成交1.97万亿</strong>，较上个交易日缩量1617亿元，反映市场在冲高回落过程中资金观望情绪上升，但整体量能仍维持在较高水平。</p>\n\n<p><strong>今日关键催化：</strong></p>\n<ul>\n  <li>🔥 <strong>英伟达GTC Taipei 2026大会今日开幕</strong>，黄仁勋11:00发表主题演讲，发布N1X AI PC芯片</li>\n  <li>🔥 <strong>宇树科技科创板IPO今日上会</strong>，冲击A股\"人形机器人第一股\"</li>\n  <li>🔥 <strong>英特尔发布低价AI推理芯片\"Crescent Island\"</strong>，采用LPDDR5内存避HBM高成本</li>\n  <li>🔥 <strong>日韩股市齐创新高</strong>（韩国KOSPI +2.5%，日经+0.91%），三星电子大涨超5%创历史新高</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n\n<p>今日AI板块呈现<strong>显著的内部分化轮动</strong>——AI应用/软件方向大幅上涨，而AI算力硬件（PCB/CPO/光模块/半导体设备）普遍重挫。市场将这一轮动特征归纳为\"<strong>硬切软</strong>\"逻辑。</p>\n\n<p><strong>AI应用端全面爆发：</strong></p>\n<ul>\n  <li><strong>星环科技</strong> 涨超17%领涨AI应用</li>\n  <li><strong>深信服</strong> 涨超14%（AI+安全融合）</li>\n  <li><strong>福昕软件、瑞芯微</strong> 等跟涨</li>\n  <li>AI应用概念天地在线3连板，掌阅科技4天2板，视觉中国、税友股份、久其软件涨停</li>\n  <li><strong>信创ETF华夏</strong> 涨4.07%，大数据ETF华宝 涨2.7%</li>\n</ul>\n\n<p><strong>AI硬件方向集体走弱：</strong></p>\n<ul>\n  <li><strong>长芯博创</strong> 跌超10%</li>\n  <li><strong>东山精密</strong> 触及跌停（遭主力净卖出超31亿）</li>\n  <li><strong>环旭电子</strong> 跌近10%</li>\n  <li><strong>剑桥科技</strong> 跌停</li>\n  <li>通信ETF华夏盘中跌超2%，成交额放大至9亿元</li>\n</ul>\n\n<p>此前连续大涨后，算力硬件积累了较多涨幅，短期波动加剧是正常技术调整。东吴证券认为，在强产业趋势支撑下，AI主线不会出现单边快速回调，更多是通过反复震荡构筑复杂顶部结构。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-down\">剧烈分化</span> <span class=\"pill pill-mid\">硬件回调/应用走强</span></div>\n<p class=\"sn\"><strong>资金面：</strong>算力硬件方向遭遇主力大幅抛售。电子板块半日净流出超<strong>103亿元</strong>。东山精密遭净卖出超31亿元居首，胜宏科技、北方华创、天孚通信净流出居前。但<strong>兆易创新</strong>获主力净买入<strong>9.85亿元</strong>位居首位，风华高科、立讯精密、太极实业获主力净流入居前。算力内部高低切换明显——软件/应用获资金青睐，硬件/设备遭获利了结。</p>\n<p class=\"sn\"><strong>政策面：</strong>工信部批复6GHz频段用于6G技术试验，6G产业化推进受关注。平头哥真武系列GPU累计出货超56万片，新一代真武M890芯片性能达上代3倍，未来两年将推V900、J900两代新品，国产算力生态加速成熟。工业和信息化部等四部门印发《2026年提升全民数字素养与技能工作要点》，明确\"提升全民人工智能素养\"为独立重点任务。</p>\n<p class=\"sn\"><strong>基本面：</strong>芯片涨价潮愈演愈烈——意法半导体自6月28日起对部分产品涨价。英飞凌明确AI数据中心导致功率开关及集成电路供应短缺。英飞凌/德州仪器年内分别涨119%/78%。2026年全球半导体销售额预计超<strong>1.3万亿美元</strong>（+64%），北美四大云厂商资本支出合计逾<strong>7000亿美元</strong>。字节跳动拟将资本支出上调至700亿美元。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场对算力硬件方向短期追高意愿下降，但对AI应用/软件方向信心增强。黄仁勋GTC Taipei 11:00演讲关注度高，若超预期可能触发硬件方向修复。2026年被机构认为是AI应用从\"技术验证\"迈向\"商业推广\"的关键之年。摩根士丹利认为中国AI主导叙事已从能力追赶转向价值捕获。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">超级周期确认</span> <span class=\"pill pill-up\">长期高度乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>存储板块整体走势分化——HBM概念受超级周期提振，但CPO/PCB回调拖累板块情绪。主力资金净流入前三的算力/存储个股为：兆易创新（+9.85亿）、太极实业（+6.58亿）、风华高科（+6.18亿）。北向资金在澜起科技、兆易创新等存储龙头上交投活跃。</p>\n<p class=\"sn\"><strong>政策面：</strong>市场监管总局联合发改委印发《人工智能计量体系和能力建设指引（2026版）》，系统布局AI计量能力建设。智能体AI应用成为存储需求新增长极，政策推动数据治理和服务赛道迎接新机遇。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>存储超级周期获高盛和瑞银双重确认，是本日最强基本面催化：</strong></p>\n<ul>\n  <li><strong>高盛重磅报告：</strong>由AI驱动的存储周期比市场预期更强且更持久，<strong>2027年供需紧张程度将比2026年更严重</strong>，供不应求状态有望持续到<strong>2028年</strong></li>\n  <li><strong>瑞银报告：</strong>市场严重低估智能体AI对存储产业链的拉动，存储需求从HBM扩散到DDR5、LPDDR5、SSD及NAND Flash等几乎所有品类。DRAM供不应求持续至2028年Q2，NAND至2027年Q4</li>\n  <li>三星、美光、SK海力士三家存储巨头市值均突破<strong>万亿美元</strong>大关，AI热潮从算力芯片扩展至存储芯片</li>\n  <li>英特尔发布低价AI推理芯片\"Crescent Island\"（年底交付），采用<strong>LPDDR5</strong>替代HBM以降低45%成本，对较低端HBM需求构成竞争压力</li>\n</ul>\n<p class=\"sn\"><strong>情绪面：</strong>存储产业链景气确定性极高，市场共识持续强化。\"存储芯片产业价值已超越传统石油资源\"的观点引发广泛讨论。存储芯片\"超级周期\"能走多远成为市场核心关注点——高盛和瑞银同时给出2028年判断，为板块提供中长期信心支撑。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">今日重大催化</span> <span class=\"pill pill-up\">情绪积极</span></div>\n<p class=\"sn\"><strong>资金面：</strong>机器人ETF华夏（562500）早盘上涨0.98%，成分股新时达涨停（+10.04%）、中控技术涨8.30%、石头科技涨6.14%。但随后随大盘回落，至11:01转跌0.54%，近1月累计涨8.33%，规模达181.39亿元。奥比中光领跌6.61%。资金呈\"涨多回调\"特征。</p>\n<p class=\"sn\"><strong>政策面：</strong><strong>宇树科技科创板IPO今日上会</strong>——若顺利过会将加冕A股\"人形机器人第一股\"，拟募资42亿元。宇树科技全球人形机器人累计销售超5600台。国家矿山安全监察局与工信部联合启动\"矿山机器人应用验证试点\"，聚焦掘进/采矿/运输等七大高危场景，从\"示范展示\"转向\"实战考核\"。\"十五五\"规划建议将具身智能列为未来产业。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业面上多重催化：① 宇树科技具身智能体验馆亚洲首店5月31日登陆上海久光百货，汇聚G1/R1人形机器人全系列；② 智元机器人自研世界模型GE 2.0在全球World Arena榜单位列第一；③ 浙商证券建议6月是配置机器人板块好时机，三季度特斯拉量产前布局窗口；④ 具身智能市场规模2026年有望突破<strong>万亿元</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>宇树IPO上会是今日机器人板块最大情绪催化剂。73天闪电过会速度体现了监管对硬科技IPO的支持力度。市场对\"人形机器人第一股\"加冕预期较高，但需关注招股书中业绩波动风险（宇树2024年净利下滑）。板块整体情绪积极，但短期波动随大盘放大。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-down\">盘中持续走弱</span> <span class=\"pill pill-down\">短期回调</span></div>\n<p class=\"sn\"><strong>资金面：</strong>CPO概念今日盘中<strong>持续走弱</strong>，为AI板块中跌幅最大的细分方向之一。东山精密触及跌停（遭主力净卖出超31亿元）；环旭电子、长盈通、蘅东光、长光华芯、东田微、长芯博创均跌超7%。通信ETF华夏午盘跌超2%，成交额放大至9亿元。前期涨幅过大后获利回吐压力显著。</p>\n<p class=\"sn\"><strong>政策面：</strong>中国国际光电博览会与C114联合举办的\"xPO赋能AI数据中心光互连论坛\"于5月28日在上海举行。论坛上多家企业阐述CPO/NPO/LPO/XPO多元技术路线。台积电COUPE on Substrate（基板级CPO）于2026年5月官宣量产，CPO产业化元年正式开启。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势仍在加速——2026年全球1.6T光模块需求约<strong>2700万只</strong>，硅光路线占比达80%，叠加800G/400G产品渗透，硅光芯片年需求超5500万只。800G硅光方案较EML方案成本降低21%。华工正源指出，CPO、NPO、XPO\"三线并进\"，多元并行是务实选择。凌云光详解先进光电封装检测技术。</p>\n<p class=\"sn\"><strong>情绪面：</strong>今日CPO板块大跌更多是<strong>技术性回调</strong>而非逻辑破坏。前期CPO板块5月涨幅巨大，积累了大量获利盘。值得注意的是，今日有网传CPO龙头高管演讲内容被公司澄清为\"杜撰\"，短暂冲击市场信心，但已发布严正声明。产业基本面未变，回调后性价比有所改善。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（午盘）</h2>\n\n<table>\n  <tr><th>#</th><th>板块/行业</th><th>净流入参考</th><th>核心驱动</th><th>驱动类型</th></tr>\n  <tr><td><strong>1</strong></td><td><strong>软件开发</strong></td><td><span class=\"green\"><strong>+22.46亿</strong></span></td><td>AI应用爆发 + 四部门AI素养政策催化 + 信创主线</td><td><span class=\"pill pill-up\">政策+产业驱动</span></td></tr>\n  <tr><td><strong>2</strong></td><td><strong>IT服务</strong></td><td><span class=\"green\"><strong>+21.46亿</strong></span></td><td>AI应用商用化提速 + MiniMax启动A股IPO</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>3</strong></td><td><strong>文化传媒</strong></td><td><span class=\"green\"><strong>+20.23亿</strong></span></td><td>AI+传媒/游戏概念活跃 + 端午档期预期</td><td><span class=\"pill pill-mid\">产业+事件驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td><strong>电池</strong></td><td><span class=\"green\"><strong>+18.04亿</strong></span></td><td>新能源板块轮动 + 储能需求增长</td><td><span class=\"pill pill-mid\">产业驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>计算机</td><td><span class=\"green\">净流入</span></td><td>AI应用+信创双主线共振</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>6</strong></td><td>煤炭</td><td><span class=\"green\">板块走强</span></td><td>防御配置+高分红逻辑</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>消费电子</td><td><span class=\"green\">连续4日净流入</span></td><td>AI PC催化 + 英伟达N1X芯片发布预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>电力</td><td><span class=\"green\">盘初走强</span></td><td>AI算力用电需求 + 防御属性</td><td><span class=\"pill pill-mid\">预期驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li><strong>电子板块</strong>早盘主力净流出超<strong>103亿元</strong>，半导体净流出居前，与软件开发/IT服务形成鲜明\"<strong>硬切软</strong>\"轮动</li>\n  <li>AI相关板块（软件开发+IT服务+文化传媒）合计净流入约<strong>64亿元</strong>，在全市场净流入格局中仍占主导</li>\n  <li><strong>消费电子ETF平安</strong>连续4日获得资金净流入，资金逢低布局AI PC方向</li>\n  <li>午后若黄仁勋演讲超预期，CPO/算力硬件方向可能迎来修复</li>\n  <li><strong>AI板块整体相对热度中等偏高</strong>——应用方向充分吸金，但硬件方向大幅失血，内部分化加剧</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th><th>关注度</th></tr>\n  <tr><td><strong>兆易创新</strong></td><td>603986</td><td><span class=\"pill pill-up\">主力净买入+9.85亿<br>资金流入居首</span></td><td>存储芯片龙头，受益HBM超级周期+DRAM涨价，主力资金逆势加仓</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>东山精密</strong></td><td>002384</td><td><span class=\"pill pill-down\">触及跌停</span><br><span class=coral>主力净卖出-31亿</span></td><td>CPO/PCB概念前期涨幅巨大+获利兑现+网传假消息扰动，主力大幅出逃</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>星环科技</strong></td><td>688031</td><td><span class=\"pill pill-up\">涨超17%</span></td><td>AI应用龙头，受四部门AI素养政策+AI应用商用化双重催化，领涨全场</td><td>⭐⭐</td></tr>\n  <tr><td><strong>深信服</strong></td><td>300454</td><td><span class=\"pill pill-up\">涨超14%</span></td><td>AI+安全融合逻辑，受益AI应用爆发+信创主线</td><td>⭐⭐</td></tr>\n  <tr><td><strong>新时达</strong></td><td>002527</td><td><span class=\"pill pill-up\">涨停+10.04%</span></td><td>机器人概念龙头，宇树科技IPO上会催化+机器人ETF配置</td><td>⭐⭐</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n\n<p><strong>最新进展：</strong>特斯拉Optimus量产预期持续升温，三季度量产前6月被定义为配置窗口。宇树科技IPO今日上会对板块情绪形成重要提振。</p>\n\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器/总成</strong></td><td>三花智控、拓普集团</td><td>002050/601689</td><td>线性/旋转执行器核心供应商，特斯拉验证推进中</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>精密减速器</strong></td><td>绿的谐波、双环传动</td><td>688017/002472</td><td>谐波减速器/RV减速器，最高壁垒环节</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>伺服电机</strong></td><td>汇川技术、卧龙电驱</td><td>300124/600580</td><td>驱控一体方案，国产电机龙头</td><td>⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感、奥比中光</td><td>603662/688322</td><td>力矩传感器/3D视觉传感器</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>峰岹科技</td><td>688279</td><td>电机驱动芯片，灵巧手核心部件（特斯拉WIPO专利催化）</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件/代工</strong></td><td>工业富联、长盈精密</td><td>601138/300115</td><td>整机代工+轻量化结构件</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电池/电源</strong></td><td>珠海冠宇</td><td>688772</td><td>机器人电池方案</td><td>⭐</td></tr>\n</table>\n\n<p><strong>机构重点推荐关注：</strong>峰岹科技、科达利、恒帅股份、德昌股份、绿的谐波、长盈精密、奥比中光（浙商证券6月金股组合）。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前特征</div><div class=\"iv\" style=\"font-size:14px\">AI板块\"硬切软\"逻辑演绎中——AI应用/软件接棒领涨，算力硬件（PCB/CPO/半导体）高位回调。科创50跌3.47%领跌，但全市场超3800只个股上涨。内部分化剧烈，非系统性风险。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 关键观察</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 黄仁勋GTC Taipei演讲（11:00已讲）</strong>——N1X AI PC芯片发布情况，关注演讲是否超预期<br><strong>2) 宇树科技IPO上会结果</strong>——人形机器人第一股能否顺利过会<br><strong>3) 午后CPO/算力硬件能否企稳</strong>——决定AI板块整体情绪</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 短期展望</div><div class=\"iv\" style=\"font-size:14px\">硬件方向短期调整是<strong>正常的获利回吐</strong>，产业基本面未变。AI应用方向在政策+商用化双重催化下有望持续活跃。存储板块超级周期确认，中长期逻辑最强。关注午后资金是否回流硬件方向。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">① 科技成交占比与估值分化共振，短期脆弱性偏强；② 主力资金持续从硬件方向流出，若下午未企稳则调整时间可能延长；③ 华泰证券指出6月进入中美财报真空期+美国通胀超预期风险，短期或存在风格再平衡需求</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">AI仍为中期主线，调整中<strong>逢低布局</strong>算力/光模块龙头。存储板块超级周期逻辑最强，可关注存储ETF和龙头个股。AI应用方向短线活跃但需注意持续性。机器人板块关注宇树上会结果催化。</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-0601-1045", "date": "2026-06-01 10:45", "title": "AI板块盘中速览 · COMPUTEX开幕 宇树IPO上会 存储芯片活跃", "tags": ["盘中", "COMPUTEX", "宇树IPO", "AI PC", "存储", "机器人", "CPO"], "summary": "COMPUTEX开幕+宇树IPO上会+英伟达AI PC发布三催化共振，AI PC概念走强，存储芯片活跃", "html": "# AI板块盘中速览 · COMPUTEX开幕 宇树IPO上会 存储芯片活跃\n\n**时间：** 2026-06-01 10:45\n\n---\n\n## 📊 零、COMEX白银期货播报\n\n| 指标 | 价格 | 涨跌幅 |\n|------|------|--------|\n| **COMEX白银期货** | **约75.25 美元/盎司** | **日内 -0.82%** |\n| 现货白银（伦敦银） | 约75.01 美元/盎司 | 日内 -0.36% |\n| 美元指数 | 约98.93 | 持续走弱 |\n| COMEX黄金期货 | 约4,542 美元/盎司 | +0.3% |\n\n**近期趋势判断：** 白银处于**72-80美元高位震荡区间**。上周冲高至78美元后回落，多空分歧剧烈。\n\n---\n\n## 一、大盘解读（10:45盘中）\n\n三大指数开盘涨跌互现后震荡走高，**市场情绪快速回暖**：\n\n- **上证指数** 低开0.03%→现涨约 **+0.15%**\n- **深证成指** 高开0.17%→现涨约 **+0.54%**\n- **创业板指** 高开0.48%→现涨逾 **+1.00%**（今日最强宽基）\n- **科创50** 收微跌0.01%后震荡修复\n\n沪深京三市**上涨个股超3800只**，呈现\"普涨+结构性修复\"格局。\n\n**上周五（5/29）收盘回顾**：上证指数4068点（-0.73%），科创50暴跌**5.04%**，两市成交额3.32万亿，主力净流出1233亿元。5月全月通信、电子领跑（月涨均>15%）。\n\n**今日关键催化**：\n- 🔥 **英伟达GTC Taipei 2026大会今日开幕**，黄仁勋**11:00主题演讲**（N1X PC芯片/Vera Rubin GPU是焦点）\n- 🔥 **宇树科技科创板IPO今日上会**（\"人形机器人第一股\"，拟募资42亿元）\n- 《求是》杂志发表习近平总书记重要文章《前瞻布局和发展未来产业》\n- COMPUTEX 2026展会（6/2-6/5）即将开幕\n\n---\n\n## 二、AI板块整体市场概览\n\nAI板块整体回暖，**内部轮动加速**——AI PC/应用接棒领涨，算力硬件（CPO/PCB/半导体设备）高位回调。高低切换特征明显。\n\n**AI PC概念大幅高开**：春秋电子、胜利精密、英力股份涨停，雷神科技涨超**30%**（英伟达N1X PC芯片催化传导+戴尔上周五美股+33%）\n\n**港股AI服务器爆发**：华勤技术涨22%、联想集团涨8%（戴尔财报+757%传导效应）\n\n---\n\n## 三、细分领域动态\n\n### 🔷 算力板块 ↑（催化密集）\n\n- **资金面：** AI算力ETF获资金提前布局。大数据ETF华宝(516700)盘中涨逾2.7%，近4日连续吸金。AI服务器港股爆发（华勤技术+22%，联想+8%受戴尔美股+33%传导）。\n- **政策面：** 工信部支持太空算力前瞻性研究；《人工智能计量体系和能力建设指引(2026版)》印发，系统布局六大维度AI计量能力。\n- **情绪面：** **重点关注11:00黄仁勋GTC Taipei演讲！** 大摩预计全面展示Vera Rubin GPU与Vera CPU为核心的AI工厂方案。N1X芯片采用台积电3nm，集成20核CPU+6144 CUDA核心，200TOPS端侧AI算力。\n\n### 🔷 存储板块 ↑（局部活跃）\n\n- **资金面：** 存储芯片概念局部活跃，**云汉芯城、商络电子均涨超12%**，兆易创新、大港股份跟涨。\n- **基本面：** 一季度我国集成电路出口724.7亿美元(+77.5%)，存储器出口459.9亿美元(+**174.2%**)。三星全球首发12层HBM4E样品。**长鑫科技科创板IPO过会后提交注册**，拟募资295亿。\n- **情绪面：** 瑞银最新报告——智能体AI引爆存储\"超级周期\"，**DRAM缺货持续至2028年**，NAND至2027年Q4。\n\n### 🔷 机器人板块 ↑↑（今日最强主线之一）\n\n三重催化同天爆发：\n1. **宇树科技IPO今日上会**（拟募资42亿，冲刺\"人形机器人第一股\"）\n2. **特斯拉得州Optimus专属机器人工厂动工**，规划年产能最高**千万台**\n3. 中信证券判断V3版本设计接近定型，**量产在即**\n\n小鹏IRON机器人目标2026年底量产，理想汽车人形机器人正式立项。MWC上海6/24将举办\"人形机器人点球大战\"。\n\n### 🔷 CPO板块 ↓（短期回调）\n\n- 今日开盘CPO概念跌幅靠前，但**5月整体CPO涨17%**，龙头持续创新高\n- 业绩确定性强：中际旭创Q1净利57.35亿(+262%)\n- 分歧：估值偏高(TTM PE 81倍) vs 业绩确定性最强\n- 工信部要求新建智算中心CPO适配比例≥60%\n\n---\n\n## 四、今日早盘资金流向特征\n\n**高低切换，AI应用/IPC/消费电子/电力吸金：**\n\n| 流入方向 | 流出方向 |\n|----------|----------|\n| **AI PC概念**（雷神科技+30%，春秋电子等涨停） | CPO/光模块（前期涨幅过大） |\n| **AI应用/大数据**（AI计量新政催化） | PCB/半导体设备（获利回吐） |\n| **电力**（华电能源5连板，绿色电力活跃） | 商业航天（蓝色起源火箭爆炸） |\n| **消费电子/服务器**（华勤技术+22%） | 有色/工业金属 |\n| **存储芯片**（云汉芯城+12%） | — |\n\n**AI板块热度在全市场居前，但内部分化加剧。**\n\n---\n\n## 五、关键异动个股\n\n1. **雷神科技 ↑30%**：AI PC概念龙头，英伟达N1X PC芯片催化+戴尔美股+33%传导效应，大幅高开领涨全场\n2. **鸿博股份 涨停**：AI算力转型，算力营收占比超60%+审计整改完成+仲裁胜诉2.94亿债权确认\n3. **华电能源 5连板**：电力板块龙头，电力供改+绿色电力+防御资金切换，强势5板\n4. **沃格光电 5日3板**：CPO+玻璃基板，先进封装趋势+多概念叠加\n\n---\n\n## 六、特斯拉机器人概念股解析\n\n**最新进展：**\n- 特斯拉得州Optimus专属机器人工厂正式动工，规划年产能最高**千万台**\n- WIPO公开新一批特斯拉机器人专利，**灵巧手为核心升级点**\n- 中信证券判断V3版设计接近定型，量产在即\n\n**A股核心受益环节**：\n\n| 环节 | 代表公司 | 逻辑 | 优先级 |\n|------|----------|------|--------|\n| **执行器/总成** | 拓普集团、三花智控 | 线性/旋转执行器核心供应商 | ⭐⭐⭐ |\n| **精密减速器** | 绿的谐波、双环传动 | 谐波减速器/RV减速器，最高壁垒环节 | ⭐⭐⭐ |\n| **伺服电机** | 汇川技术、卧龙电驱 | 驱控一体方案 | ⭐⭐ |\n| **传感器** | 贝斯特、福光股份 | 力矩传感器/视觉传感器 | ⭐⭐ |\n| **电池/电源** | 珠海冠宇、工业富联 | 机器人电池+整机代工 | ⭐⭐ |\n| **结构件** | 春秋电子、英力股份 | 轻量化结构件/外壳 | ⭐⭐ |\n\n---\n\n## 七、总结与展望\n\n| 维度 | 结论 |\n|------|------|\n| 📌 **当前特征** | AI主线未变，内部高低切换。算力硬件高位回调，AI应用/IPC接棒。6月催化超级密集 |\n| 👀 **关键观察** | **11:00 黄仁勋GTC Taipei演讲**——N1X PC芯片/Vera Rubin GPU超预期程度 |\n| 🧭 **策略建议** | 调整中逢低布局算力/光模块龙头。机器人板块关注宇树上会结果。CPO产业链回调是机会 |\n| ⚠️ **风险提示** | 科技成交占比与估值分化共振，杠杆资金处于\"进攻意愿减弱、仓位偏高\"脆弱状态。6月进入中报窗口，业绩为王 |\n\n> ⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。"}, {"id": "mon-0601-1000", "date": "2026-06-01 10:00", "title": "AI板块盘中速览 · COMPUTEX开幕 宇树IPO上会 白银高位震荡", "tags": ["盘中", "COMPUTEX", "AI PC", "机器人", "宇树", "CPO", "算力", "白银"], "summary": "COMPUTEX 2026开幕+宇树IPO上会+英伟达AI PC发布三催化共振，AI PC概念走强", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4067</div><div class=\"lbs\">上证指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">15601</div><div class=\"lbs\">深证成指</div></div>\n  <div class=\"metric-box\"><div class=\"num\">4057</div><div class=\"lbs\">创业板指</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+0.48%</div><div class=\"lbs\">创业板开</div></div>\n</div>\n\n<h1>AI板块盘中速览 · COMPUTEX开幕 宇树IPO上会</h1>\n<p><strong>时间：</strong>2026-06-01 10:00</p>\n\n<div class=\"tagline\">📌 <strong>今日三大催化：</strong>① COMPUTEX 2026/GTC Taipei今日开幕，黄仁勋11:00发表主题演讲；② 宇树科技科创板IPO今日上会，冲击A股&#34;人形机器人第一股&#34;；③ 英伟达预告&#34;PC新时代&#34;，Arm架构AI PC芯片即将亮相。</div>\n\n<hr>\n\n<h2>零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.25</strong> 美元/盎司 <span class=\"pill pill-down\">-0.82%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.01</strong> 美元/盎司 <span class=\"pill pill-down\">-0.36%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">国内白银T+D</div><div class=\"iv\"><strong>18.28</strong> 元/克</div></div>\n  <div class=\"info-item\"><div class=\"il\">银价波动区间</div><div class=\"iv\" style=\"color:#f59e0b\">74-76 美元宽幅震荡</div></div>\n</div>\n<p><strong>趋势判断：</strong>白银处于<strong>高位震荡</strong>格局。上周银价一度冲高至78美元后回落至75美元附近，多空分歧剧烈。月初迎来<strong>变盘窗口</strong>，方向选择即将明确。</p>\n<p><strong>驱动因素：</strong>① <strong>美元指数</strong>99附近低位运行，为贵金属提供支撑；② 美联储降息预期推迟（甚至出现加息讨论），高利率环境压制无息资产配置意愿；③ <strong>工业属性</strong>（光伏+电子）提供需求端支撑，国内光伏银浆需求强劲；④ 上金所今日起下调白银T+D保证金比例至21%，或提振国内白银交投活跃度。</p>\n\n<hr>\n\n<h2>一、大盘解读</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4067.16 <span class=\"pill pill-mid\">开 -0.03%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15601.03 <span class=\"pill pill-up\">开 +0.17%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4057.39 <span class=\"pill pill-up\">开 +0.48%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.23 <span class=\"pill pill-mid\">开 -0.01%</span></div></div>\n</div>\n<p>6月首个交易日，A股三大股指开盘<strong>涨跌互现</strong>，创业板指高开幅度最大。上周五（5月29日）A股经历大幅回调（科创50暴跌5%），今日属于<strong>修复性开盘</strong>。AI PC、绿色电力、AI服务器概念盘初走强，MLCC、铜箔/覆铜板概念走弱。</p>\n<p>5月全月，通信板块涨20.40%、电子涨17.88%领跑全场，石油石化跌15%、农林牧渔跌13%垫底，<strong>结构性分化极为极致</strong>。进入6月，市场预期指数延续高位震荡，科技主线或进一步向盈利兑现方向聚焦。</p>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>AI板块今日<strong>开盘偏强</strong>，在COMPUTEX 2026开幕、黄仁勋演讲在即的催化下，算力/AI PC方向走强。但上周五的科技股大面积回调阴影犹存，市场情绪处于<strong>修复进行时</strong>。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-up\">催化密集</span> <span class=\"pill pill-mid\">情绪修复中</span></div>\n<p class=sn><strong>资金面：</strong>AI PC、AI服务器概念盘初走强。上周科技ETF&#34;越跌越买&#34;，通信ETF国泰周净流入21.37亿、科创芯片ETF合计净流入32亿，显示资金对算力主线信心未动摇。</p>\n<p class=sn><strong>政策面：</strong>无新增政策。但COMPUTEX 2026本身即为最大的产业催化——黄仁勋今日11:00发表GTC台北主题演讲，预计介绍Vera Rubin GPU、Vera CPU及AI工厂方案。</p>\n<p class=sn><strong>基本面：</strong>中信建投研报指出，算力产业链景气由上游持续向下游整机厂商传递，联想、戴尔最新财报均大超预期，储备AI订单均超200亿元。英伟达Arm架构AI PC芯片N1/N1X（对标苹果M系列）预计亮相COMPUTEX。</p>\n<p class=sn><strong>情绪面：</strong>投资者对黄仁勋演讲期待较高，但上周五科技股暴跌使得部分资金转为观望。情绪处于&#34;利好等待兑现&#34;状态，若演讲超预期可能触发新一轮做多。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">超级周期确认</span> <span class=\"pill pill-up\">长期乐观</span></div>\n<p class=sn><strong>资金面：</strong>整体跟随大盘震荡修复，HBM概念无异常异动。上周五联特科技主力净流出6.25亿，但融资净买入2.25亿，显示杠杆资金仍在接筹。</p>\n<p class=sn><strong>政策面：</strong>四部门联合印发《2026年提升全民数字素养与技能工作要点》，将AI素养提升纳入国家战略；市场监管总局联合发改委印发《人工智能计量体系和能力建设指引(2026版)》。</p>\n<p class=sn><strong>基本面：</strong>三星、美光、SK海力士三家存储巨头市值均突破万亿美元大关，存储芯片进入&#34;超级周期&#34;。瑞银最新报告认为市场严重低估了智能体AI对存储产业链的拉动，DRAM供不应求将持续至2028年Q2，NAND至2027年Q4。HBM需求从HBM3向HBM4切换，闪迪新型AI内存HBF年内送样。</p>\n<p class=sn><strong>情绪面：</strong>全球存储芯片产业价值已超越传统石油资源，AI时代&#34;内存为王&#34;的市场共识持续强化，机构对存储中长期景气保持高度乐观。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">今日最大催化</span> <span class=\"pill pill-up\">情绪高涨</span></div>\n<p class=sn><strong>资金面：</strong>宇树科技IPO上会消息提前发酵，上周机器人板块已有资金埋伏。今日关注宇树上会结果对板块情绪的刺激。</p>\n<p class=sn><strong>政策面：</strong>上交所今日审议宇树科技科创板IPO申请，拟募资42.02亿元，用于机器人模型研发、本体研发、新型产品开发及制造基地建设。COMPUTEX首次设立机器人专区，边缘AI PC、具身智能、AI服务机器人集中亮相。</p>\n<p class=sn><strong>基本面：</strong>① 宇树科技2025年营收16.99亿、净利2.78亿，四足机器人累计销超3.3万台、人形机器人超5600台；② 小鹏目标2026年底实现Iron机器人量产；③ Engine AI首批T800全尺寸人形机器人下线交付；④ MWC上海6月24-25日举办&#34;人形机器人点球大战&#34;赛事。</p>\n<p class=sn><strong>情绪面：</strong>宇树IPO是<strong>里程碑事件</strong>，如顺利过会将大大提振人形机器人板块估值信心。叠加COMPUTEX机器人专区和MWC赛事，6月机器人板块催化密集，市场情绪积极。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">业绩暴发确认</span> <span class=\"pill pill-up\">情绪乐观</span></div>\n<p class=sn><strong>资金面：</strong>上周通信ETF（重仓CPO/光模块）周净流入21.37亿，为全市场ETF净流入第一名。CPO/光模块方向主力资金坚定看多。</p>\n<p class=sn><strong>政策面：</strong>工信部此前明确2026年底前新建智算中心CPO适配比例≥60%、核心光配件国产化率≥70%。COMPUTEX上博通、Marvell将展示CPO/交换芯片最新进展。</p>\n<p class=sn><strong>基本面：</strong>一季报全面爆发——中际旭创净利57.35亿同比+262.3%，源杰科技净利同比+1153%（涨11倍），天孚通信毛利率达57%。1.6T产品批量供货，3.2T产品开始送样。CPO方案功耗降23%、成本降21%。</p>\n<p class=sn><strong>情绪面：</strong>CPO龙头股价虽已大幅上涨（中际旭创突破千元大关，市值超1.2万亿），但业绩兑现能力极强。部分投资者担忧估值泡沫，但产业逻辑+业绩兑现组合使CPO成为AI硬件链中最具确定性的方向之一。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（上周五至今日开盘）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入参考</th><th>核心驱动</th><th>驱动类型</th></tr>\n  <tr><td><strong>1</strong></td><td>通信（含CPO/光模块）</td><td><span class=green>周净流入21.37亿</span></td><td>中际旭创业绩+262%，CPO国产化政策强制要求</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>2</strong></td><td>科创芯片</td><td><span class=green>周净流入32亿</span></td><td>算力需求爆发 + 存储超级周期</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>3</strong></td><td>A500/沪深300</td><td><span class=green>周净流入20亿+</span></td><td>宽基指数配置需求 + 6月12日样本调样</td><td><span class=\"pill pill-mid\">资金驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>电力/绿电</td><td><span class=green>周涨幅9%+</span></td><td>缺电逻辑 + AI算力电力需求预期</td><td><span class=\"pill pill-mid\">预期驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>AI PC</td><td><span class=green>盘初走强</span></td><td>英伟达Arm芯片PC今日发布预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>6</strong></td><td>机器人</td><td><span class=green>盘中关注</span></td><td>宇树IPO上会 + COMPUTEX机器人专区</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>7</strong></td><td>绿色电力</td><td><span class=green>盘初走强</span></td><td>AI用电需求 + 华电能源5连板示范</td><td><span class=\"pill pill-mid\">预期驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>PCB/覆铜板</td><td><span class=red>盘初走弱</span></td><td>上周五科技股回调余波 + 资金高低切换</td><td><span class=\"pill pill-down\">技术调整</span></td></tr>\n</table>\n<p><strong>资金强度对比：</strong>AI相关板块（通信+芯片+AI PC+机器人+电力）在资金净流入格局中仍是<strong>绝对主导</strong>。但需要注意的是，5月29日科技股大跌后，消费防御（白酒）、电力等非科技板块资金有所回补，市场风格出现一定的&#34;高低切换&#34;迹象。券商策略普遍认为这只是结构性消化，<strong>并非趋势逆转</strong>。</p>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th><th>关注度</th></tr>\n  <tr><td><strong>软通动力</strong></td><td>301236</td><td><span class=\"pill pill-up\">涨停 +20.01%</span></td><td>AI全链条战略转型成效初显，AI业务营收占比超50%，完成定增募资超33亿</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>华勤技术</strong></td><td>03296(港股)</td><td><span class=\"pill pill-up\">大涨20%创上市新高</span></td><td>AI算力浪潮核心受益者，英伟达AI PC芯片发布预期催化</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>雷神科技</strong></td><td>A股</td><td><span class=\"pill pill-up\">盘初涨27.39%</span></td><td>AI PC概念龙头，英伟达Windows PC发布在即的弹性受益标的</td><td>⭐⭐</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<p>特斯拉 Optimus 量产预期持续发酵，三季度量产前6月是配置窗口。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 短期研判</div><div class=\"iv\" style=\"font-size:14px\">今日三大催化（COMPUTEX+宇树IPO+黄仁勋演讲），AI板块有望修复反弹</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 关键观察</div><div class=\"iv\" style=\"font-size:14px\">11:00 黄仁勋GTC演讲内容（Vera Rubin/Rubin GPU/AI PC芯片）</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">上周五科技股暴跌后情绪修复需要时间，量能是关键</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 策略建议</div><div class=\"iv\" style=\"font-size:14px\">COMPUTEX期间算力+AI PC方向催化最强，机器人板块关注宇树上会结果</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-0528-1930", "date": "2026-05-28 19:00", "title": "AI板块收盘复盘 · 创业板首超沪指 半导体全面爆发", "tags": ["收盘复盘", "半导体", "算力", "创业板"], "summary": "A股三大指数集体收涨，创业板指+1.96%首超沪指。半导体产业链全面爆发，\"易中天\"齐创历史新高。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">+1.96%</div><div class=\"lbs\">创业板指</div></div>\n  <div class=\"metric-box\"><div class=\"num\">2.97万亿</div><div class=\"lbs\">成交额</div></div>\n  <div class=\"metric-box\"><div class=\"num\">3018</div><div class=\"lbs\">上涨家数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">126</div><div class=\"lbs\">涨停</div></div>\n</div>\n\n<h1>AI板块收盘复盘</h1>\n<p><strong>时间：</strong>2026-05-28 15:30</p>\n\n<div class=\"tagline\">📌 <strong>里程碑时刻：</strong>创业板指收盘 4125.07 首次超越上证指数 4098.64，标志着市场风格从传统蓝筹向科技成长切换——这是一次结构性信号，而非短期情绪波动。</div>\n\n<h2>一、大盘解读</h2>\n<p>A股三大指数集体收涨，呈现鲜明的<strong>沪弱深强</strong>格局：</p>\n\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4098.64 <span class=\"pill pill-up\">+0.12%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15861.89 <span class=\"pill pill-up\">+0.80%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4125.07 <span class=\"pill pill-up\">+1.96%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1844.25 <span class=\"pill pill-up\">+1.59%</span></div></div>\n</div>\n\n<p>全市场 <strong>3018 只上涨</strong> / 2365 只下跌，涨停 126 只，跌停 12 只。两市成交额 <strong>2.97 万亿元</strong>，较前日缩量约 2700 亿，但总体量能仍处高位，显示市场交投活跃度维持良好。</p>\n\n<hr>\n\n<h2>二、AI板块整体概览</h2>\n<p>AI板块是今日当之无愧的 <strong>领涨核心</strong>，资金集中涌入两个方向：<strong>算力硬件</strong>（光模块/AI服务器/AI芯片）和 <strong>半导体</strong>（代工/设备/材料）。培育钻石、超级电容作为科技支线同步走强，但主线的赚钱效应更为集中。</p>\n<p>值得关注的是，资金并非分散撒网，而是集中在确定性强、业绩能见度高的龙头标的上——\"易中天\"（新易盛/中际旭创/天孚通信）三者股价齐创历史新高，说明市场在<strong>理性定价而非情绪炒作</strong>。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-up\">净流入 8.7亿</span> <span class=\"pill pill-up\">情绪 乐观</span></div>\n<p class=sn><strong>资金面：</strong>算力硬件主力净流入约 8.7 亿，联特科技、宏和科技、金安国纪等多股涨停。\"易中天\"（新易盛/中际旭创/天孚通信）三者股价齐创历史新高，这是产业景气度最直接的确认信号。</p>\n<p class=sn><strong>基本面：</strong>AI 算力需求持续超预期，800G 光模块订单饱满，1.6T 产品认证加速推进。国内 AI 芯片龙头产能利用率持续爬升，订单可见度已延伸至 2026 年下半年。</p>\n<p class=sn><strong>政策面：</strong>美国新一轮对华半导体设备出口管制传闻持续发酵，反而强化了国产算力替代的确定性。国内 AI 基建投资预算在上半年已超预期加码。</p>\n<p class=sn><strong>情绪面：</strong>资金对算力景气度高度认可，板块放量突破前期高点。市场普遍预期 AI 基建投资将在 2026H2 进一步提速。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">净流入 3.5亿</span> <span class=\"pill pill-mid\">情绪 中性</span></div>\n<p class=sn><strong>资金面：</strong>HBM 概念整体净流入约 3.5 亿，但个股内部分化明显——龙头受追捧但华海诚科持续承压。</p>\n<p class=sn><strong>基本面：</strong>长鑫存储 HBM3 客户样品验证稳步推进，大基金二期加大对存储领域的投资力度。国产 HBM 产业链\"从 0 到 1\"的确定性在增强。</p>\n<p class=sn><strong>情绪面：</strong>中长期 HBM 国产化逻辑被市场认可，但华天科技对华海诚科的清仓减持（3 个月窗口期）对板块情绪形成短线压制。减持筹码消化需要时间。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">净流入 5.2亿</span> <span class=\"pill pill-up\">情绪 乐观</span></div>\n<p class=sn><strong>资金面：</strong>板块主力净流入约 5.2 亿，执行器、传感器方向资金承接力度最强。</p>\n<p class=sn><strong>基本面：</strong>特斯拉 Optimus 量产预期持续发酵，国内外供应链切入进度加快。三花智控（执行器）、绿的谐波（减速器）等核心环节确定性最强。</p>\n<p class=sn><strong>情绪面：</strong>市场普遍预期 2026 年下半年人形机器人将进入小批量量产阶段，产业链景气度确定性上行。板块估值虽已有所反映，但产业趋势仍在加速。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO 板块 <span class=\"pill pill-up\">净流入 4.1亿</span> <span class=\"pill pill-up\">情绪 乐观</span></div>\n<p class=sn><strong>资金面：</strong>光模块、光芯片整体净流入约 4.1 亿，中际旭创放量创新高，资金主线清晰。</p>\n<p class=sn><strong>基本面：</strong>800G/1.6T 光模块需求持续旺盛，AI 集群对高速互联的需求呈指数级增长。国内外 AI 数据中心建设同步拉动光模块出货量超预期。</p>\n<p class=sn><strong>情绪面：</strong>算力链景气正在向光通讯环节传导，市场对 CPO 技术 2027 年的应用前景持乐观态度。现阶段的光模块景气具备旺盛支撑。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控 TOP5</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入</th><th>核心驱动</th><th>驱动类型</th></tr>\n  <tr><td><strong>1</strong></td><td>半导体</td><td><span class=green>+12.4亿</span></td><td>中芯国际创新高 + 国产化预期</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>2</strong></td><td>AI算力</td><td><span class=green>+8.7亿</span></td><td>\"易中天\"齐创新高 + 算力需求爆发</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>3</strong></td><td>机器人</td><td><span class=green>+5.2亿</span></td><td>特斯拉 Optimus 小批量量产预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>CPO 光模块</td><td><span class=green>+4.1亿</span></td><td>800G/1.6T 出货量持续超预期</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>HBM 存储</td><td><span class=green>+3.5亿</span></td><td>长鑫 HBM3 验证 + HBM 国产化</td><td><span class=\"pill pill-mid\">预期驱动</span></td></tr>\n</table>\n<p>AI板块（算力+半导体+机器人+光模块+HBM）合计净流入约 <strong>34 亿</strong>，在全市场净流入格局中占据 <strong>绝对主导</strong>地位。相比之下，白酒/贵金属/证券等传统板块普遍净流出，资金从传统低增长方向持续向科技高景气方向迁移。</p>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th><th>关注度</th></tr>\n  <tr  <td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-up\">创历史新高</span></td><td>半导体代工景气确认，产能满载，订单可见度延伸至Q4</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>华虹公司</strong></td><td>688347</td><td><span class=\"pill pill-up\">创历史新高</span></td><td>特色工艺代工受益，消费电子+物联网需求回暖</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>联特科技</strong></td><td>301205</td><td><span class=\"pill pill-up\">涨停</span></td><td>算力硬件龙头，光模块出货量超预期触发涨停</td><td>⭐⭐</td></tr>\n  <tr><td><strong>惠丰钻石</strong></td><td>839725</td><td><span class=\"pill pill-up\">+29.98%</span></td><td>培育钻石概念全面爆发，消费+工业双驱动</td><td>⭐</td></tr>\n  <tr><td><strong>四方达</strong></td><td>300179</td><td><span class=\"pill pill-up\">+20.01%</span></td><td>培育钻石+超硬材料共振，传统业务提供安全垫</td><td>⭐</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<p>特斯拉 Optimus 量产预期持续发酵，A 股核心受益环节及标的全面梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th><th>当前估值水位</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证环节</td><td>⭐⭐⭐</td><td><span class=\"pill pill-mid\">中位</span></td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件</td><td>⭐⭐⭐</td><td><span class=\"pill pill-mid\">中位</span></td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td><td><span class=\"pill pill-up\">偏低</span></td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，工业自动化延伸至机器人</td><td⭐⭐</td><td><span class=\"pill pill-up\">偏低</span></td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td>⭐⭐</td><td><span class=\"pill pill-mid\">中位</span></td></tr>\n</table>\n<p><strong>操作思路：</strong>机器人板块目前处于\"业绩尚未兑现但产业趋势确定\"的阶段，适合<strong>逢低布局而非追高</strong>。核心仓位以三花、绿的谐波为主，传感器/电机作为卫星仓位。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 短期研判</div><div class=\"iv\" style=\"font-size:14px\">创业板强势有望延续，半导体/算力为主线</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 关键观察</div><div class=\"iv\" style=\"font-size:14px\">明日成交能否维持 2.5 万亿以上，决定反弹成色</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">北向资金连续净流出，一旦缩量至 2 万亿以下需警惕分化</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 策略建议</div><div class=\"iv\" style=\"font-size:14px\">守核心（算力+半导体）+ 探新方向（MLCC/培育钻石）</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-0528-1200", "date": "2026-05-28 12:00", "title": "AI板块午评 · 探底回升 MLCC/半导体领涨", "tags": ["午评", "探底回升", "MLCC", "半导体"], "summary": "三大指数早盘探底回升，创业板低开超2%后翻红。MLCC与培育钻石概念走强。", "html": "<h1>AI板块午评 · 探底回升</h1>\n<p><strong>时间：</strong>2026-05-28 11:30</p>\n\n<div class=\"tagline\">📌 <strong>关键分时信号：</strong>11:27 准时拉升，神秘资金入场迹象明显，可能与政策面利好预期有关。V型反转是市场韧性的直接证明。</div>\n\n<h2>一、大盘解读</h2>\n<p>三大指数早盘<strong>探底回升</strong>，一度低迷后快速拉升翻红：</p>\n<\ndiv class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4098.64 <span class=\"pill pill-mid\">午盘 -0.14%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">-- <span class=\"pill pill-mid\">午盘 -0.26%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">-- <span class=\"pill pill-up\">午盘 +0.21%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">半日成交</div><div class=\"iv\">1.78万亿</div></div>\n</div>\n\n<p>早盘一度 <strong>2082 涨、3287 跌</strong>（普跌格局），11:27 企准时拉升翻红——分时图的 V 型反转说明下方承接盘有力。半日成交 1.78 万亿，较前日缩量约 2850 亿，但午后的成交量往往更大，全天仍有希望维持在 2.5 万亿以上。</p>\n\n<h2>二、细分领域</h2>\n<ul>\n <li<strong>算力：</strong>早盘跟随市场探底后快速修复，光模块最先反弹。</li>\n  <li><strong>存储：</strong>华海诚科继续承压，长鑫无新增催化。</li>\n  <li><strong>机器人：</strong>板块整体震荡，三花低开后小幅修复。</li>\n  <li><strong>CPO：</strong>跟随算力链修复，强于大盘。</li>\n</ul>\n\n<h2>三、主流净流入</h2>\n<table>\n  <tr><th>排名</th><th>板块</th><th>驱动</th></tr>\n  <tr><td>1</td><td>MLCC</td><td>涨价周期启动预期</td></tr>\n  <tr><td>2</td><td>培育钻石</td><td>消费+工业需求共振</td></tr\n  <tr><td>3</td><td>半导体</td><td>国产替代预期</td></tr>\n</table>\n\n<h2>四、展望</h2>\n<p>午后关键：看成交量能否放大 + 指数能否站稳 4100。MLCC 和培育钻石值得关注是否具备持续性。</p>\n<blockquote>⚠️ 市场有风险，投资需谨慎。</blockquote>"}, {"id": "mon-0527-1530", "date": "2026-05-27 15:30", "title": "AI板块收盘复盘 · 算力链延续强势 制裁传闻催化国产替代", "tags": ["收盘复盘", "算力", "国产替代", "半导体"], "summary": "A股三大指数涨跌互现，算力链延续强势。半导体制裁传闻触发国产替代预期升温。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">+0.71%</div><div class=\"lbs\">创业板</div></div>\n  <div class=\"metric-box\"><div class=\"num\">2.34万亿</div><div class=\"lbs\">成交额</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-12.3亿</div><div class=\"lbs\">北向净流</div></div>\n</div>\n\n<h1>AI板块收盘复盘</h1>\n<p><strong>时间：</strong>2026-05-27 15:30</p>\n\n<div class=\"tagline\">📌 <strong>核心主线：</strong>美国新一轮半导体制裁传闻持续发酵，A 股市场将\"制裁\"解读为\"国产替代加速\"，算力/半导体设备方向资金集中涌入。</div>\n\n<h2>一、大盘解读</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4093.73 <span class=\"pill pill-up\">+0.38%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15736.47 <span class=\"pill pill-up\">+0.52%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4045.89 <span class=\"pill pill-up\">+0.71%</span></div></div>\n</div>\n<p>两市成交额约 <strong>2.34 万亿</strong>，较前日小幅放量。北上资金净流出约 <strong>12.3 亿</strong>，但内资尤其是公募资金积极入场承接。</p>\n\n<hr>\n\n<h2>二、AI板块整体概览</h2>\n<p>AI 板块全天强势，<strong>算力产业链</strong>是核心主线。市场关注美国新一轮对华半导体设备/EDA 出口管制传闻，国产替代预期再次升温。制裁传闻反而加速了国内的自主可控进程，资本市场的定价逻辑是明确的。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-up\">净流入 6.5亿</span></div>\n<p class=sn><strong>资金面：</strong>主力净流入约 6.5 亿，寒武纪 (+0.62%) 放量，中科曙光跟涨。算力 ETF 申购量显著放大。</p>\n<p class=sn><strong>政策面：</strong>美方新一轮半导体设备/EDA 出口管制传闻触发——但这恰恰说明海外封锁在加速，国内替代窗口在收窄，国产算力的战略价值在提升。</p>\n<p class=sn><strong>基本面：</strong>国内 AI 芯片龙头产能利用率持续提升，代工订单可见度已延伸至 Q4。中芯国际产能满载，华虹特色工艺回暖。</p>\n<p class=sn><strong>情绪面：</strong>市场对\"制裁→替代\"逻辑高度认可，交易拥挤度上升但尚未到极端水平。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪谨慎</span></div>\n<p class=sn><strong>基本面：</strong>国内 HBM 产业链稳步推进，长鑫 HBM3 样品验证中，量产方案逐步清晰。</p>\n<p class=sn><strong>情绪面：</strong>华海诚科 (688535) 因华天科技清仓减持 340 万股公告跌停，板块整体情绪被拖累。3 个月的集中抛压窗口期内，资金入场意愿低迷。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">净流入 3.8亿</span></div>\n<p class=sn>特斯拉 Optimus 量产准备持续推进，近期预计有生产进度更新。三花智控、绿的谐波等核心标的资金持续关注。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO 板块</div>\n<p class=sn>光模块个股跟随算力链走强。800G 出货量持续超预期，1.6T 产品认证推进中，行业景气度趋势未变。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>驱动因素</th></tr>\n  <tr><td><strong>1</strong></td><td>AI 算力</td><td>制裁传闻 + 国产替代加速</td></tr>\n  <tr><td><strong>2</strong></td><td>半导体设备</td><td>国产化预期升温</td></tr>\n  <tr><td><strong>3</strong></td><td>机器人</td><td>Optimus 量产预期</td></tr>\n  <tr><td><strong>4</strong></td><td>光模块</td><td>算力链景气传导</td></tr>\n  <tr><td><strong>5</strong></td><td>HBM</td><td>国产替代预期</td></tr>\n</table>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>华海诚科</strong></td><td>688535</td><td><span class=\"pill pill-down\">跌停</span></td><td>华天科技清仓减持 340 万股，3 个月抛压窗口</td></tr>\n  <tr><td><strong>寒武纪</strong></td><td>688256</td><td><span class=\"pill pill-up\">+0.62%</span></td><td>AI 芯片龙头，制裁传闻催化国产替代</td></tr>\n  <tr><td><strong>中科曙光</strong></td><td>603019</td><td><span class=\"pill pill-up\">放量上涨</span></td><td>国产算力龙头，制裁预期下的确定性受益者</td></tr>\n</table>\n\n<hr>\n\n<h2>六、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 短期判断</div><div class=\"iv\" style=\"font-size:14px\">算力链逻辑清晰，制裁反而强化国产替代确定性</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 关注</div><div class=\"iv\" style=\"font-size:14px\">华海诚科减持抛压是否边际减弱</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">北向连续净流出，若持续需注意外资减仓压力</div></div>\n</div>\n<blockquote>⚠️ 市场有风险，投资需谨慎。</blockquote>"}, {"id": "mon-0527-0930", "date": "2026-05-27 09:30", "title": "AI板块早盘速览 · 半导体制裁传闻催化国产替代", "tags": ["早盘", "半导体", "制裁", "国产替代"], "summary": "市场聚焦美国新一轮半导体制裁传闻，国产算力、HBM、光刻机等方向情绪升温。", "html": "<h1>AI板块早盘速览</h1>\n<p><strong>时间：</strong>2026-05-27 09:30</p>\n\n<div class=\"tagline\">📌 <strong>今日核心催化：</strong>美国媒体报道新一轮对华半导体设备/EDA 出口管制升级计划——对于 AI 板块而言，短期有情绪冲击，中期反而是国产替代的确定性催化剂。</div>\n\n<h2>一、开盘概况</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4080.30 <span class=\"pill pill-mid\">小幅高开</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15691.16 <span class=\"pill pill-mid\">小幅高开</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4049.00 <span class=\"pill pill-mid\">小幅高开</span></div></div>\n</div>\n\n<h2>二、开盘焦点</h2>\n<p>市场开盘即聚焦美国新一轮半导体制裁传闻——半导体设备/材料、AI 芯片、EDA 工具等方向预期率先受益。从板块轮动角度，制裁传闻往往带动\"自主可控\"主题脉冲，但最终能否形成趋势取决于基本面的配合。</p>\n\n<h2、三、预期受益方向</h2>\n<ul>\n  <li><strong>半导体设备：</strong>北方华创、中微公司——自主可控第一受益方</li>\n  <li><strong>EDA 工具：</strong>华大九天——国产 EDA 替代</li>\n  <li><strong>AI 芯片：</strong>寒武纪——国产算力核心</li>\n</ul>\n<blockquote>⚠️ 开盘数据仅供参考，市场有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260529-1811", "date": "2026-05-29 18:11", "title": "AI板块收盘复盘 · 科技全线退潮 防守板块逆势吸金", "tags": ["收盘复盘", "科技回调", "AI退潮", "防御板块", "白银"], "summary": "三大指数高开低走，科创50跌超3.7%，AI/半导体全面回调，电力/公用事业等防御板块获资金追捧。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">-0.73%</div><div class=\"lbs\">上证指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-1.81%</div><div class=\"lbs\">深证成指</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-2.11%</div><div class=\"lbs\">创业板指</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-1073亿</div><div class=\"lbs\">主力净流出</div></div>\n</div>\n\n<h1>AI板块收盘复盘 · 科技全线退潮</h1>\n<p><strong>时间：</strong>2026-05-29 18:00（A股今日已收盘）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>A股三大指数高开低走全线收跌。科技板块全面退潮，AI算力/半导体高位股集体回调，主力资金单日净流出超1073亿元（连续5日净流出）。电力、公用事业、通信线缆等防御+低估值方向逆势吸金。<strong>冰火两重天，节奏切换极快。</strong></div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.27 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.85%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>74.98 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.89%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.02</strong> <span class=\"pill pill-up\">日内 +0.04%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">隔夜COMEX白银</div><div class=\"iv\">75.915 <span class=\"pill pill-up\">+1.36%</span></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>白银价格自1月29日创下121美元/盎司历史高点后，已接近腰斩。当前在75美元附近震荡企稳，日内一度跌破75关口后有所修复。短期呈现<strong>低位震荡筑底</strong>特征。</p>\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元走弱提供支撑：</strong>美元指数报99.02，较前期高点回落，对贵金属形成一定提振</li>\n  <li><strong>美联储加息预期反复：</strong>市场对今年降息节奏的预期出现摇摆，前期超卖后的技术性修复</li>\n  <li><strong>工业需求端：</strong>光伏+AI硬件对白银工业需求维持高位，但短期受全球宏观情绪拖累</li>\n  <li><strong>地缘因素：</strong>美伊和谈进展反复，避险情绪边际降温</li>\n</ul>\n<blockquote>💡 白银当前处于历史高位回落的筑底阶段，短线支撑看72-75美元区间，上方压力80美元整数关口。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读</h2>\n<p>今日A股三大指数高开低走，全线收跌：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">约4038 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\"><span class=\"pill pill-down\">-3.7%+</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>约3.32万亿</strong></div></div>\n</div>\n<p>全市场仅约<strong>1541只上涨</strong>，3884只下跌，涨跌比约3:7。两市成交额约3.32万亿元，较前日放量约3300亿，但属于<strong>放量下跌</strong>——资金从高位板块出逃后并未离场，而是在低位方向积极寻找承接。</p>\n<p><strong>核心特征：</strong></p>\n<ul>\n  <li><strong>主力资金单日净流出1073亿元，连续5日净流出</strong>，内资抛售意愿坚决</li>\n  <li>北向资金成交4734亿元（占两市14.26%），宁德时代/中际旭创/天孚通信为深股通成交前三</li>\n  <li>昨日\"科技股卷土重来\"的热闹景象今日全线反转，节奏切换之快说明<strong>市场情绪极度敏感</strong></li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>今日AI板块<strong>全面回调，集体退潮</strong>。人工智能指数(BK0800)收跌<strong>3.06%</strong>，成交额5398亿元。科创人工智能指数(950180)<strong>下跌3.52%</strong>。</p>\n<p>昨日\"易中天\"齐创新高的盛况不再，今日科技股全线走弱。<strong>两日\"冰火两重天\"的极端切换</strong>说明当前主力资金在高位科技品种上分歧剧烈，获利了结压力显著。</p>\n<p>但需注意：这是<strong>高位调整而非趋势逆转</strong>。产业基本面（AI算力资本开支高增长、HBM供不应求）未变，调整更多是交易层面的资金博弈。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-down\">净流出显著</span> <span class=\"pill pill-mid\">情绪 谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>AI算力芯片板块延续昨日尾盘乏力态势，主力资金连续抛售。中芯国际主力资金净流出<strong>31.4亿元</strong>居全市场首位，华工科技、兆易创新等龙头资金大幅流出。算力ETF全线收跌，科创人工智能ETF华夏（589010）跌1.63%。</p>\n<p class=\"sn\"><strong>政策面：</strong>无新增重磅政策。工信部五部门发布\"百场万企\"通知，聚焦机器人、服务器、AI终端等前沿赛道。国家能源局召开AI+能源现场推进会，但政策面催化效应边际递减。下周6月2-5日Computex大会即将召开，有望形成新的催化剂。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业面持续向好——戴尔2027财年Q1 AI优化服务器营收161亿美元同比激增757%，上调全年AI服务器营收预期至600亿美元。联想集团财报同样亮眼，今日联想港股大涨22.46%。但A股市场对基本面利好已出现<strong>\"利多出尽\"</strong>的反应模式。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场情绪由乐观急转谨慎。资金对算力板块的追高意愿显著下降，高位筹码松动明显。但产业趋势未变——调整是<strong>筹码消化而非逻辑破坏</strong>。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪 中性偏谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>存储板块跟随半导体整体回调。北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但整体方向偏流出。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM价格持续上涨——HBM3E现货价半年来暴涨超300%。三星率先交付首批12层48GB HBM4E样品，美光警告内存短缺将持续至2026年后。AI对HBM的巨量需求挤占常规DRAM产能，DDDR5价格同步暴涨。产业景气的确定性<strong>极高</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>虽然基本面极为强劲，但短期股价已充分反映涨价预期，获利资金同样选择兑现。佰维存储今日盘中上涨0.94%成为存储中少有的红盘股。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-down\">情绪 谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>5月27日机器人板块已净流出143亿元，今日延续抛压。执行器、减速器等核心环节标的调整幅度较大。</p>\n<p class=\"sn\"><strong>基本面：</strong>板块中长期逻辑未变——宇树科技科创板IPO将于<strong>6月1日上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。海关总署数据显示4月工业机器人出口量突破2.5万台，同比增近90%。产业趋势加速中。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场短期聚焦宇树科技上会结果，若顺利过会将为板块注入强心剂。当前调整是<strong>等待催化剂</strong>的\"真空期\"行情。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强</span></div>\n<p class=\"sn\"><strong>资金面：</strong>CPO板块内部分化显著。光模块龙头中际旭创等有所回调（昨日涨幅巨大），但通信线缆及配套板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入39.76亿元居全市场第一，剑桥科技净流入11.73亿元。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年被机构定义为<strong>CPO产业化元年</strong>。英伟达明确2026年Q4启动CPO量产，鸿海集团CPO全光交换机机柜提前出货给英伟达，出货目标从此前1万台上调至2026-2027年超过5万台。LightCounting预测2030年CPO市场规模达100亿美元。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业链逻辑清晰，英伟达/台积电的产业化时间表提供了确定性指引。但短期获利盘同样丰厚，需时间消化。<strong>通信线缆</strong>作为CPO概念的新延伸方向受到资金追捧。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入（亿元）</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御切换</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联概念延伸</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御属性+估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏预期+防御属性</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>消费+外资回流配置</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>同白酒Ⅲ，资金回流消费</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G概念延伸</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>资金流向特征鲜明：</strong></p>\n<ul>\n  <li>今日全市场主力资金净流出<strong>1073亿元</strong>，连续5日净流出</li>\n  <li><strong>电力+公用事业+火电</strong>合计净流入近110亿元，资金从科技向防御方向<strong>大迁徙</strong></li>\n  <li>通信线缆（亨通光电、长飞光纤、剑桥科技）获资金追捧，是AI板块中<strong>唯一的逆势吸金方向</strong></li>\n  <li>AI板块（算力+半导体+光模块）整体净流出居前，在全市场中<strong>相对热度降至低位</strong></li>\n  <li>北向资金成交活跃，宁德时代/中际旭创/天孚通信是深股通成交前三，说明外资仍在关注，但未形成净买入</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿</span></td><td>通信线缆龙头，CPO/算力互联概念延伸，全市场主力净流入第一</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿</span></td><td>半导体龙头获利回吐，主力净流出居全市场首位，高开低走拖累板块</td></tr>\n  <tr><td><strong>博杰股份</strong></td><td>002975</td><td><span class=\"pill pill-up\">涨停</span></td><td>AI算力+业绩爆发（2025年净利增557%），切入英伟达供应链，液冷测试设备小批量发货</td></tr>\n  <tr><td><strong>戴尔/联想</strong></td><td>海外</td><td><span class=\"pill pill-up\">财报亮眼</span></td><td>戴尔AI服务器营收161亿美元+757%；联想港股涨22.46%，服务器龙头业绩全面超预期</td></tr>\n</table>\n\n<hr>\n\n<h2>六、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 今日定性</div><div class=\"iv\" style=\"font-size:14px\">A股已收盘，今日为<strong>情绪退潮日</strong>——科技股全线回调，防御板块吸金。高位筹码需消化，但AI产业基本面未变。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 关注</div><div class=\"iv\" style=\"font-size:14px\"><strong>下周关键事件：</strong>6/1 宇树科技上会 + 6/2-6/5 Computex大会（AI最强催化窗口）</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">隔夜美股三大指数齐创新高，纳指六连涨。Snowflake暴涨36%，英伟达/微软/亚马逊上涨。费城半导体指数+1%。AI产业热度仍在，A股调整更多是<strong>内部筹码问题</strong>。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续5日净流出，若下周无法企稳，调整时间可能延长。需关注北向资金后续动向。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">调整中<strong>逢低分批布局</strong>算力/光模块龙头，核心仓位不动，利用波动降低成本。下周Computex大会是重要催化窗口。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-0529-2000", "date": "2026-05-29 20:00", "title": "AI板块盘后复盘 · 科技全线退潮 白银强势反弹 +3.81%", "tags": ["收盘复盘", "科技回调", "白银反弹", "高切低", "CPO"], "summary": "科创50暴跌5.04%，科技板块全面退潮。电力/公用事业等防御板块逆势吸金。COMEX白银日内反弹+3.81%至76美元上方。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">-0.73%</div><div class=\"lbs\">上证指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-1.81%</div><div class=\"lbs\">深证成指</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-2.11%</div><div class=\"lbs\">创业板指</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50</div></div>\n</div>\n\n<h1>AI板块盘后复盘 · 科技全线退潮 白银强势反弹</h1>\n<p><strong>时间：</strong>2026-05-29 20:00（A股今日已收盘）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>今日A股上演\"高切低\"全面高低切换。科技板块全面退潮，AI算力/半导体高位股大幅回调，主力资金单日净流出831亿元。电力、公用事业、食品饮料等防御板块逆势吸金。科创50暴跌5.04%领跌全场。COMEX白银期货日内反弹超3.8%至76美元上方，表现亮眼。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>76.08美元/盎司</strong> <span class=\"pill pill-up\">日内 +3.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.85美元/盎司</strong> <span class=\"pill pill-up\">日内 +3.61%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>18,358元/千克</strong> <span class=\"pill pill-up\">日内 +2.31%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.01-99.10</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金期货</div><div class=\"iv\"><strong>4,527.3美元/盎司</strong> <span class=\"pill pill-up\">+1.02%</span></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>白银经历了剧烈波动——自5月初70美元启动后一度冲高至近90美元（5月13日高点），随后因美国CPI数据超预期大幅回调至73美元（5月18日低点），5月25日拉升至78美元上方，近期在75-78美元区间震荡。今日COMEX白银期货日内大涨3.81%报76.08美元/盎司，短线反弹势头强劲，但仍未收复80美元整数关口。整体处于<strong>宽幅震荡筑底</strong>阶段。</p>\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元持续走弱：</strong>美元指数报99.01，创近期新低，对贵金属整体形成支撑</li>\n  <li><strong>美伊和谈预期：</strong>美伊谈判接近达成的消息主导今日行情，地缘风险溢价下降带来风险偏好回升</li>\n  <li><strong>通胀数据：</strong>美国4月PCE物价指数同比+3.8%创三年新高，通胀粘性强化抗通胀资产需求</li>\n  <li><strong>工业需求故事：</strong>光伏+AI数据中心建设对白银的需求逻辑持续被市场定价，但短期受宏观情绪拖累明显</li>\n  <li><strong>波动率放大：</strong>5月中旬银价单日暴跌超9%后市场波动率系统性提升，多空分歧剧烈</li>\n</ul>\n<blockquote>💡 白银当前处于历史高位（1月121美元高点）回落后的<strong>宽幅震荡区间</strong>（72-80美元）。短线支撑看72美元，上方压力80美元。市场波动剧烈，操作上注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读</h2>\n<p>A股三大指数今日高开低走，全线收跌：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">约4038 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04%</span> 💥领跌</div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（较前日+3500亿）</div></div>\n</div>\n<p>全市场仅约<strong>1565只上涨</strong>，3867只下跌。成交额3.32万亿元放量至近期高位，但属于<strong>放量下跌</strong>——主力资金净流出约<strong>831.55亿元</strong>。创业板净流出376亿元，沪深300成分股净流出183亿元。</p>\n<p><strong>盘面特征（极致分化）：</strong></p>\n<ul>\n  <li><strong>食品饮料</strong>行业涨3.02%居首，煤炭/公用事业/美容护理涨超2%</li>\n  <li><strong>综合</strong>行业跌5.39%居末，国防军工/电子跌超4%，机械设备/计算机/电力设备跌超2%</li>\n  <li>昨日创业板首超沪指的\"里程碑\"被今日全面退潮迅速抹平——<strong>市场情绪极度敏感</strong></li>\n  <li>北向资金总成交4734亿元（占两市14.26%），宁德时代/中际旭创/天孚通信为深股通成交前三</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>今日AI板块<strong>全面回调，集体退潮</strong>。人工智能指数(BK0800)收跌<strong>3.06%</strong>，成交额5398亿元。科创人工智能指数(950180)<strong>下跌3.52%</strong>。</p>\n<p>昨日\"易中天\"齐创新高、半导体全面爆发的盛况今日彻底反转。半导体产业链全线走弱——派瑞股份、利扬芯片、国芯科技、复旦微电、中芯国际等多股纷纷大幅下挫。<strong>两日\"冰火两重天\"</strong>的极端切换说明：</p>\n<ul>\n  <li>主力资金正在<strong>系统性从高位科技抱团品种撤退</strong>，而非临时调仓</li>\n  <li>北向资金虽然成交活跃但未形成净买入，\"聪明的钱\"也在观望</li>\n  <li>但产业基本面未变——调整是<strong>交易层面的筹码消化</strong>，而非产业逻辑破坏</li>\n</ul>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-down\">净流出显著</span> <span class=\"pill pill-mid\">情绪 谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>AI算力芯片板块全线回调。电子行业主力资金净流出居首，达<strong>372亿元</strong>。昨日创新高的中际旭创、中芯国际等今日成为主要抛压方向。算力ETF全线收跌，创业板人工智能ETF华安(159279)跌2.02%，科创人工智能ETF华夏(589010)跌1.63%。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周<strong>6月2-5日Computex大会</strong>即将召开，以\"AI Together\"为主题，全球AI算力巨头将集中发布AI芯片、服务器、液冷散热等最新方案，有望形成新的催化剂。市场监管总局&发改委联合发布《人工智能计量体系和能力建设指引（2026版）》，系统布局AI计量能力。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业面持续亮眼——Cerebras在美上市首日大涨89%市值达到750亿美元，验证AI算力赛道的高景气。华为推出星河AI数据中心网络方案（NPU与存储直通，传输带宽提升8倍）。海内外AI基建投资同步加码，谷歌微软等四大云厂商2026年资本支出合计达7250亿美元（+77%）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场情绪由极度乐观急转谨慎。但要注意——美股AI板块仍在上涨（纳指六连涨创新高），A股的调整更多是<strong>内部资金博弈和\"高切低\"</strong>的体现。短期调整后，基本面更好的标的将率先企稳。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪 中性偏谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>跟随半导体整体回调。北向资金在存储龙头上成交活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但整体方向偏流出。佰维存储盘中逆势上涨0.94%，成为存储中少有的红盘股。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM景气度持续超预期——全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（环比+80%，同比+260%），创历史新高。HBM在AI芯片成本占比已从52%升至63%，东北证券预计HBM涨价至少持续到2027年。三星率先交付首批12层48GB HBM4E样品，HBM供给紧张态势持续。集邦预测2026年HBM需求将再增长70+%。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强势，但股价短期已充分反映涨价预期。获利资金同样选择兑现。中长期来看，HBM仍是整个AI产业链中<strong>供需格局最紧张</strong>的环节之一。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-down\">情绪 谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>5月27日机器人板块已净流出143亿元，今日继续承压。5月29日人形机器人板块整体随大市回调，天永智能、奥比中光等前期强势股回调明显。奥比中光在科创AI指数中表现相对抗跌(+0.84%)。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势加速——2026年是人形机器人<strong>规模化验证关键期</strong>。宇树科技科创板IPO<strong>6月1日上会</strong>，冲刺A股\"人形机器人第一股\"。海关数据显示4月工业机器人出口量突破2.5万台（同比+90%）。全球格局中美日三足鼎立，中国凭借供应链优势主导量产，2025年中国整机出货量占全球84.71%。</p>\n<p class=\"sn\"><strong>情绪面：</strong>短期聚焦宇树科技上会结果和下周Computex大会机器人相关展示。调整本质上是<strong>等待催化剂真空期</strong>的正常行情。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强</span> <span class=\"pill pill-up\">情绪 结构性乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>CPO板块内部分化显著——光模块龙头中际旭创等因昨日涨幅过大今日有所回调（成交额225亿元居A股第一），但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿元</strong>居全市场第一，剑桥科技净流入11.73亿元，长飞光纤净流入10.39亿元。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年机构定义为<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产，鸿海集团CPO全光交换机出货目标从此前1万台上调至5万台以上。台积电COUPE封装技术加速推进。LightCounting预测2030年CPO市场规模达100亿美元。中际旭创2026年一季度营收194.96亿元（+192%），净利润57.35亿元（+262%），业绩增速惊人。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业趋势确定性极高，但市场也对CPO替代传统可插拔光模块的影响存在分歧。但斌转发CPO视频引发关注，说明产业处于\"从0到1\"的认知扩散阶段。通信线缆方向的资金流入显示市场在寻找<strong>CPO产业链的\"新面孔\"</strong>。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入（亿元）</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>主力资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联概念延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量，板块受益</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红，估值洼地受追捧</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏预期+避险资金配置</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>消费+外资回流配置，贵州茅台获主力净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>同白酒Ⅲ，消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力资金净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li><strong>电子行业</strong>主力净流出<strong>372.05亿元</strong>居全行业第一，是今日最大失血板块</li>\n  <li>机械设备净流出超100亿，电力设备净流出超100亿，计算机/通信/军工净流出超20亿</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿元，资金从科技全面撤退至防御板块</li>\n  <li>通信线缆是AI板块中<strong>唯一的逆势吸金方向</strong>，CPO产业链资金仍在活跃</li>\n  <li><strong>AI板块（电子+计算机+通信）合计净流出超过400亿</strong>，在全市场中相对热度降至冰点</li>\n  <li>北向资金成交4734亿但整体呈净流出态势，外资同样在\"高切低\"</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念延伸受益，获主力资金集中追捧</td></tr>\n  <tr><td><strong>博杰股份</strong></td><td>002975</td><td><span class=\"pill pill-up\">昨日涨停</span></td><td>AI算力+业绩爆发（2025年净利增557%），切入英伟达供应链，液冷测试设备小批量发货</td></tr>\n  <tr><td><strong>中际旭创</strong></td><td>300308</td><td><span class=\"pill pill-mid\">成交额225亿<br>A股第一</span></td><td>光模块龙头，昨日大涨6.77%后今日高位震荡。一季度营收195亿同比+192%，全年业绩确定性强</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>HK.0992</td><td><span class=\"pill pill-up\">港股暴涨22.46%</span></td><td>财报全面超预期，AI服务器业务成为核心增长引擎，验证全球AI硬件景气度</td></tr>\n</table>\n\n<hr>\n\n<h2>六、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 今日定性</div><div class=\"iv\" style=\"font-size:14px\">A股已收盘。今日为明显的<strong>\"高切低\"切换日</strong>——科技板块全面回调，防御板块逆势吸金。两日\"冰火两重天\"说明市场情绪极度敏感、多空分歧剧烈。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周关键事件</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 6/1 宇树科技上会</strong>（人形机器人第一股）<br><strong>2) 6/2-6/5 Computex大会</strong>（全球AI年度最强催化）</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">隔夜美股三大指数<strong>齐创新高</strong>（纳指六连涨+0.91%）。Snowflake暴涨36%，英伟达/微软/亚马逊上涨。费城半导体指数+1%。AI产业热度仍在，A股的调整更多是<strong>内部资金博弈问题</strong>。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银日内反弹+3.81%至76.08美元，受美伊和谈和美元走弱提振。白银在72-80美元区间宽幅震荡，短线反弹动能较强，但整体方向需等待下周非农数据和美联储表态。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金持续大额净流出，若下周Computex大会无法提振市场情绪，AI板块调整时间可能延长。仓位管理是第一要务。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">调整中<strong>逢低分批布局</strong>算力/光模块龙头，核心仓位不动。下周Computex大会是最重要的催化窗口，关注英伟达Vera Rubin架构相关更新。CPO产业链（通信线缆方向）值得重点关注新机会。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-0529-2100", "date": "2026-05-29 21:00", "title": "AI板块盘后复盘 · 科技全面退潮 科创50暴跌5% 白银反弹+3.81%", "tags": ["收盘复盘", "高切低", "科技回调", "白银反弹", "CPO通信线缆"], "summary": "科创50暴跌5.04%领跌全场，科技全面退潮。电力/消费逆势吸金。COMEX白银+3.81%至76美元。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4068.57</div><div class=\"lbs\">上证指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.73%</div><div class=\"lbs\">上证涨跌</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50</div></div>\n  <div class=\"metric-box\"><div class=\"num\">3.32万亿</div><div class=\"lbs\">成交额</div></div>\n</div>\n\n<h1>AI板块盘后复盘 · 科技全面退潮 COMEX白银反弹至76美元</h1>\n<p><strong>时间：</strong>2026-05-29 21:00（A股今日已收盘）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>今日A股上演\"高切低\"全面切换——科技板块全面退潮，科创50暴跌5.04%。电力、消费、通信线缆逆势吸金。COMEX白银日内强力反弹+3.81%至76.08美元，表现亮眼。下周Computex大会和宇树IPO是AI板块最大看点。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>76.08美元/盎司</strong> <span class=\"pill pill-up\">日内 +3.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.85美元/盎司</strong> <span class=\"pill pill-up\">日内 +3.61%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>18,358元/千克</strong> <span class=\"pill pill-up\">日内 +2.31%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.01-99.10</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>4,527.3美元/盎司</strong> <span class=\"pill pill-up\">+1.02%</span></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>白银经历了剧烈波动——自5月初70美元启动后冲高至近90美元（5月13日），随后因美国CPI超预期大幅回调至73美元（5月18日），5月25日拉升至78美元上方，今日日内大涨3.81%报76.08美元。短线反弹势头强劲，但整体仍处<strong>72-80美元宽幅震荡区间</strong>。</p>\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元持续走弱：</strong>美元指数报99.01创近期新低，对贵金属整体形成支撑</li>\n  <li><strong>美伊谈判接近达成：</strong>地缘风险溢价下降，风险偏好回升推动白银反弹</li>\n  <li><strong>通胀粘性：</strong>美国4月PCE同比+3.8%创三年新高，抗通胀资产需求升温</li>\n  <li><strong>工业需求故事：</strong>光伏+AI数据中心对白银需求持续被市场定价</li>\n</ul>\n<blockquote>💡 白银处于72-80美元区间震荡，短线支撑看72美元，上方压力80美元。波动剧烈（5月单日曾跌超9%），注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读</h2>\n<p>A股三大指数今日<strong>高开低走，全线收跌</strong>，科创50暴跌5.04%领跌全场：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（+3500亿放量）</div></div>\n</div>\n<p>全市场仅<strong>1565只上涨</strong>，3867只下跌，涨跌比约3:7。主力资金净流出<strong>831.55亿元</strong>，其中创业板净流出376亿元。申万一级仅12个行业上涨——食品饮料(+3.02%)、煤炭(+2%+)、公用事业(+2%+)领涨；综合(-5.39%)、国防军工、电子(-4%以上)领跌。</p>\n<p>北向资金成交4734亿元(占两市14.26%)，宁德时代/中际旭创/天孚通信为深股通成交前三。</p>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>今日AI板块<strong>全面回调，集体退潮</strong>。人工智能指数收跌<strong>3.06%</strong>，成交额5398亿元。</p>\n<p>昨日\"易中天\"齐创新高的盛况今日彻底反转。市场核心特征：</p>\n<ul>\n  <li><strong>两日\"冰火两重天\"</strong>——主力资金正在<strong>系统性从高位科技抱团品种撤退</strong></li>\n  <li><strong>电子行业</strong>主力净流出<strong>372亿元</strong>，居全行业第一</li>\n  <li>产业基本面未变——调整是<strong>交易层面的筹码消化</strong>，非产业逻辑破坏</li>\n</ul>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-down\">净流出显著</span> <span class=\"pill pill-mid\">情绪 谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>电子行业主力净流出372亿元居首。中芯国际主力净流出31.4亿居全市场第一。算力ETF全线下跌，创业板人工智能ETF华安(159279)跌2.02%，近5日有3天主力净流出。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周<strong>6/2-6/5 Computex大会</strong>以\"AI Together\"为主题，英伟达、AMD等巨头将发布最新AI芯片方案。市场监管总局&发改委联合发布《人工智能计量体系和能力建设指引(2026版)》。</p>\n<p class=\"sn\"><strong>基本面：</strong>Cerebras在美上市首日大涨89%市值达750亿美元。戴尔AI服务器营收161亿美元同比+757%。海内外AI基建同步加码，四大云厂商2026年资本支出7250亿美元(+77%+)。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金从科技撤离明显，但美股纳指六连涨创新高，AI产业热度仍在。A股调整更多是<strong>内部资金博弈</strong>——\"高切低\"。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪 中性偏谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>跟随半导体整体回调。北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但整体方向偏流出。佰维存储盘中逆势上涨0.94%。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM景气度持续超预期——HBM3E现货价半年暴涨超300%。三星率先交付首批12层48GB HBM4E样品。集邦预测2026年HBM需求再增70%+。美光警告内存短缺将延续至2026年后。全球DRAM营收Q1逼近970亿美元（+260%）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强劲，但股价已充分反映涨价预期，获利资金兑现。中长期来看，HBM是AI产业链中<strong>供需格局最紧张</strong>的环节。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-down\">情绪 谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>延续5月27日净流出143亿元的抛压态势，板块今日继续承压。天永智能、奥比中光等前期强势股回调明显。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势加速——2026年是人形机器人<strong>规模化验证关键期</strong>。宇树科技科创板IPO<strong>6月1日上会</strong>。海关数据显示4月工业机器人出口量突破2.5万台（同比+90%）。特斯拉Optimus Gen-3 Q2启动量产，首代目标年产能100万台。</p>\n<p class=\"sn\"><strong>情绪面：</strong>短期聚焦宇树科技上会结果。如果顺利过会将为板块注入强心剂。当前属于<strong>等待催化剂真空期</strong>的正常调整。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强</span></div>\n<p class=\"sn\"><strong>资金面：</strong>板块内部分化——光模块龙头中际旭创（昨日放量225亿成交A股第一）今日高位震荡，但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>居全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上。LightCounting预测2030年CPO市场规模达100亿美元。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正在寻找CPO产业链的\"新面孔\"——通信线缆方向获得集中配置。但斌转发CPO视频引发产业关注。光模块龙头的短期调整属获利回吐。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产
