i>\n<li><strong>政策面：</strong>SK海力士计划五年内晶圆产能翻番，产能瓶颈或持续到2030年。</li>\n<li><strong>基本面：</strong><strong>三星交付全球首批HBM4E样品</strong>（带宽超1.5TB/s），在Computex 2026展示全球首款<strong>HBM5原型</strong>。英伟达探询2026年Q4交付16层堆叠HBM可行性。</li>\n<li><strong>情绪面：</strong>存储赛道持续高景气，HBM技术迭代加速，从周期股向成长股切换预期强化。</li>\n</ul>\n\n<h3>机器人板块</h3>\n<ul>\n<li><strong>资金面：</strong>6月4日机器人概念活跃，日盈电子、锋龙股份、日发精机涨停。创业板人工智能ETF华宝主力净流入1.02亿元。</li>\n<li><strong>政策面：</strong>工信部/国家数据局\"模数共振\"行动推动AI+机器人应用。广深\"十五五\"规划支持具身智能。</li>\n<li><strong>基本面：</strong><strong>宇树科技73天闪电过会</strong>，估值420亿成\"人形机器人第一股\"。2028年人形机器人市场规模料超138亿美元。特斯拉Optimus计划2026年更广泛推广。</li>\n<li><strong>情绪面：</strong>概念向量产切换预期强烈。板块PE 34.6倍处于近5年14%分位，估值相对合理。</li>\n</ul>\n\n<h3>CPO板块</h3>\n<ul>\n<li><strong>资金面：</strong>6月4日CPO板块经历6月3日大涨后进入技术性回调。此前通信板块连续两日净流入居行业首位（148-168亿元）。中际旭创市值突破1.4万亿后调整。</li>\n<li><strong>政策面：</strong><strong>英伟达官宣Spectrum-X硅光CPO交换机全面量产</strong>，2026年Q4实现CPO规模化商用。2026年为CPO产业化元年。</li>\n<li><strong>基本面：</strong>中际旭创800G全球市占率超42%，1.6T全球唯一批量供货。高盛预测2026年全球光模块市场规模285-480亿美元。Lightcounting预测2026年以太网光模块市场增长65%。</li>\n<li><strong>情绪面：</strong>短期回调属大涨后正常调整，中长期逻辑不变。CPO是AI硬件中确定性最强环节之一。</li>\n</ul>\n\n<h2>四、主流净流入板块监控（6月4日）</h2>\n<h3>主力资金净流入TOP10个股</h3>\n<ol>\n<li><strong>京东方A</strong> —— 34.81亿元（面板/LED，涨停创近五年新高）</li>\n<li><strong>三安光电</strong> —— 14.54亿元（化合物半导体）</li>\n<li><strong>沪电股份</strong> —— 14.13亿元（PCB/AI服务器）</li>\n<li><strong>兆易创新</strong> —— 13.61亿元（存储芯片）</li>\n<li><strong>中兴通讯</strong> —— 12.18亿元（通信设备）</li>\n<li><strong>德明利</strong> —— 11.73亿元（存储芯片）</li>\n<li><strong>大族激光</strong> —— 11.49亿元（半导体设备）</li>\n<li><strong>通鼎互联</strong> —— 9.13亿元（光纤通信）</li>\n<li><strong>厦门钨业</strong> —— 8.73亿元（有色金属）</li>\n<li><strong>胜宏科技</strong> —— 7.72亿元（PCB）</li>\n</ol>\n<p><strong>AI板块相对热度：</strong> 🟡 中等偏上。市场普跌但芯片/半导体逆势走强，AI产业链是存量资金最偏好方向。交投较6月3日明显缩量（两市缩量3740亿）。</p>\n\n<h2>五、关键异动个股</h2>\n<ol>\n<li><strong>京东方A（000725）涨停</strong> —— 百万股东迎涨停，股价创近五年新高。主力净流入34.81亿居两市首位。</li>\n<li><strong>中船特气（688146）20CM涨停</strong> —— 半导体电子特气龙头，受益于HBM/先进封装产能扩张。</li>\n<li><strong>太极实业（600667）3天2板</strong> —— 半导体封测概念持续发酵。</li>\n</ol>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<ul>\n<li><strong>Optimus量产：</strong> Qutimus V3设计接近定型，预计2026年7-8月量产。宇树科技73天过会拟募资42亿元。小鹏IRON预计2026年底量产。</li>\n<li><strong>受益标的：</strong> 执行器（拓普集团、三花智控）；减速器（绿的谐波、中大力德）；电机（汇川技术、鸣志电器）；传感器（奥比中光、禾川科技）；灵巧手（斯菱智驱、北特科技）。</li>\n<li><strong>数据：</strong> 宇树科技2025年营收16.99亿元（三年CAGR 226%），毛利率60.13%。2026Q1营收同比增68.5%。</li>\n</ul>\n\n<h2>七、总结与展望</h2>\n<h3>当前总结</h3>\n<ol>\n<li><strong>A股6月4日普跌调整但科技逆势：</strong> 指数跌但芯片半导体走强，CPO技术性回调，内部轮动健康。</li>\n<li><strong>资金极度聚焦科技：</strong> 主力净流入TOP10几乎全部是半导体/通信标的。</li>\n<li><strong>白银波动加剧：</strong> 美伊局势+鹰派预期+今晚非农，多空激烈博弈。</li>\n</ol>\n<h3>6月5日展望</h3>\n<ul>\n<li><strong>A股：</strong> 关注科创板/半导体能否延续强势。CPO经历两日回调或迎技术性反弹。今晚美国非农数据影响全球情绪。</li>\n<li><strong>白银：</strong> 非农公布前后波动加剧。数据偏弱看75美元，偏强则测试72美元支撑。</li>\n<li><strong>长期：</strong> CPO产业化元年+AI算力资本开支高增+人形机器人商业化拐点临近——三大趋势不变。</li>\n</ul>\n<hr />\n<p><em>⚠️ 风险提示：市场信息汇总，不构成投资建议。AI板块短期涨幅较大，需防高位震荡。投资有风险，决策需谨慎。</em></p>\n<p><em>数据来源：东方财富、证券时报、Wind、Lightcounting、高盛、中信证券、每经</em></p>"}, {"id": "mon-20260605-1006", "date": "2026-06-05 10:06", "title": "AI板块实时监控 & COMEX白银播报 — 外围芯片暴跌 A股走出独立行情", "tags": ["AI板块", "白银", "实时监控", "博通", "物理AI", "算力", "存储"], "summary": "博通指引低于预期全球芯片暴跌；A股芯片净流入106亿独立走强；物理AI新概念爆发", "html": "\n<h1>AI板块实时监控报告 &amp; COMEX白银期货播报</h1>\n<p><strong>【2026-06-05 10:06】</strong></p>\n\n<h2>零、COMEX白银期货播报</h2>\n<ul>\n<li><strong>最新价格：</strong> COMEX白银期货最新报 <strong>73.06美元/盎司</strong>（6月4日收盘），日内跌0.86%。今日亚盘现货白银交投于73-74美元/盎司区间。</li>\n<li><strong>日内涨跌幅：</strong> 隔夜COMEX白银期货跌0.86%至73.06美元，盘中最低触及72.57美元。</li>\n<li><strong>近期趋势判断：</strong> 白银自今年1月触及94美元/盎司高位后持续回调，目前在<strong>72-76美元区间震荡整理</strong>。短期偏弱但仍处于历史高位区间。</li>\n<li><strong>驱动因素简析：</strong>\n<ul>\n<li><strong>美元指数：</strong> 美元指数交投于99.2附近，对贵金属形成一定压制</li>\n<li><strong>美联储政策：</strong> 美国5月ADP就业超预期，市场担忧加息预期升温，但市场已逐步消化</li>\n<li><strong>工业需求：</strong> 光伏/新能源汽车/AI硬件用银需求保持高位，世界白银协会预测2026年供需缺口6316吨</li>\n<li><strong>库存支撑：</strong> COMEX白银库存持续下降，全球显性库存仅能支撑1.2个月消费</li>\n<li><strong>机构预测分化：</strong> 美国银行看多年底冲击100美元，瑞银/汇丰下调目标至75-80美元</li>\n</ul></li>\n<li><strong>现货黄金同步承压：</strong> 金价最新报约4470美元/盎司附近。</li>\n</ul>\n\n<h2>一、大盘解读</h2>\n<p><strong>今日（6月5日，周五）A股三大指数集体低开，市场分化明显：</strong></p>\n<ul>\n<li><strong>上证指数：</strong> 开盘报 <strong>4044.83点</strong>，跌0.32%</li>\n<li><strong>深证成指：</strong> 开盘报 <strong>15595.70点</strong>，跌0.42%</li>\n<li><strong>创业板指：</strong> 开盘报 <strong>4079.95点</strong>，跌0.22%</li>\n<li><strong>科创综指：</strong> 开盘报 <strong>2053.44点</strong>，跌1.05%</li>\n<li><strong>两市涨跌比：</strong> 开盘涨跌比为2034:2649，涨停6家，跌停3家</li>\n<li><strong>昨日回顾（6月4日）：</strong> 三大指数集体收跌——沪指跌0.64%报4057.78点，深成指跌0.27%，创业板指跌0.83%。两市成交2.78万亿元缩量。半导体/存储芯片/PCB逆势走强，消费/有色/油气承压。</li>\n<li><strong>隔夜外围重挫：</strong> 美股芯片巨头<strong>博通下季度指引160亿美元低于预期</strong>，股价暴跌12.59%。美光跌超7%，AMD跌超3%。日韩芯片股暴跌——韩国综指跌超6%，三星电子跌超6%，SK海力士跌超8%，韩国交易所启动熔断机制。</li>\n</ul>\n\n<h2>二、AI板块实时市场概览</h2>\n<blockquote>A股今日三大指数低开，AI板块受外围暴跌拖累承压。但<strong>物理AI概念逆市大幅高开</strong>——天娱数科一字涨停，凡拓数创、索辰科技高开9%。英伟达重磅发布NVIDIA Cosmos 3物理AI模型催化该方向。AI板块内部<strong>结构性分化</strong>：算力硬件方向受博通利空冲击，而AI应用/物理AI方向活跃。截至9:50，芯片产业链主力资金净流入高达<strong>106.6亿元</strong>居各板块之首，显示A股芯片板块走出独立行情。</blockquote>\n\n<h2>三、细分领域动态</h2>\n\n<h3>算力板块</h3>\n<ul>\n<li><strong>资金面</strong> 💰：今日芯片产业链单日主力资金净流入<strong>106.6亿元</strong>，位居各板块之首。科创人工智能ETF华夏（589010）下跌2.40%，成分股分化——云从科技涨1.04%、金山办公涨1.01%，但星环科技跌5.25%、澜起科技跌5.03%。</li>\n<li><strong>政策面</strong> 📋：发改委/工信部联合发布AI新规划，2030年AI核心产业规模超5万亿元；大基金二期重点投向AI芯片/高端GPU/光芯片等\"卡脖子\"领域，单企业最高投资10亿元。</li>\n<li><strong>基本面</strong> 🔬：<strong>博通下季度AI芯片销售指引160亿美元</strong>低于预期的172亿美元，股价暴跌12.59%，拖累全球AI芯片股。但博通2026财年AI芯片总销售额仍高达560亿美元。<strong>英伟达正式官宣NVIDIA Cosmos 3</strong>，全球首款全模态物理AI模型。意法半导体宣布6月28日起对部分产品涨价。</li>\n<li><strong>情绪面</strong> 😟：中性偏谨慎。博通利空冲击全球算力板块情绪，但A股芯片产业链走出独立行情显示资金对国产替代信心不减。</li>\n</ul>\n\n<h3>存储板块</h3>\n<ul>\n<li><strong>资金面</strong> 💰：今日存储芯片板块多股低开——<strong>江波龙跌超5%</strong>、兆易创新跌超4%、华虹公司、德明利等跟跌。受SK海力士跌超8%拖累。</li>\n<li><strong>政策面</strong> 📋：SK集团会长崔泰源称海力士计划五年内晶圆产能翻番，存储芯片产能瓶颈可能持续到2030年。三星率先向客户交付HBM4E样品。</li>\n<li><strong>基本面</strong> 🔬：三星在Computex 2026展示全球首款<strong>HBM5原型</strong>（2nm基础裸片+1c nm DRAM，单堆叠带宽4TB/s目标）。行业预测HBM5采用4096-bit I/O通道和16层堆叠标准。中信证券研报指出，HBM与传统存储正迎来从涨价修复到技术成长共振的新周期。</li>\n<li><strong>情绪面</strong> 😊：赛道长期逻辑不变，但短期受韩国芯片股暴跌情绪传导。HBM技术迭代加速（HBM4E→HBM5路线清晰），存储从周期股向成长股切换预期仍在。</li>\n</ul>\n\n<h3>机器人板块</h3>\n<ul>\n<li><strong>资金面</strong> 💰：今日A股机器人概念股开盘表现分化。昊志机电、奥比中光等前期活跃股关注度较高。6月2日板块涨1.12%但主力净流出10.64亿元。</li>\n<li><strong>政策面</strong> 📋：四部门（中央网信办、教育部、工信部、人社部）联合印发AI素养新政，将\"提升全民人工智能素养\"列为重点任务。比亚迪执行副总裁首度证实自研人形机器人，代号\"尧舜禹\"。</li>\n<li><strong>基本面</strong> 🔬：<strong>特斯拉Optimus V3预计7-8月启动量产</strong>，弗里蒙特工厂年产能100万台。中信证券力推特斯拉机器人产业链。<strong>宇树科技科创板过会</strong>成\"人形机器人第一股\"。比亚迪2026年计划内部部署2万台人形机器人。</li>\n<li><strong>情绪面</strong> 😊：乐观偏积极。量产时间节点已明确，产业链从概念走向现实。但需注意部分个股短期涨幅已大。</li>\n</ul>\n\n<h3>CPO板块</h3>\n<ul>\n<li><strong>资金面</strong> 💰：昨日（6月4日）通信ETF国泰净流入<strong>17.34亿元</strong>居全市场ETF第一。今日CPO板块开盘受外围拖累低开但跌幅有限。致尚科技公告持续收到PH客户光纤连接器采购订单，累积金额约6640万美元。</li>\n<li><strong>政策面</strong> 📋：英伟达官宣Spectrum-X硅光CPO交换机全面量产。黄仁勋与Marvell CEO在Computex 2026同台发声，指出AI瓶颈正从算力/存储转向<strong>高速连接</strong>，光互连技术有望迈入产业景气周期。</li>\n<li><strong>基本面</strong> 🔬：中际旭创800G全球市占率超42%，1.6T全球唯一批量供货，订单排期覆盖至2028年。2026年被机构定义为<strong>CPO产业化元年</strong>。据LightCounting预测，到2030年CPO市场规模有望达100亿美元。</li>\n<li><strong>情绪面</strong> 😊：中长期极度乐观，但短期受外围芯片股暴跌情绪影响。黄仁勋点名光互连为下一代AI瓶颈，为CPO板块提供最强催化。</li>\n</ul>\n\n<h2>四、主流净流入板块监控</h2>\n<h3>今日（6月5日）板块资金流向</h3>\n<table>\n<tr><th>排行</th><th>板块/方向</th><th>资金流入情况</th><th>驱动原因</th></tr>\n<tr><td>🥇</td><td><strong>芯片产业链</strong></td><td><strong>主力净流入106.6亿元</strong></td><td>国产替代+WSTS上调全球半导体市场+意法半导体涨价</td></tr>\n<tr><td>🥈</td><td><strong>物理AI概念</strong></td><td>大幅高开，多股涨停</td><td>英伟达Cosmos 3全模态物理AI模型发布</td></tr>\n<tr><td>🥉</td><td><strong>创新药</strong></td><td>开盘多股高开</td><td>政策利好<br>美诺华涨4%+、翰宇药业涨2%+</td></tr>\n<tr><td>4</td><td><strong>航天装备</strong></td><td>涨幅居前</td><td>商业航天政策利好</td></tr>\n<tr><td>5</td><td>数字媒体</td><td>涨幅居前</td><td>AI+应用落地预期</td></tr>\n<tr><td>6</td><td>疫苗</td><td>小幅上涨</td><td>防御性资金配置</td></tr>\n<tr><td>7</td><td>通信设备</td><td>ETF const reports = [{"id": "citic-pe", "title": "中信证券(600030) 近三年PE-TTM走势分析", "icon": "📈", "tags": ["中信证券", "PE-TTM", "估值分析"], "desc": "基于自建数据库对中信证券近三年PE-TTM走势的深度复盘与当前估值定位分析", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">16.72x</div><div class=\"lbs\">当前 PE-TTM</div></div>\n  <div class=\"metric-box\"><div class=\"num\">21.93x</div><div class=\"lbs\">近 3 年均值</div></div>\n  <div class=\"metric-box\"><div class=\"num\">13.33x</div><div class=\"lbs\">近 3 年最低</div></div>\n  <div class=\"metric-box\"><div class=\"num\">35.26x</div><div class=\"lbs\">近 3 年最高</div></div>\n</div>\n\n<h1>中信证券(600030) 近三年 PE-TTM 走势分析</h1>\n\n<div class=\"tagline\">📌 <strong>核心结论：</strong>当前 PE-TTM 16.72 倍，处于近三年偏低分位（约 30% 分位），较均值 21.93 倍折价约 23.7%。对于中长期投资者，具备较高安全边际。</div>\n\n<h2>一、PE-TTM 走势全景回顾</h2>\n<p>PE-TTM（滚动市盈率）= 股价 ÷ 最近 12 个月的实际每股收益。相比静态市盈率，它使用<strong>最新四个季度财务数据</strong>，更真实反映公司当前估值水平。</p>\n\n<h3>走势三阶段</h3>\n<p><strong>第一阶段：估值收缩期（2024 年）</strong><br>受证券行业\"降费让利\"政策预期影响，市场对券商盈利前景产生担忧。叠加成交量萎缩、自营承压，PE 从年初 20 倍区间持续下滑至年末 <strong>14.7 倍</strong>附近，全年估值中枢下移约 26%。</p>\n\n<p><strong>第二阶段：底部震荡期（2025 年初至年中）</strong><br>PE 在 <strong>13.33 ~ 15.5 倍</strong> 区间窄幅波动。市场对券商板块关注度降至低点。期间中信证券多次回购稳定投资者信心。<strong>13.33 倍</strong> 成为本轮调整的估值铁底。</p>\n\n<p><strong>第三阶段：估值修复期（2025 年下半年至今）</strong><br>市场活跃度回升 + 权益市场回暖，券商自营及经纪业务环比改善。PE 从历史底部区域反弹至 16~18 倍区间。当前 16.72 倍较底部反弹约 25.4%，但距均值仍有空间。</p>\n\n<hr>\n\n<h2>二、关键区间分析</h2>\n<table>\n  <tr><th>指标</th><th>数值</th><th>含义</th></tr>\n  <tr><td><strong>最低 PE</strong></td><td>13.33x</td><td>2025 年 7 月——近三年绝对底部，也是压力测试的极限值</td></tr>\n  <tr><td><strong>最高 PE</strong></td><td>35.26x</td><td>2024 年初\"中特估\"行情驱动</td></tr>\n  <tr><td><strong>均值 PE</strong></td><td>21.93x</td><td>近三年估值中枢</td></tr>\n  <tr><td><strong>中位数 PE</strong></td><td>18.77x</td><td>半数时间在此以下</td></tr>\n  <tr><td><strong>当前 PE</strong></td><td>16.72x</td><td>低于均值和中位数，折价约 23.7%</td></tr>\n</table>\n<p><strong>分位数：</strong>当前 16.72 倍处于近三年 PE 序列约 <strong>30% 分位</strong>——即过去三年中约 <strong>70% 的时间估值高于当前</strong>。从历史统计角度看具有明显安全边际。</p>\n\n<hr>\n\n<h2>三、驱动因素</h2>\n<ul>\n  <li><strong>市场周期：</strong>券商估值与日均成交额高度正相关。2024 日均<8000 亿 vs 2025 日均>1.2 万亿</li>\n  <li><strong>行业政策：</strong>\"降费让利\"冲击边际递减；注册制改革深化利好投行</li>\n  <li><strong>自营收益：</strong>权益市场修复是 PE 回升核心推动力</li>\n</ul>\n\n<hr>\n\n<h2>四、估值展望</h2>\n<p>当前已反映大部分不确定性，下行风险有限。若市场活跃度维持，PE 有望向均值 <strong>21.93 倍</strong> 修复，对应约 <strong>31% 上行空间</strong>。</p>\n<p><strong>操作参考：</strong>PE 进入 <strong>15 倍以下</strong> 逐步布局；PE 接近或突破 <strong>22 倍</strong> 时分批兑现。</p>\n\n<blockquote>⚠️ 以上分析仅基于公开数据和历史统计，不构成投资建议。PE 为滞后指标。</blockquote>"}, {"id": "hbm-chain", "title": "国产HBM产业链全景解析", "icon": "🔬", "tags": ["HBM", "长鑫存储", "长电科技", "安集科技"], "desc": "全面梳理国产HBM产业链现状、核心玩家与挑战，从DRAM到先进封装逐环节拆解", "html": "<h1>国产 HBM 产业链全景解析</h1>\n<p><strong>日期：</strong>2026-05-28</p>\n\n<div class=\"tagline\">国产 HBM 产业链目前处于 <strong>\"从 0 到 1，点状突破\"</strong> 的初级阶段。与国际顶尖水平（SK 海力士 HBM3E）存在 2~3 代差距，但代差已从 8 年缩至 4 年。</div>\n\n<h2>一、HBM 存储颗粒</h2>\n<table>\n  <tr><th>公司</th><th>上市</th><th>最新进展</th></tr>\n  <tr><td><strong>长鑫存储 (CXMT)</strong></td><td><span class=\"pill pill-mid\">未上市</span></td><td>HBM2 已于 2025H1 量产，HBM3 样品交付客户，目标 2027 年 HBM3E</td></tr>\n  <tr><td>武汉新芯 (XMC)</td><td><span class=\"pill pill-mid\">未上市</span></td><td>HBM2 开发中，月产能 3000 片 12 英寸工厂</td></tr>\n</table>\n<p>从成熟 DDR5 转向高性能 HBM DRAM，技术跨度大，长鑫的 HBM3 量产验证是关键一战。</p>\n\n<h2>二、先进封装</h2>\n<table>\n  <tr><th>公司</th><th>代码</th><th>技术布局</th><th>推荐</th></tr>\n  <tr><td><strong>长电科技</strong></td><td>600584</td><td>XDFOI 对标 CoWoS，2.5D/3D 封装最强竞争者</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>通富微电</strong></td><td>002156</td><td>绑定 AMD，已与长鑫合作 HBM2 样品</td><td>⭐⭐</td></tr>\n  <tr><td>华天科技</td><td>002185</td><td>TSV/3D 封装布局中</td><td>⭐</td></tr>\n</table>\n\n<h2>三、关键设备</h2>\n<ul>\n  <li><strong>TSV 刻蚀：</strong>北方华创 (002371) / 中微公司 (688012) ✅ 可国产化</li>\n  <li><strong>CMP 设备：</strong>华海清科 (688120) ✅ 国内龙头</li>\n  <li><strong>封装光刻：</strong>上海微电子——已量产出货</li>\n  <li><strong>键合设备：</strong>新益昌追赶中——<strong>最大短板之一</strong></li>\n</ul>\n\n<h2>四、关键材料</h2>\n<table>\n  <tr><th>环节</th><th>公司</th><th>代码</th><th>备注</th></tr>\n  <tr><td><strong>CMP 抛光液</strong></td><td>安集科技</td><td>688019</td><td>⭐⭐⭐ 龙头</td></tr>\n  <tr><td>光刻胶</td><td>南大光电</td><td>300346</td><td>ArF 光刻胶国产化</td></tr>\n  <tr><td>光刻胶</td><td>上海新阳</td><td>300236</td><td>KrF/ArF 光刻胶</td></tr>\n  <tr><td>电子特气</td><td>华特气体</td><td>688268</td><td>高纯气体供应商</td></tr>\n</table>\n\n<h2>五、链主：华为海思</h2>\n<p>华为定义需求 → 长鑫提 DRAM 规格 → 长电/通富开发封装 → 联合设备材料厂攻关 → 昇腾芯片落地验证。华为是整个链条的 <strong>火车头</strong>。</p>\n\n<h2>六、时间线</h2>\n<table>\n  <tr><th>时间</th><th>目标</th><th>意义</th></tr>\n  <tr><td><span class=\"pill pill-up\">2025H1 ✅</span></td><td>HBM2 量产</td><td>比预期提早约 2 年，突破意义重大</td></tr>\n  <tr><td><span class=\"pill pill-mid\">2025H2 🔄</span></td><td>HBM3 量产验证</td><td>与主流代差从 8 年缩至 4 年</td></tr>\n  <tr><td><span class=\"pill pill-mid\">2027E 🎯</span></td><td>HBM3E 量产</td><td>跳过 HBM2E 直接上 3E，追赶策略清晰</td></tr>\n</table>\n\n<blockquote>⚠️ 以上分析基于公开信息整理，不构成投资建议。</blockquote>"}, {"id": "semi-rpt", "title": "半导体投资分析：安集科技 · 源杰科技精选", "icon": "💎", "tags": ["半导体", "安集科技", "源杰科技", "CMP"], "desc": "基于野村亚太科技团队研报，梳理AI倒逼半导体工艺重构逻辑，精选筹码优良标的", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">+33%</div><div class=\"lbs\">安集 Q1 营收</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+321%</div><div class=\"lbs\">源杰 Q1 营收</div></div>\n  <div class=\"metric-box\"><div class=\"num\">77.8%</div><div class=\"lbs\">源杰毛利率</div></div>\n  <div class=\"metric-box\"><div class=\"num\">65.5%</div><div class=\"lbs\">安集机构持有</div></div>\n</div>\n\n<h1>半导体投资分析报告</h1>\n<p><strong>来源：</strong>野村证券亚太科技团队 · Donnie Teng<br><strong>日期：</strong>2026-05-27</p>\n\n<div class=\"tagline\">半导体行业增长逻辑已从\"晶体管密度提升\"转向 <strong>\"3D 晶体管 + 背面供电 + 新材料组合创新\"</strong>。AI 倒逼芯片制造底层工艺重写。</div>\n\n<h2>一、全产业链时间线</h2>\n<table>\n  <tr><th>时间</th><th>关键事件</th><th>投资方向</th></tr>\n  <tr><td><strong>2026 年</strong></td><td>GAA 晶体管、SoIC 混合键合、InP 衬底小批量</td><td>先进封装、化合物半导体</td></tr>\n  <tr><td><strong><span class=orange>2027 年（拐点）</span></strong></td><td><strong>背面供电、玻璃核心基板、晶圆键合 NAND 集中放量</strong></td><td><strong>材料+设备 配置核心窗口</strong></td></tr>\n  <tr><td>2028 年</td><td>DRAM-on-logic 规模化，边缘 AI + 汽车电子成新驱动力</td><td>异构集成、Chiplet</td></tr>\n  <tr><td>2029-2030</td><td>高 NA EUV 量产，金属氧化物光刻胶全面导入</td><td>光刻胶国产化、EUV 生态</td></tr>\n</table>\n\n<h3>野村关键论点</h3>\n<ol>\n  <li><strong>材料环节价值重估：</strong>工艺复杂度提升使材料单耗和价值量同步上升</li>\n  <li><strong>玻璃基板：</strong>博通有望 2027 年率先采用，国内厂商加速跟进</li>\n  <li><strong>硅片供需：</strong>12 英寸硅片 2027 年起供需由松转紧</li>\n  <li><strong>台积电资本开支：</strong>2027 年有望达 700 亿美元，设备端景气外溢</li>\n</ol>\n\n<hr>\n\n<h2>二、优选标的深度拆解</h2>\n\n<h3>🥇 安集科技 (688019) —— CMP 抛光液龙头</h3>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">2026Q1 营收</div><div class=\"iv\">7.24 亿 <span class=\"pill pill-up\">+33%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">净利润</div><div class=\"iv\">2.08 亿 <span class=\"pill pill-up\">+23%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">股东户数</div><div class=\"iv\">1.43 万户</div></div>\n  <div class=\"info-item\"><div class=\"il\">机构持有</div><div class=\"iv\">65.5%</div></div>\n</div>\n<ul>\n  <li>股东户数连续收敛，从 2025 年末的 1.8 万降至 1.43 万——筹码在不断集中</li>\n  <li>前十大股东集中度 58%，140 家机构持股 65.5%——机构深度锁仓</li>\n  <li>大股东零减持——管理层对股价的认可信号</li>\n  <li><strong>筹码评分：⭐⭐⭐⭐⭐</strong></li>\n</ul>\n\n<h3>🥈 源杰科技 (688498) —— 光芯片 IDM</h3>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">2026Q1 营收</div><div class=\"iv\">3.55 亿 <span class=\"pill pill-up\">+321%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">净利润</div><div class=\"iv\">1.79 亿 <span class=\"pill pill-up\">+1153%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">毛利率</div><div class=\"iv\">77.8%</div></div>\n  <div class=\"info-item\"><div class=\"il\">户均市值</div><div class=\"iv\">459 万</div></div>\n</div>\n<ul>\n  <li>营收暴增 321%，利润暴增 1153%——产业趋势爆发初期阶段</li>\n  <li>77.8% 毛利率——技术壁垒极高，IDM 模式带来强定价权</li>\n  <li>户均持股市值 459 万——筹码高度集中在大户和机构手中</li>\n  <li>股东户数仅 1.36 万户——极低，筹码非常干净</li>\n  <li><strong>筹码评分：⭐⭐⭐⭐</strong></li>\n</ul>\n\n<h3>🥉 鼎龙股份 (300054) —— CMP 抛光垫</h3>\n<p>营收 10.2 亿，股东户数 6.04 万户偏多。抛光垫国产替代逻辑正确，但需等待筹码进一步集中。<strong>筹码评分：⭐⭐⭐</strong></p>\n\n<blockquote><strong>组合建议：</strong>安集科技打底 + 源杰科技博弹性，鼎龙股份作为观察标的等待筹码改善。</blockquote>\n<blockquote>⚠️ 以上分析基于公开信息整理，不构成投资建议。</blockquote>"}, {"id": "huahai", "title": "华海诚科(688535)深度分析：HBM逻辑与筹码困境", "icon": "⚠️", "tags": ["华海诚科", "HBM", "GMC", "减持"], "desc": "HBM国产化产业趋势确定，但华天科技清仓减持3个月，核心矛盾在分母", "html": "<h1>华海诚科 (688535) 深度分析</h1>\n\n<div class=\"tagline\">HBM 国产化 → GMC 放量 → 华海诚科受益 —— 这条逻辑链从产业趋势上说成立。但 <strong>产业面的利好做多分子，筹码面的确定性做空分母</strong>。核心矛盾在分母。</div>\n\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">减持主体</div><div class=\"iv\">华天科技</div></div>\n  <div class=\"info-item\"><div class=\"il\">减持规模</div><div class=\"iv\" style=\"color:#ef4444\">清仓 340 万股 / 2.40%</div></div>\n  <div class=\"info-item\"><div class=\"il\">减持期间</div><div class=\"iv\" style=\"color:#ef4444\">5.28 → 8.27（3 个月）</div></div>\n  <div class=\"info-item\"><div class=\"il\">当前 PE</div><div class=\"iv\">300+ 倍</div></div>\n</div>\n\n<h2>核心矛盾：产业面 vs 筹码面</h2>\n<blockquote>股价 = HBM/GMC/国产替代远期故事 ÷ <strong>筹码结构的即时破坏力</strong></blockquote>\n\n<h3>问题出在分母：</h3>\n<ol>\n  <li><strong>华天科技清仓减持</strong>（340 万股，3 个月窗口）—— 确定性抛压</li>\n  <li><strong>日均主力净流出数千万至亿级</strong>——卖压大于买力</li>\n  <li><strong>缺乏长线多头承接</strong>——以游资 + 散户为主</li>\n  <li><strong>300+ 倍 PE</strong>——远期预期已充分透支</li>\n</ol>\n\n<h2>关键时间线</h2>\n<table>\n  <tr><th>日期</th><th>事件</th><th>影响</th></tr>\n  <tr><td><span class=\"pill pill-down\">5 月 24 日</span></td><td>华天科技公告清仓减持</td><td><strong>分水岭</strong>：产业逻辑不变，筹码逻辑彻底逆转</td></tr>\n  <tr><td><span class=\"pill pill-down\">5.28 → 8.27</span></td><td>减持执行期</td><td>3 个月的确定性抛压窗口</td></tr>\n  <tr><td><span class=\"pill pill-mid\">8.27 后</span></td><td>减持结束</td><td>筹码消化后的重新入场窗口</td></tr>\n</table>\n\n<h2>操作策略</h2>\n<p>产业面逻辑硬，但短期筹码矛盾要先解决。<strong>更好的入场时机：华天科技 3 个月减持期结束后、筹码充分交换、换手率降下来之后</strong>。</p>\n<p>期间持续跟踪：每日换手率、股东户数变化、大宗交易折价率。</p>\n\n<blockquote>⚠️ 以上分析基于公开信息整理，不构成投资建议。</blockquote>"}, {"id": "transwarp-688031", "title": "星环科技(688031) 深度研究报告", "icon": "🚀", "tags": ["星环科技", "AI基础设施", "认知数据库", "信创", "大数据", "688031", "GD专题"], "desc": "全面剖析星环科技：IDC大数据独立软件厂商连续4年第一，认知数据库云版发布在即，广发证券给170.94元目标价。营收重回高增(Q1+26.2%)亏损收窄33%，但军采处罚与持续亏损需关注。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4.48亿</div><div class=\"lbs\">2025营收</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+20.5%</div><div class=\"lbs\">营收增速</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-2.45亿</div><div class=\"lbs\">归母净利润</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-28.6%</div><div class=\"lbs\">亏损同比收窄</div></div>\n</div>\n<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">170.94元</div><div class=\"lbs\">广发目标价</div></div>\n  <div class=\"metric-box\"><div class=\"num\">54.14%</div><div class=\"lbs\">毛利率</div></div>\n  <div class=\"metric-box\"><div class=\"num\">165.4亿</div><div class=\"lbs\">总市值</div></div>\n  <div class=\"metric-box\"><div class=\"num\">190+项</div><div class=\"lbs\">累计专利</div></div>\n</div>\n\n<h1>星环科技(688031) 深度研究报告</h1>\n<p><strong>报告日期：</strong>2026-06-01 | <strong>当前股价：</strong>136.53元 | <strong>总市值：</strong>165.4亿元</p>\n\n<div class=\"tagline\">📌 <strong>核心判断：</strong>星环科技是国内稀缺的\"大数据平台+AI平台+数据库\"全栈自研厂商。IDC排名连续4年独立软件厂商第一。营收重回高增（Q1+26.2%），亏损持续收窄。认知数据库云版本发布在即，广发证券5月28日给予目标价170.94元（较当前有+25%空间）。今日涨停（+16.81%）。但军采处罚、持续亏损、PS估值偏高是主要风险。</div>\n\n<hr>\n\n<h2>一、公司概览</h2>\n<table>\n  <tr><th>项目</th><th>内容</th></tr>\n  <tr><td>公司全称</td><td>星环信息科技（上海）股份有限公司</td></tr>\n  <tr><td>股票代码</td><td>688031.SH（科创板）</td></tr>\n  <tr><td>上市日期</td><td>2022年10月18日</td></tr>\n  <tr><td>创始人/CEO</td><td>孙元浩</td></tr>\n  <tr><td>所属行业</td><td>软件开发 / AI基础设施</td></tr>\n</table>\n\n<p>围绕数据的集成、存储、治理、建模、分析、挖掘、流通全生命周期，提供基础软件及服务。对标国际的Databricks/Snowflake。</p>\n\n<hr>\n\n<h2>二、产品矩阵</h2>\n<ul>\n  <li><strong>🏗️ 大数据平台</strong>：TDH一站式大数据平台（基本盘，连续4年IDC市占第一）</li>\n  <li><strong>🗄️ 数据库</strong>：ArgoDB（分析型）+ KunDB（交易型）+ Hippo（向量）+ StellarDB（图）</li>\n  <li><strong>🤖 AI平台</strong>：Sophon MLOps + 无涯大模型 + 无涯·问知/问数 + TKH知识平台 + AI PC版（接入DeepSeek）</li>\n  <li><strong>🧠 认知数据库</strong>（2026催化）：AI集成至数据库引擎，云版即将发布</li>\n</ul>\n\n<hr>\n\n<h2>三、财务全景</h2>\n<table>\n  <tr><th>年度</th><th>营收(亿)</th><th>同比</th><th>净利润(亿)</th><th>毛利率</th></tr>\n  <tr><td><strong>2023</strong></td><td>5.38</td><td>+44.4%</td><td>-2.89</td><td>-</td></tr>\n  <tr><td>2024</td><td>3.71</td><td>-24.3%</td><td>-3.43</td><td>-</td></tr>\n  <tr><td><strong>2025</strong></td><td><strong>4.48</strong></td><td><strong>+20.5%</strong></td><td><strong>-2.45</strong></td><td><strong>54.14%</strong></td></tr>\n  <tr><td><strong>2026Q1</strong></td><td><strong>0.81</strong></td><td><strong>+26.2%</strong></td><td><strong>-0.56</strong></td><td><strong>40.45%</strong></td></tr>\n</table>\n<p>✅ <strong>边际改善趋势明确</strong>：2025年亏损首度收窄(-28.6%)，Q1亏损继续收窄(-33%)。三费占营收比从86.5%→60.54%（-29.94%），降本增效显著。</p>\n<p>⚠️ 上市三年累计亏损超15亿，现金流仍为负，货币资金可维持约2年。</p>\n\n<hr>\n\n<h2>四、行业竞争格局</h2>\n<table>\n  <tr><th>维度</th><th>实力</th><th>来源</th></tr>\n  <tr><td>大数据平台</td><td><strong>独立软件厂商#1</strong></td><td>IDC 连续4年</td></tr>\n  <tr><td>图数据库</td><td>#4</td><td>IDC 2024</td></tr>\n  <tr><td>AI/ML平台</td><td>#5</td><td>IDC 2024</td></tr>\n  <tr><td>信创数据库</td><td>市场领导者</td><td>计世资讯</td></tr>\n</table>\n<p><strong>核心壁垒</strong>：① 全栈自研不依赖开源 ② 信创适配（华为/飞腾/龙芯） ③ 金融+政府头部客户 ④ AI+Data融合</p>\n\n<hr>\n\n<h2>五、增长驱动力</h2>\n<ol>\n  <li><strong>✅ 信创替代（确定性最高）</strong>：Oracle/IBM/Hadoop国产替代，央企/政府端刚需</li>\n  <li><strong>✅ AI基础设施化（最大空间）</strong>：认知数据库云版发布在即，搭AIGC流量快车</li>\n  <li><strong>✅ 行业数字化</strong>：金融、能源、轨交、央企数智化持续释放</li>\n  <li><strong>✅ 产品升级</strong>：AI产品附加值更高，有望带动毛利率突破60%</li>\n</ol>\n\n<hr>\n\n<h2>六、⚠️ 风险因素</h2>\n\n<h3>🔴 军队采购处罚（2026-05-09）</h3>\n<p>因\"2021-YK01-W1122\"项目<strong>围标串标</strong>，被暂停全军采购资格（生效2026-05-09）。法定代表人孙元浩及授 (function() {
  if (!monitors || monitors.length===0) return;
  const l=monitors[monitors.length-1];
  const h=l.html;

  // extract info-grid items
  const infoItems={};
  const re=/<div class="il">(.*?)<\/div>\s*<div class="iv">(.*?)<\/div>/gs;
  let m; while((m=re.exec(h))) infoItems[m[1].trim()]=m[2].trim();

  // Market indices
  const idxMap={sh:'上证指数',sz:'深证成指',cy:'创业板指',kc:'科创50'};
  Object.entries(idxMap).forEach(([k,v])=>{
    if(infoItems[v]){
      const raw=infoItems[v];
      const price=(raw.match(/[\d.]+/)||['--'])[0];
      const chg=(raw.match(/[+-]\d+\.?\d*%/)||['--'])[0];
      document.getElementById('v_'+k).textContent=price;
      if(chg!=='--'){
        const up=chg.startsWith('+');
        document.getElementById('sub_'+k).className='sub '+(up?'green':'red');
        document.getElementById('sub_'+k).textContent=chg;
      }
    }
  });

  // Tags -> tagCloud
  const tags=l.tags||[];
  const tagColors=['#3b82f6','#a855f7','#ec4899','#06b6d4','#f59e0b','#22c55e'];
  document.getElementById('tagCloud').innerHTML=tags.slice(0,8).map((t,i)=>
    '<span style="background:'+tagColors[i%6]+'18;color:'+tagColors[i%6]+'">#'+t+'</span>'
  ).join('');

  // Parse net inflow table
  const tables=[...h.matchAll(/<table>(.*?)<\/table>/gs)].map(m=>m[1]);
  let funds=[];
  tables.forEach(tbl=>{
    if(/净流入/.test(tbl)&&(/板块/.test(tbl)||/驱动/.test(tbl))){
      const rows=[...tbl.matchAll(/<tr>(.*?)<\/tr>/gs)].map(m=>m[1]);
      for(let i=1;i<rows.length;i++){
        const cells=[...rows[i].matchAll(/<t[dh][^>]*>(.*?)<\/t[dh]>/gs)].map(m=>m[1]);
        if(cells.length>=3){
          const name=cells[1].replace(/<[^>]+>/g,'').trim();
          const fv=parseFloat(cells[2].replace(/<[^>]+>/g,'').replace(/[+亿]/g,''));
          if(!isNaN(fv)) funds.push({n:name,v:fv,c:'#3b82f6'});
        }
      }
    }
  });
  if(funds.length===0) funds=tags.slice(0,5).map((t,i)=>({n:t,v:(5-i)*2,c:'#3b82f6'}));
  funds=funds.slice(0,5);
  const maxV=Math.max(...funds.map(f=>f.v));
  document.getElementById('fundList').innerHTML=funds.map(f=>
    '<div class=fund-row><span class=n>'+f.n+'</span><div class=b style="background:'+f.c+'22"><div style="width:'+(f.v/maxV*100)+'%;background:'+f.c+'">'+f.v.toFixed(1)+'亿</div></div></div>'
  ).join('');

  // Parse highlights
  let highlights=[];
  tables.forEach(tbl=>{
    if(/异动/.test(tbl)&&(/个股/.test(tbl)||/逻辑/.test(tbl))){
      const rows=[...tbl.matchAll(/<tr>(.*?)<\/tr>/gs)].map(m=>m[1]);
      for(let i=1;i<rows.length&&highlights.length<5;i++){
        const cells=[...rows[i].matchAll(/<t[dh][^>]*>(.*?)<\/t[dh]>/gs)].map(m=>m[1]);
        if(cells.length>=2){
          const stock=cells[0].replace(/<[^>]+>/g,'').trim();
          const action=cells.length>=4?cells[cells.length-2].replace(/<[^>]+>/g,'').trim():'';
          highlights.push('• <strong>'+stock+'</strong> — '+action);
        }
      }
    }
  });
  if(highlights.length===0){
    const s=l.summary||'';
    highlights=s.split(/[。.]/).filter(x=>x.trim()).slice(0,3).map(x=>'• '+x.trim()+'。');
  }
  document.getElementById('highlightList').innerHTML=highlights.join('<br>');

  // Parse watchlist
  let wl=[];
  tables.forEach(tbl=>{
    if(/名称/.test(tbl)&&/代码/.test(tbl)&&/现价/.test(tbl)){
      const rows=[...tbl.matchAll(/<tr>(.*?)<\/tr>/gs)].map(m=>m[1]);
      for(let i=1;i<rows.length;i++){
        const cells=[...rows[i].matchAll(/<t[dh][^>]*>(.*?)<\/t[dh]>/gs)].map(m=>m[1]);
        if(cells.length>=4){
          const name=cells[0].replace(/<[^>]+>/g,'').trim();
          const code=cells[1].replace(/<[^>]+>/g,'').trim();
          const price=cells[2].replace(/<[^>]+>/g,'').trim();
          const chg=cells[3].replace(/<[^>]+>/g,'').trim();
          let ch=null;
          try{ch=parseFloat(chg.replace(/[+%]/g,''));}catch(e){}
          wl.push({n:name,c:code,p:price,ch:ch});
        }
      }
    }
  });
  if(wl.length>0){
    document.getElementById('wlBody').innerHTML=wl.map(s=>{
      if(s.ch!==null&&!isNaN(s.ch)){
        const cls=s.ch>=0?'green':'red';
        const sign=s.ch>=0?'+':'';
        return '<tr><td><strong>'+s.n+'</strong></td><td><span class=code>'+s.c+'</span></td><td>&yen;'+s.p+'</td><td class="'+cls+'">'+sign+s.ch.toFixed(2)+'%</td></tr>';
      }
      return '<tr style="color:#94a3b8;font-size:11px"><td>'+s.n+'</td><td><span class=code>'+s.c+'</span></td><td>--</td><td>--</td></tr>';
    }).join('');
  }

  // Market comment
  document.getElementById('marketComment').innerHTML='<p>'+(l.summary||'暂无数据')+'</p>';
})()

  g.innerHTML = s.map(st => {
    const rt = st.rt;
    const rc = rt === 'B' ? 'pfl-rtg-B' : rt === 'H' ? 'pfl-rtg-H' : 'pfl-rtg-S';
    const rtLabels = {B:'增持',H:'观望',S:'减持'};
    const cc = rt === 'B' ? '#22c55e' : rt === 'H' ? '#f59e0b' : '#ef4444';
    const mkCl = st.md.s.includes('多头') ? 'ts-b' : 'ts-r';
    const rsCl = st.rs.includes('超卖') || st.rs.includes('偏强') ? 'ts-b' : st.rs.includes('偏弱') ? 'ts-r' : 'ts-n';
    const mn = Math.min(...st.kl), mx = Math.max(...st.kl), rg = mx - mn || 1;
    const w = 200, hh = 30;
    const pts = st.kl.map((v,i) => `${(i/(st.kl.length-1))*w},${hh-((v-mn)/rg)*hh}`).join(' ');
    const svg = `<svg viewBox="0 0 ${w} ${hh}"><defs><linearGradient id="g-${st.c.replace(/[.#]/g,'')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${cc}" stop-opacity="0.2"/><stop offset="100%" stop-color="${cc}" stop-opacity="0.01"/></linearGradient></defs><path d="M${pts}" fill="none" stroke="${cc}" stroke-width="1.3" stroke-linecap="round"/><path d="M0,${hh} L${pts} L${pts.split(' ').pop().split(',')[0]},${hh}Z" fill="url(#g-${st.c.replace(/[.#]/g,'')})" opacity="0.25"/></svg>`;
    return `
      <div class="pfl-card">
        <span class="pfl-rtg ${rc}">${rtLabels[rt]}</span>
        <div class="pfl-hd">
          <span class="pfl-exg ${st.ec}">${st.e}</span>
          <div class="pfl-sn"><h2>${st.n}</h2><span class="cd">${st.c}</span></div>
        </div>
        <div class="pfl-pr"><span class="p">${st.cur}${st.pr.toFixed(2)}</span><span class="cp ${st.ch>=0?'profit':'loss'}">${st.ch>0?'+':''}${st.ch}%</span></div>
        <div class="pfl-pl ${st.ch>=0?'pb':'lb'}">${st.ch>=0?'📈 今日上涨':'📉 今日下跌'}</div>
        <div class="pfl-tech">
          <div class="pfl-tb"><div class="tl">MACD</div><div class="tv">${st.md.v.toFixed(2)}</div><div class="ts ${mkCl}">${st.md.s}</div></div>
          <div class="pfl-tb"><div class="tl">KDJ</div><div class="tv" style="font-size:10px">${st.kd}</div></div>
          <div class="pfl-tb"><div class="tl">RSI6</div><div class="tv">${st.r6.toFixed(1)}</div><div class="ts ${rsCl}">${st.rs}</div></div>
        </div>
        <div class="pfl-chart">${svg}</div>
        <div class="pfl-mf">
          <div class="pfl-mfi"><div class="ml">主力</div><div class="mv ${st.mf[0]>=0?'profit':'loss'}">${st.mf[0]>=0?'+':''}${st.mf[0].toFixed(2)}</div></div>
          <div class="pfl-mfi"><div class="ml">超大单</div><div class="mv ${st.mf[1]>=0?'profit':'loss'}">${st.mf[1].toFixed(2)}</div></div>
          <div class="pfl-mfi"><div class="ml">大单</div><div class="mv ${st.mf[2]>=0?'profit':'loss'}">${st.mf[2].toFixed(2)}</div></div>
          <div class="pfl-mfi"><div class="ml">中小单</div><div class="mv ${st.mf[3]>=0?'profit':'loss'}">${st.mf[3].toFixed(2)}</div></div>
        </div>
        <div class="pfl-tag">${st.tg.map(t => `<span class="pfl-ct">${t}</span>`).join('')}</div>
      </div>`;
  }).join('');
}

// Load portfolio on page ready
loadPortfolio();

// Init
renderMonitors();
renderReports();
</script>
</body>
</html>
