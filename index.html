<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二级市场研究员 · 智能仪表盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
header{background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border-bottom:1px solid #334155;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{background:#22c55e;width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ht{font-size:13px;color:#94a3b8}
.tabs{display:flex;gap:4px;padding:16px 24px 0;border-bottom:1px solid #334155;overflow-x:auto}
.tab{padding:8px 18px;border-radius:8px 8px 0 0;border:1px solid transparent;cursor:pointer;font-size:13px;color:#94a3b8;background:transparent;font-family:inherit;transition:all .15s;white-space:nowrap}
.tab.active{border-color:#334155 #334155 #0f172a;background:#0f172a;color:#f1f5f9;font-weight:600}
.tab .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.page{display:none;padding:16px 24px 24px;max-width:1200px;margin:0 auto}
.page.show{display:block}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px}
.card .lbl{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.card .val{font-size:22px;font-weight:700}
.card .sub{font-size:12px;margin-top:4px}
.green{color:#22c55e}.red{color:#ef4444}.orange{color:#f59e0b}.purple{color:#a855f7}.cyan{color:#06b6d4}.gray{color:#94a3b8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 6px;color:#94a3b8;font-weight:500;font-size:11px;text-transform:uppercase;text-align:left;border-bottom:1px solid #334155}
td{padding:7px 6px;border-bottom:1px solid rgba(51,65,85,.5)}
tr:hover td{background:rgba(59,130,246,.05)}
.code{font-size:11px;color:#64748b;font-family:monospace}
.fund-row{display:flex;align-items:center;margin-bottom:6px;font-size:12px}
.fund-row .n{width:80px;color:#94a3b8;text-align:right;padding-right:8px;flex-shrink:0}
.fund-row .b{flex:1;height:20px;border-radius:4px;overflow:hidden}
.fund-row .b div{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;color:#fff;font-size:10px;font-weight:600}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagcloud span{padding:4px 10px;border-radius:6px;font-size:12px;cursor:default}
.articles{display:flex;flex-direction:column;gap:10px}
.article{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px 18px;cursor:pointer;transition:border .15s}
.article:hover{border-color:#3b82f6}
.article .meta{font-size:11px;color:#94a3b8;display:flex;gap:8px;margin-bottom:4px}
.article .meta .t{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:500}
.article .meta .t.mon{background:rgba(59,130,246,.15);color:#3b82f6}
.article .meta .t.rpt{background:rgba(168,85,247,.15);color:#a855f7}
.article h3{font-size:14px;font-weight:600;margin-bottom:3px}
.article p{font-size:12px;color:#94a3b8;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.article .tags span{font-size:10px;padding:1px 6px;background:rgba(59,130,246,.1);color:#3b82f6;border-radius:4px}
.search{width:100%;padding:10px 14px;border:1px solid #334155;border-radius:8px;font-size:13px;background:#1e293b;color:#f1f5f9;outline:none;font-family:inherit;margin-bottom:12px}
.search:focus{border-color:#3b82f6}
.filters{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.filters button{padding:4px 10px;border-radius:999px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:11px;cursor:pointer;font-family:inherit;transition:all .1s}
.filters button.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.rpt-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:16px;cursor:pointer;transition:border .15s}
.rpt-card:hover{border-color:#3b82f6}
.rpt-card .icon{font-size:28px;flex-shrink:0;width:44px;text-align:center}
.rpt-card .info h3{font-size:15px;font-weight:600;margin-bottom:4px}
.rpt-card .info .desc{font-size:12px;color:#94a3b8;line-height:1.5}
.rpt-card .info .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.rpt-card .info .tags span{font-size:10px;padding:2px 7px;background:rgba(59,130,246,.1);color:#3b82f6;border-radius:4px}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:800px;max-height:88vh;background:#1e293b;border:1px solid #334155;border-radius:14px;z-index:201;flex-direction:column;box-shadow:0 25px 80px rgba(0,0,0,.5)}
.modal.show{display:flex}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;backdrop-filter:blur(6px)}
.overlay.show{display:block}
.modal .mh{padding:16px 20px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;flex-shrink:0}
.modal .mh button{background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;padding:0 4px}
.modal .mb{padding:20px;overflow-y:auto;line-height:1.7;font-size:14px}
.modal .mb h1{font-size:22px;margin:20px 0 8px;font-weight:700}
.modal .mb h2{font-size:17px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid #334155;font-weight:600}
.modal .mb h3{font-size:15px;margin:12px 0 4px;font-weight:600}
.modal .mb h4{font-size:13px;margin:10px 0 3px;font-weight:600}
.modal .mb p{margin-bottom:10px;font-size:14px;line-height:1.8}
.modal .mb strong{color:#fff}
.modal .mb blockquote{border-left:3px solid #3b82f6;margin:12px 0;padding:10px 16px;background:rgba(59,130,246,.08);border-radius:0 8px 8px 0;font-size:13px}
.modal .mb table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.modal .mb td,.modal .mb th{border:1px solid #334155;padding:6px 8px}
.modal .mb th{background:rgba(255,255,255,.04);font-weight:600}
.modal .mb hr{border:none;border-top:1px solid #334155;margin:16px 0}
.modal .mb ul,.modal .mb ol{padding-left:22px;margin-bottom:10px}
.modal .mb li{margin-bottom:4px;font-size:14px;line-height:1.7}
.modal .mb .metric-box{display:inline-block;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);border-radius:8px;padding:10px 16px;margin:4px;text-align:center}
.modal .mb .metric-box .num{font-size:22px;font-weight:700;color:#3b82f6}
.modal .mb .metric-box .lbs{font-size:11px;color:#94a3b8}
.modal .mb .metric-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.modal .mb .sect-card{background:rgba(255,255,255,.03);border-radius:8px;padding:14px;margin:12px 0;border:1px solid rgba(51,65,85,.5)}
.modal .mb .sect-card .sn{font-size:12px;color:#94a3b8;margin-bottom:6px}
.modal .mb .sect-card .sh{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.modal .mb .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.modal .mb .info-item{background:rgba(255,255,255,.03);border-radius:6px;padding:10px}
.modal .mb .info-item .il{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px}
.modal .mb .info-item .iv{font-size:16px;font-weight:700;margin-top:2px}
.modal .mb .tagline{font-size:13px;color:#94a3b8;padding:10px 14px;background:rgba(255,255,255,.02);border-radius:8px;margin:12px 0;border-left:3px solid #3b82f6}
.modal .mb .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
.modal .mb .pill-up{background:rgba(34,197,94,.15);color:#22c55e}
.modal .mb .pill-down{background:rgba(239,68,68,.15);color:#ef4444}
.modal .mb .pill-mid{background:rgba(245,158,11,.15);color:#f59e0b}
@media(max-width:800px){
  .grid2,.grid3{grid-template-columns:1fr}
  .page{padding:12px 14px}
  .row{grid-template-columns:repeat(2,1fr)}
  header{padding:10px 14px}
  header h1{font-size:14px}
  .modal .mb{padding:14px}
  .rpt-card{flex-direction:column;gap:8px}
}
</style>
</head>

<header>
  <h1><span style="background:linear-gradient(135deg,#3b82f6,#a855f7);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px">📊</span> 二级市场研究员 · 智能仪表盘</h1>

</header>
<div class="tabs">

</div>

<!-- ═══ DASHBOARD ═══ -->
<div id="page-dash" class="page show">

    <div class="card"><div class=lbl>创业板指</div><div class=val id=v_cy>--</div><div class="sub" id=sub_cy>--</div></div>
    <div class="card"><div class=lbl>科创50</div><div class=val id=v_kc>--</div><div class="sub" id=sub_kc>--</div></div>

  <div class="grid3">

      <div class=lbl style=margin-bottom:10px>📈 板块资金净流入 TOP5</div>
      <div id=fundList></div>
    </div>
    <div class="card">
      <div class=lbl style=margin-bottom:10px>🔥 板块涨跌</div>
      <div id=sectorList style="font-size:12px;line-height:2"></div>
      <div style=margin-top:12px><div class=lbl style=margin-bottom:4px>🏷 热点</div><div class=tagcloud id=tagCloud></div></div>
    </div>
    <div class="card">
      <div class=lbl style=margin-bottom:10px>🏆 今日异动</div>
      <div id=highlightList style="font-size:12px;line-height:2"></div>
    </div>
  </div>
  <div class="grid2">
    <div class="card"><div class=lbl style=margin-bottom:10px>👁 核心监控股</div><table><thead><tr><th>名称</th><th>代码</th><th>现价</th><th>涨跌幅</th></tr></thead><tbody id=wlBody></tbody></table></div>
    <div class="card"><div class=lbl style=margin-bottom:10px>📊 今日市场解读</div><div id=marketComment style="font-size:12px;line-height:1.8"></div></div>
  </div>
</div>

<!-- ═══ MONITOR ═══ -->
<div id="page-monitor" class="page">
  <div class="filters" id=monFilter>
    <button class=active onclick="filterMon('all',event)">全部</button>
    <button onclick="filterMon('2026-06-04',event)">06-04</button>
  </div>
  <div class="articles" id=monList></div>
</div>

<!-- ═══ REPORTS ═══ -->
<div id="page-rpt" class="page">
  <div id=rptList style="max-width:800px;margin:0 auto"></div>
</div>

<!-- ═══ PORTFOLIO ═══ -->
<div id="page-portfolio" class="page">
  <div id=pfl-loading style="text-align:center;padding:60px 0;color:#94a3b8">⏳ 正在获取持仓数据...</div>
  <div id=pfl-wrap style="display:none">
    <div class="row" id=pflBar></div>
    <div class="grid3" id=pflMF></div>
    <div style="text-align:right;margin-bottom:12px">
      <span style="font-size:11px;color:#94a3b8" id=pflTime></span>
    </div>
    <div class="grid" id=pflGrid></div>
  </div>
</div>

ong>情绪面</strong> 😊： 积极偏乐观。AI算力从训练端向推理延伸长逻辑清晰，博通/英伟达的AI营收指引强劲。但需注意中际旭创等高位股短期获利回吐压力。</li>\n</ul>\n\n<h3>存储板块</h3>\n<ul>\n<li><strong>资金面</strong> 💰： 隔夜美股费城半导体指数逆市创历史新高，存储方向持续吸金。国内存储芯片板块早盘低开高走，<strong>中船特气涨19.88%</strong>领涨半导体材料方向。</li>\n<li><strong>政策面</strong> 📋： SK集团会长崔泰源称SK海力士<strong>计划五年内晶圆产能翻番</strong>，存储芯片产能瓶颈可能持续到2030年。SK海力士扩产直接利好国内半导体设备和材料供应商。</li>\n<li><strong>基本面</strong> 🔬： <strong>三星交付全球首批HBM4E样品</strong>（带宽超1.5TB/s），并在Computex 2026展示全球首款<strong>HBM5原型</strong>。Arm CEO表示存储芯片供应整体仍吃紧，HBM/DRAM/NAND供需平衡均紧张。上海证券指出国产AI芯片正迎来关键突破期。</li>\n<li><strong>情绪面</strong> 😊： 赛道持续高热。HBM技术迭代加速，HBM4E→HBM5路线清晰。存储从周期股向成长股切换的预期增强，三星/Micron/SK海力士股价持续走强映射国内存储概念。</li>\n</ul>\n\n<h3>机器人板块</h3>\n<ul>\n<li><strong>资金面</strong> 💰： 6月2日人形机器人板块涨1.12%（阿莱德领涨），但主力资金净流出10.64亿元，游资净流入6.48亿元、散户净流入4.15亿元。近几个交易日板块资金面偏中性。</li>\n<li><strong>政策面</strong> 📋： 四部门联合印发《2026年提升全民数字素养与技能工作要点》，将\"提升全民人工智能素养\"单独列为重点任务，间接利好机器人产业的AI人才储备。外交部部长助理刘彬率37国驻华使节参访深圳具身智能企业。</li>\n<li><strong>基本面</strong> 🔬： <strong>宇树科技科创板73天闪电过会</strong>，估值420亿元，成为\"人形机器人第一股\"。市场讨论正从可行性转向规模化，2028年人形机器人市场规模超138亿美元、2035年有望达2000亿美元。特斯拉Optimus预计2026年更广泛推广。但电池续航仍是制约因素。</li>\n<li><strong>情绪面</strong> 😊： 概念向量产切换预期强烈。摩根士丹利预计2025年全球出货约1.3万台（中国企业占近80%），执行器成本已降90%。但板块估值PE 34.6倍处于历史14%分位，处于相对低位，中长线逻辑清晰。</li>\n</ul>\n\n<h3>CPO板块</h3>\n<ul>\n<li><strong>资金面</strong> 💰： 今日CPO板块开盘<strong>跌幅居前</strong>（技术性回调），但昨日（6月3日）通信板块主力净流入36.33亿元、电子板块净流入13.26亿元。昨日中际旭创、新易盛、天孚通信（易中天）批量创历史新高，今日正常回调。创业板人工智能ETF华宝(159363)昨日大涨超5%成交11亿元。</li>\n<li><strong>政策面</strong> 📋： <strong>英伟达6月2日官宣Spectrum-X硅光CPO交换机全面量产</strong>，能效较传统方案提升5倍、AI部署效率提高130%。明确2026年四季度实现CPO规模化商用。2026年被机构定义为<strong>CPO产业化元年</strong>。</li>\n<li><strong>基本面</strong> 🔬： <strong>中际旭创昨日股价超越贵州茅台</strong>（最高1290元），800G全球市占率超42%，1.6T全球唯一批量供货，订单排期覆盖至2028年。Lightcounting预测2026年以太网光模块市场增长65%。黄仁勋在Computex宣布与Coherent、Corning、Lumentum签署多年战略协议锁定核心产能。</li>\n<li><strong>情绪面</strong> 😊： 极度亢奋后分化回落。中际旭创市值超茅台引发市场热议。今日回调属<strong>健康的技术性调整</strong>，英伟达CPO量产和1.6T独占供应的产业逻辑不变。国盛证券建议\"重回大光\"关注光模块龙头。</li>\n</ul>\n\n<h2>四、主流净流入板块监控</h2>\n\n<h3>今日（6月4日）早盘主力资金流向</h3>\n<ul>\n<li><strong>主力净流入板块：</strong> 光学光电子、电子、半导体</li>\n<li><strong>主力净流出板块：</strong> 电新行业（净流出超96亿元）、有色金属、通信</li>\n<li><strong>个股主力净流入TOP：</strong> <strong>京东方A</strong> 净买入超19.46亿元位居首位；兆易创新、三安光电、中兴通讯获主力资金净流入居前</li>\n<li><strong>个股主力净流出TOP：</strong> 宁德时代遭净卖出超17亿元；工业富联、新易盛、长电科技资金净流出额居前</li>\n</ul>\n\n<h3>昨日（6月3日）申万一级行业主力资金净流入排行</h3>\n<ol>\n<li><strong>通信</strong> —— 净流入 <strong>36.33亿元</strong></li>\n<li><strong>电子</strong> —— 净流入 <strong>13.26亿元</strong></li>\n<li><strong>机械设备</strong> —— 净流入超4亿元</li>\n<li><strong>有色金属</strong> —— 净流入超4亿元</li>\n<li><strong>基础化工</strong> —— 净流入超4亿元</li>\n<li><strong>环保</strong> —— 净流入超4亿元</li>\n</ol>\n<p>其余行业主力资金净流出。电力设备、计算机、传媒、医药净流出居前。</p>\n\n<h3>AI板块相对热度判断</h3>\n<p>🟢 <strong>中高热度</strong>。AI板块连续两个交易日（6月2-3日）强势上涨后今日进入分化——CPO回调、芯片半导体接棒。京东方A（光学光电子）获主力净买入19.46亿元居首，显示资金关注点正从传统消费向AI基础设施领域转移。但通信板块今日转为净流出，说明短期获利了结情绪有所上升。AI板块在全市场中的资金热度排名约为<strong>前30%</strong>，热度略低于巅峰期但中长线逻辑未变。</p>\n\n<h2>五、关键异动个股</h2>\n\n<ol>\n<li><strong>京东方A（000725）</strong> ⬆ <strong>大涨，主力净买入19.46亿元居首</strong> —— 光学光电子龙头，AI驱动面板需求回暖，叠加近期消费电子ETF连续大涨（今日消费电子ETF易方达涨1.21%冲击3连涨）。消息面：微信与华为等手机厂商合作推出A2A助手能力，促进端侧AI应用落地。</li>\n<li><strong>中船特气（688146）</strong> ⬆ <strong>涨近20%</strong> —— 半导体电子特气龙头。受益逻辑：SK海力士五年内晶圆产能翻番+存储芯片产能瓶颈持续到2030年，电子特气作为半导体制造重要耗材需求爆发。华特气体昨日涨停逻辑相似。</li>\n<li><strong>三安光电（600703）</strong> ⬆ <strong>涨停（+9.99%）</strong> —— 化合物半导体/碳化硅龙头。AI算力基础设施建设拉动第三代半导体需求飙升，半导体ETF国联安(512480)涨2.56%，板块成交超40亿元。</li>\n</ol>\n\n<h2>六、总结与展望</h2>\n\n<h3>当前市场总结</h3>\n<ol>\n<li><strong>AI板块分化轮动健康：</strong> CPO冲高回调 + 芯片半导体接棒，AI产业内部轮动有序。博通560亿美元AI芯片指引和中际旭创1.6T独占供应提供中长期确定性。</li>\n<li><strong>CPO回调是机会还是风险？</strong> 昨日易中天批量创新高后今日技术性回调属正常现象。英伟达CPO量产（2026Q4规模化商用）产业逻辑不变，调整后仍可关注。</li>\n<li><strong>存储芯片景气度持续上行：</strong> HBM4E交付+HBM5原型亮相+产能瓶颈持续到2030年，三重催化使存储成为2026年AI最强子赛道之一。</li>\n<li><strong>白银短期震荡中期看多：</strong> 美伊谈判周末重启+美元指数波动压制短期价格，但工业需求增长和COMEX库存下降提供中期支撑。</li>\n<li><strong>机器人关注宇树上市：</strong> 73天闪电过会打开\"人形机器人第一股\"估值锚，产业链配套标的（执行器、减速器、传感器）值得持续跟踪。</li>\n</ol>\n\n<h3>下 trong> 130只股票涨超9%，26只跌超9%。玻璃基板概念<strong>红星发展8天6板</strong>，光通信<strong>金时科技9天5板</strong>、<strong>天洋新材4连板</strong>。</li>\n<li><strong>板块分化：</strong> 半导体/能源设备/电子元器件/煤炭涨幅居前；有色金属/零售/白酒/文化传媒/锂电池/贵金属跌幅居前。</li>\n</ul>\n<hr/>\n<h2>二、AI板块整体市场概览</h2>\n<blockquote>今日AI板块 <strong>内部剧烈分化</strong> —— 半导体芯片方向逆势走强，但CPO/光模块板块经历昨日暴涨后 <strong>大幅回调</strong>。AI板块整体处于 <strong>「大主线内部轮动，短期高位震荡」</strong> 格局。盘后需关注美股AI板块（英伟达/博通/Marvell）夜盘走势，将直接影响次日A股AI方向开盘情绪。</blockquote>\n<hr/>\n<h2>三、细分领域动态</h2>\n<h3>算力板块</h3>\n<ul>\n<li><strong>资金面</strong>：<strong>电子板块全天获主力资金净流入535亿元</strong>，高居31个申万一级行业首位。科创芯片ETF南方(588890)涨2.06%冲击3连涨，近5日净流入2.12亿元。</li>\n<li><strong>政策面</strong>：发改委/工信部发布《新一代人工智能发展规划》，<strong>2030年AI核心产业规模超5万亿元</strong>，大基金二期重点投向AI硬件。</li>\n<li><strong>基本面</strong>：<strong>博通预测2026财年AI芯片销售额达560亿美元</strong>，已向OpenAI交付芯片。黄仁勋Computex宣布Vera CPU全面投产。</li>\n<li><strong>情绪面</strong>： <strong>中性偏积极</strong>。费城半导体指数创历史新高提供正向锚，但A股算力短期涨幅较大出现分化。</li>\n</ul>\n<h3>存储板块</h3>\n<ul>\n<li><strong>资金面</strong>：中船特气涨近20%（半导体材料），华虹公司主力净流入4.96亿元居科创板前列。</li>\n<li><strong>政策面</strong>：SK海力士 <strong>五年内晶圆产能翻番</strong>，存储芯片产能瓶颈可能持续到2030年。</li>\n<li><strong>基本面</strong>：<strong>三星交付全球首批HBM4E样品</strong>（带宽超1.5TB/s），展示全球首款 <strong>HBM5原型</strong>（单堆叠带宽目标4TB/s）。Arm CEO表示存储芯片 <strong>供应整体吃紧</strong>。</li>\n<li><strong>情绪面</strong>：<strong>赛道持续高热</strong>。HBM4E->HBM5技术迭代路线明确，存储从周期股向成长股切换预期强化。国产HBM材料/设备是盘后关注重点。</li>\n</ul>\n<h3>机器人板块</h3>\n<ul>\n<li><strong>资金面</strong>：机器人ETF天弘(159770)涨1.21%，申购900万份。机器人ETF华夏近1月涨8.72%。</li>\n<li><strong>政策面</strong>：四部门印发AI素养新政。37国驻华使节参访深圳具身智能企业。ISC.AI 2026定档6月24日。</li>\n<li><strong>基本面</strong>：<strong>宇树科技科创板73天闪电过会</strong>，估值约420亿元。特斯拉Optimus V3量产锁定7-8月。中信证券力推产业链受益标的。</li>\n<li><strong>情绪面</strong>：<strong>偏乐观但预期分化</strong>。板块PE 34.6倍处于历史14%分位，中长线逻辑清晰。</li>\n</ul>\n<h3>CPO板块</h3>\n<ul>\n<li><strong>资金面</strong>：<strong>今日通信板块净流出居前</strong>（CPO获利了结）。工业富联、新易盛、亨通光电主力净流出居前。<strong>中际旭创成交额达200亿元</strong>，多空分歧白热化。</li>\n<li><strong>政策面</strong>：英伟达6月2日官宣Spectrum-X硅光CPO交换机<strong>全面量产</strong>，2026年Q4规模化商用。2026年为<strong>CPO产业化元年</strong>。</li>\n<li><strong>基本面</strong>：<strong>中际旭创昨日股价超越贵州茅台</strong>（最高1290元），800G市占率超42%，1.6T全球唯一批量供货，订单排期至2028年。</li>\n<li><strong>情绪面</strong>：<strong>极度亢奋后分化回落</strong>。中际旭创市值超1.4万亿、年内涨幅超5倍，高位筹码博弈激烈。国盛证券仍建议\"重回大光\"。</li>\n</ul>\n<hr/>\n<h2>四、主流净流入板块监控</h2>\n<h3>今日主力资金行业流向</h3>\n<p><strong>净流入居前：</strong> 电子(+535亿)、光学光电子、半导体、能源设备、中船系(+8.48亿)</p>\n<p><strong>净流出居前：</strong> 电新行业(-148.18亿)、有色金属、通信（CPO获利了结）</p>\n<h3>个股主力净流入TOP5</h3>\n<ol>\n<li><strong>京东方A</strong> — 净买入 <strong>34.03亿元</strong> 居首（AI驱动面板+光学光电子）</li>\n<li><strong>兆易创新</strong> — 净流入居前（存储芯片龙头）</li>\n<li><strong>三安光电</strong> — 涨停（+9.99%）（化合物半导体）</li>\n<li><strong>中兴通讯</strong> — 净流入（携手腾讯推出AI云电脑）</li>\n<li><strong>中国动力</strong> — 10cm涨停（船舶+中船系）</li>\n</ol>\n<h3>AI板块相对热度判断</h3>\n<p><strong>&#x1f7e2; 中等偏上热度，但日内降温。</strong> 昨日AI板块（CPO+芯片）为资金主攻方向；今日CPO板块获利了结，半导体/芯片接棒。AI板块全市场热度排名约<strong>前30%</strong>，内部轮动有序，中长期逻辑未变。</p>\n<hr/>\n<h2>五、关键异动个股</h2>\n<ol>\n<li><strong>京东方A（000725）</strong> &#x2b06; <strong>净买入34.03亿元居A股首位</strong> —— 光学光电子龙头，AI驱动面板需求回暖。微信携手华为/小米推出A2A端侧AI助手能力，催化消费电子。</li>\n<li><strong>中际旭创（300308）</strong> &#x2b06;&#x2b07; <strong>成交额达200亿元</strong> —— 昨日股价超茅台（最高1290元）后今日震荡，1.6T全球唯一供货逻辑不变但短期估值分歧加大。</li>\n<li><strong>三安光电（600703）</strong> &#x2b06; <strong>涨停（+9.99%）</strong> —— 化合物半导体/碳化硅龙头，AI算力拉动第三代半导体需求飙升。</li>\n</ol>\n<hr/>\n<h2>六、特斯拉机器人概念股解析</h2>\n<p><strong>Optimus量产进展：</strong> 特斯拉7-8月规模化量产，弗里蒙特工厂年产100万台，马斯克薪酬方案与产量挂钩。中信证券发布深度报告指出Optimus产业链进入爆发前夜。</p>\n<p><strong>A股受益标的梳理：</strong></p>\n<ol>\n<li><strong>执行器：</strong> 拓普集团、三花智控、肇民科技</li>\n<li><strong>减速器：</strong> 绿的谐波（今日主力净流入5.09亿元居科创板首）、中大力发展、双环传动</li>\n<li><strong>电机：</strong> 汇川技术、鸣志电器、兆威电机</li>\n<li><strong>传感器：</strong> 奥比中光、禾川科技</li>\n<li><strong>灵巧手：</strong> 斯菱智驱、北特科技</li>\n<li><strong>结构件：</strong> 领益智造、胜宏科技</li>\n</ol>\n<p>矩子科技、拓普集团、绿的谐波今日涨超5%，机器人ETF近一月涨8.72%。</p>\n<hr/>\n<h2>七、总结与展望</h2>\n<h3>今日市场总结</h3>\n<ol>\n<li><strong>A股缩量回调，结构分化：</strong> 三大指数收跌、超4100股下跌，但科创50逆势收红+0.69%。半导体/电子板块获主力净流入535亿元成唯一亮点。</li>\n<li><strong>CPO回调是机会还是风险？</strong> 昨日易中天批量创新高后今日技术性回调，成交额（中际旭创200亿元）显示多空激列。中长期产业逻辑（英伟达CPO量产+1.6T独占供应）未变，但短期估值确已偏贵。</li>\n<li><strong>芯片半导体接棒核心逻辑清晰：</strong> HBM4E交付+HBM5原型+产能瓶颈到2030年为存储赛道提供三充值。国产替代+大基金二期提供政策背书。</li>\n<li><strong>白银短期偏弱中期有底：</strong> 美伊谈判+美元走强压制短期价格，但COMEX库存腰斩+工业需求提供中期支撑。关注今晚美国初请失业金数据。</li>\n<li><strong>机器人关注宇树上市催化：</strong> 73天闪电过会打开估值锚，特斯拉Optimus 7-8月量产节点临近，产业链配套标的中长线值得跟踪。</li>\n</ol>\n<h3>次日（6月5日）展望</h3>\n<ul>\n<li><strong>关注美股夜盘：</strong> 英伟达、博通、Marvell股价走势将直接影响次日A股算力/CPO方向开盘情绪。费城半导体指数近两个交易日逆势创新高，信号积极。</li>\n<li><strong>CPO板块：</strong> 今日回调后关注明早是否有资金回流。金时科技9天5板、天洋新材4连板显示光通信短线情绪仍在。</li>\n<li><strong>存储芯片：</strong> 三星HBM4E/HBM5催化持续，国产HBM材料和设备标的有望继续获资金关注。</li>\n<li><strong>机器人：</strong> 宇树科技过会后的上市进展值得跟踪，特斯拉Optimus量产时间表为板块提供确定性催化剂。</li>\n<li><strong>白银：</strong> 若今晚初请数据走弱，白银有望延续反弹至74-75美元区间。中期关注非农数据和美伊谈判进展。</li>\n<li><strong>大盘：</strong> 今日缩量至2.78万亿，明日若进一步缩量至2.5万亿以下需警惕短期调整压力。4060点（沪指）为短线支撑位。</li>\n</ul>\n<blockquote>&#x26a0;&#xfe0f; <strong>风险提示：</strong> 以上内容为市场信息汇总，不构成投资建议。AI板块短期涨幅已大（费城半导体指数年初至今涨96%），高位震荡和政策不确定性需警惕。投资有风险，决策需谨慎。</blockquote>"}];
const reports = [{"id": "citic-pe", "title": "中信证券(600030) 近三年PE-TTM走势分析", "icon": "📈", "tags": ["中信证券", "PE-TTM", "估值分析"], "desc": "基于自建数据库对中信证券近三年PE-TTM走势的深度复盘与当前估值定位分析", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">16.72x</div><div class=\"lbs\">当前 PE-TTM</div></div>\n  <div class=\"metric-box\"><div class=\"num\">21.93x</div><div class=\"lbs\">近 3 年均值</div></div>\n  <div class=\"metric-box\"><div class=\"num\">13.33x</div><div class=\"lbs\">近 3 年最低</div></div>\n  <div class=\"metric-box\"><div class=\"num\">35.26x</div><div class=\"lbs\">近 3 年最高</div></div>\n</div>\n\n<h1>中信证券(600030) 近三年 PE-TTM 走势分析</h1>\n\n<div class=\"tagline\">📌 <strong>核心结论：</strong>当前 PE-TTM 16.72 倍，处于近三年偏低分位（约 30% 分位），较均值 21.93 倍折价约 23.7%。对于中长期投资者，具备较高安全边际。</div>\n\n<h2>一、PE-TTM 走势全景回顾</h2>\n<p>PE-TTM（滚动市盈率）= 股价 ÷ 最近 12 个月的实际每股收益。相比静态市盈率，它使用<strong>最新四个季度财务数据</strong>，更真实反映公司当前估值水平。</p>\n\n<h3>走势三阶段</h3>\n<p><strong>第一阶段：估值收缩期（2024 年）</strong><br>受证券行业\"降费让利\"政策预期影响，市场对券商盈利前景产生担忧。叠加成交量萎缩、自营承压，PE 从年初 20 倍区间持续下滑至年末 <strong>14.7 倍</strong>附近，全年估值中枢下移约 26%。</p>\n\n<p><strong>第二阶段：底部震荡期（2025 年初至年中）</strong><br>PE 在 <strong>13.33 ~ 15.5 倍</strong> 区间窄幅波动。市场对券商板块关注度降至低点。期间中信证券多次回购稳定投资者信心。<strong>13.33 倍</strong> 成为本轮调整的估值铁底。</p>\n\n<p><strong>第三阶段：估值修复期（2025 年下半年至今）</strong><br>市场活跃度回升 + 权益市场回暖，券商自营及经纪业务环比改善。PE 从历史底部区域反弹至 16~18 倍区间。当前 16.72 倍较底部反弹约 25.4%，但距均值仍有空间。</p>\n\n<hr>\n\n<h2>二、关键区间分析</h2>\n<table>\n  <tr><th>指标</th><th>数值</th><th>含义</th></tr>\n  <tr><td><strong>最低 PE</strong></td><td>13.33x</td><td>2025 年 7 月——近三年绝对底部，也是压力测试的极限值</td></tr>\n  <tr><td><strong>最高 PE</strong></td><td>35.26x</td><td>2024 年初\"中特估\"行情驱动</td></tr>\n  <tr><td><strong>均值 PE</strong></td><td>21.93x</td><td>近三年估值中枢</td></tr>\n  <tr><td><strong>中位数 PE</strong></td><td>18.77x</td><td>半数时间在此以下</td></tr>\n  <tr><td><strong>当前 PE</strong></td><td>16.72x</td><td>低于均值和中位数，折价约 23.7%</td></tr>\n</table>\n<p><strong>分位数：</strong>当前 16.72 倍处于近三年 PE 序列约 <strong>30% 分位</strong>——即过去三年中约 <strong>70% 的时间估值高于当前</strong>。从历史统计角度看具有明显安全边际。</p>\n\n<hr>\n\n<h2>三、驱动因素</h2>\n<ul>\n  <li><strong>市场周期：</strong>券商估值与日均成交额高度正相关。2024 日均<8000 亿 vs 2025 日均>1.2 万亿</li>\n  <li><strong>行业政策：</strong>\"降费让利\"冲击边际递减；注册制改革深化利好投行</li>\n  <li><strong>自营收益：</strong>权益市场修复是 PE 回升核心推动力</li>\n</ul>\n\n<hr>\n\n<h2>四、估值展望</h2>\n<p>当前已反映大部分不确定性，下行风险有限。若市场活跃度维持，PE 有望向均值 <strong>21.93 倍</strong> 修复，对应约 <strong>31% 上行空间</strong>。</p>\n<p><strong>操作参考：</strong>PE 进入 <strong>15 倍以下</strong> 逐步布局；PE 接近或突破 <strong>22 倍</strong> 时分批兑现。</p>\n\n<blockquote>⚠️ 以上分析仅基于公开数据和历史统计，不构成投资建议。PE 为滞后指标。</blockquote>"}, {"id": "hbm-chain", "title": "国产HBM产业链全景解析", "icon": "🔬", "tags": ["HBM", "长鑫存储", "长电科技", "安集科技"], "desc": "全面梳理国产HBM产业链现状、核心玩家与挑战，从DRAM到先进封装逐环节拆解", "html": "<h1>国产 HBM 产业链全景解析</h1>\n<p><strong>日期：</strong>2026-05-28</p>\n\n<div class=\"tagline\">国产 HBM 产业链目前处于 <strong>\"从 0 到 1，点状突破\"</strong> 的初级阶段。与国际顶尖水平（SK 海力士 HBM3E）存在 2~3 代差距，但代差已从 8 年缩至 4 年。</div>\n\n<h2>一、HBM 存储颗粒</h2>\n<table>\n  <tr><th>公司</th><th>上市</th><th>最新进展</th></tr>\n  <tr><td><strong>长鑫存储 (CXMT)</strong></td><td><span class=\"pill pill-mid\">未上市</span></td><td>HBM2 已于 2025H1 量产，HBM3 样品交付客户，目标 2027 年 HBM3E</td></tr>\n  <tr><td>武汉新芯 (XMC)</td><td><span class=\"pill pill-mid\">未上市</span></td><td>HBM2 开发中，月产能 3000 片 12 英寸工厂</td></tr>\n</table>\n<p>从成熟 DDR5 转向高性能 HBM DRAM，技术跨度大，长鑫的 HBM3 量产验证是关键一战。</p>\n\n<h2>二、先进封装</h2>\n<table>\n  <tr><th>公司</th><th>代码</th><th>技术布局</th><th>推荐</th></tr>\n  <tr><td><strong>长电科技</strong></td><td>600584</td><td>XDFOI 对标 CoWoS，2.5D/3D 封装最强竞争者</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>通富微电</strong></td><td>002156</td><td>绑定 AMD，已与长鑫合作 HBM2 样品</td><td>⭐⭐</td></tr>\n  <tr><td>华天科技</td><td>002185</td><td>TSV/3D 封装布局中</td><td>⭐</td></tr>\n</table>\n\n<h2>三、关键设备</h2>\n<ul>\n  <li><strong>TSV 刻蚀：</strong>北方华创 (002371) / 中微公司 (688012) ✅ 可国产化</li>\n  <li><strong>CMP 设备：</strong>华海清科 (688120) ✅ 国内龙头</li>\n  <li><strong>封装光刻：</strong>上海微电子——已量产出货</li>\n  <li><strong>键合设备：</strong>新益昌追赶中——<strong>最大短板之一</strong></li>\n</ul>\n\n<h2>四、关键材料</h2>\n<table>\n  <tr><th>环节</th><th>公司</th><th>代码</th><th>备注</th></tr>\n  <tr><td><strong>CMP 抛光液</strong></td><td>安集科技</td><td>688019</td><td>⭐⭐⭐ 龙头</td></tr>\n  <tr><td>光刻胶</td><td>南大光电</td><td>300346</td><td>ArF 光刻胶国产化</td></tr>\n  <tr><td>光刻胶</td><td>上海新阳</td><td>300236</td><td>KrF/ArF 光刻胶</td></tr>\n  <tr><td>电子特气</td><td>华特气体</td><td>688268</td><td>高纯气体供应商</td></tr>\n</table>\n\n<h2>五、链主：华为海思</h2>\n<p>华为定义需求 → 长鑫提 DRAM 规格 → 长电/通富开发封装 → 联合设备材料厂攻关 → 昇腾芯片落地验证。华为是整个链条的 <strong>火车头</strong>。</p>\n\n<h2>六、时间线</h2>\n<table>\n  <tr><th>时间</th><th>目标</th><th>意义</th></tr>\n  <tr><td><span class=\"pill pill-up\">2025H1 ✅</span></td><td>HBM2 量产</td><td>比预期提早约 2 年，突破意义重大</td></tr>\n  <tr><td><span class=\"pill pill-mid\">2025H2 🔄</span></td><td>HBM3 量产验证</td><td>与主流代差从 8 年缩至 4 年</td></tr>\n  <tr><td><span class=\"pill pill-mid\">2027E 🎯</span></td><td>HBM3E 量产</td><td>跳过 HBM2E 直接上 3E，追赶策略清晰</td></tr>\n</table>\n\n<blockquote>⚠️ 以上分析基于公开信息整理，不构成投资建议。</blockquote>"}, {"id": "semi-rpt", "title": "半导体投资分析：安集科技 · 源杰科技精选", "icon": "💎", "tags": ["半导体", "安集科技", "源杰科技", "CMP"], "desc": "基于野村亚太科技团队研报，梳理AI倒逼半导体工艺重构逻辑，精选筹码优良标的", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">+33%</div><div class=\"lbs\">安集 Q1 营收</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+321%</div><div class=\"lbs\">源杰 Q1 营收</div></div>\n  <div class=\"metric-box\"><div class=\"num\">77.8%</div><div class=\"lbs\">源杰毛利率</div></div>\n  <div class=\"metric-box\"><div class=\"num\">65.5%</div><div class=\"lbs\">安集机构持有</div></div>\n</div>\n\n<h1>半导体投资分析报告</h1>\n<p><strong>来源：</strong>野村证券亚太科技团队 · Donnie Teng<br><strong>日期：</strong>2026-05-27</p>\n\n<div class=\"tagline\">半导体行业增长逻辑已从\"晶体管密度提升\"转向 <strong>\"3D 晶体管 + 背面供电 + 新材料组合创新\"</strong>。AI 倒逼芯片制造底层工艺重写。</div>\n\n<h2>一、全产业链时间线</h2>\n<table>\n  <tr><th>时间</th><th>关键事件</th><th>投资方向</th></tr>\n  <tr><td><strong>2026 年</strong></td><td>GAA 晶体管、SoIC 混合键合、InP 衬底小批量</td><td>先进封装、化合物半导体</td></tr>\n  <tr><td><strong><span class=orange>2027 年（拐点）</span></strong></td><td><strong>背面供电、玻璃核心基板、晶圆键合 NAND 集中放量</strong></td><td><strong>材料+设备 配置核心窗口</strong></td></tr>\n  <tr><td>2028 年</td><td>DRAM-on-logic 规模化，边缘 AI + 汽车电子成新驱动力</td><td>异构集成、Chiplet</td></tr>\n  <tr><td>2029-2030</td><td>高 NA EUV 量产，金属氧化物光刻胶全面导入</td><td>光刻胶国产化、EUV 生态</td></tr>\n</table>\n\n<h3>野村关键论点</h3>\n<ol>\n  <li><strong>材料环节价值重估：</strong>工艺复杂度提升使材料单耗和价值量同步上升</li>\n  <li><strong>玻璃基板：</strong>博通有望 2027 年率先采用，国内厂商加速跟进</li>\n  <li><strong>硅片供需：</strong>12 英寸硅片 2027 年起供需由松转紧</li>\n  <li><strong>台积电资本开支：</strong>2027 年有望达 700 亿美元，设备端景气外溢</li>\n</ol>\n\n<hr>\n\n<h2>二、优选标的深度拆解</h2>\n\n<h3>🥇 安集科技 (688019) —— CMP 抛光液龙头</h3>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">2026Q1 营收</div><div class=\"iv\">7.24 亿 <span class=\"pill pill-up\">+33%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">净利润</div><div class=\"iv\">2.08 亿 <span class=\"pill pill-up\">+23%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">股东户数</div><div class=\"iv\">1.43 万户</div></div>\n  <div class=\"info-item\"><div class=\"il\">机构持有</div><div class=\"iv\">65.5%</div></div>\n</div>\n<ul>\n  <li>股东户数连续收敛，从 2025 年末的 1.8 万降至 1.43 万——筹码在不断集中</li>\n  <li>前十大股东集中度 58%，140 家机构持股 65.5%——机构深度锁仓</li>\n  <li>大股东零减持——管理层对股价的认可信号</li>\n  <li><strong>筹码评分：⭐⭐⭐⭐⭐</strong></li>\n</ul>\n\n<h3>🥈 源杰科技 (688498) —— 光芯片 IDM</h3>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">2026Q1 营收</div><div class=\"iv\">3.55 亿 <span class=\"pill pill-up\">+321%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">净利润</div><div class=\"iv\">1.79 亿 <span class=\"pill pill-up\">+1153%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">毛利率</div><div class=\"iv\">77.8%</div></div>\n  <div class=\"info-item\"><div class=\"il\">户均市值</div><div class=\"iv\">459 万</div></div>\n</div>\n<ul>\n  <li>营收暴增 321%，利润暴增 1153%——产业趋势爆发初期阶段</li>\n  <li>77.8% 毛利率——技术壁垒极高，IDM 模式带来强定价权</li>\n  <li>户均持股市值 459 万——筹码高度集中在大户和机构手中</li>\n  <li>股东户数仅 1.36 万户——极低，筹码非常干净</li>\n  <li><strong>筹码评分：⭐⭐⭐⭐</strong></li>\n</ul>\n\n<h3>🥉 鼎龙股份 (300054) —— CMP 抛光垫</h3>\n<p>营收 10.2 亿，股东户数 6.04 万户偏多。抛光垫国产替代逻辑正确，但需等待筹码进一步集中。<strong>筹码评分：⭐⭐⭐</strong></p>\n\n<blockquote><strong>组合建议：</strong>安集科技打底 + 源杰科技博弹性，鼎龙股份作为观察标的等待筹码改善。</blockquote>\n<blockquote>⚠️ 以上分析基于公开信息整理，不构成投资建议。</blockquote>"}, {"id": "huahai", "title": "华海诚科(688535)深度分析：HBM逻辑与筹码困境", "icon": "⚠️", "tags": ["华海诚科", "HBM", "GMC", "减持"], "desc": "HBM国产化产业趋势确定，但华天科技清仓减持3个月，核心矛盾在分母", "html": "<h1>华海诚科 (688535) 深度分析</h1>\n\n<div class=\"tagline\">HBM 国产化 → GMC 放量 → 华海诚科受益 —— 这条逻辑链从产业趋势上说成立。但 <strong>产业面的利好做多分子，筹码面的确定性做空分母</strong>。核心矛盾在分母。</div>\n\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">减持主体</div><div class=\"iv\">华天科技</div></div>\n  <div class=\"info-item\"><div class=\"il\">减持规模</div><div class=\"iv\" style=\"color:#ef4444\">清仓 340 万股 / 2.40%</div></div>\n  <div class=\"info-item\"><div class=\"il\">减持期间</div><div class=\"iv\" style=\"color:#ef4444\">5.28 → 8.27（3 个月）</div></div>\n  <div class=\"info-item\"><div class=\"il\">当前 PE</div><div class=\"iv\">300+ 倍</div></div>\n</div>\n\n<h2>核心矛盾：产业面 vs 筹码面</h2>\n<blockquote>股价 = HBM/GMC/国产替代远期故事 ÷ <strong>筹码结构的即时破坏力</strong></blockquote>\n\n<h3>问题出在分母：</h3>\n<ol>\n  <li><strong>华天科技清仓减持</strong>（340 万股，3 个月窗口）—— 确定性抛压</li>\n  <li><strong>日均主力净流出数千万至亿级</strong>——卖压大于买力</li>\n  <li><strong>缺乏长线多头承接</strong>——以游资 + 散户为主</li>\n  <li><strong>300+ 倍 PE</strong>——远期预期已充分透支</li>\n</ol>\n\n<h2>关键时间线</h2>\n<table>\n  <tr><th>日期</th><th>事件</th><th>影响</th></tr>\n  <tr><td><span class=\"pill pill-down\">5 月 24 日</span></td><td>华天科技公告清仓减持</td><td><strong>分水岭</strong>：产业逻辑不变，筹码逻辑彻底逆转</td></tr>\n  <tr><td><span class=\"pill pill-down\">5.28 → 8.27</span></td><td>减持执行期</td><td>3 个月的确定性抛压窗口</td></tr>\n  <tr><td><span class=\"pill pill-mid\">8.27 后</span></td><td>减持结束</td><td>筹码消化后的重新入场窗口</td></tr>\n</table>\n\n<h2>操作策略</h2>\n<p>产业面逻辑硬，但短期筹码矛盾要先解决。<strong>更好的入场时机：华天科技 3 个月减持期结束后、筹码充分交换、换手率降下来之后</strong>。</p>\n<p>期间持续跟踪：每日换手率、股东户数变化、大宗交易折价率。</p>\n\n<blockquote>⚠️ 以上分析基于公开信息整理，不构成投资建议。</blockquote>"}, {"id": "transwarp-688031", "title": "星环科技(688031) 深度研究报告", "icon": "🚀", "tags": ["星环科技", "AI基础设施", "认知数据库", "信创", "大数据", "688031", "GD专题"], "desc": "全面剖析星环科技：IDC大数据独立软件厂商连续4年第一，认知数据库云版发布在即，广发证券给170.94元目标价。营收重回高增(Q1+26.2%)亏损收窄33%，但军采处罚与持续亏损需关注。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4.48亿</div><div class=\"lbs\">2025营收</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+20.5%</div><div class=\"lbs\">营收增速</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-2.45亿</div><div class=\"lbs\">归母净利润</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-28.6%</div><div class=\"lbs\">亏损同比收窄</div></div>\n</div>\n<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">170.94元</div><div class=\"lbs\">广发目标价</div></div>\n  <div class=\"metric-box\"><div class=\"num\">54.14%</div><div class=\"lbs\">毛利率</div></div>\n  <div class=\"metric-box\"><div class=\"num\">165.4亿</div><div class=\"lbs\">总市值</div></div>\n  <div class=\"metric-box\"><div class=\"num\">190+项</div><div class=\"lbs\">累计专利</div></div>\n</div>\n\n<h1>星环科技(688031) 深度研究报告</h1>\n<p><strong>报告日期：</strong>2026-06-01 | <strong>当前股价：</strong>136.53元 | <strong>总市值：</strong>165.4亿元</p>\n\n<div class=\"tagline\">📌 <strong>核心判断：</strong>星环科技是国内稀缺的\"大数据平台+AI平台+数据库\"全栈自研厂商。IDC排名连续4年独立软件厂商第一。营收重回高增（Q1+26.2%），亏损持续收窄。认知数据库云版本发布在即，广发证券5月28日给予目标价170.94元（较当前有+25%空间）。今日涨停（+16.81%）。但军采处罚、持续亏损、PS估值偏高是主要风险。</div>\n\n<hr>\n\n<h2>一、公司概览</h2>\n<table>\n  <tr><th>项目</th><th>内容</th></tr>\n  <tr><td>公司全称</td><td>星环信息科技（上海）股份有限公司</td></tr>\n  <tr><td>股票代码</td><td>688031.SH（科创板）</td></tr>\n  <tr><td>上市日期</td><td>2022年10月18日</td></tr>\n  <tr><td>创始人/CEO</td><td>孙元浩</td></tr>\n  <tr><td>所属行业</td><td>软件开发 / AI基础设施</td></tr>\n</table>\n\n<p>围绕数据的集成、存储、治理、建模、分析、挖掘、流通全生命周期，提供基础软件及服务。对标国际的Databricks/Snowflake。</p>\n\n<hr>\n\n<h2>二、产品矩阵</h2>\n<ul>\n  <li><strong>🏗️ 大数据平台</strong>：TDH一站式大数据平台（基本盘，连续4年IDC市占第一）</li>\n  <li><strong>🗄️ 数据库</strong>：ArgoDB（分析型）+ KunDB（交易型）+ Hippo（向量）+ StellarDB（图）</li>\n  <li><strong>🤖 AI平台</strong>：Sophon MLOps + 无涯大模型 + 无涯·问知/问数 + TKH知识平台 + AI PC版（接入DeepSeek）</li>\n  <li><strong>🧠 认知数据库</strong>（2026催化）：AI集成至数据库引擎，云版即将发布</li>\n</ul>\n\n<hr>\n\n<h2>三、财务全景</h2>\n<table>\n  <tr><th>年度</th><th>营收(亿)</th><th>同比</th><th>净利润(亿)</th><th>毛利率</th></tr>\n  <tr><td><strong>2023</strong></td><td>5.38</td><td>+44.4%</td><td>-2.89</td><td>-</td></tr>\n  <tr><td>2024</td><td>3.71</td><td>-24.3%</td><td>-3.43</td><td>-</td></tr>\n  <tr><td><strong>2025</strong></td><td><strong>4.48</strong></td><td><strong>+20.5%</strong></td><td><strong>-2.45</strong></td><td><strong>54.14%</strong></td></tr>\n  <tr><td><strong>2026Q1</strong></td><td><strong>0.81</strong></td><td><strong>+26.2%</strong></td><td><strong>-0.56</strong></td><td><strong>40.45%</strong></td></tr>\n</table>\n<p>✅ <strong>边际改善趋势明确</strong>：2025年亏损首度收窄(-28.6%)，Q1亏损继续收窄(-33%)。三费占营收比从86.5%→60.54%（-29.94%），降本增效显著。</p>\n<p>⚠️ 上市三年累计亏损超15亿，现金流仍为负，货币资金可维持约2年。</p>\n\n<hr>\n\n<h2>四、行业竞争格局</h2>\n<table>\n  <tr><th>维度</th><th>实力</th><th>来源</th></tr>\n  <tr><td>大数据平台</td><td><strong>独立软件厂商#1</strong></td><td>IDC 连续4年</td></tr>\n  <tr><td>图数据库</td><td>#4</td><td>IDC 2024</td></tr>\n  <tr><td>AI/ML平台</td><td>#5</td><td>IDC 2024</td></tr>\n  <tr><td>信创数据库</td><td>市场领导者</td><td>计世资讯</td></tr>\n</table>\n<p><strong>核心壁垒</strong>：① 全栈自研不依赖开源 ② 信创适配（华为/飞腾/龙芯） ③ 金融+政府头部客户 ④ AI+Data融合</p>\n\n<hr>\n\n<h2>五、增长驱动力</h2>\n<ol>\n  <li><strong>✅ 信创替代（确定性最高）</strong>：Oracle/IBM/Hadoop国产替代，央企/政府端刚需</li>\n  <li><strong>✅ AI基础设施化（最大空间）</strong>：认知数据库云版发布在即，搭AIGC流量快车</li>\n  <li><strong>✅ 行业数字化</strong>：金融、能源、轨交、央企数智化持续释放</li>\n  <li><strong>✅ 产品升级</strong>：AI产品附加值更高，有望带动毛利率突破60%</li>\n</ol>\n\n<hr>\n\n<h2>六、⚠️ 风险因素</h2>\n\n<h3>🔴 军队采购处罚（2026-05-09）</h3>\n<p>因\"2021-YK01-W1122\"项目<strong>围标串标</strong>，被暂停全军采购资格（生效2026-05-09）。法定代表人孙元浩及授 (function() {
  if (!monitors || monitors.length===0) return;
  const l=monitors[monitors.length-1];
  const h=l.html;

  // extract info-grid items
  const infoItems={};
  const re=/<div class="il">(.*?)<\/div>\s*<div class="iv">(.*?)<\/div>/gs;
  let m; while((m=re.exec(h))) infoItems[m[1].trim()]=m[2].trim();

  // Market indices
  const idxMap={sh:'上证指数',sz:'深证成指',cy:'创业板指',kc:'科创50'};
  Object.entries(idxMap).forEach(([k,v])=>{
    if(infoItems[v]){
      const raw=infoItems[v];
      const price=(raw.match(/[\d.]+/)||['--'])[0];
      const chg=(raw.match(/[+-]\d+\.?\d*%/)||['--'])[0];
      document.getElementById('v_'+k).textContent=price;
      if(chg!=='--'){
        const up=chg.startsWith('+');
        document.getElementById('sub_'+k).className='sub '+(up?'green':'red');
        document.getElementById('sub_'+k).textContent=chg;
      }
    }
  });

  // Tags -> tagCloud
  const tags=l.tags||[];
  const tagColors=['#3b82f6','#a855f7','#ec4899','#06b6d4','#f59e0b','#22c55e'];
  document.getElementById('tagCloud').innerHTML=tags.slice(0,8).map((t,i)=>
    '<span style="background:'+tagColors[i%6]+'18;color:'+tagColors[i%6]+'">#'+t+'</span>'
  ).join('');

  // Parse net inflow table
  const tables=[...h.matchAll(/<table>(.*?)<\/table>/gs)].map(m=>m[1]);
  let funds=[];
  tables.forEach(tbl=>{
    if(/净流入/.test(tbl)&&(/板块/.test(tbl)||/驱动/.test(tbl))){
      const rows=[...tbl.matchAll(/<tr>(.*?)<\/tr>/gs)].map(m=>m[1]);
      for(let i=1;i<rows.length;i++){
        const cells=[...rows[i].matchAll(/<t[dh][^>]*>(.*?)<\/t[dh]>/gs)].map(m=>m[1]);
        if(cells.length>=3){
          const name=cells[1].replace(/<[^>]+>/g,'').trim();
          const fv=parseFloat(cells[2].replace(/<[^>]+>/g,'').replace(/[+亿]/g,''));
          if(!isNaN(fv)) funds.push({n:name,v:fv,c:'#3b82f6'});
        }
      }
    }
  });
  if(funds.length===0) funds=tags.slice(0,5).map((t,i)=>({n:t,v:(5-i)*2,c:'#3b82f6'}));
  funds=funds.slice(0,5);
  const maxV=Math.max(...funds.map(f=>f.v));
  document.getElementById('fundList').innerHTML=funds.map(f=>
    '<div class=fund-row><span class=n>'+f.n+'</span><div class=b style="background:'+f.c+'22"><div style="width:'+(f.v/maxV*100)+'%;background:'+f.c+'">'+f.v.toFixed(1)+'亿</div></div></div>'
  ).join('');

  // Parse highlights
  let highlights=[];
  tables.forEach(tbl=>{
    if(/异动/.test(tbl)&&(/个股/.test(tbl)||/逻辑/.test(tbl))){
      const rows=[...tbl.matchAll(/<tr>(.*?)<\/tr>/gs)].map(m=>m[1]);
      for(let i=1;i<rows.length&&highlights.length<5;i++){
        const cells=[...rows[i].matchAll(/<t[dh][^>]*>(.*?)<\/t[dh]>/gs)].map(m=>m[1]);
        if(cells.length>=2){
          const stock=cells[0].replace(/<[^>]+>/g,'').trim();
          const action=cells.length>=4?cells[cells.length-2].replace(/<[^>]+>/g,'').trim():'';
          highlights.push('• <strong>'+stock+'</strong> — '+action);
        }
      }
    }
  });
  if(highlights.length===0){
    const s=l.summary||'';
    highlights=s.split(/[。.]/).filter(x=>x.trim()).slice(0,3).map(x=>'• '+x.trim()+'。');
  }
  document.getElementById('highlightList').innerHTML=highlights.join('<br>');

  // Parse watchlist
  let wl=[];
  tables.forEach(tbl=>{
    if(/名称/.test(tbl)&&/代码/.test(tbl)&&/现价/.test(tbl)){
      const rows=[...tbl.matchAll(/<tr>(.*?)<\/tr>/gs)].map(m=>m[1]);
      for(let i=1;i<rows.length;i++){
        const cells=[...rows[i].matchAll(/<t[dh][^>]*>(.*?)<\/t[dh]>/gs)].map(m=>m[1]);
        if(cells.length>=4){
          const name=cells[0].replace(/<[^>]+>/g,'').trim();
          const code=cells[1].replace(/<[^>]+>/g,'').trim();
          const price=cells[2].replace(/<[^>]+>/g,'').trim();
          const chg=cells[3].replace(/<[^>]+>/g,'').trim();
          let ch=null;
          try{ch=parseFloat(chg.replace(/[+%]/g,''));}catch(e){}
          wl.push({n:name,c:code,p:price,ch:ch});
        }
      }
    }
  });
  if(wl.length>0){
    document.getElementById('wlBody').innerHTML=wl.map(s=>{
      if(s.ch!==null&&!isNaN(s.ch)){
        const cls=s.ch>=0?'green':'red';
        const sign=s.ch>=0?'+':'';
        return '<tr><td><strong>'+s.n+'</strong></td><td><span class=code>'+s.c+'</span></td><td>&yen;'+s.p+'</td><td class="'+cls+'">'+sign+s.ch.toFixed(2)+'%</td></tr>';
      }
      return '<tr style="color:#94a3b8;font-size:11px"><td>'+s.n+'</td><td><span class=code>'+s.c+'</span></td><td>--</td><td>--</td></tr>';
    }).join('');
  }

  // Market comment
  document.getElementById('marketComment').innerHTML='<p>'+(l.summary||'暂无数据')+'</p>';
})()

  g.innerHTML = s.map(st => {
    const rt = st.rt;
    const rc = rt === 'B' ? 'pfl-rtg-B' : rt === 'H' ? 'pfl-rtg-H' : 'pfl-rtg-S';
    const rtLabels = {B:'增持',H:'观望',S:'减持'};
    const cc = rt === 'B' ? '#22c55e' : rt === 'H' ? '#f59e0b' : '#ef4444';
    const mkCl = st.md.s.includes('多头') ? 'ts-b' : 'ts-r';
    const rsCl = st.rs.includes('超卖') || st.rs.includes('偏强') ? 'ts-b' : st.rs.includes('偏弱') ? 'ts-r' : 'ts-n';
    const mn = Math.min(...st.kl), mx = Math.max(...st.kl), rg = mx - mn || 1;
    const w = 200, hh = 30;
    const pts = st.kl.map((v,i) => `${(i/(st.kl.length-1))*w},${hh-((v-mn)/rg)*hh}`).join(' ');
    const svg = `<svg viewBox="0 0 ${w} ${hh}"><defs><linearGradient id="g-${st.c.replace(/[.#]/g,'')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${cc}" stop-opacity="0.2"/><stop offset="100%" stop-color="${cc}" stop-opacity="0.01"/></linearGradient></defs><path d="M${pts}" fill="none" stroke="${cc}" stroke-width="1.3" stroke-linecap="round"/><path d="M0,${hh} L${pts} L${pts.split(' ').pop().split(',')[0]},${hh}Z" fill="url(#g-${st.c.replace(/[.#]/g,'')})" opacity="0.25"/></svg>`;
    return `
      <div class="pfl-card">
        <span class="pfl-rtg ${rc}">${rtLabels[rt]}</span>
        <div class="pfl-hd">
          <span class="pfl-exg ${st.ec}">${st.e}</span>
          <div class="pfl-sn"><h2>${st.n}</h2><span class="cd">${st.c}</span></div>
        </div>
        <div class="pfl-pr"><span class="p">${st.cur}${st.pr.toFixed(2)}</span><span class="cp ${st.ch>=0?'profit':'loss'}">${st.ch>0?'+':''}${st.ch}%</span></div>
        <div class="pfl-pl ${st.ch>=0?'pb':'lb'}">${st.ch>=0?'📈 今日上涨':'📉 今日下跌'}</div>
        <div class="pfl-tech">
          <div class="pfl-tb"><div class="tl">MACD</div><div class="tv">${st.md.v.toFixed(2)}</div><div class="ts ${mkCl}">${st.md.s}</div></div>
          <div class="pfl-tb"><div class="tl">KDJ</div><div class="tv" style="font-size:10px">${st.kd}</div></div>
          <div class="pfl-tb"><div class="tl">RSI6</div><div class="tv">${st.r6.toFixed(1)}</div><div class="ts ${rsCl}">${st.rs}</div></div>
        </div>
        <div class="pfl-chart">${svg}</div>
        <div class="pfl-mf">
          <div class="pfl-mfi"><div class="ml">主力</div><div class="mv ${st.mf[0]>=0?'profit':'loss'}">${st.mf[0]>=0?'+':''}${st.mf[0].toFixed(2)}</div></div>
          <div class="pfl-mfi"><div class="ml">超大单</div><div class="mv ${st.mf[1]>=0?'profit':'loss'}">${st.mf[1].toFixed(2)}</div></div>
          <div class="pfl-mfi"><div class="ml">大单</div><div class="mv ${st.mf[2]>=0?'profit':'loss'}">${st.mf[2].toFixed(2)}</div></div>
          <div class="pfl-mfi"><div class="ml">中小单</div><div class="mv ${st.mf[3]>=0?'profit':'loss'}">${st.mf[3].toFixed(2)}</div></div>
        </div>
        <div class="pfl-tag">${st.tg.map(t => `<span class="pfl-ct">${t}</span>`).join('')}</div>
      </div>`;
  }).join('');
}

// Load portfolio on page ready
loadPortfolio();

// Init
renderMonitors();
renderReports();
</script>
</body>
</html>
