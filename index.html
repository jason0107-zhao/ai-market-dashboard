.31</span></td></tr>\n  <tr><td><strong>3</strong></td><td>兴森科技</td><td>—</td><td><span class=\"green\">+12.46</span></td></tr>\n  <tr><td><strong>4</strong></td><td>剑桥科技</td><td>603083</td><td><span class=\"green\">+11.73</span></td></tr>\n  <tr><td><strong>5</strong></td><td>宁德时代</td><td>300750</td><td><span class=\"green\">+10.48</span></td></tr>\n  <tr><td><strong>6</strong></td><td>长飞光纤</td><td>601869</td><td><span class=\"green\">+10.39</span></td></tr>\n  <tr><td><strong>7</strong></td><td>中国中免</td><td>—</td><td><span class=\"green\">+9.87</span></td></tr>\n  <tr><td><strong>8</strong></td><td>中天科技</td><td>600522</td><td><span class=\"green\">+9.35</span></td></tr>\n  <tr><td><strong>9</strong></td><td>贵州茅台</td><td>600519</td><td><span class=\"green\">+9.19</span></td></tr>\n  <tr><td><strong>10</strong></td><td>华能蒙电</td><td>—</td><td><span class=\"green\">+8.42</span></td></tr>\n</table>\n\n<hr>\n\n<h2>七、下周前瞻（6月1日-5日）</h2>\n\n<div class=\"info-card\">\n<h3>📅 核心事件日历</h3>\n<table>\n  <tr><th>时间</th><th>事件</th><th>重要程度</th><th>预期影响</th></tr>\n  <tr><td><strong>6/1（周一）</strong></td><td><strong>宇树科技科创板IPO上会</strong></td><td>⭐⭐⭐⭐⭐</td><td>人形机器人板块最强催化剂。若过会，宇树成为A股\"人形机器人第一股\"，估值锚定效应将提振整个板块。关注是否带动机器人ETF和相关产业链个股走强</td></tr>\n  <tr><td><strong>6/2-6/5</strong></td><td><strong>Computex 2026 台北电脑展</strong></td><td>⭐⭐⭐⭐⭐</td><td>全球AI年度最强催化窗口。黄仁勋主题演讲，预计发布Vera Rubin架构、CPO量产时间表等重磅信息。英伟达/AMD/英特尔/台积电全线参与</td></tr>\n  <tr><td><strong>6月初</strong></td><td>美国5月非农就业数据</td><td>⭐⭐⭐</td><td>影响美联储降息预期和美元指数走势，进而影响白银和科技股全球资金流向</td></tr>\n</table>\n</div>\n\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 短期判断</div><div class=\"iv\" style=\"font-size:14px\">A股周一大概率<strong>震荡企稳</strong>，科技板块经历周五暴跌后存在技术性修复需求。但\"高切低\"格局可能延续，电力/公用事业等防御板块仍有韧性。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 核心催化剂</div><div class=\"iv\" style=\"font-size:14px\"><strong>宇树上会（6/1）+ Computex大会（6/2-6/5）</strong>是双重重磅催化，有望推动AI板块情绪修复和资金回流。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银75-76美元区间震荡，5月月线涨约2.1%。下周关注非农数据和美联储官员表态。72美元为关键支撑，80美元为上方压力。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续大额净流出格局尚未改变。如果宇树IPO上会或Computex大会不及预期，科技板块调整时间可能延长。仓位管理是第一要务。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>核心仓位不动</strong>（算力/光模块/存储龙头），利用Computex催化前的低点逢低布局。重点关注：<br>\n1）CPO产业链通信线缆方向（亨通光电、剑桥科技、长飞光纤）<br>\n2）机器人核心零部件（拓普集团、三花智控、绿的谐波）<br>\n3）HBM/存储产业链（关注涨价逻辑兑现）</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 美股今夜关注</div><div class=\"iv\" style=\"font-size:14px\">美股周五盘中，纳指延续强势，AI板块继续上涨。关注戴尔、英伟达、Cerebras等AI龙头走势，A股科技板块修复需要外部正面信号的确认。</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-0007", "date": "2026-06-01 00:07", "title": "AI板块周末复盘 · 科技全面退潮 白银75美元震荡 聚焦Computex大会", "tags": ["周末复盘", "科技回调", "白银震荡", "高切低", "Computex大会", "宇树IPO"], "summary": "A股上周五科技全面退潮科创50暴跌5%。COMEX白银75.58美元震荡。本周Computex大会+宇树上会是最大看点。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4068.57</div><div class=\"lbs\">上证指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.73%</div><div class=\"lbs\">上周五涨跌</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX白银</div></div>\n</div>\n\n<h1>AI板块周末复盘 · 科技退潮 白银震荡 聚焦Computex</h1>\n<p><strong>时间：</strong>2026-06-01 00:07</p>\n\n<div class=\"tagline\">📌 <strong>当前状态：</strong>A股上周五（5月29日）已收盘。本周一（6月1日）A股尚未开盘。本周是AI板块最重要的催化窗口——<strong>宇树科技6/1 IPO上会 + Computex 6/2-6/5台北开幕</strong>，英伟达Vera Rubin架构即将完整曝光。上周五科技全面退潮后，市场急需新催化剂驱动方向选择。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.20美元/盎司</strong> <span class=\"pill pill-mid\">日内持平</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银T+D</div><div class=\"iv\"><strong>18,284元/千克</strong> <span class=\"pill pill-mid\">日内 -0.09%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>4,569.90美元/盎司</strong> <span class=\"pill pill-up\">+0.94%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.02</strong> <span class=\"pill pill-down\">走弱</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>白银自1月创下121美元历史高点后深度回调，目前处于<strong>75美元附近低位震荡筑底</strong>阶段。上周五（5/29）日内一度大幅反弹+3.81%至76美元上方，但周末回落至75.58美元。整体波动区间收窄，在72-80美元之间宽幅震荡。短线呈现<strong>筑底企稳</strong>特征，但尚未形成趋势性反转信号。</p>\n\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元走弱提供支撑：</strong>美元指数报99.02，较前期高点明显回落，对贵金属整体形成提振</li>\n  <li><strong>美联储加息预期反复：</strong>新任美联储主席沃什上任后偏鹰表态，市场对2026年加息预期升温，限制白银上行空间</li>\n  <li><strong>工业需求端稳健：</strong>光伏装机+AI数据中心建设对白银工业需求维持高位，但短期受宏观情绪拖累</li>\n  <li><strong>机构观点分歧：</strong>美银看多Q4触及100美元但认为\"昙花一现\"；瑞银下调目标价至80美元，供需缺口从3亿盎司收窄至6000-7000万盎司</li>\n  <li><strong>波动率显著放大：</strong>5月中旬单日暴跌超9%，近期波动区间扩大，多空博弈剧烈</li>\n</ul>\n\n<blockquote>💡 白银当前处于72-80美元区间震荡，短线支撑看72美元，上方压力80美元。注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、AI板块整体市场概览</h2>\n<p><strong>A股已收盘（上周五5/29）。</strong>上周AI板块经历剧烈分化——周三（5/27）\"易中天\"齐创历史新高、半导体全面爆发，周五（5/29）科技全线暴跌，科创50单日跌幅<strong>5.04%</strong>领跌全场。两日\"冰火两重天\"充分说明当前市场处于<strong>极度敏感的高位博弈阶段</strong>。</p>\n\n<p>本周核心看点：</p>\n<ul>\n  <li><strong>6月1日（周一）：</strong>宇树科技科创板IPO上会（人形机器人第一股），拟募资42亿元</li>\n  <li><strong>6月2-5日（周二-周五）：</strong>Computex 2026台北电脑展——英伟达Vera CPU + Rubin GPU正式亮相，\"AI工厂\"架构首次完整曝光</li>\n  <li>两大事件叠加，本周将是AI板块年内最重要的催化窗口之一</li>\n</ul>\n\n<hr>\n\n<h2>二、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-down\">上周五净流出</span> <span class=\"pill pill-mid\">情绪 谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五电子行业主力净流出<strong>372亿元</strong>居全行业第一。中芯国际主力净流出31.4亿元全市场最高。算力ETF全线收跌。但需注意——这是连续上涨后的<strong>获利回吐</strong>，而非产业逻辑破坏。</p>\n<p class=\"sn\"><strong>政策面：</strong>本周最大政策催化剂来自<strong>Computex 2026</strong>（6/2-6/5），以\"AI Together\"为主题。英伟达将正式亮相Vera CPU和Rubin GPU两款王炸产品，围绕这两款芯片的供应链布局已提前打响，台积电罕见调整先进封装产能。市场监管总局&发改委联合发布《人工智能计量体系和能力建设指引》。</p>\n<p class=\"sn\"><strong>基本面：</strong>Cerebras在美上市首日暴涨89%市值达750亿美元，验证AI算力赛道高景气。戴尔2027财年Q1 AI服务器营收161亿美元同比+757%。四大云厂商2026年资本支出合计达7250亿美元（+77%）。海内外AI基建投资同步加码。</p>\n<p class=\"sn\"><strong>情绪面：</strong>上周五抛压释放后，市场对本周Computex的期待可能带来<strong>预期修复</strong>。但需警惕英伟达Rubin GPU散热问题（传闻2.3kW功耗瓶颈）若被确认可能形成短期情绪冲击。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪 中性偏谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五跟随半导体回调。北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但方向偏流出。佰维存储成为存储中少有的红盘股。</p>\n<p class=\"sn\"><strong>政策面：</strong>工信部等十部门联合推进AI伦理审查制度落地，但存储行业更多受产业供需影响。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM供需持续紧张——HBM3E现货价半年暴涨超300%。三星率先交付首批12层48GB HBM4E样品。集邦预测2026年HBM需求再增70%+。美光警告内存短缺将延续至2026年后。全球DRAM营收2026年Q1逼近970亿美元（环比+80%，同比+260%），创历史新高。HBM在AI芯片成本占比已从52%升至63%。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强势，HBM涨价周期确定性极高。但短期股价已充分反映涨价预期，获利资金兑现意愿强烈。中长期来看，HBM仍是AI产业链中<strong>供需格局最紧张</strong>的环节之一。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">情绪 中性</span> <span class=\"pill pill-up\">催化在即</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五延续前期抛压态势。5月15日板块曾大爆发（三丰智能20cm涨停、绿的谐波涨16%），但后续获利回吐明显。当前处于调整蓄力阶段。</p>\n<p class=\"sn\"><strong>政策面：</strong>本周最重磅事件——<strong>宇树科技科创板IPO将于6月1日上会</strong>，冲刺A股\"人形机器人第一股\"。上海国际具身机器人展6/3-6/5同期举办。工信部五部门\"百场万企\"通知聚焦机器人赛道。国家发改委明确\"让机器人进工厂、进商场、进家庭\"。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势加速——特斯拉Optimus Gen-3预计年中亮相，7-8月启动量产，首代目标年产能100万台。智元机器人新增超1万台生产订单已超过2025年全年总量。海关总署数据显示4月工业机器人出口突破2.5万台（同比+90%）。2026年是人形机器人<strong>规模化验证关键期</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>本周宇树上会结果至关重要。若顺利过会将为板块注入强心剂。市场预期2026年人形机器人产业规模突破200亿元，长期空间巨大。但短期估值已不便宜，适合在调整中逢低布局。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强</span> <span class=\"pill pill-mid\">情绪 结构性乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五CPO板块内部剧烈分化——光模块龙头中际旭创高位震荡（成交225亿A股第一），但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿元</strong>居全市场第一。</p>\n<p class=\"sn\"><strong>政策面：</strong>市场调研公司Cignal AI指出CPO初步部署将在2026年启动。\"韬定律\"（ISCAS 2026）提出竞争维度从\"芯片制程\"转向\"互连密度\"，与CPO产业诉求形成共鸣。台积电在技术论坛上披露\"三层蛋糕\"AI平台架构，将光子互连（COUPE）列为未来最重要的三大技术方向之一。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年被机构定义为<strong>CPO产业化元年</strong>。英伟达明确2026年Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台+。台积电COUPE硅光整合平台预计2026年量产。LightCounting预测2030年CPO市场规模达100亿美元。中际旭创一季度营收194.96亿元（+192%），净利润57.35亿元（+262%）。1.6T光模块2026年进入商业化元年，800G出货量预计突破4000万只。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业趋势确定性极高。上周五资金从高位光模块龙头撤出后，转向通信线缆等\"新面孔\"方向。这体现了产业认知扩散过程中的资金轮动特征。但光模块龙头基本面扎实，调整后反而提供更好的入场时机。</p>\n</div>\n\n<hr>\n\n<h2>三、主流净流入板块监控（5月29日 TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿元)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联概念延伸</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>上周五全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li><strong>电力+公用事业+火电</strong>合计净流入约110亿元，资金从科技向防御方向<strong>大迁徙</strong></li>\n  <li>通信线缆（亨通光电净流入39.76亿）和印制电路板（净流入28.51亿）是AI关联板块中<strong>仅有的逆势吸金方向</strong></li>\n  <li><strong>电子行业</strong>净流出<strong>372亿元</strong>居首，AI板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong></li>\n  <li>AI板块全市场相对热度<strong>降至冰点</strong>，但本周催化事件密集，有望迎来情绪修复</li>\n  <li>外资方面：明晟MSCI指数新纳入19只中国股票（聚焦光通信、算力、高端制造），QFII持有A股市值接近2000亿元，硬科技方向获外资持续配置</li>\n</ul>\n\n<hr>\n\n<h2>四、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿</span><br>全市场第一</td><td>通信线缆龙头，CPO/算力互联概念延伸受益，周五获主力资金集中追捧</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿</span><br>全市场第一</td><td>半导体龙头获利回吐，创历史新高后遭大幅抛售，对板块形成显著拖累</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>HK.0992</td><td><span class=\"pill pill-up\">港股暴涨22.46%</span></td><td>财报全面超预期，AI服务器业务成核心增长引擎，验证全球AI硬件景气</td></tr>\n  <tr><td><strong>中际旭创</strong></td><td>300308</td><td><span class=\"pill pill-mid\">成交额225亿</span><br>A股第一</td><td>光模块龙头，昨日大涨后高位震荡，一季度营收195亿同比+192%，全年业绩确定性强</td></tr>\n</table>\n\n<hr>\n\n<h2>五、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3预计2026年中亮相，7-8月启动量产，首代目标年产能100万台。产业链核心受益标的一览：</p>\n\n<table>\n  <tr><th>环节</th><th>公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th><th>估值水位</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证环节</td><td>⭐⭐⭐</td><td><span class=\"pill pill-mid\">中位</span></td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件，确定性最高</td><td>⭐⭐⭐</td><td><span class=\"pill pill-mid\">中位</span></td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td><td><span class=\"pill pill-up\">偏低</span></td></tr>\n  <tr><td><strong>伺服电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，工业自动化延伸至机器人</td><td>⭐⭐</td><td><span class=\"pill pill-up\">偏低</span></td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张逻辑</td><td>⭐⭐</td><td><span class=\"pill pill-mid\">中位</span></td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机龙头，灵巧手核心供应商</td><td>⭐⭐</td><td><span class=\"pill pill-up\">偏低</span></td></tr>\n  <tr><td><strong>丝杠</strong></td><td>恒立液压</td><td>601100</td><td>精密丝杠国产替代，机器人线性关节核心</td><td>⭐⭐</td><td><span class=\"pill pill-up\">偏低</span></td></tr>\n</table>\n\n<p><strong>核心逻辑：</strong>2026年是人形机器人从\"概念验证\"到\"小批量量产\"的关键转折年。特斯拉Optimus Gen-3量产计划确定性高，叠加宇树科技上会、智元机器人订单爆发、国产供应链加速切入，产业链有望迎来<strong>估值修复+订单弹性</strong>双轮驱动。核心仓位以三花智控、绿的谐波为主，传感器/电机作为卫星仓位。</p>\n\n<blockquote>💡 机器人板块目前处于\"产业趋势确定但业绩尚未全面兑现\"的阶段，适合<strong>逢调整分批布局</strong>，不适合追高。</blockquote>\n\n<hr>\n\n<h2>六、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 本周定位</div><div class=\"iv\" style=\"font-size:14px\">A股等待周一（6/1）开盘。<strong>本周是AI板块年内最重要的催化窗口</strong>——宇树上会(6/1)+ Computex大会(6/2-6/5)。上周五科技全面退潮后，新催化剂将决定方向选择。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 本周关键事件</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 6/1 宇树科技IPO上会</strong>（人形机器人第一股，关注过会与否）<br><strong>2) 6/2-6/5 Computex大会</strong>（英伟达Vera Rubin完整曝光、AI工厂架构）<br><strong>3) 6/3-6/5 上海具身机器人展</strong><br><strong>4) 美国PCE通胀数据/非农数据</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">美股三大指数上周五<strong>齐创新高</strong>，纳指六连涨。费城半导体指数+1%。A股调整更多是<strong>内部筹码博弈问题</strong>，AI产业基本面与美股持续共振。本周Computex有望成为中美AI板块同步向上的催化剂。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银75.58美元在72-80美元区间震荡。美元走弱提供支撑，但美联储加息预期限制上行空间。本周关注美国非农数据对贵金属的指引。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金持续大额净流出，市场情绪极度敏感。若本周Computex发布内容不及预期，AI板块调整可能延续。需关注英伟达Rubin GPU散热问题是否被确认。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">本周以<strong>关注催化事件、伺机而动</strong>为主。若宇树过会+Computex超预期，AI板块有望迎来修复行情。核心仓位逢低布局算力/光模块龙头，适度配置CPO通信线缆方向。机器人板块关注宇树上会结果。</div></div>\n</div>\n\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-0107", "date": "2026-06-01 01:07", "title": "AI板块周末复盘 · 明天三重催化来袭：宇树IPO上会/Computex开幕/黄仁勋演讲 白银75美元震荡", "tags": ["周末复盘", "宇树IPO", "Computex", "黄仁勋", "白银震荡", "科技高切低", "戴尔AI"], "summary": "A股休市。明天宇树上会+黄仁勋演讲+Computex开幕三重催化齐聚。白银75美元区间震荡。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">75.2</div><div class=\"lbs\">COMEX白银</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.2</div><div class=\"lbs\">现货白银</div></div>\n  <div class=\"metric-box\"><div class=\"num\">~99.0</div><div class=\"lbs\">美元指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">待开市</div><div class=\"lbs\">A股状态</div></div>\n</div>\n\n<h1>AI板块周末复盘 · 明天三重催化来袭（宇树IPO上会/Computex开幕/黄仁勋演讲）</h1>\n<p><strong>时间：</strong>2026-06-01 01:07（A股今日休市）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>当前A股休市中。明日（6月1日周一）多重催化集中来袭——宇树科技IPO上会冲刺\"人形机器人第一股\"、Computex 2026大会将于6月2日盛大开幕、黄仁勋6月1日上午11点发表主题演讲。COMEX白银维持在75美元附近窄幅震荡。本周三件大事将决定AI板块短期走向。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>~75.2美元/盎司</strong> <span class=\"pill pill-mid\">周内震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>~75.2美元/盎司</strong> <span class=\"pill pill-mid\">周内震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>~18,280元/千克</strong> <span class=\"pill pill-mid\">周内震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>~99.0</strong> <span class=\"pill pill-down\">走弱态势</span></div></div>\n</div>\n<p><strong>近期趋势：</strong>白银本周经历了\"先抑后扬\"的V型走势——5月28日(周四)单日重挫4.5%至低点，5月30日(周五)强力反弹约3.45%至75.2美元附近。全周现货白银从16.682元/克跌至16.537元/克，周线微跌。目前白银处于<strong>72-80美元宽幅震荡区间</strong>的中间位置。</p>\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元走弱提供支撑：</strong>美元指数报99.0附近，较前期高位回落，对贵金属形成支撑</li>\n  <li><strong>美伊和谈预期影响：</strong>美伊谈判进展是近期核心变量。5月28日地缘风险溢价下降导致白银暴跌，周五部分修复</li>\n  <li><strong>美联储加息预期反复：</strong>市场定价今年年底前加息概率约55%，5年期国债利率达4.82%创年内新高，压制贵金属上行空间</li>\n  <li><strong>华尔街分歧加大：</strong>美银看多Q4冲击100美元但称涨势\"昙花一现\"；瑞银给出一致看多但认为短期震荡</li>\n  <li><strong>工业需求故事仍在：</strong>光伏+AI硬件建设对白银工业需求维持高位，为中长期走势提供支撑</li>\n</ul>\n<p><strong>下周关注：</strong>6月5日(周五)美国5月非农就业数据将是关键——若就业数据再超预期，将强化美联储加息预期，对白银形成压力；反之则利好白银反弹。美伊谈判进展仍是重要变量。</p>\n<blockquote>💡 白银处于72-80美元大区间中间位置。短线支撑72美元，上方压力80美元。波动剧烈（5月曾单日跌超9%），注意仓位管理。美银看多Q4冲击100美元，但短期以区间震荡对待。</blockquote>\n\n<hr>\n\n<h2>一、AI板块整体市场概览</h2>\n<p><strong>A股今日休市（周日）</strong>，暂无实时交易数据。</p>\n<p>回顾上周五（5月29日）A股走势——三大指数高开低走，全线收跌。上证指数收报4068.57(-0.73%)，深证成指15575.13(-1.81%)，创业板指约4038(-2.11%)，<strong>科创50暴跌5.04%</strong>领跌全场。两市成交3.32万亿元放量下跌。电子行业主力净流出372亿元居全行业第一，资金从科技向电力/公用事业/消费等防御方向高切低。</p>\n<p><strong>上周整体特征：</strong>A股5月走出极端分化行情——584家公司股价创历史新高，但近4000家公司月线下跌。机构资金高度抱团AI等热门赛道。全市场风格呈现典型的\"科技主线+高切低轮动\"特征。</p>\n<p><strong>本周最大看点：</strong>三大超级催化集中来袭：</p>\n<ul>\n  <li><strong>明天（6/1）宇树科技IPO上会</strong>——冲刺A股\"人形机器人第一股\"</li>\n  <li><strong>6/2-6/5 Computex 2026大会</strong>——以\"AI Together\"为主题，全球AI算力巨头齐聚</li>\n  <li><strong>6/1 上午11点黄仁勋主题演讲</strong>——有望揭晓新一代AI突破技术（Vera CPU/Rubin GPU）</li>\n</ul>\n\n<hr>\n\n<h2>二、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">情绪 等待催化</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五电子行业主力净流出372亿居全行业第一。算力板块获利回吐压力显著。中芯国际全市场净流出31.4亿排名第一。但算力ETF份额持续增加，显示中长期资金仍在布局。</p>\n<p class=\"sn\"><strong>政策面：</strong>最重磅催化——<strong>黄仁勋将于6/1上午11点（北京时间）发表Computex主题演讲</strong>，有望揭晓Vera CPU和Rubin GPU等下一代产品。摩根士丹利称这是英伟达从\"GPU公司\"向\"全栈AI计算公司\"转型的关键节点。软银承诺在法国最多投资750亿欧元建设欧洲最大AI算力集群，全球AI基建投资同步加码。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业面持续亮眼——戴尔2027财年Q1 AI优化服务器营收161亿美元同比激增<strong>757%</strong>，上调全年AI服务器营收预期至600亿美元。联想港股上周暴涨22.46%。Cerebras在美上市首日大涨89%市值750亿美元。四大云厂商2026年资本支出合计达7250亿美元（同比+77%）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>上周五A股科技退潮属于\"高切低\"资金再平衡，非产业逻辑破坏。隔夜美股纳指六连涨创新高，AI产业热度持续升温。本周Computex大会若发布超预期产品，有望重新点燃A股算力板块行情。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">HBM景气度极高</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五存储板块跟随半导体整体回调，但北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿）。佰维存储盘中逆势涨0.94%。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM产业链<strong>极度强劲</strong>——HBM3E现货价半年暴涨超300%。三星率先交付首批12层48GB HBM4E样品。全球DRAM营收2026 Q1逼近970亿美元(+260%)创历史新高。美光警告内存短缺延续至2026年后。集邦预测2026年HBM需求再增70%+。英伟达Rubin平台将采用HBM4记忆芯片，首批支持8层堆叠。</p>\n<p class=\"sn\"><strong>情绪面：</strong>HBM是AI产业链中供需格局最紧张的环节之一。短期股价因涨幅过大面临获利回吐压力，但中长期逻辑极为确定。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">情绪 聚焦明天上会</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周板块整体回调，执行器/减速器等核心环节调整幅度较大。但北向资金在部分机器人标的上逆势加仓，凯中精密获北向加仓165%。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>明天（6/1）宇树科技科创板IPO上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42亿元。这将是板块最强的催化剂。机构报告预计2026年人形机器人产业规模突破200亿元。海关总署数据显示4月工业机器人出口量突破2.5万台（同比+90%）。特斯拉Optimus Gen-3 Q2启动量产，首代目标年产能100万台。</p>\n<p class=\"sn\"><strong>情绪面：</strong>若宇树上会顺利过会，将为板块注入强心剂。但也有文章指出宇树Q1\"增收不增利\"（扣非净利同比-52.55%），上会过程中可能面临问询压力。市场等待结果中。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">情绪 结构性乐观</span> <span class=\"pill pill-up\">通信线缆逆势吸金</span></div>\n<p class=\"sn\"><strong>资金面：</strong>光模块龙头中际旭创上周五成交225亿（A股第一）高位震荡。通信线缆及配套板块逆势净流入39.83亿元——亨通光电主力净流入<strong>39.76亿</strong>全市场排名第一，剑桥科技11.73亿，长飞光纤10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达明确Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上。台积电CPO封装技术加速推进，预计下半年实现小批量产。LightCounting预测2026年以太网光模块销量增长60%，AI带动光模块市场规模有望突破260亿美元。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业链逻辑清晰，产业化时间表明确。资金正在寻找CPO产业链的\"新面孔\"——通信线缆方向获得集中配置。市场对\"易中天\"高位有所犹豫，但通信线缆作为新延伸方向受到追捧。但斌转发CPO视频引发产业关注，产业认知正在扩散。</p>\n</div>\n\n<hr>\n\n<h2>三、主流净流入板块监控（上周五 5/29 TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联概念延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红，估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>资金流向总结：</strong>上周五全市场主力净流出约831亿元，电子行业净流出372亿居首。电力+公用事业合计净流入约85亿，资金从科技全面撤退至防御方向。通信线缆是AI板块中<strong>唯一逆势吸金方向</strong>。AI板块（电子+计算机+通信）合计净流出超400亿。</p>\n<p><strong>AI板块相对热度判断：</strong>当前AI科技板块在全市场的相对热度处于<strong>冰点</strong>——正经历\"高切低\"的资金再平衡。但本周Computex大会和宇树IPO有望重新激活板块热度，需警惕\"利好出尽\"的可能。短期调整未破坏产业逻辑，AI板块热度回升取决于催化剂的力度。</p>\n\n<hr>\n\n<h2>四、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>戴尔（DELL）</strong></td><td>美股</td><td><span class=\"pill pill-up\">财报后暴涨约35%</span></td><td>Q1 AI优化服务器营收<strong>161亿美元同比+757%</strong>，上调全年AI营收预期至600亿美元。这是全球AI硬件景气度最强验证。</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>HK.0992</td><td><span class=\"pill pill-up\">港股涨22.46%</span></td><td>财报全面超预期，AI服务器业务成为核心增长引擎，戴尔+联想双重验证AI硬件大年。</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿</span></td><td>通信线缆龙头，CPO/算力互联概念延伸受益，上周五全市场主力资金净流入第一。</td></tr>\n</table>\n\n<hr>\n\n<h2>五、本周（6/1-6/5）核心催化剂全景</h2>\n<table>\n  <tr><th>日期</th><th>事件</th><th>影响板块</th><th>重要程度</th></tr>\n  <tr><td><strong>6/1 周一</strong></td><td>宇树科技科创板IPO上会</td><td>机器人</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>6/1 周一11:00</strong></td><td>黄仁勋Computex主题演讲</td><td>算力/AI芯片/CPO</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>6/2-6/5</strong></td><td>Computex 2026大会（AI Together）</td><td>全部AI细分领域</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>6/3-6/5</strong></td><td>上海国际具身机器人展</td><td>机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>6/5 周五</strong></td><td>美国5月非农就业数据</td><td>白银/全球市场</td><td>⭐⭐⭐</td></tr>\n</table>\n\n<hr>\n\n<h2>六、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\"><strong>A股休市，本周多重催化密集来袭。</strong>上周五科技全线回调（科创50-5.04%），资金高切低至防御板块。但AI产业基本面未变。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 明日最大看点</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 6/1宇树科技IPO上会</strong>——人形机器人第一股<br><strong>2) 6/1 11:00黄仁勋Computex演讲</strong>——揭晓新一代AI技术</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">纳指已六连涨创新高，费城半导体指数+1%。戴尔AI营收+757%暴增35%。美股AI热度仍在。<strong>A股科技回调更多是内部资金博弈</strong>，非产业逻辑破坏。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">72-80美元区间震荡。关注6/5非农数据，就业若超预期→加息预期强化→白银承压；反之利好白银反弹。美伊谈判进展仍是重要变量。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">1) 非农若超预期→加息预期强化→全球流动性和风险偏好承压<br>2) 主力资金连续大额净流出，若Computex催化不足，科技调整时间或延长<br>3) 警惕\"利好出尽\"——若宇树上会/黄仁勋演讲内容不及预期，可能触发新一轮抛压</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>逢低分批布局</strong>算力/光模块龙头，核心仓位不动。重点关注Computex大会英伟达Vera Rubin架构相关更新。CPO产业链通信线缆方向值得重点关注。若宇树顺利过会，机器人板块可适度加仓核心标的（三花智控/绿的谐波）。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-0207", "date": "2026-06-01 02:07", "title": "AI板块凌晨盘前展望 · 今日Computex+宇树IPO双重催化 白银76美元震荡", "tags": ["凌晨快报", "Computex", "宇树IPO", "白银", "盘前展望"], "summary": "A股今日休市。凌晨聚焦：今日上午宇树科技IPO上会+黄仁勋Computex主题演讲双重催化。COMEX白银76美元附近震荡。戴尔AI服务器营收+757%验证景气。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">$76.08</div><div class=\"lbs\">COMEX白银</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+3.81%</div><div class=\"lbs\">白银日内</div></div>\n  <div class=\"metric-box\"><div class=\"num\">$98.9</div><div class=\"lbs\">美元指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">6/1</div><div class=\"lbs\">宇树上会+Computex</div></div>\n</div>\n\n<h1>AI板块凌晨盘前展望</h1>\n<p><strong>时间：</strong>2026-06-01 02:07（A股今日周一尚未开盘）</p>\n\n<div class=\"tagline\">📌 <strong>核心催化剂：</strong>今日是AI板块的<strong>超级星期一</strong>——上午宇树科技科创板IPO上会（人形机器人第一股）&amp; 英伟达黄仁勋在Computex大会发表主题演讲（发布Vera Rubin AI平台）。两枚重磅炸弹同时引爆，AI板块情绪有望显著回暖。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>约75.50-76.30 美元/盎司</strong> <span class=\"pill pill-mid\">日内窄幅震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金期货</div><div class=\"iv\"><strong>约4,542 美元/盎司</strong> <span class=\"pill pill-up\">+0.3%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>约98.9</strong> <span class=\"pill pill-down\">微跌 持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">布伦特原油</div><div class=\"iv\"><strong>约92.1美元/桶</strong> <span class=\"pill pill-down\">-11.1%大跌</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">纳指</div><div class=\"iv\"><span class=\"pill pill-up\">大涨2.4%</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>白银自1月29日创下121美元历史高点后大幅回落，5月初从70美元启动至89美元（5月13日），随后因CPI超预期单日暴跌超9%。当前在<strong>72-80美元区间宽幅震荡</strong>，隔夜在75.50-76.30区间窄幅波动，短期趋势不明朗。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元持续走弱提供支撑：</strong>美元指数报98.9，较前期高点明显回落，对贵金属形成支撑</li>\n  <li><strong>地缘缓和预期：</strong>美伊和谈推进，霍尔木兹海峡油轮通过量骤降，但冲突烈度下降。油价大跌11.1%反映地缘风险溢价迅速消退</li>\n  <li><strong>美联储加息预期：</strong>市场定价美联储年底前加息概率约55%，5月非农数据（6月5日公布）将成关键指引</li>\n  <li><strong>风险偏好回升：</strong>纳指大涨2.4%，市场风险偏好明显回升，避险情绪降温压制贵金属</li>\n  <li><strong>工业需求：</strong>光伏+AI数据中心对白银工业需求维持高位，中长期逻辑不变</li>\n</ul>\n<blockquote>💡 白银72-80美元区间震荡，短线方向不清晰。本周焦点：6/5美国非农数据将决定美联储加息预期，进而影响白银方向。操作上以区间策略为主。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（周五5/29回顾）</h2>\n<p>A股周五高开低走全线收跌，<strong>科创50暴跌5.04%</strong>领跌全场：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n</div>\n<p>全市场1565只上涨，3867只下跌。主力资金净流出<strong>831.55亿元</strong>。电子行业净流出<strong>372.05亿</strong>居首位。</p>\n\n<p><strong>隔夜美股指引（积极信号）：</strong></p>\n<ul>\n  <li><strong>纳指大涨2.4%</strong>，市场风险偏好显著回升</li>\n  <li><strong>10Y美债收益率下行11bp至4.45%</strong>，利率环境改善</li>\n  <li>美元指数微跌至<strong>98.9</strong>，离岸人民币升至<strong>6.76</strong></li>\n  <li>布油大跌<strong>11.1%</strong>，地缘缓和预期下风险资产受益</li>\n  <li>AI个股方面：Cerebras上市首日+89%，戴尔财报超预期</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>周五AI板块全面回调，人工智能指数收跌<strong>3.06%</strong>，成交额5398亿元。但周末消息面密集利好，今日有望企稳反弹：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\" style=\"background:#059669;color:white;padding:4px 12px;border-radius:4px\">🔥 今日最大催化</div><div class=\"iv\" style=\"font-size:14px\"><strong>6月1日（周一）上午11:00</strong> 黄仁勋Computex主题演讲<br>+ <strong>宇树科技IPO上会</strong>（人形机器人第一股）</div></div>\n</div>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-up\">今日催化密集</span> <span class=\"pill pill-up\">情绪 有望回暖</span></div>\n<p class=\"sn\"><strong>资金面：</strong>周五电子行业净流出372亿居首，中芯国际净流出31.4亿全市场第一。但资金外逃或为今日催化事件前夜清洗。上周五美股AI全线反弹，Cerebras（AI算力新星）上市首日暴涨89%市值达750亿美元，海外资金对算力的热情不减。</p>\n<p class=\"sn\"><strong>政策面：</strong><strong>今日最强政策催化：</strong>黄仁勋将于北京时间6月1日上午11:00在Computex 2026发表主题演讲，预计正式展示Vera Rubin AI平台（搭载HBM4内存），并可能发布面向PC的N1X SoC芯片。此外，市场监管总局&amp;发改委联合发布《人工智能计量体系建设指引(2026版)》。工信部&amp;国家数据局启动2026年\"模数共振\"行动（面向20个重点行业），发改委密集释放AI落地配套政策信号。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业景气持续超预期。戴尔2027财年Q1 AI优化服务器营收161亿美元（同比+757%），上调全年AI服务器营收预期至600亿美元。英伟达计划在6月初发布面向PC的N1X SoC芯片，与微软+ARM联合推动\"新PC时代\"。5月科技类基金业绩爆发（头部单月涨超40%），新基金发行破千亿。</p>\n<p class=\"sn\"><strong>情绪面：</strong>周五市场情绪极度悲观，但周末消化后叠加今日双重催化剂，今日算力板块有望<strong>探底回升</strong>。但需注意\"利多出尽\"风险——市场已部分定价Computex利好，需观察实际演讲内容超预期程度。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">HBM景气最强</span> <span class=\"pill pill-up\">情绪 中性偏乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>周五北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），整体方向偏流出，但交易量表明外资仍高度关注。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM是AI产业链中<strong>供需格局最紧张</strong>的环节。<strong>HBM3E现货价半年暴涨超300%</strong>。三星率先交付首批12层48GB HBM4E样品。美光新加坡HBM先进封装工厂动工（长期投资70亿美元）。全球DRAM营收Q1逼近970亿美元（+260%创历史新高）。黄仁勋今日Computex演讲中Rubin平台将采用HBM4内存——<strong>直接利好HBM产业链</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>HBM产业数据极为强劲，且今日Computex将直接展示HBM需求，板块情绪有望显著改善。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">今日重大催化</span> <span class=\"pill pill-up\">情绪 乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>周五延续5月27日净流出143亿元的抛压态势。但今日重大事件催化下，资金有望回流。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>今日核心催化：</strong>宇树科技科创板IPO将于6月1日上会，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。2026世界智博会（天津5/28-5/31）刚闭幕，具身智能展区首次独立设馆，80余家企业展出上百种机器人整机产品。智平方AlphaBot 2已实现月交付百台级。2026年中国人形机器人产业规模预计突破200亿元。特斯拉Optimus Gen-3预计年中亮相。</p>\n<p class=\"sn\"><strong>情绪面：</strong>宇树科技上会是今日机器人板块最核心催化剂。若顺利过会，将提振整个机器人板块估值中枢。同时6月3-5日上海国际具身机器人展也将举办。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆持续走强</span> <span class=\"pill pill-up\">情绪 结构性乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>周五CPO板块内部分化——光模块龙头回调，但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电（+39.76亿净流入全市场第一）、剑桥科技（+11.73亿）、长飞光纤（+10.39亿）持续受追捧。资金正在寻找\"新面孔\"。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上。LightCounting预计2026年以太网光模块销量增长60%，AI带动光模块市场规模有望突破<strong>260亿美元</strong>。英伟达推出三款硅光CPO交换机，Cignal AI报告超大规模数据中心将成为CPO部署先锋。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业链确定性高，资金持续涌入。今日Computex大会预计将有更多CPO相关方案展示。光模块龙头短期调整后估值更具吸引力。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（周五5/29 TOP10回顾）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向分析：</strong></p>\n<ul>\n  <li>周五全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>居全行业第一，是科技退潮的核心方向</li>\n  <li><strong>电力+公用事业+火力发电</strong>合计净流入超<strong>100亿</strong>，资金全面转向防御</li>\n  <li>通信线缆是AI板块中<strong>唯一逆势吸金方向</strong>——亨通光电全市场第一净流入39.76亿</li>\n  <li><strong>AI板块（电子+计算机+通信）合计净流出超400亿元</strong>，相对热度降至近期冰点</li>\n  <li>今日如宇树上会+Computex双重催化超预期，AI板块有望<strong>暴力反弹</strong></li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">周五净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联延伸受益。资金认可度高，趋势有望延续</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">净流出31.4亿<br>全市场第一</span></td><td>周五获利回吐，但产业基本面不变。Computex催化下今日有望修复</td></tr>\n  <tr><td><strong>博杰股份</strong></td><td>002975</td><td><span class=\"pill pill-up\">涨停（5/28）</span></td><td>AI算力测试+2025年净利增557%，切入英伟达供应链。液冷测试设备小批量发货</td></tr>\n  <tr><td><strong>戴尔科技</strong></td><td>DELL</td><td><span class=\"pill pill-up\">盘前涨39%</span></td><td>AI服务器营收161亿美元+757%，上调全年指引至600亿美元。全球AI硬件景气最强验证</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3预计年中亮相，7-8月启动正式量产，首代目标年产能100万台。A股核心受益标的：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，工业自动化延伸</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td>⭐⭐</td></tr>\n</table>\n\n<p><strong>今日催化：</strong>宇树科技科创板IPO<strong>6月1日（今日）上会</strong>，冲刺\"人形机器人第一股\"。若顺利过会将为整个板块注入强心剂。6月3-5日上海国际具身机器人展也将举办。2026年是人形机器人从0-1量产兑现阶段，<strong>板块核心仓位适合逢低布局</strong>。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 今日展望</div><div class=\"iv\" style=\"font-size:14px\">A股今日周一开盘。周五市场经历\"高切低\"全面退潮，但周末消息面密集利好，叠加<strong>今日Computex+宇树IPO双重催化剂</strong>，AI板块有望探底回升。重点关注黄仁勋主题演讲内容（Vera Rubin/PC芯片/CPO等方向）超预期程度。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 今日关键事件</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 上午11:00</strong> 黄仁勋Computex主题演讲（最强催化）<br><strong>2) 6/1 宇树科技IPO上会</strong>（人形机器人里程碑）<br><strong>3) 6/3-6/5</strong> 上海具身机器人展</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 隔夜外盘指引</div><div class=\"iv\" style=\"font-size:14px\">纳指大涨<strong>2.4%</strong>创新高，市场风险偏好显著回升。美元指数跌至98.9，离岸人民币升至6.76。戴尔AI服务器营收+757%，Cerebras上市首日+89%。外部环境<strong>极为友好</strong>。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银72-80美元区间震荡。美元走弱提供支撑但油价大跌反映地缘溢价消退。本周焦点：6/5美国非农数据。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">1) 周五主力资金净流出831亿，筹码消化尚未完成<br>2) 需观察Computex利好是否\"利多出尽\"<br>3) 市场仍在\"高切低\"进程中，AI板块需时间修复</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">今日操作<strong>以观望为主、逢低布局</strong>。重点关注：<br>1) 黄仁勋演讲中CPO/Vera Rubin/HBM相关内容<br>2) 宇树上会结果对机器人板块的提振<br>3) 亨通光电/通信线缆方向资金延续性<br>算力/光模块龙头在调整中<strong>分批低吸</strong>。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-0307", "date": "2026-06-01 03:07", "title": "AI板块凌晨盘前展望 · Computex+宇树IPO今日双重催化 白银小幅回落至75.6美元", "tags": ["凌晨快报", "Computex", "宇树IPO", "白银", "盘前展望", "机器人", "CPO"], "summary": "今日是AI重磅交易日：宇树科技IPO上会+黄仁勋Computex主题演讲双催化。纳指大涨2.4%创新高提供外围支撑。COMEX白银75.59美元小幅回落。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">$75.59</div><div class=\"lbs\">COMEX白银</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.43%</div><div class=\"lbs\">日跌幅</div></div>\n  <div class=\"metric-box\"><div class=\"num\">🔄</div><div class=\"lbs\">A股休市中</div></div>\n  <div class=\"metric-box\"><div class=\"num\">📅6/1-5</div><div class=\"lbs\">Computex大会</div></div>\n</div>\n\n<h1>AI板块凌晨盘前展望 · Computex+宇树IPO双重催化 今日开幕</h1>\n<p><strong>时间：</strong>2026-06-01 03:07（A股今日休市 · 距离开盘还有约6.5小时）</p>\n\n<div class=\"tagline\">📌 <strong>核心关注：</strong>今日是重磅交易日——<strong>宇树科技科创板IPO上会</strong>（上午）+ <strong>黄仁勋Computex GTC台北主题演讲</strong>（下午）双重催化。A股今日正常开市，科技板块有望在经历上周五大幅回调后迎来反弹窗口。COMEX白银收于75.59美元，小幅回落-0.43%，贵金属整体走势趋于稳定。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.59美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>4,542.4美元/盎司</strong> <span class=\"pill pill-up\">+0.30%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>98.9</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">离岸人民币</div><div class=\"iv\"><strong>6.76</strong> <span class=\"pill pill-up\">升值</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">10Y美债收益率</div><div class=\"iv\"><strong>4.45%</strong> <span class=\"pill pill-down\">-11bp</span></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>COMEX白银最新报75.59美元/盎司，日内微跌-0.43%，延续上周五强力反弹(+3.81%)后的<strong>高位窄幅震荡</strong>格局。美元指数跌至98.9创近期新低，美债收益率大幅下行11bp至4.45%，为白银提供底部支撑。白银当前在75-80美元区间震荡。</p>\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元走弱+美债收益率下行：</strong>美元指数跌至98.9（近期低位），10Y美债收益率-11bp至4.45%，整体流动性环境对贵金属偏友好</li>\n  <li><strong>地缘局势缓和：</strong>美伊和谈稳步推进，油价大幅下跌（布油-11.1%至92.1美元/桶），全球风险偏好显著回升——纳指大涨2.4%、债市大涨</li>\n  <li><strong>美联储政策预期：</strong>新主席沃什正式接任，市场对2026年加息的预期在前两周已充分消化，短期利空出尽</li>\n  <li><strong>工业需求端：</strong>光伏+AI数据中心建设对白银实物需求的中长期逻辑不变，但银价已从1月121美元高点回撤近40%</li>\n  <li><strong>机构观点分化：</strong>美国银行预计Q4冲击100美元但认為是\"昙花一现\"；瑞银将年底目标下调至80美元。市场分歧巨大，波动率处于高位</li>\n</ul>\n<blockquote>💡 白银75-76美元区间短期支撑较强。下方关键支撑72美元，上方压力80美元整数关口。策略上建议观望为主，等待方向确认。</blockquote>\n\n<hr>\n\n<h2>一、大盘前瞻（A股今日开盘展望）</h2>\n<p>A股今日（6月1日 周一）<strong>正常开市交易</strong>，三大指数上周五高开低走全线收跌：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">~4038 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04%💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n</div>\n<p><strong>展望今日：</strong></p>\n<ul>\n  <li><strong>外围利好：</strong>隔夜美股纳指大涨2.4%创新高，费城半导体指数+1%，AI板块热度不减。美债收益率大幅下行、美元走弱对新兴市场（含A股）形成资金利好</li>\n  <li><strong>双催化开启：</strong>今日<strong>上午宇树科技IPO上会</strong>+<strong>下午黄仁勋Computex主题演讲</strong>，是近期最强的催化剂组合拳</li>\n  <li><strong>资金面：</strong>上周五主力资金净流出831亿元，但北向资金成交活跃（4734亿元），外资并未离场。今日关注高切低后资金是否会回流科技板块</li>\n  <li><strong>风险点：</strong>上周五科技板块跌幅较大，今日能否高开走强取决于情绪修复力度。若量能不足则可能延续震荡</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览（周末消息面汇总）</h2>\n<p>本周末AI板块消息面极为密集，四大维度催化集中释放：</p>\n<ul>\n  <li><strong>🔑 Computex 2026今日开幕：</strong>以\"AI Together\"为主题，是史上规模最大的一届（1500+参展商）。<strong>黄仁勋6月1日下午GTC台北专题演讲</strong>预计发布Vera Rubin平台更新。高通/英特尔/ARM CEO相继登台——AI芯片三巨头齐聚</li>\n  <li><strong>🔑 宇树科技IPO上会：</strong>科创板\"人形机器人第一股\"今日上会，拟募资42亿元。若通过将为机器人板块注入强心剂</li>\n  <li><strong>🔑 戴尔AI服务器营收+757%：</strong>戴尔2027财年Q1 AI优化服务器营收161亿美元同比+757%，上调全年AI服务器指引至600亿美元——AI硬件景气度持续验证</li>\n  <li><strong>🔑 Cerebras美股上市：</strong>AI芯片新贵Cerebras上市首日大涨89%市值达750亿美元，验证AI算力赛道的持续热度</li>\n</ul>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">盘前情绪 中性偏乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五电子行业主力净流出372亿元居全行业第一，中芯国际主力净流出31.4亿。但北向资金在科技龙头（中际旭创/宁德时代/天孚通信）上成交依然活跃。今日关注资金回流行情。</p>\n<p class=\"sn\"><strong>政策面：</strong>工信部与国家数据局联合启动\"模数共振\"面向20个重点行业，发改委出台AI落地配套文件。今日下午黄仁勋Computex演讲预计释放重磅产品信息（Vera CPU/Rubin平台），是今日最强催化。</p>\n<p class=\"sn\"><strong>基本面：</strong>戴尔AI服务器营收161亿美元+757%，Cerebras上市首日+89%，海内外AI基建投资同步加码（四大云厂商2026年资本支出7250亿美元+77%）。产业景气度持续超预期。</p>\n<p class=\"sn\"><strong>情绪面：</strong>上周五\"高切低\"后，科技板块情绪处于低位。但隔夜美股纳指大涨2.4%新高+Computex双重催化，今日开盘<strong>有望迎来反弹行情</strong>。关键在于量能能否配合。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">盘前情绪 中性偏乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五存储板块跟随半导体回调，北向资金在澜起科技（沪股通成交42亿）、兆易创新（成交33.86亿）上保持活跃。佰维存储逆势收红+0.94%，成为板块中少有的亮点。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM景气的确定性没有变化——全球DRAM营收2026Q1逼近970亿美元（+260%创历史新高）。三星率先交付首批12层48GB HBM4E样品。HBM在AI芯片成本占比已从52%升至63%。集邦预测2026年HBM需求将再增长70%+。美光警告内存短缺将延续至2026年后。</p>\n<p class=\"sn\"><strong>情绪面：</strong>存储是AI产业链中供需格局最紧张的环节之一，中长期逻辑坚实。短期调整属获利回吐，不影响中期趋势。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">盘前情绪 高度乐观（等待落地）</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五板块整体承压，但聚焦今日：<strong>宇树科技今日上会</strong>是最大看点。若顺利过会，将成为A股\"人形机器人第一股\"，整个板块有望迎来情绪提振。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是人形机器人<strong>规模化验证关键期</strong>。宇树科技已于5月27日预披露上会公告，拟募资42.02亿元。海关数据显示4月工业机器人出口量突破2.5万台（同比+90%）。特斯拉Optimus Gen-3 Q2启动量产，首代目标年产能100万台。</p>\n<p class=\"sn\"><strong>情绪面：</strong>机器人板块当前正处于<strong>\"催化剂真空\"向\"催化剂密集\"切换</strong>的关键窗口——宇树上会+Computex机器人展示双重催化。板块调整后的配置价值显著提升。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">盘前情绪 结构性乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五虽科技板块整体回调，但<strong>通信线缆</strong>方向逆势净流入39.83亿元。亨通光电主力净流入39.76亿居全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。资金对CPO产业链的\"新面孔\"保持高度兴趣。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达明确Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上。台积电COUPE技术加速推进。今日黄仁勋Computex演讲预计涉及CPO/光互连相关技术路线图。LightCounting预测2030年CPO市场规模达100亿美元。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业链逻辑清晰——通信线缆（亨通/长飞/中天）作为新延伸方向获资金追捧。但短期涨幅已较大，注意追高风险。中际旭创一季度营收195亿元（+192%），全年业绩确定性强，调整后仍是核心标的。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（5月29日周五 TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红+估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏预期+618大促</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>资金流向分析：</strong></p>\n<ul>\n  <li>上周五全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>（全行业第一），机械设备、电力设备各超100亿——科技板块全面失血</li>\n  <li>通信线缆是AI板块中<strong>唯一的逆势吸金方向</strong>——CPO产业链高景气驱动</li>\n  <li>电力+公用事业合计净流入约85亿，\"高切低\"特征极其明显</li>\n  <li><strong>今日关注：</strong>在Computex+宇树双重催化下，资金是否会回流AI板块值得密切跟踪</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>宇树科技</strong></td><td>科创板IPO上会</td><td><span class=\"pill pill-up\">📅今日上会</span></td><td>冲刺A股\"人形机器人第一股\"，拟募资42亿元。过会将标志着人形机器人商业化进入资本市场新阶段</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">5/29主力净流入39.76亿</span></td><td>通信线缆龙头，CPO产业链延伸受益，受主力资金集中追捧</td></tr>\n  <tr><td><strong>Cerebras</strong></td><td>美股AI芯片</td><td><span class=\"pill pill-up\">上市首日+89%</span></td><td>AI算力新贵，市值750亿美元，验证AI芯片赛道持续热度</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus量产预期持续发酵并迎来关键催化(宇树上会+Computex)，A股核心受益环节：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，特斯拉验证环节</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，工业自动化延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td>⭐⭐</td></tr>\n</table>\n<p><strong>今日催化：</strong>宇树科技上会结果直接决定机器人板块情绪。若顺利过会，将为人形机器人产业链上市公司打开估值锚定空间。建议关注核心零部件供应商：<strong>三花智控</strong>（执行器）、<strong>绿的谐波</strong>（减速器）确定性最高。</p>\n\n<hr>\n\n<h2>七、今日全球大事日历</h2>\n<table>\n  <tr><th>⏰ 时间</th><th>事件</th><th>重要性</th></tr>\n  <tr><td>上午</td><td><strong>宇树科技科创板IPO上会</strong></td><td>🔴🔴🔴</td></tr>\n  <tr><td>14:00</td><td>高通CEO安蒙 COMPUTEX主题演讲</td><td>🟠🟠</td></tr>\n  <tr><td>下午</td><td><strong>黄仁勋 GTC台北大会主题演讲</strong>（Vera Rubin/CPO等预期）</td><td>🔴🔴🔴</td></tr>\n  <tr><td>全天</td><td>COMPUTEX 2026 正式开幕（\"AI Together\"主题）</td><td>🔴🔴🔴</td></tr>\n  <tr><td>全天</td><td>A股9:30正常开市交易</td><td>🟠🟠</td></tr>\n</table>\n\n<hr>\n\n<h2>八、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 今日定性</div><div class=\"iv\" style=\"font-size:14px\">今日是AI板块<strong>近期最重要的交易日之一</strong>——宇树IPO上会+黄仁勋Computex演讲双重催化。A股在上周五回调后有望借催化剂开启反弹窗口。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 今日关注</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 宇树上会结果</strong>（机器人板块催化剂）<br><strong>2) 黄仁勋演讲内容</strong>（Vera Rubin/CPO量产时间表）<br><strong>3) 量能变化</strong>——能否重回3万亿以上</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">上周五美股纳指大涨<strong>2.4%</strong>再创新高，费城半导体指数+1%。英伟达/微软/亚马逊上涨。AI产业热度仍在，海外市场为A股开盘创造良好外部环境。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银75.59美元附近窄幅震荡。美元走弱+地缘缓和提供支撑，但短期趋势不明朗。75-80美元区间运行，建议观望为主。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">上周五主力资金大额净流出831亿，若今日量能不足，科技股反弹力度可能有限。关注Computex利好兑现后是否\"买预期卖事实\"。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">关注机器人板块（宇树催化）短线机会。算力/光模块龙头调整后是<strong>逢低布局</strong>机会。CPO通信线缆方向短期涨幅较大不宜追高。本周核心策略：<strong>催化驱动为主，量能为辅</strong>。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-0407", "date": "2026-06-01 04:07", "title": "AI板块盘前速览 · 白银75美元震荡 聚焦Computex/宇树IPO双催化", "tags": ["盘前分析", "白银", "Computex", "宇树科技", "CPO", "人形机器人", "高切低"], "summary": "A股未开盘，盘前聚焦今日宇树科技上会和明日Computex大会双催化。COMEX白银75.27美元窄幅震荡。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">75.27</div><div class=\"lbs\">COMEX白银(美元)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.43%</div><div class=\"lbs\">白银日内</div></div>\n  <div class=\"metric-box\"><div class=\"num\">6/2-6/5</div><div class=\"lbs\">Computex大会</div></div>\n  <div class=\"metric-box\"><div class=\"num\">6/1</div><div class=\"lbs\">宇树科技上会</div></div>\n</div>\n\n<h1>AI板块盘前速览 · 白银震荡 聚焦Computex/宇树IPO</h1>\n<p><strong>时间：</strong>2026-06-01 04:07（A股今日未开盘 · 盘前分析）</p>\n\n<div class=\"tagline\">📌 <strong>盘前核心焦点：</strong>当前为A股非交易时段（凌晨4时）。本周<strong>两大核心事件</strong>将主导AI板块走势：1) 宇树科技科创板IPO今日（6/1）上会；2) Computex 2026大会明日（6/2-6/5）开幕。COMEX白银期货在75美元附近震荡，市场静待本周多项催化剂释放。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货(SI)</div><div class=\"iv\"><strong>75.27美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">伦敦现货白银</div><div class=\"iv\"><strong>75.2美元/盎司</strong> <span class=\"pill pill-down\">微跌</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力(T+D)</div><div class=\"iv\"><strong>约18,280元/千克</strong> <span class=\"pill pill-mid\">窄幅震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.02</strong> <span class=\"pill pill-up\">小幅反弹 +0.04%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>4,544美元/盎司</strong> <span class=\"pill pill-up\">+0.02%</span></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>COMEX白银期货经历1月121美元/盎司历史高点后大幅回调，目前处于<strong>72-80美元宽幅震荡区间</strong>。5月29日从74.8美元低位反弹+3.81%至76.08美元后，目前回落至75.27美元附近，短线呈现<strong>低位震荡筑底</strong>特征。</p>\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元指数99附近徘徊：</strong>美元走弱趋势为贵金属提供底部支撑，但美联储加息预期反复（市场对年内加息预期升温）限制反弹空间</li>\n  <li><strong>通胀数据：</strong>美国4月PCE物价指数同比+3.8%创三年新高，通胀粘性强化市场对贵金属的配置需求</li>\n  <li><strong>供给缺口大幅收窄：</strong>瑞银数据显示2026年全球白银供给缺口从此前预期的3亿盎司骤降至6000-7000万盎司，供需基本面边际趋松</li>\n  <li><strong>工业需求逻辑仍在：</strong>光伏装机（2026年中国目标140GW）和AI数据中心建设对白银的工业需求保持高位，但短期支撑力度减弱</li>\n  <li><strong>美银与瑞银分歧：</strong>美银预计Q4银价冲击100美元，但瑞银将年底目标下调至80美元——<strong>机构分歧巨大</strong>，波动率系统性放大</li>\n</ul>\n<blockquote>💡 白银短线支撑看72-74美元区间，上方压力80美元整数关口。波动率处于高位（5月单日曾跌超9%），<strong>仓位管理至关重要</strong>。</blockquote>\n\n<hr>\n\n<h2>一、AI板块整体市场概览</h2>\n<p><strong>【A股今日未开盘 · 盘前分析】</strong></p>\n<p>A股上周五（5月29日）上演<strong>\"高切低\"全面切换</strong>——科技板块全面退潮，科创50暴跌5.04%，人工智能指数收跌3.06%。电力、公用事业、消费等防御板块逆势吸金。主力资金单日净流出831亿元。</p>\n<p><strong>本周AI板块两大核心催化：</strong></p>\n<ul>\n  <li><strong>今日（6/1）：宇树科技科创板IPO上会</strong>——冲刺A股\"人形机器人第一股\"，拟募资42.02亿元</li>\n  <li><strong>明日（6/2-6/5）：Computex 2026台北电脑展</strong>——以\"AI Together\"为主题，全球AI算力巨头集体发布最新产品</li>\n</ul>\n<p>上周五的科技调整更多是<strong>交易层面的筹码消化</strong>，产业基本面（AI基建资本支出高增长、HBM/光模块供不应求）未变。本周两大事件有望重新点燃AI板块做多情绪。</p>\n\n<hr>\n\n<h2>二、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">情绪 等待催化</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五电子行业主力净流出372亿元居全行业第一，算力板块整体承压。但Cerebras在美上市首日大涨89%（市值750亿美元），显示全球资本对AI算力赛道仍高度认可。</p>\n<p class=\"sn\"><strong>政策面：</strong>本周<strong>Computex 2026大会</strong>（6/2-6/5）是最强催化。英伟达预计将展示Vera Rubin架构最新进展（2026下半年问世），AMD、英特尔、台积电等同步发布新品。此外，华为昇腾950系列（2026Q1已上市）和Atlas 950超节点（8192卡规模，FP8算力8EFlops）持续推进国产算力替代。</p>\n<p class=\"sn\"><strong>基本面：</strong>全球AI基建投资持续加码——四大云厂商（谷歌/微软/Meta/亚马逊）2026年资本支出合计达7250亿美元（同比+77%）。戴尔AI服务器营收161亿美元同比+757%。国产AI芯片龙头进入业绩兑现期，寒武纪、盛科通信等受益于国产替代加速。</p>\n<p class=\"sn\"><strong>情绪面：</strong>上周五市场情绪急转谨慎，但美股AI板块同期走强（纳指六连涨创新高），情绪传导存在时差。本周Computex若释放超预期信号，A股算力板块有望止跌反弹。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪 中性偏积极</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五存储板块跟随半导体整体回调，但北向资金在澜起科技（沪股通成交42亿）、兆易创新（33.86亿）等存储龙头上交投依然活跃，显示外资关注度不减。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>HBM景气度持续超预期</strong>——HBM3E现货价半年暴涨超300%，三星率先交付首批12层48GB HBM4E样品。全球DRAM营收2026Q1逼近970亿美元（同比+260%），创历史新高。集邦预测2026年HBM需求再增70%+。美光警告内存短缺将持续至2026年后。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强劲，但股价前期涨幅已充分反映涨价预期，获利资金有兑现需求。中长期来看，HBM仍是AI产业链中<strong>供需格局最紧张</strong>的环节，回调后仍是优质配置窗口。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">情绪 今日最强催化</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五机器人板块随大市整体回调，但执行器、传感器方向资金承接力度尚可。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>今日最大看点：宇树科技科创板IPO上会</strong>！宇树科技冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。海关数据显示2026年4月工业机器人出口量突破2.5万台（同比+90%）。2026年是人形机器人<strong>规模化验证关键期</strong>——中信建投预计2026年实现数万台至10万台量产。特斯拉Optimus Gen-3量产持续推进。</p>\n<p class=\"sn\"><strong>情绪面：</strong>如果宇树科技今日顺利过会，将极大提振机器人板块情绪。核心受益标的三花智控（执行器）、绿的谐波（减速器）、汇川技术（伺服电机）等有望率先受益。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">情绪 结构性乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五通信线缆及配套板块逆势净流入<strong>39.83亿元</strong>，是AI板块中唯一的逆势吸金方向。亨通光电主力净流入<strong>39.76亿</strong>居全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。光模块龙头中际旭创（成交225亿A股第一）高位震荡。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年被机构定义为<strong>CPO产业化元年</strong>——英伟达2026年Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上（此前1万台）。台积电COUPE封装技术加速推进。中际旭创2026年一季度营收194.96亿元（+192%），净利润57.35亿元（+262%）。LightCounting预测2030年CPO市场规模达100亿美元。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正在CPO产业链中寻找\"新面孔\"——通信线缆方向（亨通光电、长飞光纤）获得集中配置。本周Computex大会上CPO相关技术展示值得关注。</p>\n</div>\n\n<hr>\n\n<h2>三、主流净流入板块监控（上周五回顾）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红，估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿，外资回流</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>资金流向分析：</strong></p>\n<ul>\n  <li>上周五全市场主力净流出<strong>831.55亿元</strong>，连续多日大幅净流出</li>\n  <li><strong>电子行业</strong>主力净流出<strong>372.05亿</strong>居全行业第一（占全部净流出的44.7%），是今日最大失血板块</li>\n  <li><strong>防御三剑客</strong>（电力+公用事业+火电）合计净流入约110亿，资金从科技全面撤退至低估值高股息方向</li>\n  <li><strong>通信线缆</strong>是AI板块中唯一的逆势吸金方向（+39.83亿），说明CPO产业链的资金逻辑仍被认可</li>\n  <li><strong>AI板块（电子+计算机+通信）合计净流出超400亿</strong>，相对热度降至冰点——但<strong>极端情绪往往是转折的前夜</strong></li>\n</ul>\n\n<hr>\n\n<h2>四、关键异动个股（近期回顾）</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">上周五主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念延伸，资金持续追捧。本周有望受益于Computex催化延续强势</td></tr>\n  <tr><td><strong>宇树科技</strong></td><td>IPO上会</td><td><span class=\"pill pill-up\">今日上会审核</span></td><td>人形机器人第一股，拟募资42.02亿元。若顺利过会，将打开A股机器人板块估值天花板</td></tr>\n  <tr><td><strong>中际旭创</strong></td><td>300308</td><td><span class=\"pill pill-mid\">成交225亿A股第一</span></td><td>光模块绝对龙头，1.6T光模块商业化元年核心受益。上周五高位震荡，本周Computex为重要催化剂</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>HK.0992</td><td><span class=\"pill pill-up\">上周五港股暴涨22.46%</span></td><td>财报超预期，AI服务器业务成核心增长引擎，验证全球AI硬件景气度持续高企</td></tr>\n</table>\n\n<hr>\n\n<h2>五、本周展望与策略</h2>\n\n<h3>核心事件日历</h3>\n<table>\n  <tr><th>日期</th><th>事件</th><th>影响方向</th><th>关注度</th></tr>\n  <tr><td><strong>6/1（今日）</strong></td><td>宇树科技科创板IPO上会</td><td>机器人板块</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>6/2-6/5</strong></td><td>Computex 2026台北电脑展</td><td>AI全产业链</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>本周</strong></td><td>美国5月非农数据</td><td>全球宏观/贵金属</td><td>⭐⭐</td></tr>\n  <tr><td><strong>本周</strong></td><td>美联储官员讲话</td><td>利率预期/美元</td><td>⭐⭐</td></tr>\n</table>\n\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 本周判断</div><div class=\"iv\" style=\"font-size:14px\">A股今日未开盘。上周五科技\"高切低\"调整后，本周Computex和宇树IPO有望成为<strong>AI板块反弹催化剂</strong>。但主力资金连续多日净流出的惯性需要打破，周初需观察成交量恢复情况。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 Computex看点</div><div class=\"iv\" style=\"font-size:14px\"><strong>1)</strong> 英伟达Vera Rubin架构最新进展<br><strong>2)</strong> 华为昇腾/国产算力方案展示<br><strong>3)</strong> CPO量产时间表更新<br><strong>4)</strong> 机器人/端侧AI新品发布</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">美股周五纳指连涨创新高，AI指数走强，费城半导体+1%。英伟达/博通/AMD走势良好，博通ASIC定制芯片业务快速增长（AI半导体收入同比+106%）。AI产业热度仍在，A股调整更多是<strong>阶段性资金博弈</strong>。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银75.27美元，处于72-80美元宽幅震荡区间。本周关注美国5月非农数据和美联储表态。短线支撑72美元，阻力80美元。美银/瑞银对年底目标价分歧巨大（100 vs 80美元），波动率仍将维持高位。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续大额净流出惯性尚未打破。若Computex/宇树IPO催化低于预期，AI板块调整时间或延长。油价高位+海外流动性紧缩预期升温构成双重压力。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>守核心（算力/光模块龙头）</strong> + <strong>探新方向（CPO通信线缆/人形机器人零部件）</strong>。本周两大催化事件若配合，建议利用盘中低点逐步加仓。若催化不及预期，则控制仓位等待更好的配置时机。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260601-0507", "date": "2026-06-01 05:07", "title": "AI板块早间速报 · COMPUTEX开幕在即 宇树科技今日IPO上会 戴尔AI营收暴增757%", "tags": ["早间速报", "盘前复盘", "白银震荡", "COMPUTEX", "宇树IPO", "戴尔财报", "算力"], "summary": "A股盘前休市。上周五科技回调科创50暴跌5%，周末戴尔AI营收+757%暴升35%，宇树科技今日IPO上会，COMPUTEX明日开幕。", "html": "\\n<div class=\\\"metric-row\\\">\\n  <div class=\\\"metric-box\\\"><div class=\\\"num\\\">--</div><div class=\\\"lbs\\\">A股尚未开盘</div></div>\\n  <div class=\\\"metric-box\\\"><div class=\\\"num\\\">75.25</div><div class=\\\"lbs\\\">COMEX银($)</div></div>\\n  <div class=\\\"metric-box\\\"><div class=\\\"num\\\">75.64</div><div class=\\\"lbs\\\">现货银($)</div></div>\\n  <div class=\\\"metric-box\\\"><div class=\\\"num\\\">6/1</div><div class=\\\"lbs\\\">宇树IPO上会日</div></div>\\n</div>\\n\\n<h1>AI板块早间速报 · COMPUTEX开幕在即 宇树科技今日IPO上会</h1>\\n<p><strong>时间：</strong>2026-06-01 05:07（北京时间·A股盘前时段·距离开盘还有约4.5小时）</p>\\n\\n<div class=\\\"tagline\\\">📌 <strong>核心基调：</strong>当前A股处于<strong>盘前休市时段</strong>（今日6月1日周一9:30开盘）。上周五（5/29）A股科技板块全面回调科创50暴跌5.04%，但周末重磅利好密集——<strong>戴尔AI服务器营收+757%暴升35%</strong>、<strong>宇树科技今日IPO上会</strong>、<strong>COMPUTEX 2026明日开幕</strong>。A股AI板块今日有望迎来<strong>情绪修复</strong>。COMEX白银期货周末在75.25美元附近窄幅震荡。</div>\\n\\n<hr>\\n\\n<h2>📊 零、COMEX白银期货播报</h2>\\n<div class=\\\"info-grid\\\">\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">COMEX白银期货</div><div class=\\\"iv\\\"><strong>75.25 美元/盎司</strong> <span class=\\\"pill pill-mid\\\">周末休市·窄幅震荡</span></div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">现货白银(伦敦)</div><div class=\\\"iv\\\"><strong>75.64 美元/盎司</strong> <span class=\\\"pill pill-mid\\\">区间整理</span></div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">国内白银T+D</div><div class=\\\"iv\\\"><strong>18,284 元/千克</strong> <span class=\\\"pill pill-mid\\\">周五收盘价</span></div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">美元指数</div><div class=\\\"iv\\\"><strong>99.02-99.33</strong> <span class=\\\"pill pill-down\\\">近期走弱</span></div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">工行纸白银</div><div class=\\\"iv\\\"><strong>16.44 元/克</strong> <span class=\\\"pill pill-mid\\\">中间价</span></div></div>\\n</div>\\n\\n<p><strong>近期趋势判断：</strong>白银在5月经历了剧烈波动——月初从70美元启动七连涨至82美元（5月7日），随后冲高至近90美元（5月13日），因美国CPI超预期单日暴跌超9%至73美元（5月18日），5月25日拉升至78美元上方后回落。当前在<strong>75-76美元区间窄幅震荡</strong>，整体处于<strong>宽幅区间筑底</strong>阶段。白银自1月29日创下121美元历史高点后，已回落约38%。</p>\\n\\n<p><strong>驱动因素简析：</strong></p>\\n<ul>\\n  <li><strong>美元走弱提供支撑：</strong>美元指数持续回落至99附近，对贵金属整体形成底部支撑</li>\\n  <li><strong>美伊局势：</strong>特朗普称即将对伊朗战事做出最终决定，中东地缘不确定性维持高位，贵金属避险情绪不减</li>\\n  <li><strong>通胀粘性压制降息预期：</strong>美国4月PCE同比+3.8%创三年新高，市场定价美联储年底前加息概率约55%，降息预期持续推后压制银价上行空间</li>\\n  <li><strong>工业需求韧性：</strong>光伏+AI数据中心建设对白银工业需求维持高位，2026年全球白银供应缺口预计扩大至4630万盎司左右</li>\\n  <li><strong>投机情绪降温：</strong>CFTC数据显示COMEX白银投机净多头持仓减少至10,244手，短线资金看涨情绪降温</li>\\n</ul>\\n<blockquote>💡 白银当前处于72-80美元宽幅震荡区间。短线支撑72美元（前低），上方压力80美元整数关口。下周关注美国非农数据（6月5日）对美元和降息预期的扰动。波动剧烈，注意仓位管理。</blockquote>\\n\\n<hr>\\n\\n<h2>一、大盘解读（上周五5/29回顾）</h2>\\n<p>A股上周五（5月29日）三大指数高开低走全线收跌，<strong>科创50暴跌5.04%领跌全场</strong>：</p>\\n<div class=\\\"info-grid\\\">\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">上证指数</div><div class=\\\"iv\\\">4068.57 <span class=\\\"pill pill-down\\\">-0.73%</span></div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">深证成指</div><div class=\\\"iv\\\">15575.13 <span class=\\\"pill pill-down\\\">-1.81%</span></div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">创业板指</div><div class=\\\"iv\\\">4037.95 <span class=\\\"pill pill-down\\\">-2.11%</span></div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">科创50</div><div class=\\\"iv\\\">1751.32 <span class=\\\"pill pill-down\\\">-5.04% 💥</span></div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">两市成交</div><div class=\\\"iv\\\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\\n</div>\\n<p>全市场仅<strong>1565只上涨</strong>，3867只下跌。主力资金净流出<strong>831.55亿元</strong>。北向资金成交4734亿元（占两市14.26%），宁德时代/中际旭创/天孚通信为深股通成交前三。</p>\\n<p><strong>盘面特征：</strong>食品饮料(+3.02%)、煤炭(+2.13%)、公用事业(+2%+)领涨；综合(-5.39%)、国防军工(-4.23%)、电子(-4%+)领跌。资金从科技向防御方向<strong>系统性迁徙</strong>。</p>\\n\\n<hr>\\n\\n<h2>二、AI板块整体市场概览</h2>\\n<p>上周五AI板块<strong>全面回调</strong>，人工智能指数收跌<strong>3.06%</strong>，成交额5398亿元。两日\\\"冰火两重天\\\"行情（周四创业板首超沪指/\\\"易中天\\\"创新高 vs 周五科创50暴跌5%）说明市场情绪极度敏感。</p>\\n<p><strong>但周末重磅利好密集发酵，今日盘面有望修复：</strong></p>\\n<ul>\\n  <li><strong>戴尔财报爆表：</strong>Q1 AI服务器营收161亿美元同比+757%，上调全年AI营收预期至600亿美元，盘后飙升35%创历史新高</li>\\n  <li><strong>宇树科技今日IPO上会：</strong>冲刺A股\\\"人形机器人第一股\\\"，66天闪电推进创纪录</li>\\n  <li><strong>COMPUTEX 2026明日开幕：</strong>英伟达黄仁勋发表主题演讲（预计发布Vera Rubin架构新细节）</li>\\n  <li><strong>美股AI全线大涨：</strong>纳指七连涨创新高，高通+6%、ARM+5%再创历史新高</li>\\n  <li><strong>产业基本面不变：</strong>四大云厂商2026年资本支出7250亿美元(+77%)，AI算力景气度仍在加速</li>\\n</ul>\\n\\n<hr>\\n\\n<h2>三、细分领域动态</h2>\\n\\n<div class=\\\"sect-card\\\">\\n<div class=\\\"sh\\\">🔷 算力板块 <span class=\\\"pill pill-mid\\\">上周回调 · 今日有望高开</span></div>\\n<p class=\\\"sn\\\"><strong>资金面（上周五）：</strong>电子行业主力净流出372亿元居全行业第一。中芯国际主力净流出31.4亿居全市场第一。算力ETF全线下跌。</p>\\n<p class=\\\"sn\\\"><strong>政策面：</strong>明天（6/2）<strong>COMPUTEX 2026</strong>以\\\"AI Together\\\"为主题开幕，英伟达黄仁勋预计发布Vera Rubin相关架构。工信部《人工智能关键基础技术 具身智能基准测试方法》6月1日正式实施。北京AI企业超2500家，核心产业规模约4500亿元。</p>\\n<p class=\\\"sn\\\"><strong>基本面：</strong><strong>戴尔AI服务器营收161亿美元+757%</strong>——这是全球AI基建投资加速的最强确认信号。Cerebras上市首日+89%。四大云厂商2026年资本支出7250亿美元(+77%)。华为推出星河AI数据中心网络方案，NPU直通存储带宽提升8倍。AI产业基本面持续超预期。</p>\\n<p class=\\\"sn\\\"><strong>情绪面：</strong>上周五大幅回落后，戴尔财报+35%和美股AI大涨有望带动今日A股算力板块<strong>高开修复</strong>。市场关注Computex大会进一步催化。</p>\\n</div>\\n\\n<div class=\\\"sect-card\\\">\\n<div class=\\\"sh\\\">🔷 存储板块 <span class=\\\"pill pill-up\\\">产业最强景气环节</span></div>\\n<p class=\\\"sn\\\"><strong>资金面（上周五）：</strong>北向在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），方向偏流出。佰维存储逆势上涨0.94%。</p>\\n<p class=\\\"sn\\\"><strong>政策面：</strong>瑞银最新报告：全面上调存储需求预测，预计DRAM供不应求持续至<strong>2028年Q2</strong>，NAND供不应求至2027年Q4。AI从训练→推理→智能体时代，存储需求正从HBM扩散至DDR5、LPDDR5、SSD及NAND Flash等全品类。</p>\\n<p class=\\\"sn\\\"><strong>基本面（全线超预期）：</strong>全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（环比+80%，同比+260%），创历史新高。<strong>HBM3E现货价半年暴涨超300%</strong>。三星率先交付首批12层48GB HBM4E样品。HBM在AI芯片成本占比已从52%升至63%。集邦预测2026年HBM需求再增70%+。美光新加坡HBM先进封装工厂动工（长期投资70亿美元）。</p>\\n<p class=\\\"sn\\\"><strong>情绪面：</strong>产业数据极为亮眼，但A股股价已部分反映涨价预期。存储是AI产业链中<strong>供需格局最紧张</strong>的环节，中长期确定性极高。</p>\\n</div>\\n\\n<div class=\\\"sect-card\\\">\\n<div class=\\\"sh\\\">🔷 机器人板块 <span class=\\\"pill pill-up\\\">今日最强催化——宇树IPO上会</span></div>\\n<p class=\\\"sn\\\"><strong>资金面（上周五）：</strong>板块延续回调，高位票抛压消化中。成交缩量暗示抛压在缓和。</p>\\n<p class=\\\"sn\\\"><strong>基本面：</strong>产业趋势加速——<strong>宇树科技科创板IPO今日（6/1）上会</strong>，从3月20日受理到上会仅66天，速度罕见。发行前创始人王兴兴直接+间接合计控制33.36%股份。宇树2025年实现营收16.99亿元，人形机器人销量超5600台占全球32.4%位居第一。4月工业机器人出口突破2.5万台（同比+90%）。全球人形机器人格局中美日三足鼎立，中国凭借供应链优势主导出货，占全球84.71%。</p>\\n<p class=\\\"sn\\\"><strong>情绪面：</strong>今日宇树IPO上会是板块<strong>最核心的催化剂</strong>。若顺利过会将为A股注入\\\"人形机器人第一股\\\"，标志行业从概念期迈向产业化兑现阶段。</p>\\n</div>\\n\\n<div class=\\\"sect-card\\\">\\n<div class=\\\"sh\\\">🔷 CPO板块 <span class=\\\"pill pill-up\\\">通信线缆方向逆势吸金</span></div>\\n<p class=\\\"sn\\\"><strong>资金面（上周五）：</strong>光模块龙头中际旭创高位震荡（成交225亿A股第一），但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>全市场第一，剑桥科技+11.73亿、长飞光纤+10.39亿。</p>\\n<p class=\\\"sn\\\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达明确Q4启动CPO量产。鸿海CPO全光交换机出货目标从此前1万台上调至2026-2027年超5万台。LightCounting预测2030年CPO市场达100亿美元。中际旭创Q1营收195亿(+192%)净利57亿(+262%)。</p>\\n<p class=\\\"sn\\\"><strong>情绪面：</strong>资金正在寻找CPO产业链\\\"新面孔\\\"——通信线缆方向获集中配置。但斌转发CPO视频引发关注。光模块龙头短期调整属获利回吐，产业逻辑不变。Computex大会可能发布CPO最新进展。</p>\\n</div>\\n\\n<hr>\\n\\n<h2>四、主流净流入板块监控（上周五5/29 TOP8）</h2>\\n<table>\\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\\\"green\\\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\\\"pill pill-mid\\\">防御配置</span></td></tr>\\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\\\"green\\\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\\\"pill pill-mid\\\">防御配置</span></td></tr>\\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\\\"green\\\">+39.83</span></td><td>CPO/算力互联概念延伸（新方向）</td><td><span class=\\\"pill pill-up\\\">产业驱动</span></td></tr>\\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\\\"green\\\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\\\"pill pill-up\\\">业绩驱动</span></td></tr>\\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\\\"green\\\">+24.79</span></td><td>防御+高分红，估值洼地</td><td><span class=\\\"pill pill-mid\\\">防御配置</span></td></tr>\\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\\\"green\\\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\\\"pill pill-mid\\\">防御配置</span></td></tr>\\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\\\"green\\\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\\\"pill pill-mid\\\">事件驱动</span></td></tr>\\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\\\"green\\\">+18.43</span></td><td>茅台净流入9.19亿</td><td><span class=\\\"pill pill-mid\\\">防御配置</span></td></tr>\\n</table>\\n\\n<p><strong>资金流向核心发现：</strong></p>\\n<ul>\\n  <li>全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>居全行业第一（失血最大）</li>\\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金从科技全面撤退至防御方向</li>\\n  <li><strong>通信线缆</strong>是AI板块中<strong>唯一逆势吸金方向</strong>——亨通光电全市场净流入第一</li>\\n  <li>AI板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至冰点</li>\\n  <li><strong>对比隔夜美股：</strong>美股AI全线大涨纳指七连涨创新高，A股和美股的阶段性背离或在本周修复</li>\\n</ul>\\n\\n<hr>\\n\\n<h2>五、关键异动个股</h2>\\n<table>\\n  <tr><th>个股</th><th>市场</th><th>异动</th><th>逻辑</th></tr>\\n  <tr><td><strong>戴尔科技 (DELL)</strong></td><td>NYSE</td><td><span class=\\\"pill pill-up\\\">盘后飙升+35%<br>创历史新高</span></td><td>Q1 AI服务器营收161亿美元+757%，上调全年AI营收至600亿美元。全球AI硬件最强业绩验证。</td></tr>\\n  <tr><td><strong>亨通光电 (600487)</strong></td><td>A股</td><td><span class=\\\"pill pill-up\\\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联新方向，资金集中追捧</td></tr>\\n  <tr><td><strong>中芯国际 (688981)</strong></td><td>A股</td><td><span class=\\\"pill pill-down\\\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐，昨日创新高后大幅回调</td></tr>\\n  <tr><td><strong>宇树科技</strong></td><td>科创板</td><td><span class=\\\"pill pill-up\\\">今日IPO上会</span></td><td>A股\\\"人形机器人第一股\\\"，66天闪电上会</td></tr>\\n</table>\\n\\n<hr>\\n\\n<h2>六、主力资金增仓TOP10个股（上周五）</h2>\\n<table>\\n  <tr><th>#</th><th>个股</th><th>净流入(亿)</th><th>板块</th></tr>\\n  <tr><td><strong>1</strong></td><td>亨通光电</td><td><span class=\\\"green\\\">39.76</span></td><td>通信线缆/CPO</td></tr>\\n  <tr><td><strong>2</strong></td><td>长芯博创</td><td><span class=\\\"green\\\">13.31</span></td><td>光通信</td></tr>\\n  <tr><td><strong>3</strong></td><td>兴森科技</td><td><span class=\\\"green\\\">12.46</span></td><td>PCB/AI服务器</td></tr>\\n  <tr><td><strong>4</strong></td><td>剑桥科技</td><td><span class=\\\"green\\\">11.73</span></td><td>光模块/通信</td></tr>\\n  <tr><td><strong>5</strong></td><td>宁德时代</td><td><span class=\\\"green\\\">10.48</span></td><td>新能源</td></tr>\\n  <tr><td><strong>6</strong></td><td>长飞光纤</td><td><span class=\\\"green\\\">10.39</span></td><td>光纤光缆/CPO</td></tr>\\n  <tr><td><strong>7</strong></td><td>中国中免</td><td><span class=\\\"green\\\">9.87</span></td><td>消费</td></tr>\\n  <tr><td><strong>8</strong></td><td>中天科技</td><td><span class=\\\"green\\\">9.35</span></td><td>通信线缆</td></tr>\\n  <tr><td><strong>9</strong></td><td>贵州茅台</td><td><span class=\\\"green\\\">9.19</span></td><td>白酒</td></tr>\\n  <tr><td><strong>10</strong></td><td>华能蒙电</td><td><span class=\\\"green\\\">8.42</span></td><td>电力</td></tr>\\n</table>\\n<p><strong>观察：</strong>通信线缆/光通信方向占据TOP10中4席（亨通/长芯博创/剑桥/长飞），CPO产业链延伸方向是上周五全市场唯一获集中配置的AI相关方向。</p>\\n\\n<hr>\\n\\n<h2>七、特斯拉机器人概念股解析</h2>\\n<p>特斯拉Optimus Gen-3已下线投入内部测试，Q2启动量产，首代目标年产能100万台。今日宇树科技IPO上会进一步强化板块关注度。A股核心受益标的：</p>\\n<table>\\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th><th>估值水位</th></tr>\\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证</td><td>⭐⭐⭐</td><td><span class=\\\"pill pill-mid\\\">中位</span></td></tr>\\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心</td><td>⭐⭐⭐</td><td><span class=\\\"pill pill-mid\\\">中位</span></td></tr>\\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td><td><span class=\\\"pill pill-up\\\">偏低</span></td></tr>\\n  <tr><td><strong>伺服电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，延伸至机器人</td><td>⭐⭐</td><td><span class=\\\"pill pill-up\\\">偏低</span></td></tr>\\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件</td><td>⭐⭐</td><td><span class=\\\"pill pill-mid\\\">中位</span></td></tr>\\n  <tr><td><strong>灵巧手电机</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机，灵巧手核心驱动</td><td>⭐⭐</td><td><span class=\\\"pill pill-up\\\">偏低</span></td></tr>\\n</table>\\n<p><strong>近期催化：</strong>宇树科技6月1日IPO上会（今日）、小鹏机器人Q3亮相年底量产、Figure 03开启全天候包裹分拣直播。2026年是人形机器人<strong>从0到1量产兑现阶段</strong>，适合<strong>逢低布局</strong>。</p>\\n\\n<hr>\\n\\n<h2>八、本周关键事件日历</h2>\\n<table>\\n  <tr><th>日期</th><th>事件</th><th>影响板块</th><th>重要等级</th></tr>\\n  <tr><td><strong>周一 6/1</strong></td><td>📌 宇树科技IPO上会</td><td>机器人/人形机器人</td><td><span class=\\\"pill pill-up\\\">⭐⭐⭐</span></td></tr>\\n  <tr><td><strong>周一 6/1</strong></td><td>华为nova16系列发布会</td><td>消费电子/半导体</td><td><span class=\\\"pill pill-mid\\\">⭐⭐</span></td></tr>\\n  <tr><td><strong>周二 6/2</strong></td><td>📌 COMPUTEX 2026开幕<br>黄仁勋主题演讲</td><td>算力/CPO/半导体</td><td><span class=\\\"pill pill-up\\\">⭐⭐⭐</span></td></tr>\\n  <tr><td><strong>周三 6/3</strong></td><td>AMD主题演讲<br>华为智能光伏战略发布会</td><td>算力/光伏</td><td><span class=\\\"pill pill-mid\\\">⭐⭐</span></td></tr>\\n  <tr><td><strong>周四 6/4</strong></td><td>英特尔/高通演讲</td><td>算力/AI PC</td><td><span class=\\\"pill pill-mid\\\">⭐⭐</span></td></tr>\\n  <tr><td><strong>周五 6/5</strong></td><td>📌 美国5月非农就业数据</td><td>贵金属/汇率/全球风险偏好</td><td><span class=\\\"pill pill-up\\\">⭐⭐⭐</span></td></tr>\\n</table>\\n\\n<hr>\\n\\n<h2>九、总结与展望</h2>\\n<div class=\\\"info-grid\\\">\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">📌 当前状态</div><div class=\\\"iv\\\" style=\\\"font-size:14px\\\">A股盘前休市中（距离开盘约4.5h）。上周五科技全线回调科创50-5.04%，但隔夜美股AI全线大涨纳指七连涨创新高，戴尔AI营收+757%暴升35%。</div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">💡 今日推演</div><div class=\\\"iv\\\" style=\\\"font-size:14px\\\">受<strong>戴尔财报+35%</strong>和美股AI全面大涨提振，A股AI板块今日有望<strong>高开修复</strong>。关键看成交量——若高开后量能放大则有望企稳反弹，缩量则需警惕继续消化压力。通信线缆方向（亨通光电）可能延续强势。</div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">👀 本周关键</div><div class=\\\"iv\\\" style=\\\"font-size:14px\\\"><strong>1)</strong> 宇树科技IPO上会结果（今日最强催化）<br><strong>2)</strong> COMPUTEX 2026大会（英伟达/AMD/英特尔新品发布）<br><strong>3)</strong> 美国5月非农数据（6/5）影响美联储预期</div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">💡 白银展望</div><div class=\\\"iv\\\" style=\\\"font-size:14px\\\">COMEX白银72-80美元区间震荡筑底。美元走弱提供支撑，但通胀粘性压制降息预期。关注非农数据对贵金属的短期扰动。</div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">⚠️ 风险提示</div><div class=\\\"iv\\\" style=\\\"font-size:14px;color:#f59e0b\\\">主力资金连续多日大额净流出。若今日高开但成交量不足，需警惕\\\"高开低走\\\"。仓位管理第一。</div></div>\\n  <div class=\\\"info-item\\\"><div class=\\\"il\\\">🧭 策略建议</div><div class=\\\"iv\\\" style=\\\"font-size:14px\\\"><strong>1)</strong> 关注戴尔财报对A股AI服务器/算力产业链传导<br><strong>2)</strong> 逢低布局算力/光模块龙头，等待Computex催化<br><strong>3)</strong> 关注CPO通信线缆方向新机会（亨通/长飞/剑桥）<br><strong>4)</strong> 宇树上会结果决定机器人板块方向</div></div>\\n</div>\\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>\\n"}, {"id": "mon-20260601-0607", "date": "2026-06-01 06:00", "title": "AI板块早间速报 · COMPUTEX开幕在即 黄仁勋演讲成焦点 白银震荡企稳", "tags": ["早间速报", "COMPUTEX", "英伟达Rubin", "白银", "具身智能标准"], "summary": "英伟达Rubin机架构发布在即，三星HBM4E样品交付，工信部具身智能评测标准6月1日正式实施。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">💤</div><div class=\"lbs\">A股休市中</div></div>\n  <div class=\"metric-box\"><div class=\"num\">💎</div><div class=\"lbs\">白银 $75.2</div></div>\n  <div class=\"metric-box\"><div class=\"num\">🔥</div><div class=\"lbs\">COMPUTEX</div></div>\n</div>\n\n<h1>AI板块早间速报 · 非交易时段</h1>\n<p><strong>时间：</strong>2026-06-01 06:00（北京时间）</p>\n<p><strong>状态：</strong>⚪ A股上一交易日（5月29日周五）已收盘，本日为6月第一个交易日，A股将于9:30开盘。当前为盘前消息梳理时段。</p>\n\n<div class=\"tagline\">📌 <strong>今日最大看点：</strong>台北国际电脑展（COMPUTEX 2026）将于6月2日-5日举行，英伟达CEO黄仁勋今日上午11点发表主题演讲，预计发布新一代Rubin机架架构，市场聚焦散热方式（液冷）、GPU互联（CPO）及供应链最新指引。</div>\n\n<hr>\n\n<h2>零、COMEX白银期货播报</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🥈 白银 <span class=\"pill pill-mid\">$75.2/oz</span> <span class=\"pill pill-mid\">震荡企稳</span></div>\n<p class=sn><strong>最新价格：</strong>COMEX白银期货主力合约报 <strong>$75.2美元/盎司</strong>，现货白银交投于 <strong>$75.2-$75.6</strong> 区间。国内白银T+D约 <strong>18,280元/千克</strong>。</p>\n<p class=sn><strong>日内涨跌幅：</strong>窄幅波动，跌幅约 <strong>-0.1%~-0.5%</strong> 区间盘整。周五（5月29日）收于 $75.58，日内振幅收窄。</p>\n<p class=sn><strong>近期趋势：</strong>白银自1月历史高点（$121/oz）大幅回撤约 <strong>38%</strong>，当前处于 <strong>$72-$77</strong> 区间震荡整理阶段。5月28日一度跌至$72.90美元创三周新低，随后小幅反弹。</p>\n<p class=sn><strong>驱动因素：</strong></p>\n<ul>\n<li>美伊紧张局势推升避险需求，但白银工业属性（光伏/电子）拖累价格</li>\n<li>美联储降息预期反复摇摆，美元指数震荡影响贵金属定价</li>\n<li>供应端：矿产银产量连年下滑（自2016年约2.8万吨峰值后持续减少），2026年供应缺口预计扩大至4500吨</li>\n<li>美国银行预测白银年底有望冲击$100/oz，但认为涨势难以持续，2027年或重回$75附近</li>\n<li>上海黄金交易所自6月1日起调降白银T+D保证金比例（24%→21%），释放政策宽松信号</li>\n</ul>\n</div>\n\n<hr>\n\n<h2>一、AI板块整体市场概览（盘前）</h2>\n\n<p><strong>A股上周五（5月29日）收盘状况：</strong>三大指数全线收跌——上证指数报4068.57点（-0.73%），深证成指报15575.13点（-1.81%），科创50指数大幅回调。市场呈现 <strong>\"高位科技集体兑现\"</strong> 格局：科技板块涨停转跌停的现象增多，前期涨幅过大的AI硬件股遭遇获利了结。</p>\n\n<p><strong>盘前核心信息：</strong>COMPUTEX 2026今日揭幕，黄仁勋11时主题演讲成全市场焦点。6月首周市场面临 <strong>风格再平衡</strong> 的可能——上周五主力资金已从高位科技切换至电力（+43亿）、酿酒（+46.68亿）、通信硬件等板块。但AI长期主线未变，\"逢低加仓\"仍是主流策略共识。</p>\n\n<hr>\n\n<h2>二、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-up\">情绪 高度关注</span></div>\n<p class=sn><strong>资金面（上交易日回顾）：</strong>5月29日科技板块整体遭获利了结，但通信硬件（CPO/光模块）仍获资金追捧——亨通光电单日吸金近40亿居A股第一，长芯博创+13.31亿，剑桥科技+11.73亿。</p>\n<p class=sn><strong>基本面：</strong></p>\n<ul>\n<li>COMPUTEX 2026今日揭幕，英伟达CEO黄仁勋将于11:00发表主题演讲，核心看点：下一代 <strong>Rubin机架架构</strong>，算力/功耗进一步提升；市场关注散热方案（液冷）、GPU互联（CPO）和近200万个零部件供应前景</li>\n<li>英伟达计划发布面向PC的 <strong>SoC芯片</strong>，戴尔和微软将推出首批搭载英伟达芯片的PC</li>\n<li>AI推理成硬件市场主导，占投资约三分之二。博通定制AI ASIC芯片2026财年Q1收入84亿美元（+106%）</li>\n<li>华为\"韬定律\"概念持续发酵，引发芯片行业价值重估讨论</li>\n</ul>\n<p class=sn><strong>政策面：</strong>工信部等八部门联合印发《\"人工智能+制造\"专项行动实施意见》，加速训练芯片、异构算力等关键技术突破。发改委密集释放信号：正谋划出台加快AI落地配套文件。</p>\n<p class=sn><strong>情绪面：</strong>COMPUTEX开幕前市场情绪高度集中。华泰证券策略认为AI仍是
