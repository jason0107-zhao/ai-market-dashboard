td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季+618大促</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>资金流向核心发现：</strong>全市场主力净流出831亿元连续多日净流出。电子行业净流出372亿居首。AI板块（电子+计算机+通信）合计净流出超400亿元。电力+公用事业合计净流入约85亿。通信线缆是AI唯一逆势吸金方向（亨通光电39.76亿净流入全市场第一）。AI板块相对热度降至冰点。</p>\n\n<hr>\n\n<h2>四、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联延伸受益</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐，拖累板块</td></tr>\n  <tr><td><strong>博杰股份</strong></td><td>002975</td><td><span class=\"pill pill-up\">周五涨停</span></td><td>AI算力+业绩爆发，切入英伟达供应链</td></tr>\n</table>\n\n<hr>\n\n<h2>五、下周关键事件展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">⏰ 6/1 周一</div><div class=\"iv\" style=\"font-size:14px\"><strong>宇树科技IPO上会</strong>——冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。如顺利过会将为机器人板块注入强心剂。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⏰ 6/2-6/5</div><div class=\"iv\" style=\"font-size:14px\"><strong>Computex 2026大会</strong>——主题\"AI Together\"，英伟达/AMD/英特尔等巨头发布下一代AI芯片。重点关注Vera Rubin架构更新。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">美股三大指数齐创新高（纳指六连涨）。Snowflake +36%，英伟达/微软续涨。费城半导体+1%。中美科技股出现分化——美股涨、A股回调，说明A股调整更多是内部筹码问题。</div></div>\n</div>\n\n<hr>\n\n<h2>六、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 本周定性</div><div class=\"iv\" style=\"font-size:14px\">AI行情\"先涨后调\"——上半月算力趋势大涨，月末高位兑现回调。科创50月涨幅超11%领跑。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周焦点</div><div class=\"iv\" style=\"font-size:14px\"><strong>宇树科技IPO（6/1）+ Computex大会（6/2-5）</strong>——全年最强AI催化组合，有望驱动AI板块重拾升势。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">白银72-80美元区间宽幅震荡，75美元为多空分水岭。供给缺口+工业需求支撑长期，但美联储紧缩预期压制短期。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续大额净流出+北向偏流出，若Computex催化不及预期，AI板块调整时间可能延长。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">调整中逢低分批布局算力/光模块龙头。关注Computex新方向（Vera Rubin架构、CPO、AI PC）。CPO延伸方向（通信线缆）值得重点关注。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260531-1207", "date": "2026-05-31 12:00", "title": "AI板块周末复盘 · 计算催化密集 白银72-80震荡 聚焦下周宇树上会+Computex", "tags": ["周末复盘", "白银", "高切低", "Computex", "宇树IPO", "CPO通信线缆"], "summary": "A股休市（周日）。5月AI板块为最强主线，周五全面高切低。COMEX白银76美元。下周聚焦宇树IPO上会及Computex大会。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">75.2</div><div class=\"lbs\">现货白银</div></div>\n  <div class=\"metric-box\"><div class=\"num\">76.1</div><div class=\"lbs\">COMEX白银</div></div>\n  <div class=\"metric-box\"><div class=\"num\">99.04</div><div class=\"lbs\">美元指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">18,280</div><div class=\"lbs\">沪银T+D</div></div>\n</div>\n\n<h1>AI板块周末复盘 · 聚焦下周催化 白银72-80区间震荡</h1>\n<p><strong>时间：</strong>2026-05-31 12:00</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>今日为周日，A股休市。上周五（5/29）A股发生全面\"高切低\"切换，科创50暴跌5%，科技全线退潮。COMEX白银期货报76.1美元/盎司，周内波动剧烈。下周市场核心聚焦<strong>6/1宇树科技IPO上会</strong>和<strong>6/2-6/5 Computex大会</strong>两大催化。5月整体回顾：科创50单月暴涨后月末回调，算力/AI为全月主线。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>76.1美元/盎司</strong> <span class=\"pill pill-down\">周内波幅剧烈</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.2美元/盎司</strong> <span class=\"pill pill-mid\">低位企稳</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银T+D</div><div class=\"iv\"><strong>18,280元/千克</strong> <span class=\"pill pill-mid\">区间运行</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.04</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>4,569.9美元/盎司</strong> <span class=\"pill pill-up\">+0.83%</span></div></div>\n</div>\n\n<p><strong>一周复盘（5/25-5/31）：</strong></p>\n<ul>\n  <li>本周白银走势呈<strong>\"V型反转\"</strong>——周一至周四先抑后扬：周四COMEX白银一度跌破73美元（最低72.5附近），周五强力反弹至76美元上方，全周收窄跌幅</li>\n  <li>5月整体：白银5月初从70美元启动冲高至81美元（5/7），月中回调至73美元附近，月末在75-78美元区间震荡。5月累计<strong>涨幅约2.1%</strong></li>\n  <li>自1月29日历史高点121美元以来，白银已回落约<strong>37%</strong>，当前处于腰斩后震荡筑底阶段</li>\n</ul>\n\n<p><strong>近期趋势判断：</strong>白银处于<strong>72-80美元宽幅震荡区间</strong>。短线看72-75美元区间支撑较强，上方80美元为关键压力位。突破80美元需要新的催化剂（如美联储明确降息信号或地缘突发事件）。</p>\n\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元持续走弱利好多重资产：</strong>美元指数报99.04，持续处于低位，对贵金属形成整体支撑</li>\n  <li><strong>美联储政策预期反复：</strong>市场对年内降息节奏预期摇摆，4月PCE同比+3.8%创三年新高，通胀粘性制约降息空间</li>\n  <li><strong>工业需求支撑：</strong>光伏（全球最大白银工业用户）+AI数据中心建设对白银需求保持刚性</li>\n  <li><strong>供应缺口收窄压力：</strong>瑞银估算2026年全球白银供应缺口从3亿盎司收窄至6000-7000万盎司。去银化（银包铜/电镀铜）技术加速，高价抑制需求</li>\n  <li><strong>机构观点分歧巨大：</strong>美国银行看多Q4冲100美元但认为\"昙花一现\"；瑞银下调年底目标至80美元；汇丰认为白银\"被明显高估\"，预计68-88美元区间波动</li>\n</ul>\n\n<blockquote>💡 白银短期在72-80美元区间震荡整理。方向性突破需等待下周美国非农数据和美联储表态。建议在区间下沿（72-75美元）分批布局而非追高。关注去银化技术进展对中长期供需格局的影响。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（周五5/29回顾）</h2>\n<p>上周五A股三大指数高开低走，全线收跌：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04%</span> 💥</div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n</div>\n\n<p><strong>5月全月回顾：</strong></p>\n<ul>\n  <li>科创50全月累计涨幅一度突破<strong>+11%</strong>，领跑各大宽基指数，月末最后两日大幅回调抹去部分涨幅</li>\n  <li>算力、存储芯片、AI、国产半导体等科技赛道持续领跑全月，板块内多股走出连续上涨行情</li>\n  <li>月末\"高切低\"行情——科技高位获利盘集中兑现，电力/公用事业/消费等防御板块逆势吸金</li>\n  <li>北向资金5月持续净流入（尤其上半月），月末转为偏流出</li>\n  <li>成交额维持高位（日均约3万亿），市场交投活跃度明显高于一季度</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>上周五AI板块全面回调，人工智能指数收跌<strong>3.06%</strong>。但需要看到大背景——<strong>5月AI板块是绝对主线</strong>，月末的调整是在持续大涨后的正常技术性回调。</p>\n\n<p><strong>核心判断：</strong>调整是<strong>交易层面的筹码消化</strong>，而非产业逻辑破坏。AI产业基本面（全球资本开支高增长、HBM供不应求、CPO产业化元年）均未改变。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">情绪 高位整理</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五电子行业主力净流出372亿元居全行业第一，中芯国际主力净流出31.4亿居全市场第一。算力ETF全线下跌。不过，通信线缆及配套逆势净流入约40亿元——亨通光电净流入39.76亿全市场第一。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周最大催化——<strong>6/2-6/5 Computex大会</strong>以\"AI Together\"为主题，英伟达预计将发布Vera Rubin架构更新、新一代AI芯片方案。市场监管总局&发改委联合发布《人工智能计量体系和能力建设指引（2026版）》。</p>\n<p class=\"sn\"><strong>基本面：</strong>Cerebras在美上市首日大涨89%市值达750亿美元——AI算力赛道景气验证。戴尔AI服务器营收161亿美元同比+757%（上调全年目标至600亿美元）。四大云厂商2026年资本支出合计7250亿美元（+77%）。5月29日发布的《2026全球AI算力报告》指出AI算力基础设施正从支撑系统演变为<strong>驱动科技创新的战略性底座</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>短期高位获利压力释放中，但中长期对AI算力的乐观预期未变。下周Computex大会有望点燃新一轮做多热情。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪 中性偏谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>跟随半导体整体回调。北向资金在存储龙头交投活跃（澜起科技42亿、兆易创新33.86亿为沪股通成交前三），整体方向偏流出。佰维存储逆势上涨0.94%成为板块中少有的红盘股。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业基本面极为强劲——HBM3E现货价半年暴涨<strong>超300%</strong>。全球DRAM营收Q1逼近970亿美元（+260%）。三星率先交付首批12层48GB HBM4E样品，抢先SK海力士至少一个季度。苹果20周年iPhone计划采用HBM内存。集邦预测2026年HBM需求再增70%+。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强势但短期股价已充分反映涨价预期。HBM是AI产业链中<strong>供需格局最紧张</strong>的环节，中长期确定性极高。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">情绪 等待催化剂</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五继续承压。5月27日板块已净流出143亿元，月末获利资金持续兑现。执行器（三花智控）、减速器（绿的谐波）等核心标的有所回调。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势加速中——<strong>宇树科技科创板IPO将于6月1日上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42亿元。海关数据4月工业机器人出口量突破2.5万台（同比+90%）。特斯拉Optimus Gen-3已下线，弗里蒙特产线改造中。2026年是人形机器人规模化验证关键期。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场聚焦宇树科技上会结果。若顺利过会将为板块注入强心剂。湘财证券指出机器人板块有望成为AI板块内部轮动的聚焦点。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">结构性活跃</span></div>\n<p class=\"sn\"><strong>资金面：</strong>板块内部分化显著——光模块龙头中际旭创高位震荡，但<strong>通信线缆及配套</strong>逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入39.76亿居全市场第一，剑桥科技11.73亿、长飞光纤10.39亿。资金在寻找CPO产业链新面孔。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达明确Q4启动CPO量产，鸿海CPO全光交换机出货目标从1万台上调至超5万台。GlobalFoundries推出业界首个符合OCI MSA规范的SCALE CPO解决方案。LightCounting预测2030年CPO市场规模达100亿美元。中际旭创2026Q1营收195亿（+192%），净利润57亿（+262%）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业趋势确定性极高。但斌转发CPO视频引发产业认知扩散。通信线缆方向获资金集中配置，市场在挖掘CPO产业链的<strong>新受益环节</strong>。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（周五5/29 TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期+高分红</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红，估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618电商大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台主力净流入9.19亿领衔</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链延伸</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>10</strong></td><td>建筑装饰</td><td><span class=\"green\">+7.27</span></td><td>基建预期+部分行业龙头资金回补</td><td><span class=\"pill pill-mid\">轮动配置</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831亿</strong>，电子行业净流出<strong>372亿</strong>居全行业第一</li>\n  <li>电力+公用事业合计净流入约85亿，防御性板块全面吸金</li>\n  <li>通信线缆（亨通光电、剑桥科技、长飞光纤）是AI板块中<strong>唯一逆势吸金方向</strong></li>\n  <li>AI相关板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至冰点</li>\n  <li>北向资金成交活跃（4734亿/占两市14.26%），但整体方向偏净流出，外资同样\"高切低\"</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念延伸，主力集中配置</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐，昨日创历史新高后高位回调</td></tr>\n  <tr><td><strong>博杰股份</strong></td><td>002975</td><td><span class=\"pill pill-up\">涨停</span></td><td>AI算力+业绩爆发（25年净利增557%），切入英伟达供应链</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>HK.0992</td><td><span class=\"pill pill-up\">港股暴涨22.46%</span></td><td>财报全面超预期，AI服务器业务成核心增长引擎</td></tr>\n</table>\n\n<hr>\n\n<h2>六、5月AI板块核心观点总结</h2>\n\n<p><strong>5月市场主线回顾：</strong></p>\n<ul>\n  <li><strong>算力/AI芯片：</strong>全月最强主线。海外云厂商资本开支7250亿美元（+77%），Cerebras上市首日暴涨89%，戴尔AI服务器营收猛增757%</li>\n  <li><strong>存储/HBM：</strong>HBM3E半年涨300%，三星率先交付HBM4E样品。DRAM营收创历史新高</li>\n  <li><strong>CPO/光模块：</strong>产业化元年确定。中际旭创Q1营收195亿（+192%），英伟达Q4启动CPO量产</li>\n  <li><strong>机器人：</strong>宇树科技冲刺IPO，特斯拉Optimus Q2启动量产，4月工业机器人出口量同比+90%</li>\n  <li><strong>政策端：</strong>四部门联合发布AI+能源双向赋能方案，发改委将AI+行动升级为\"全面实施\"，工信部五部门部署百场万企对接（机器人/服务器/AI终端）</li>\n</ul>\n\n<p><strong>下周核心关注：</strong></p>\n<ul>\n  <li><strong>6/1（周一）：</strong>宇树科技科创板IPO上会——若通过将成为A股\"人形机器人第一股\"</li>\n  <li><strong>6/2-6/5（周二至周五）：</strong>台北Computex 2026大会——\"AI Together\"主题，英伟达/AMD/Intel集中发布，全球AI年度最大催化窗口</li>\n  <li><strong>美国经济数据：</strong>关注ISM制造业PMI、非农就业数据，影响美联储降息预期和美元走势</li>\n</ul>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股休市（周日）。上周五全面\"高切低\"调整后，市场等待新催化剂。整体看，5月AI板块为最强主线，月末调整为正常技术性回调。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周核心催化</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 6/1 宇树科技IPO上会</strong>（人形机器人第一股）<br><strong>2) 6/2-6/5 Computex大会</strong>（全球AI年度最强催化窗口）</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">上周五美股三大指数齐创新高，纳指六连涨。费城半导体指数+1%。英伟达/微软/亚马逊上涨。AI产业热度仍在，A股调整属于内部资金博弈问题。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银在72-80美元区间宽幅震荡。下周关注美国非农和ISM数据。白银配置适合在区间下沿（72-75美元）分批布局。注意去银化趋势对中长期需求的压制。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续大额净流出，若下周Computex无法有效提振市场情绪，AI板块调整时间可能延长。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">调整中<strong>逢低分批布局</strong>算力/光模块龙头（中际旭创、新易盛）。关注Computex英伟达Vera Rubin发布。CPO产业链通信线缆方向是近期新发现的受益环节。机器人板块等待宇树上会结果。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260531-1300", "date": "2026-05-31 13:00", "title": "AI板块周末复盘 · 5月收官科创50月涨11%+ 聚焦下周Computex/宇树IPO催化", "tags": ["周末复盘", "5月收官", "科创50", "Computex", "人形机器人", "白银", "CPO"], "summary": "5月A股收官，科创50月涨11%+领跑。白银75.58美元。下周Computex+宇树上会是最大催化。", "html": "\n<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX银(美元/盎司)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.43%</div><div class=\"lbs\">白银日内</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+2.1%</div><div class=\"lbs\">白银5月</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+11%+</div><div class=\"lbs\">科创50五月</div></div>\n</div>\n\n<h1>AI板块周末复盘 · 5月收官与下周Computex展望</h1>\n<p><strong>时间：</strong>2026-05-31 13:00（A股今日周末休市）</p>\n\n<div class=\"tagline\">📌 <strong>5月收官总结：</strong>A股5月呈现明显结构性分化——沪指冲高回落月线收阴，但<strong>科创50月涨超11%</strong>领跑全市场，创业板指月涨近10%站稳4000点。AI/半导体/算力成为全月绝对主线。下周<strong>Computex 2026</strong>（6/2-6/5）和<strong>宇树科技IPO上会</strong>（6/1）是最重要的催化窗口。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货(5/29收盘)</div><div class=\"iv\"><strong>75.58美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银(最新)</div><div class=\"iv\"><strong>75.20美元/盎司</strong> <span class=\"pill pill-mid\">区间震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>18,358元/千克</strong> <span class=\"pill pill-up\">+2.31%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.02</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">5月累计</div><div class=\"iv\"><span class=\"pill pill-up\">+2.1%</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>COMEX白银期货5月29日收于75.58美元/盎司，日内微跌0.43%，但5月整体累计<strong>上涨约2.1%</strong>。白银自1月底创下121美元历史高点后经历大幅回调，当前在<strong>72-80美元区间宽幅震荡筑底</strong>。上周走势呈现\"先抑后扬\"——5月28日曾急挫至73美元附近，随后29日强势反弹超3%收复至76美元上方，最终回落至75.58美元。整体处于<strong>多空激烈博弈</strong>阶段。</p>\n\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元指数走弱支撑：</strong>美元指数报99.02，创近期低位，对贵金属整体形成支撑</li>\n  <li><strong>通胀持续高企：</strong>美国4月PCE同比+3.8%创三年新高，强化抗通胀资产需求</li>\n  <li><strong>工业需求强劲：</strong>光伏装机+AI数据中心建设带动白银工业需求持续高位</li>\n  <li><strong>供需格局紧张：</strong>全球白银供应连续第六年短缺，2026年缺口约4630万盎司</li>\n  <li><strong>机构观点分化：</strong>美银看至Q4达100美元但警示\"昙花一现\"；瑞银年底目标80美元；汇丰认为\"明显高估\"</li>\n  <li><strong>印度提高白银进口关税：</strong>从6%大幅提高至15%，可能压制印度需求</li>\n</ul>\n\n<blockquote>💡 白银短线支撑72美元，上方压力80美元整数关口。5月月线收涨+2.1%，在贵金属中表现强于黄金（5月-2.03%），但波动率显著放大（5月单日曾跌超9%）。下周关注美国非农数据对贵金属的进一步指引。</blockquote>\n\n<hr>\n\n<h2>一、AI板块整体市场概览</h2>\n<p><strong>A股今日周末休市。</strong>回顾上周五（5月29日），AI板块经历<strong>全面退潮日</strong>：人工智能指数收跌3.06%，成交额5398亿元。科创AI指数跌3.52%。</p>\n<p>但从<strong>5月全月视角</strong>看，AI板块仍是全市场最核心的主线：</p>\n<ul>\n  <li><strong>科创50指数月涨超11%</strong>，突破2020年7月14日历史高点</li>\n  <li><strong>创业板指月涨近10%</strong>，站稳4000点整数关口（5月28日创业板指首次超越沪指创历史里程碑）</li>\n  <li>芯片产业链个股表现尤为亮眼——<strong>中芯国际、寒武纪、北方华创、兆易创新、华虹公司</strong>等股价5月创历史新高</li>\n  <li>\"易中天\"（新易盛/中际旭创/天孚通信）三大光模块龙头5月股价<strong>轮番创历史新高</strong></li>\n  <li><strong>长盈通月涨超170%</strong>成为板块情绪标杆，<strong>大普微月涨超130%</strong></li>\n</ul>\n<p>上周五的调整更多是<strong>月度获利了结和\"高切低\"</strong>的行为，并非产业逻辑的破坏。</p>\n\n<hr>\n\n<h2>二、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">5月强势 短线回调</span> <span class=\"pill pill-mid\">情绪 等待催化</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五电子行业主力净流出372亿元居全行业第一。中芯国际主力净流出31.4亿居全市场首位。算力ETF全线收跌。但5月整体来看，半导体相关ETF5月26日单日净流入即达94.15亿元，全月流入规模极为可观。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周重磅催化——<strong>Computex 2026（6/2-6/5）</strong>以\"AI Together\"为主题。英伟达CEO黄仁勋将于北京时间周一（6/1）中午11点发表主题演讲，核心看点包括：<strong>Vera Rubin机架架构更新</strong>、下一代GPU互联技术（CPO）、液冷散热方案。这是全球AI产业链年中最强催化窗口。</p>\n<p class=\"sn\"><strong>基本面：</strong>Cerebras在纳斯达克上市首日暴涨89%市值达750亿美元，验证AI算力赛道的极高景气。四大云厂商2026年资本开支7250亿美元（+77%+）。戴尔AI服务器营收161亿美元同比+757%。联想集团22.46%大涨。产业面<strong>全面向好</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场等待Computex催化，短期处于\"催化剂真空期\"后的\"预期预热期\"。美股纳指六连涨创新高、费城半导体+1%，AI产业热度不减，A股的调整更多是内部资金博弈。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">产业景气最高</span> <span class=\"pill pill-mid\">情绪 等待催化</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五跟随半导体整体回调，北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿）。佰维存储逆势收涨0.94%。</p>\n<p class=\"sn\"><strong>基本面：</strong>存储是AI产业链中供需格局<strong>最紧张</strong>的环节——HBM3E现货价半年暴涨超<strong>300%</strong>。三星率先交付首批12层48GB HBM4E样品。全球DRAM营收Q1逼近970亿美元（+260%创历史新高）。HBM在AI芯片成本占比已从52%升至63%。东北证券预计HBM涨价至少持续到2027年。美光警告内存短缺将延续至2026年后。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强势，但短期股价已充分反映涨价预期，获利资金选择兑现。中长期来看，HBM仍是AI产业链供需格局最紧张的环节，调整后仍可重点关注。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">催化剂密集</span> <span class=\"pill pill-up\">情绪 关注6/1上会</span></div>\n<p class=\"sn\"><strong>资金面：</strong>5月27日机器人板块净流出143亿元后，上周五延续承压。但筹码清理较为充分。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业催化密集到来——<strong>宇树科技科创板IPO将于6月1日（周一）上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。海关数据4月工业机器人出口量突破2.5万台（同比+90%）。2026年是人形机器人<strong>规模化验证关键期</strong>，特斯拉Optimus Gen-3 Q2启动量产，目标年产能100万台。中国整机出货量占全球84.71%。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场对宇树科技上会高度关注。若顺利过会将为板块注入强心剂。下周 Computex 大会也有机器人相关展示，板块催化剂密集。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">产业化元年 通信线缆吸金</span> <span class=\"pill pill-up\">情绪 结构性活跃</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五板块内部分化显著——光模块龙头中际旭创（A股成交额225亿第一）高位震荡，但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>居全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年被机构定义为<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上。LightCounting预测2030年CPO市场规模达100亿美元。中际旭创Q1营收195亿（+192%）、净利润57亿（+262%）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正在寻找CPO产业链的\"新面孔\"——通信线缆方向获集中配置。黄仁勋Computex演讲中<strong>CPO技术路径</strong>的披露将成为下周市场焦点。但斌转发CPO视频引发产业关注，市场认知正在扩散。</p>\n</div>\n\n<hr>\n\n<h2>三、主流净流入板块监控（5月29日数据）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>科技→防御大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>5月29日全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li>高切低特征显著——<strong>电力+公用事业</strong>合计净流入约85亿，资金从科技全面撤退至防御板块</li>\n  <li>AI相关板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至阶段性低点</li>\n  <li>通信线缆是AI板块中<strong>唯一逆势吸金方向</strong>——受益CPO/算力互联概念延伸</li>\n  <li>但从<strong>整月视角</strong>看，半导体/算力仍是资金净流入最大的方向，5月整体科技主线地位不可动摇</li>\n</ul>\n\n<hr>\n\n<h2>四、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念延伸，获主力资金集中追捧</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-mid\">5月创历史新高<br>月涨超25%</span></td><td>半导体代工景气确认，产能满载订单可见度延伸至Q4。上周五获利回吐净流出31.4亿（全市场第一）</td></tr>\n  <tr><td><strong>中际旭创</strong></td><td>300308</td><td><span class=\"pill pill-up\">5月涨幅显著<br>多次创历史新高</span></td><td>光模块绝对龙头，Q1营收195亿+192%，净利润57亿+262%，业绩验证AI算力高景气</td></tr>\n  <tr><td><strong>Cerebras</strong></td><td>NASDAQ</td><td><span class=\"pill pill-up\">上市首日+89%</span></td><td>晶圆级AI芯片公司纳斯达克上市，市值750亿美元，验证AI算力赛道极高景气</td></tr>\n</table>\n\n<hr>\n\n<h2>五、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus V3量产推进中，A股核心受益标的梳理（按确定性排序）：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>确定性</th></tr>\n  <tr><td><strong>执行器总成</strong></td><td>拓普集团</td><td>601689</td><td>Optimus V3线性执行器独家（腿/腰大关节），单机约1.5万元，已签40亿+订单</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>旋转关节</strong></td><td>三花智控</td><td>002050</td><td>旋转关节总成独家（14个上肢关节）+全套液冷，单机约3万元，锁定54亿订单</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>谐波减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器龙头，V3单台用14-20个，唯一规模化进入T链</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>滚柱丝杠</strong></td><td>五洲新春</td><td>603667</td><td>行星滚柱丝杠核心，V3单机34根，腿部关键传动（上周受机器人板块回调影响跌停）</td><td>⭐⭐</td></tr>\n  <tr><td><strong>空心杯电机</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机独家，用于V3灵巧手，高功率密度</td><td>⭐⭐</td></tr>\n  <tr><td><strong>伺服系统</strong></td><td>汇川技术</td><td>300124</td><td>伺服系统+控制器，V3运动控制方案</td><td>⭐⭐</td></tr>\n  <tr><td><strong>3D视觉传感器</strong></td><td>奥比中光</td><td>688322</td><td>3D视觉传感器，V3环境感知核心硬件，上周五相对抗跌（+0.84%）</td><td>⭐⭐</td></tr>\n  <tr><td><strong>力矩传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐</td></tr>\n</table>\n<p><strong>关键进展：</strong>特斯拉Optimus Gen-3已下线并投入内部测试，Q2启动量产，首批量产基地位于加州弗里蒙特工厂（原Model S/X产线改造），设计年产能100万台。2026年计划实现5-10万台产量。国内供应链批量订单有望陆续落地。</p>\n\n<hr>\n\n<h2>六、5月A股月度盘点</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\"><strong>月涨+11%+</strong> <span class=\"pill pill-up\">领跑全球</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\"><strong>月涨近+10%</strong> <span class=\"pill pill-up\">站稳4000点</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪指</div><div class=\"iv\"><span class=\"pill pill-mid\">冲高回落 月线收阴</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">月热点</div><div class=\"iv\" style=\"font-size:14px\"><strong>芯片/算力/CPO/PCB</strong></div></div>\n</div>\n<p>5月A股呈现典型的<strong>结构性牛市</strong>——算力、存储芯片、人工智能、国产半导体等科技赛道持续领跑。芯片产业链从晶圆代工（中芯国际、华虹）到设备（北方华创、盛美上海）到存储（兆易创新、佰维存储、大普微+130%）全面爆发。CPO板块\"易中天\"轮番创历史新高。AI算力ETF资金连续多日净流入，半导体相关ETF单日净流入最高达94亿元。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 周末定性</div><div class=\"iv\" style=\"font-size:14px\">A股周末休市。5月A股结构性牛市收官，科创50月涨11%+领跑。上周五的科技调整是\"高切低\"行为，非产业逻辑破坏。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周核心催化</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 6/1 宇树科技IPO上会</strong>（\"人形机器人第一股\"，拟募资42亿）<br><strong>2) 6/1 黄仁勋COMPUTEX主题演讲</strong>（北京时间中午11点，Vera Rubin/CPO/液冷等核心方向）<br><strong>3) 6/2-6/5 COMPUTEX 2026</strong>（英伟达/AMD/英特尔齐聚）</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">上周五美股三大指数齐创新高。AI芯片公司Cerebras上市首日暴涨89%。英伟达、微软、戴尔等AI巨头持续走强。A股AI板块调整更多是内部筹码问题。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银75.58美元/盎司，5月累计+2.1%。72-80美元区间宽幅震荡，下周关注非农数据对贵金属的指引。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续多日净流出，若下周Computex催化不及预期，AI板块调整时间可能延长。仓位管理为先。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">下周是AI板块<strong>最关键的催化周</strong>，建议关注：1) 黄仁勋演讲中关于CPO/液冷的新技术路径；2) 宇树科技上会结果；3) 通信线缆方向的产业延伸机会。调整中<strong>逢低分批布局</strong>算力/光模块龙头。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>\n"}, {"id": "mon-20260531-1407", "date": "2026-05-31 14:07", "title": "AI板块周末复盘 · 5月收官 5月PMI 50.0% 科技回调中聚焦下周Computex/宇树IPO", "tags": ["周末复盘", "5月收官", "PMI", "科技回调", "白银", "Computex", "宇树IPO"], "summary": "5月PMI 50.0%位于荣枯线，市场等待下周AI催化窗口。COMEX白银75.58美元震荡，工业需求逻辑持续。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">50.0%</div><div class=\"lbs\">5月PMI</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX银 $/oz</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+11%</div><div class=\"lbs\">科创50月涨幅</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">周五科创50</div></div>\n</div>\n\n<h1>AI板块周末复盘 · 5月收官 等待下周催化</h1>\n<p><strong>时间：</strong>2026-05-31 14:07（周末，A股休市）</p>\n\n<div class=\"tagline\">📌 <strong>核心判断：</strong>今日为5月最后一个周末，A股休市中。5月A股整体走出结构性牛市——科创50全月累计暴涨11%，但最后一个交易日科技全面回调（科创50暴跌5.04%）。5月制造业PMI 50.0%刚好站在荣枯线上。下周两大催化密集：<strong>6/1宇树科技IPO上会</strong> + <strong>6/2-6/5 Computex大会</strong>，是AI板块情绪修复的关键窗口。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58美元/盎司</strong> <span class=\"pill pill-down\">周跌 -0.81%</span><br><small>5月涨 +2.1%</small></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金期货</div><div class=\"iv\"><strong>4,569.90美元/盎司</strong> <span class=\"pill pill-up\">周涨 +0.28%</span><br><small>5月跌 -2.03%</small></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>~99.0</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>17,790元/千克</strong> <span class=\"pill pill-down\">周跌 -4.31%</span></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>COMEX白银期货5月29日收跌0.43%报75.58美元/盎司，周跌0.81%，但5月整体仍录得<strong>+2.1%</strong>的月涨幅。白银自1月创下121美元历史高点后已大幅回调，当前在<strong>72-80美元区间宽幅震荡</strong>，处于历史高位的调整企稳阶段。</p>\n<p><strong>CFTC持仓动态（截至5月26日）：</strong>COMEX白银投机者将净多头持仓减少1,517手，最终净多头仓位降至10,244手，显示投机资金对白银短期走势趋于谨慎。</p>\n<p><strong>驱动因素分析：</strong></p>\n<ul>\n  <li><strong>美元走弱提供支撑：</strong>美元指数报99.0创近期低位，对贵金属整体形成支撑</li>\n  <li><strong>美伊谈判进展：</strong>美伊和谈接近达成，地缘风险溢价下降，风险偏好回升但白银工业属性受拖累</li>\n  <li><strong>加息预期摇摆：</strong>美联储降息节奏反复，市场对利率前景预期波动加剧</li>\n  <li><strong>工业需求：</strong>光伏+AI数据中心建设对白银的工业需求逻辑持续被市场认可，支撑中期价格</li>\n</ul>\n<blockquote>💡 白银当前处于72-80美元区间的<b>震荡筑底</b>阶段。5月涨2.1%跑赢黄金(-2.03%)，工业需求属性提供额外支撑。短线支撑72美元，压力80美元。</blockquote>\n\n<hr>\n\n<h2>一、大盘回顾（5月收官）</h2>\n<p><strong>5月最后一个交易日（5月29日）回顾：</strong></p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">~4038 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n</div>\n<p>全市场仅1,565只上涨，3,867只下跌。主力资金净流出<strong>831.55亿元</strong>。申万一级仅12个行业上涨，食品饮料(+3.02%)、煤炭(+2%+)、公用事业(+2%+)领涨；综合(-5.39%)、国防军工、电子(-4%以上)领跌。</p>\n\n<p><strong>5月全月总结：</strong>A股整体震荡上行走出<strong>结构性牛市</strong>——科创50全月涨幅突破11%，领跑所有宽基指数。算力、存储芯片、人工智能、国产半导体等科技赛道持续领跑。北向资金、公募基金、私募机构持续加大对科创板块的布局力度。</p>\n\n<p><strong>今日（5月31日）重要宏观数据：</strong></p>\n<p>国家统计局公布5月中国采购经理指数：</p>\n<ul>\n  <li><strong>5月制造业PMI：50.0%</strong>，比上月下降0.3个百分点，恰好位于荣枯线</li>\n  <li>非制造业商务活动指数：<strong>50.1%</strong>，较上月上升0.7个百分点</li>\n  <li>综合PMI产出指数：<strong>50.5%</strong>，上升0.4个百分点</li>\n  <li>大型企业PMI：51.1%（升0.9个百分点）；中、小型企业PMI分别为48.6%和48.5%（下降1.9和1.6个百分点）</li>\n</ul>\n<p>PMI数据解读：制造业景气度<strong>止升回稳</strong>，但中小企业收缩明显，经济复苏不均衡。政策进一步发力仍有必要。</p>\n\n<hr>\n\n<h2>二、AI板块整体市场概况</h2>\n<p>5月AI板块是<strong>全市场绝对主线</strong>——科创板暴涨11%主要由AI/半导体贡献。但5月29日最后一个交易日AI板块全面回调，呈现明显的<strong>\"高切低\"</strong>特征：</p>\n<ul>\n  <li>两日\"冰火两重天\"（5月28日AI全面爆发→5月29日全线回调）</li>\n  <li><strong>电子行业</strong>主力净流出<strong>372亿元</strong>居全行业第一</li>\n  <li>产业基本面未变——调整是<strong>交易层面的筹码消化</strong>，非产业逻辑破坏</li>\n  <li>DeepSeek完成首轮融资（国家大基金领投，估值450亿美元），AI产业进入国家队引领阶段</li>\n</ul>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块</div>\n<p class=\"sn\"><strong>资金面：</strong>周五电子行业主力净流出372亿元居首。中芯国际主力净流出31.4亿全市场第一。但资金并未离场，正在寻找低位方向。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周<strong>6/2-6/5 Computex大会</strong>以\"AI Together\"为主题，英伟达CEO黄仁勋将于6月2日发表主题演讲。市场监管总局&发改委联合发布《人工智能计量体系和能力建设指引(2026版)》。</p>\n<p class=\"sn\"><strong>基本面：</strong>Cerebras在美上市首日暴涨89%市值达750亿美元，验证AI算力赛道高景气。戴尔AI服务器营收161亿美元（同比+757%），上调全年AI服务器营收预期至600亿美元。四大云厂商2026年资本支出7250亿美元（+77%）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>科技\"高切低\"是A股内部资金博弈，美股AI板块仍在上涨（纳指六连涨创新高）。短期调整为下周Computex催化留下空间。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块</div>\n<p class=\"sn\"><strong>资金面：</strong>跟随半导体回调。北向资金在澜起科技（沪股通成交42亿）、兆易创新（33.86亿）上交投活跃但方向偏流出。佰维存储曾逆势上涨0.94%。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM景气持续超预期——HBM3E半年暴涨超300%，三星率先交付首批12层48GB HBM4E样品。全球DRAM营收Q1逼近970亿美元（+260%）。集邦预测2026年HBM需求再增70%+。美光警告内存短缺延续至2026年后。中信证券指出存储从涨价修复周期转向技术成长共振的新周期。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强劲，但股价已充分反映。获利资金兑现后，<strong>等待下一轮催化</strong>。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块</div>\n<p class=\"sn\"><strong>资金面：</strong>5月27日已净流出143亿元，周五继续承压。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势加速——<strong>宇树科技IPO 6月1日上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元，是国家大基金史上首次跨界投资AI大模型公司后的又一重大事件。小鹏汽车宣布2026年完成Robotaxi和人形机器人量产。特斯拉Optimus Gen-3 Q2启动量产，年产能目标100万台。</p>\n<p class=\"sn\"><strong>情绪面：</strong>板块短期受宇树Q1业绩\"增收不增利\"（营收+68%但扣非净利-52.55%）压制。但规模化验证期的短期亏损是正常现象。下周<strong>宇树上会结果</strong>是核心变量。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块</div>\n<p class=\"sn\"><strong>资金面：</strong>板块内部分化——光模块龙头中际旭创周五高位震荡（成交额225亿A股第一），但<strong>通信线缆</strong>逆势净流入39.83亿元。亨通光电主力净流入39.76亿全市场第一，剑桥科技净流入11.73亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上。台积电启动CPO量产配套。LightCounting预测2030年CPO市场规模达100亿美元。中际旭创Q1营收195亿同比+192%，净利57亿+262%。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正在寻找CPO产业链\"新面孔\"——通信线缆方向受追捧。CPO产业趋势确定性极高，光模块龙头短期调整是获利回吐而非逻辑变化。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（5月29日数据）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿元)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>主力资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红，估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n<p><strong>核心发现：</strong>全市场主力净流出831.55亿元。电子行业净流出372亿居首。电力+公用事业净流入约85亿。通信线缆是AI板块中唯一的逆势吸金方向。AI板块（电子+计算机+通信）合计净流出超400亿，相对热度降至冰点。</p>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念延伸，主力资金集中追捧</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐，创历史新高后大幅回调拖累板块</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>HK.0992</td><td><span class=\"pill pill-up\">港股暴涨22.46%</span></td><td>财报全面超预期，AI服务器业务成核心增长引擎</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3将于2026年年底前启动量产，首代目标年产100万台。弗里蒙特工厂Model S/X产线已开始切换为人形机器人产线。A股核心受益标的梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入验证</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td>⭐⭐</td></tr>\n  <tr><td><strong>轴承</strong></td><td>五洲新春</td><td>603667</td><td>机器人关节轴承供应商</td><td>⭐⭐</td></tr>\n</table>\n<p><strong>短期催化剂：</strong>6/1宇树科技上会 + 6/2-6/5 Computex大会人形机器人展示。若宇树顺利过会将为整个机器人板块注入强心剂。板块处于\"业绩尚未兑现但产业趋势确定\"阶段，适合<strong>逢低布局</strong>。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 周末定位</div><div class=\"iv\" style=\"font-size:14px\">5月收官日科技全面回调、\"高切低\"，但全月科创50暴涨11%领跑。PMI 50.0%显示经济底部企稳，大型企业率先复苏。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周关键事件</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 6/1（周一）宇树科技IPO上会</strong>——A股\"人形机器人第一股\"<br><strong>2) 6/2-6/5 Computex大会</strong>——英伟达黄仁勋6/2主题演讲，全球AI年度最强催化窗口</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">隔夜美股三大指数<strong>齐创新高</strong>。纳指六连涨。费城半导体指数+1%。英伟达/微软/亚马逊上涨。AI产业热度仍在，A股调整更多是内部资金博弈问题。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银75.58美元，5月涨2.1%跑赢黄金。72-80美元震荡区间，工业需求逻辑持续支撑。关注下周美国非农数据和美联储态度。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金持续净流出，若下周Computex大会无法提振情绪，AI板块调整时间可能延长。仓位管理是第一要务。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">调整中<strong>逢低分批布局</strong>算力/光模块龙头。核心关注：1) Computex英伟达Vera Rubin架构 2) CPO产业链通信线缆方向新机会 3) 宇树上会结果。守核心+探新方向。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260531-1507", "date": "2026-05-31 15:00", "title": "AI板块周末复盘 · 5月完美收官 算力AI成市场主线 聚焦下周Computex/宇树IPO", "tags": ["周末复盘", "5月收官", "AI主线", "算力", "白银", "Computex", "宇树IPO", "DeepSeek融资"], "summary": "5月收官科创50月涨11%+领跑全球。算力/AI芯片/光模块成主线。月末高切低回调。DeepSeek获大基金领投450亿美元估值。宇树6/1上会+Computex下周开幕。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4068.57</div><div class=\"lbs\">上证指数(5/29)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50周跌</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX白银$</div></div>\n  <div class=\"metric-box\"><div class=\"num\">50.0%</div><div class=\"lbs\">5月PMI</div></div>\n</div>\n\n<h1>AI板块周末复盘 · 5月完美收官 算力AI成市场主线赛道</h1>\n<p><strong>时间：</strong>2026-05-31 15:00</p>\n\n<div class=\"tagline\">📌 <strong>5月行情收官：</strong>科创50单月暴涨超11%，算力、存储芯片、人工智能、半导体等科技赛道领跑全市场。5月末虽出现高位筹码回吐（科技板块集体回调），但整体来看5月是<strong>典型的结构性牛市行情</strong>。海外四云厂商2026年资本开支合计7250亿美元(+77%)，国内AI产业化落地持续超预期。今日（周日）A股休市，以下基于5月收官数据和最新消息面分析。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58美元/盎司</strong> <span class=\"pill pill-mid\">日内震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.20美元/盎司</strong> <span class=\"pill pill-mid\">基本持平</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力(T+D)</div><div class=\"iv\"><strong>18,280元/千克</strong> <span class=\"pill pill-mid\">震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.03</strong> <span class=\"pill pill-down\">偏弱整理</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货黄金</div><div class=\"iv\"><strong>4,538美元/盎司</strong> <span class=\"pill pill-mid\">震荡</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>白银自1月历史高点121美元大幅回落，5月中旬一度跌至73美元后反弹企稳。当前在<strong>75-78美元区间窄幅震荡</strong>，暂处于阶段性筑底阶段。5月最后一周白银经历\"先跌后涨\"的V型修复——周四(5/28)暴跌4.5%，周五(5/29)即反弹3.45%，日内波动幅度极大。</p>\n\n<p><strong>驱动因素：</strong></p>\n<ul>\n  <li><strong>美元维持弱势：</strong>美元指数99.03处近期低位，对贵金属整体形成支撑</li>\n  <li><strong>美联储紧缩预期：</strong>新任主席沃什明确优先控通胀，4月CPI同比+3.8%超预期，市场降息预期迅速冷却，甚至开始讨论加息可能——这对白银构成中期压制</li>\n  <li><strong>十年期美债收益率突破4.6%：</strong>无风险利率上行压制不生息的贵金属资产</li>\n  <li><strong>供需双轮驱动：</strong>全球白银供应连续第六年短缺，2026年缺口预计达4630万盎司；但印度将白银进口关税从6%大幅上调至15%，可能减少需求</li>\n  <li><strong>工业需求逻辑：</strong>光伏+AI数据中心建设对白银需求持续被市场定价</li>\n  <li><strong>机构观点分化：</strong>美国银行预测Q4冲击100美元（但称\"昙花一现\"，2027Q2回到75美元）；瑞银则相对保守，认为75美元附近有支撑但上行空间有限</li>\n</ul>\n\n<blockquote>💡 白银当前处于历史高位回落后的<strong>宽幅震荡区间</strong>（72-80美元）。短线支撑看72美元，上方压力80美元/85美元。波动剧烈（5月单日曾跌超9%），操作注意仓位管理。纯多头不建议追高，等待回调至72-74美元区间再考虑。<strong>中期看，工业需求（光伏+AI）与供给缺口逻辑仍稳固，关键变量是美联储政策路径。</strong></blockquote>\n\n<hr>\n\n<h2>一、5月A股大盘回顾（基于5/29收盘数据）</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-up\">5月累计上涨</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-up\">5月累计上涨</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-up\">5月累计上涨</span></div></div>\n  <div class=\"info-item\"><div class=\"il\"><strong>科创50</strong></div><div class=\"iv\"><strong>1751.32 <span class=\"pill pill-up\">5月累计+11%+ 💥</span></strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">5月日均成交</div><div class=\"iv\"><strong>约2.8-3.3万亿</strong></div></div>\n</div>\n\n<p><strong>5月行情三大特征：</strong></p>\n<ul>\n  <li><strong>科创50单月暴涨超11%领跑全球：</strong>算力、存储芯片、人工智能、半导体等科技赛道持续领跑全市场，走出结构性牛市行情</li>\n  <li><strong>月末高位换筹：</strong>5月28日创业板首次超越沪指后，29日随即出现科技全面退潮、科创50暴跌5.04%的\"高切低\"行情。高位筹码集中回吐，电子行业单日主力净流出372亿元</li>\n  <li><strong>防御板块逆势补位：</strong>电力/公用事业/食品饮料在科技回调时获资金涌入，但整体成交量未明显萎缩，显示资金并未离场而是在结构性轮动</li>\n</ul>\n\n<p><strong>核心上涨驱动力：</strong></p>\n<ul>\n  <li>北向资金、公募基金、私募机构持续加大对科创板块布局力度</li>\n  <li>海外四云厂商2026年资本支出7250亿美元(+77%)，大幅超预期</li>\n  <li>国内AI产业化落地持续超预期，从通用大模型到智算中心建设全线订单饱满</li>\n  <li>国产科技自主化作为国家长期战略，政策扶持+产业需求双重加持</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>今日A股休市（周日），以下为5月收官总结与下周一（6月1日）前瞻：</p>\n\n<p><strong>5月AI板块关键词：\"涨多了回调\"</strong></p>\n<ul>\n  <li>5月上旬至中旬：算力/半导体/AI芯片/光模块\"易中天\"等龙头持续创新高</li>\n  <li>5月最后一周：高位获利了结压力集中释放，29日科创50暴跌5.04%，人工智能指数跌3.06%</li>\n  <li>但产业基本面（AI资本开支高增长、HBM供不应求、CPO产业化在即）未变</li>\n  <li>调整本质上是<strong>交易层面的筹码消化</strong>，而非产业逻辑破坏</li>\n</ul>\n\n<p><strong>周末重大事件：</strong></p>\n<ul>\n  <li><strong>DeepSeek首轮融资接近尾声</strong>：获国家大基金领投，投前估值450亿美元（约合人民币3270亿元），融资规模升至700亿元。这是国家大基金成立12年来首次跨界投资纯大模型公司，标志AI产业进入国家队引领阶段</li>\n  <li><strong>明晟MSCI调整生效</strong>：纳入19只中国硬科技股票，集中在光通信、算力、高端制造等领域，全球长线资金加速布局中国硬科技</li>\n  <li><strong>科创人工智能ETF持续吸金</strong>：科创创业人工智能ETF景顺近3天连续净流入，合计吸金5132.69万元；科创人工智能ETF银华规模近10亿，近一年涨超61%</li>\n</ul>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">5月领涨后高位整理</span> <span class=\"pill pill-up\">中期趋势 乐观</span></div>\n<p class=\"sn\"><strong>资金面（5月总结）：</strong>5月算力板块是市场\"最靓的仔\"，北向资金+公募+私募持续加仓。月末最后一周出现集中获利回吐——5月28日AI算力芯片板块主力净流出20.95亿元，29日电子行业整体净流出372亿元。但5月整月来看，算力板块仍是净流入规模最大的方向之一。科创50单月+11%+，主要靠算力/半导体贡献。</p>\n<p class=\"sn\"><strong>政策面：</strong>周末无新增重磅政策。下周<strong>6月2日-5日 Computex 2026台北电脑展</strong>即将召开，主题为\"AI Together\"，英伟达CEO黄仁勋将发表主题演讲，预计发布Vera Rubin架构最新进展、新一代AI芯片及算力方案，是算力板块最重要的催化窗口。此外，下周6月1日DeepSeek V4-Pro模型API优惠期结束（2.5折永久保留），将降低中小企业AI创新门槛。</p>\n<p class=\"sn\"><strong>基本面：</strong>Cerebras（晶圆级AI芯片）5月14日纳斯达克上市首日暴涨89%，市值750亿美元。戴尔AI服务器营收161亿美元同比+757%。四大云厂商2026年资本支出7250亿美元(+77%)，创历史新高。2026全球AI算力报告发布——AI芯片围绕GPU/TPU/NPU多元方向演进，算力正成为国家关键基础要素。华为推出星河AI数据中心网络方案，带宽提升8倍。算力产业基本面<strong>极其强劲</strong>。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场对算力中长期景气的共识高度一致，但短期获利盘压力不容忽视。月末的调整是\"涨多了\"的正常消化。下周Computex大会有望重塑多头信心。关注英伟达主题演讲能否超预期。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">HBM持续紧缺</span> <span class=\"pill pill-up\">中期趋势 乐观</span></div>\n<p class=\"sn\"><strong>资金面（5月总结）：</strong>5月存储板块跟随AI产业链整体走强。月末最后一周出现调整，北向资金在存储龙头上成交活跃但方向偏流出。佰维存储29日盘中逆势上涨0.94%，是为数不多的收红存储股。板块整体处于\"产业极热、股价消化\"的阶段性调整。</p>\n<p class=\"sn\"><strong>基本面（核心亮点）：</strong></p>\n<ul>\n  <li>HBM3E现货价格半年暴涨超300%，单价从数千美元飙升至数万美元，\"有价无货、一芯难求\"</li>\n  <li><strong>三星率先交付首批12层48GB HBM4E样品</strong>，2026年2月已启动HBM4量产，进度领先全球</li>\n  <li>SK海力士目标2027年实现HBM4E量产，2025年下半年推出12层HBM4</li>\n  <li>全球DRAM营收2026年Q1逼近970亿美元（环比+80%，同比+260%），创历史新高</li>\n  <li>HBM在AI芯片成本占比从52%升至63%，涨价至少持续到2027年</li>\n  <li>集邦预测2026年HBM需求再增长70%+</li>\n  <li>苹果计划为20周年iPhone首发HBM内存</li>\n  <li>中信证券：存储行业将从涨价周期转向技术成长共振新周期</li>\n</ul>\n<p class=\"sn\"><strong>情绪面：</strong>产业确定性极高，但短期股价已充分反映涨价预期。HBM仍然是AI产业链中<strong>供需格局最紧张</strong>的环节。A股存储链关注：兆易创新（NOR Flash）、澜起科技（内存接口芯片）、江波龙（企业级SSD）、佰维存储（存储模组）。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">等待宇树IPO催化</span> <span class=\"pill pill-mid\">中期趋势 中性偏乐观</span></div>\n<p class=\"sn\"><strong>资金面（5月总结）：</strong>机器人板块5月经历\"过山车\"行情。5月21日板块大涨（中证机器人+2.26%），但5月27日遭遇\"黑色星期二\"暴跌超7%，主力资金单日净流出超27亿元，28日继续净流出97.76亿元。月末板块整体在调整中，但宇树IPO在即吸引市场目光。</p>\n<p class=\"sn\"><strong>基本面：</strong></p>\n<ul>\n  <li>宇树科技科创板IPO<strong>6月1日（明日）上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元</li>\n  <li>2026年是人形机器人<strong>规模化验证关键期</strong>——产能爬坡、场景落地与技术收敛同步推进</li>\n  <li>海关数据显示4月工业机器人出口量突破2.5万台（同比+90%）</li>\n  <li>特斯拉Optimus预计2026年大规模生产，弗里蒙特产线切换为百万台产能</li>\n  <li>上海\"十五五\"规划推动10万台机器人进工厂</li>\n  <li>2025年中国整机出货量占全球84.71%，宇树科技、智元等行业龙头领跑</li>\n  <li>湘财证券：人形机器人商业化即将兑现，有望成为AI板块内部轮动聚焦点</li>\n</ul>\n<p class=\"sn\"><strong>情绪面：</strong>聚焦宇树科技6月1日上会结果。若顺利过会将为板块注入强心剂——这是A股市场对\"人形机器人\"这一新物种的首次正式定价。但需关注：宇树Q1业绩\"增收不增利\\”（营收+68%，扣非净利-52.55%），盈利模式尚需验证。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">5月最强细分赛道</span> <span class=\"pill pill-up\">中期趋势 乐观</span></div>\n<p class=\"sn\"><strong>资金面（5月总结）：</strong>CPO板块是5月AI链中<strong>表现最强的细分方向</strong>。中际旭创多次冲击成交额A股第一（5月28日单日成交225亿元居A股第一），\"易中天\"（新易盛/中际旭创/天孚通信）齐创历史新高。5月29日科技回调中通信线缆板块逆势净流入39.83亿元，亨通光电主力净流入39.76亿居全市场第一。</p>\n<p class=\"sn\"><strong>基本面：</strong></p>\n<ul>\n  <li>2026年机构定义为<strong>CPO产业化元年</strong>——英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上</li>\n  <li>台积电COUPE硅光整合平台预计2026年量产，推动CPO技术从0到1落地</li>\n  <li>LightCounting预测：100G+可插拔光模块2025年近200亿美元→2030年超500亿美元；CPO 2030年市场规模达100亿美元</li>\n  <li>中际旭创Q1营收194.96亿元（+192%），归母净利57.35亿元（+262%）</li>\n  <li>迈威尔科技上修光互连营收预期至70%+增长</li>\n  <li>博杰股份切入英伟达AI算力/光通信供应链，业绩爆发式反转</li>\n</ul>\n<p class=\"sn\"><strong>情绪面：</strong>CPO产业路径清晰，英伟达/台积电产业化时间表提供确定性指引。但板块短期涨幅已大，光模块龙头需要时间消化获利盘。市场的超额收益正在向产业链<strong>\"新方向\"扩散</strong>——通信线缆（亨通光电、长飞光纤）、PCB（沪电股份等）等延伸环节。国盛证券建议\"重回大光主线\"。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（5月最后一交易日 5/29）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红，估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏预期+618大促</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现（5/29）：</strong></p>\n<ul>\n  <li>全市场主力资金净流出<strong>831.55亿元</strong>（连续多日净流出），其中<strong>电子行业</strong>净流出<strong>372.05亿</strong>居全行业第一</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金从科技全面撤退至防御方向</li>\n  <li>通信线缆是AI板块中<strong>唯一逆势吸金方向</strong>——亨通光电全市场净流入第一(39.76亿)</li>\n  <li>AI相关板块（电子+计算机+通信）合计净流出超过<strong>400亿元</strong>，相对热度降至冰点</li>\n  <li>北向资金成交4734亿元但整体呈净流出态势，外资同样在\"高切低\"</li>\n</ul>\n\n<p><strong>5月整月视角：</strong>尽管月末最后一天出现大幅回调，但5月整月<strong>AI板块资金净流入规模仍居全市场前列</strong>。算力+半导体+光模块三大方向累计净流入超过千亿元。资金并非撤退AI，而是<strong>阶段性高位获利了结、等待下一次介入时机</strong>。</p>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-up\">5月创新高后<br>29日调整</span></td><td>半导体代工龙头，产能满载订单可见度延伸Q4。5月创历史新高后获利回吐，主力净流出31.4亿</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">5/29净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念延伸，科技回调中逆势大涨。5月最后一周资金高度集中</td></tr>\n  <tr><td><strong>中际旭创</strong></td><td>300308</td><td><span class=\"pill pill-up\">\"易中天\"齐创新高</span></td><td>光模块\"一哥\"，Q1营收195亿（+192%），净利57亿（+262%）。月内多次成交额居A股第一，CPO产业化最大受益者</td></tr>\n  <tr><td><strong>宇树科技</strong><br>（待上市）</td><td>—</td><td><span class=\"pill pill-mid\">6/1 IPO上会</span></td><td>A股\"人形机器人第一股\"，拟募资42亿。Q1营收+68%但扣非净利腰斩。市场关注度极高，将是机器人板块的重大催化</td></tr>\n</table>\n\n<hr>\n\n<h2>六、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus量产预期持续发酵，A股核心受益环节及标的梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证环节</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，工业自动化延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td>⭐⭐</td></tr>\n  <tr><td><strong>丝杠</strong></td><td>鼎智科技</td><td>873593</td><td>微型丝杠/行星滚柱丝杠，线性关节核心传动件</td><td>⭐⭐</td></tr>\n  <tr><td><strong>整机</strong></td><td>宇树科技</td><td>待上市</td><td>人形机器人第一股，国内整机出货量领先，技术路线领先</td><td>待观察</td></tr>\n</table>\n\n<p><strong>更新要点：</strong>特斯拉弗里蒙特汽车产线已开启切换为百万台人形机器人产能，国内产业链相关企业有望陆续获得订单确认。宇树科技IPO上会是近期最核心的板块催化剂。机器人板块核心操作思路：<strong>逢调整布局，不追高</strong>，核心仓位以三花、绿的谐波为主。</p>\n\n<hr>\n\n<h2>七、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 5月行情定性</div><div class=\"iv\" style=\"font-size:14px\"><strong>结构性牛市：</strong>科创50月涨11%+领跑全球，算力/AI芯片/光模块成为市场主线。月末\"高切低\"回调属于涨多后的正常筹码消化，产业基本面未变。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周关键事件</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 6/1 宇树科技科创板IPO上会</strong>（人形机器人第一股定价）<br><strong>2) 6/2-6/5 Computex 2026台北电脑展</strong>（全球AI最强催化窗口，关注黄仁勋演讲）<br><strong>3) DeepSeek V4-Pro优惠结束</strong>（6/1，2.5折永久保留）</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">美股三大指数<strong>齐创新高</strong>，纳指六连涨。费城半导体指数持续走强。Snowflake暴涨36%，AI应用商业化验证。美股AI板块热度仍在，A股的调整更多是内部资金博弈，并非全球AI产业趋势逆转。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银75.58美元，72-80美元区间窄幅震荡。5月最后一周V型修复（先跌4.5%后涨3.45%），多空分歧剧烈。中期供给缺口+工业需求（光伏/AI）逻辑稳固，但短期需等待美联储政策路径明朗化。美银预测Q4冲击100美元。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续多日净流出，周一关注资金能否企稳。宇树上会结果若不及预期可能压制机器人板块情绪。白银波动率极高（5月单日跌超9%），注意仓位管理。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">周一关注：①宇树科技上会结果（机器人板块方向标）②A股开盘能否企稳（上周五科技回调，周一是否惯性下探）③Computex大会催化预期发酵情况。<strong>核心策略：逢低分批布局算力/光模块龙头，关注CPO产业链通信线缆方向新机会。</strong></div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260531-1607", "date": "2026-05-31 16:07", "title": "AI板块周末复盘 · 科技高切低 戴尔AI营收+757%飙35% 聚焦明天宇树IPO上会+Computex", "tags": ["周末复盘", "戴尔财报", "高切低", "白银震荡", "宇树IPO", "Computex", "CPO通信线缆"], "summary": "周五科技高切低科创50暴跌5%，隔夜美股戴尔AI营收+757%飙升35%。明日宇树IPO上会+本周Computex双催化。白银75.58美元震荡。", "html": "\n<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4068.57</div><div class=\"lbs\">上证(周五)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+35%↑</div><div class=\"lbs\">戴尔飙升</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX银($)</div></div>\n</div>\n\n<h1>AI板块周末复盘 · 科技高切低 戴尔AI营收+757% 聚焦明天超级催化周</h1>\n<p><strong>时间：</strong>2026-05-31 16:07（周日·A股上周五已收盘·非交易时段）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>A股处于周末休市。上周五（5/29）A股上演全面\"高切低\"——科技全线退潮，科创50暴跌5.04%，电子板块主力净流出372亿，电力/公用事业/通信线缆逆势吸金。但隔夜美股AI全线大涨纳指七连涨创新高，<strong>戴尔AI服务器营收161亿美元+757%，盘后飙升35%创历史新高</strong>。本周进入<strong>超级催化周：明天(6/1)宇树科技IPO上会 + 周二起(6/2-6/5)Computex 2026大会</strong>。COMEX白银期货报75.58美元/盎司，月涨+2.1%收阳。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58美元/盎司</strong> <span class=\"pill pill-down\">5/29收跌-0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>约75.20-75.32美元</strong> <span class=\"pill pill-mid\">75美元附近震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>约18,035元/千克</strong> <span class=\"pill pill-up\">夜盘+0.64%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.02-99.33</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>4,527-4,591美元/盎司</strong> <span class=\"pill pill-up\">金价回稳</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">CFTC白银净多</div><div class=\"iv\"><strong>10,244手</strong> <span class=\"pill pill-down\">周减1,517手</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>COMEX白银5月走势剧烈震荡——月初从70美元启动七连涨至89美元（月内高点），5月18日因美国CPI超预期单日暴跌超9%至73美元，月末企稳75-76美元区间。全月录得<strong>+2.1%</strong>的月涨幅，收阳。当前处于<strong>72-80美元宽幅震荡筑底</strong>阶段，多空双方在75美元一线激烈博弈。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元持续走弱提供底部支撑：</strong>美元指数回落至99附近，对贵金属整体形成支撑</li>\n  <li><strong>通胀粘性：</strong>美国4月PCE物价同比+3.8%创三年新高，抗通胀资产需求升温</li>\n  <li><strong>地缘不确定性：</strong>特朗普称即将对伊朗战事做出\"最终决定\"，中东局势持续扰动市场</li>\n  <li><strong>投机情绪降温：</strong>CFTC数据显示COMEX白银投机净多头减少至10,244手，短线看涨情绪降温</li>\n  <li><strong>工业需求维持高位：</strong>光伏+AI数据中心建设对白银工业需求维持强劲</li>\n  <li><strong>供需缺口：</strong>全球白银连续第六年出现供应短缺，2026年缺口预计约4,630万盎司</li>\n</ul>\n<blockquote>💡 白银自1月121美元历史高点最大回撤约38%，当前72-80美元区间筑底。短线支撑72美元（前低），上方压力80美元整数关口。波动剧烈，注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（上周五5/29收盘回顾）</h2>\n<p>A股上周五高开低走全线收跌，科创50暴跌5.04%领跌全场：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n  <div class=\"info-item\"><div class=\"il\">主力净流出</div><div class=\"iv\" style=\"color:#ef4444\"><strong>-831.55亿元</strong></div></div>\n</div>\n<p>全市场仅<strong>1,565只上涨</strong>，3,867只下跌。食品饮料(+3.02%)、煤炭、公用事业领涨；综合(-5.39%)、国防军工(-4.23%)、<strong>电子(-4%+)</strong>领跌。北向资金成交4,734亿元（占两市14.26%）。典型\"高切低\"——资金从科技抱团品种系统性撤离至防御方向。</p>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>上周五AI板块全面回调，人工智能指数收跌<strong>3.06%</strong>，成交额5,398亿元。两日\"冰火两重天\"——周四创业板首超沪指、\"易中天\"齐创新高→周五全面退潮科创50暴跌5%。</p>\n\n<p><strong>但产业信号在外盘极为强劲：</strong></p>\n<ul>\n  <li>⭐ <strong>美股纳指七连涨创新高</strong>（+0.91%），费城半导体指数+1%创新高</li>\n  <li>⭐ <strong>戴尔Q1 AI服务器营收161亿美元 +757%</strong>，盘后飙升35%创历史新高，全年AI营收预期上调至600亿美元</li>\n  <li>⭐ <strong>Cerebras</strong>上市首日暴涨89%市值达750亿美元</li>\n  <li>⭐ <strong>Anthropic</strong> H轮融资650亿美元估值9,650亿美元反超OpenAI</li>\n  <li><strong>高通+6%</strong>、<strong>ARM+5%</strong>再创新高、美光+3.5%续创新高</li>\n  <li><strong>全球AI资本开支全面上修：</strong>四大云厂商2026年支出7,250亿美元(+77%+)</li>\n</ul>\n\n<p><strong>核心判断：</strong>A股AI板块的调整是<strong>交易层面的筹码消化</strong>（前期涨幅过大后的获利回吐），而非产业逻辑破坏。美股对AI的定价与A股出现了<strong>阶段性背离</strong>——历史上这种背离往往很快会被修正。本周Computex大会+宇树上会双催化有望成为情绪修复的催化剂。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">A股回调 · 美股强势 · 戴尔财报最亮</span></div>\n<p class=\"sn\"><strong>资金面（A股）：</strong>电子行业主力净流出372亿居全行业第一。中芯国际主力净流出31.4亿居全市场第一。算力ETF全线下跌。中际旭创成交225亿A股第一但与昨新高对比鲜明——两日冰火两重天。</p>\n<p class=\"sn\"><strong>资金面（美股）：</strong>隔夜美股AI全面大涨——高通+6%、ARM+5%创新高、博通+3.2%、美光+3.5%续创新高。<strong>戴尔盘后飙升35%</strong>，AI需求定价仍在强化。</p>\n<p class=\"sn\"><strong>基本面（最强确认）：</strong><strong>戴尔Q1 AI服务器营收161亿美元+757%</strong>，全年AI预期上调至600亿美元——全球最强AI硬件业绩验证。Cerebras上市+89%（4万亿晶体管晶圆级芯片）。华为推出星河AI数据中心网络方案（带宽提升8倍）。四大云厂商2026年资本支出7,250亿美元(+77%)。</p>\n<p class=\"sn\"><strong>政策面：</strong>本周<strong>Computex 2026（6/2-6/5）</strong>以\"AI Together\"为主题——英伟达黄仁勋主题演讲预计发布Vera Rubin架构新细节。发改委\"人工智能+\"升级为全面实施。工信部\"模数共振\"行动推进。</p>\n<p class=\"sn\"><strong>情绪面：</strong>A股短期谨慎但美股情绪持续升温。戴尔财报传导效应将对明天A股AI服务器方向形成直接催化。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">产业景气最强环节 · 供需最紧张</span></div>\n<p class=\"sn\"><strong>资金面：</strong>北向资金在存储龙头上交投活跃但方向偏流出。澜起科技沪股通成交42亿、兆易创新33.86亿。佰维存储逆势上涨0.94%成为存储股中少有的红盘。</p>\n<p class=\"sn\"><strong>基本面（全线超预期）：</strong>全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（环比+80%，同比+260%）创历史新高。<strong>HBM3E现货价半年暴涨超300%</strong>。三星率先交付首批12层48GB HBM4E样品（6nm DRAM工艺）。HBM在AI芯片成本占比从52%升至63%。集邦预测2026年HBM需求再增70%+。<strong>美光警告内存短缺将延续至2026年后</strong>。闪迪CTO：AI竞赛正在变成\"拼内存\"。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强劲但股价短期已充分反映涨价预期，获利资金同样兑现。HBM是AI产业链中<strong>供需格局最紧张</strong>的环节，中长期确定性极高。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">等待明天(6/1)宇树IPO上会催化</span></div>\n<p class=\"sn\"><strong>资金面：</strong>延续净流出态势但成交缩量——抛压在消化中。奥比中光在科创AI指数中相对抗跌(+0.84%)。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>人形机器人规模化验证关键期</strong>。<strong>宇树科技科创板IPO明日（6月1日）上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。4月工业机器人出口2.5万台（同比+90%）。特斯拉Optimus Gen-3 Q2启动量产，首代目标年产能100万台。Figure 03已开启全天候包裹分拣直播。小鹏IRON三季度亮相年底量产。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场静待宇树科技明早上会结果。若顺利过会将成机器人板块标志性催化剂，带动板块情绪企稳回升。但注意宇树Q1\"增收不增利\"（扣非净利-52%），上会可能面临挑战。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强</span></div>\n<p class=\"sn\"><strong>资金面：</strong>板块内部分化显著——光模块龙头中际旭创高位震荡，但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>居全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产。鸿海CPO全光交换机出货目标从此前1万台大幅上调至5万台以上。台积电启动全球首款200Gbps微环调制器量产。LightCounting预测2030年CPO市场达100亿美元。中际旭创Q1营收195亿(+192%)净利57亿(+262%)。Lumentum产能售罄至2028年。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正寻找CPO产业链\"新面孔\"——通信线缆方向获得集中配置（亨通光电、长飞光纤等）。光模块龙头短期调整属获利回吐，产业逻辑不变。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（周五TOP8）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御大规模迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联新方向 🔥</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>茅台主力净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出。仅10个行业获净流入，21个行业净流出</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>全行业第一（AI科技方向全面失血）</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金全面转向防御方向</li>\n  <li><strong>通信线缆</strong>是AI板块中唯一逆势吸金方向——亨通光电全市场主力净流入居首(39.76亿)</li>\n  <li>AI板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至冰点</li>\n  <li><strong>关键反差：</strong>A股周五AI是全市场最大失血方向；隔夜美股AI相反——戴尔+35%、纳指七连涨、Cerebras+89%</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>市场</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>戴尔科技</strong></td><td>NYSE</td><td><span class=\"pill pill-up\">盘后飙升+35%<br>创历史新高</span></td><td>Q1 AI服务器营收161亿美元+757%，上调全年AI预期至600亿美元——全球最强AI硬件业绩验证</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>A股 600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联新方向获资金集中追捧</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>A股 688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐，昨日创历史新高后今日大幅回调</td></tr>\n</table>\n\n<hr>\n\n<h2>六、主力资金增仓TOP10个股（周五）</h2>\n<table>\n  <tr><th>#</th><th>个股</th><th>净流入(亿)</th><th>板块</th></tr>\n  <tr><td><strong>1</strong></td><td>亨通光电</td><td><span class=\"green\">39.76</span></td><td>通信线缆/CPO</td></tr>\n  <tr><td><strong>2</strong></td><td>长芯博创</td><td><span class=\"green\">13.31</span></td><td>光通信</td></tr>\n  <tr><td><strong>3</strong></td><td>兴森科技</td><td><span class=\"green\">12.46</span></td><td>PCB/AI服务器</td></tr>\n  <tr><td><strong>4</strong></td><td>剑桥科技</td><td><span class=\"green\">11.73</span></td><td>光模块/通信</td></tr>\n  <tr><td><strong>5</strong></td><td>宁德时代</td><td><span class=\"green\">10.48</span></td><td>新能源</td></tr>\n  <tr><td><strong>6</strong></td><td>长飞光纤</td><td><span class=\"green\">10.39</span></td><td>光纤光缆/CPO</td></tr>\n  <tr><td><strong>7</strong></td><td>中国中免</td><td><span class=\"green\">9.87</span></td><td>消费旅游</td></tr>\n  <tr><td><strong>8</strong></td><td>中天科技</td><td><span class=\"green\">9.35</span></td><td>通信线缆</td></tr>\n  <tr><td><strong>9</strong></td><td>贵州茅台</td><td><span class=\"green\">9.19</span></td><td>白酒</td></tr>\n  <tr><td><strong>10</strong></td><td>华能蒙电</td><td><span class=\"green\">8.42</span></td><td>电力</td></tr>\n</table>\n<p><strong>关键观察：</strong>通信线缆/光通信方向占据TOP10中的<strong>4席</strong>（亨通光电、长芯博创、剑桥科技、长飞光纤），合计净流入约<strong>75亿元</strong>。CPO产业链向通信线缆延伸是周五全市场最具确定性的资金流向。</p>\n\n<hr>\n\n<h2>七、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3已下线投入内部测试，Q2正式启动量产，首代目标年产能100万台。2026年是<strong>人形机器人从0到1的规模化量产兑现阶段</strong>。中国供应链核心受益梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证环节</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，工业自动化延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机，灵巧手核心驱动</td><td>⭐⭐</td></tr>\n</table>\n<p><strong>核心催化：明天(6/1)宇树科技IPO上会</strong>——若顺利过会将为人形机器人板块注入强心剂。整体策略<strong>逢低布局</strong>，核心以三花+绿的为主。</p>\n\n<hr>\n\n<h2>八、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股周末休市。周五高切低全线回调（科创50-5.04%），但隔夜美股AI全线大涨戴尔+35%、纳指七连涨创新高。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 本周超级催化周历</div><div class=\"iv\" style=\"font-size:14px\"><strong>明天周一(6/1)：宇树科技IPO上会</strong>（人形机器人第一股）<br><strong>周二-周五(6/2-6/5)：Computex 2026</strong><br>— 英伟达黄仁勋主题演讲（预计Vera Rubin架构细节）<br>— 戴尔AI服务器财报A股传导效应<br>— AMD/英特尔AI新品发布</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 明天(6/1)推演</div><div class=\"iv\" style=\"font-size:14px\">受<strong>戴尔财报+35%飙升</strong>和美股AI全面上涨带动，A股AI板块有望<strong>高开</strong>。关键看成交量：放量则有望企稳反弹。通信线缆方向（亨通光电）可能延续强势。宇树上会结果决定机器人板块方向。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银72-80美元区间宽幅震荡。美元走弱+通胀粘性提供支撑，但上方突破80美元需更强催化剂。月线+2.1%收阳显示多头基础仍在。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">①A股主力资金连续多日大额净流出 ②美伊局势若恶化将冲击风险偏好 ③科技股估值偏高需时间消化 ④宇树上会若遇阻将打压机器人情绪</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>1)</strong> 关注戴尔财报对AI服务器/算力方向的传导效应（明日早盘）<br><strong>2)</strong> Computex窗口逢低布局算力/光模块/PCB龙头<br><strong>3)</strong> 关注CPO通信线缆新方向（亨通/长飞/剑桥）<br><strong>4)</strong> 宇树上会结果决定机器人板块方向<br><strong>5)</strong> 核心仓位不动，利用调整降低成本<br><strong>6)</strong> 白银区间操作：72附近低吸，80附近高抛</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>\n"}, {"id": "mon-20260531-1707", "date": "2026-05-31 17:07", "title": "AI板块周末盘前复盘 · A股休市 白银震荡 戴尔AI营收爆表+35% 聚焦明天宇树IPO上会+Computex", "tags": ["周末复盘", "戴尔财报", "白银震荡", "Computex", "宇树科技", "高切低"], "summary": "A股休市。戴尔AI营收+757%飙升35%，美股AI大涨。明天宇树IPO上会(6/1)+Computex(6/2)最强催化。", "html": "\n<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">休市</div><div class=\"lbs\">A股状态</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX银($)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.43%</div><div class=\"lbs\">银日内</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+35%↑</div><div class=\"lbs\">戴尔财报飙升</div></div>\n</div>\n\n<h1>AI板块周末盘前复盘 · A股休市 戴尔AI营收爆表 明天宇树IPO上会+Computex开幕</h1>\n<p><strong>时间：</strong>2026-05-31 17:07（A股上周五已收盘，周日休市）</p>\n\n<div class=\"tagline\">📌 <strong>核心观点：</strong>A股周末休市中。上周五（5/29）科技全面退潮科创50暴跌5.04%，市场\"高切低\"特征显著。但隔夜<strong>戴尔财报AI服务器营收+757%爆表，盘后飙升35%创历史新高</strong>，美股AI全线大涨纳指七连涨创新高——AI产业基本面强势不改。明日（6/1）<strong>宇树科技IPO上会</strong> + 后天（6/2）<strong>Computex大会开幕</strong>是AI板块最强催化窗口，板块有望迎来情绪修复。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>约75.2 美元/盎司</strong> <span class=\"pill pill-mid\">区间震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>约18,035 元/千克</strong> <span class=\"pill pill-up\">夜盘 +0.64%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.02-99.33</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金期货</div><div class=\"iv\"><strong>4,569.9 美元/盎司</strong> <span class=\"pill pill-up\">日内 +0.83%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">CFTC白银净多</div><div class=\"iv\">10,244手 <span class=\"pill pill-down\">周减1,517手</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>COMEX白银期货本周（5/26-5/30）剧烈震荡——周一报77.27美元，周三深跌至73.29美元（-2.84%），周四强力反弹至76.08美元（+3.81%），周五回落至75.58美元（-0.43%）。周跌幅约0.81%，5月累计涨幅约+2.1%。整体处于<strong>72-80美元宽幅震荡区间</strong>，多空在75美元一线激烈博弈。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元走弱提供支撑：</strong>美元指数持续回落至99附近低位运行，对贵金属形成底部支撑</li>\n  <li><strong>通胀粘性：</strong>美国4月PCE物价同比+3.8%创三年新高，抗通胀资产需求升温</li>\n  <li><strong>美伊不确定：</strong>特朗普称即将对伊朗战事做出\"最终决定\"，霍尔木兹海峡局势持续高不确定性</li>\n  <li><strong>投机情绪降温：</strong>CFTC显示COMEX白银投机净多头减少1,517手至10,244手，短线看涨情绪降温</li>\n  <li><strong>工业需求托底：</strong>光伏+AI数据中心对白银工业需求维持高位，中长期基本面偏多</li>\n  <li><strong>波动率放大：</strong>5月中旬银价单日暴跌超9%后市场波动率系统性提升，价格急涨急跌</li>\n</ul>\n<blockquote>💡 白银自1月121美元历史高点已回落约38%，当前72-80美元区间筑底。短线支撑72美元（前低），上方压力80美元整数关口。沪银夜盘+0.64%显示国内买盘尚可。波动剧烈注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（A股5/29周五收盘回顾）</h2>\n<p>A股上周五高开低走全线收跌，科创50暴跌5.04%领跌全场：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n</div>\n\n<p>全市场仅<strong>1565只上涨</strong>，3867只下跌。主力资金净流出<strong>831.55亿元</strong>。<strong>电子行业</strong>主力净流出<strong>372.05亿元</strong>居全行业第一。北向资金成交4734亿元（占两市14.26%）。食品饮料(+3.02%)/煤炭/公用事业领涨；综合(-5.39%)/军工(-4.23%)/电子(-4%+)领跌。</p>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>周五AI板块全面回调，人工智能指数收跌<strong>3.06%</strong>，成交额5398亿元。两日\"冰火两重天\"说明市场情绪极度敏感。主力资金正在<strong>系统性从高位科技抱团品种撤退</strong>，转向电力/消费等防御方向。</p>\n\n<p><strong>但积极信号在外盘——隔夜美股AI全线大涨：</strong></p>\n<ul>\n  <li><strong>纳指七连涨创新高</strong>（+0.91%），费城半导体+1%创新高</li>\n  <li><strong>戴尔科技</strong> Q1 AI服务器营收<strong>161亿美元 同比+757%</strong>，盘后飙升<strong>+35%</strong>创历史新高</li>\n  <li><strong>Cerebras</strong>上市首日暴涨89%市值达750亿美元</li>\n  <li><strong>高通+6%</strong>、<strong>ARM+5%</strong>再创新高、美光+3.5%续创新高、微软+3%</li>\n</ul>\n\n<p><strong>核心判断：</strong>A股AI调整是<strong>交易层面的筹码消化</strong>（前期涨幅过大后的获利回吐），而非产业逻辑破坏。戴尔财报+35%是AI产业景气度最强确认信号。明天（6/1）Computex大会前最后一个交易日，板块有望企稳。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">A股回调 · 美股戴尔+35%引爆</span></div>\n<p class=\"sn\"><strong>资金面：</strong>电子行业主力净流出372亿居全行业第一。中芯国际主力净流出31.4亿居全市场第一。但美股AI全面大涨——戴尔盘后+35%、高通+6%、ARM+5%。</p>\n<p class=\"sn\"><strong>基本面（重磅催化）：</strong><strong>戴尔Q1 AI服务器营收161亿美元同比+757%</strong>，上调全年AI营收预期至<strong>600亿美元</strong>——这是全球AI基建投资加速的最强确认信号。Cerebras上市首日+89%市值750亿美元。四大云厂商2026年资本支出合计7250亿美元（+77%）。联想集团财报后港股暴涨22.46%。华为推出星河AI数据中心网络方案。</p>\n<p class=\"sn\"><strong>政策面：</strong>明天<strong>Computex 2026（6/2-6/5）</strong>以\"AI Together\"为主题开幕，英伟达黄仁勋主题演讲预计发布Vera Rubin架构细节。发改委\"人工智能+\"全面实施。工信部发布AI伦理审查服务先导计划（6月1日启动）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>A股短期谨慎，但美股AI持续升温。戴尔+35%、Cerebras+89%、纳指新高构成AI产业热度最直接证明。明天关注戴尔传导效应在A股早盘的反应。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">产业景气最强环节</span></div>\n<p class=\"sn\"><strong>资金面：</strong>北向在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但方向偏流出。佰维存储逆势上涨0.94%。</p>\n<p class=\"sn\"><strong>基本面（全线超预期）：</strong>全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（+260%），创历史新高。<strong>HBM3E现货价半年暴涨超300%</strong>。三星率先交付首批12层48GB HBM4E样品，性能提升超20%。美光警告内存短缺持续至2026年后。HBM在AI芯片成本占比从52%升至63%。集邦预测2026年HBM需求再增70%+。闪迪CTO：AI竞赛正在变成\"拼内存\"。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为亮眼但股价已充分反映涨价预期。HBM是AI产业链中<strong>供需格局最紧张</strong>的环节，中长期确定性极高。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">等待明天宇树上会</span></div>\n<p class=\"sn\"><strong>资金面：</strong>延续净流出但成交缩量——抛压在消化中。奥比中光相对抗跌(+0.84%)。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>宇树科技科创板IPO明日（6/1）上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。2026年是人形机器人规模化验证关键期。4月工业机器人出口2.5万台（同比+90%）。特斯拉Optimus Gen-3 Q2启动量产，首代目标年产能100万台。Figure 03机器人全天候包裹分拣直播展示全流程闭环。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场静待宇树上会结果。若顺利过会将为机器人板块注入强心剂——6月1日可能是板块情绪的重要分水岭。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强</span></div>\n<p class=\"sn\"><strong>资金面：</strong>光模块龙头中际旭创高位震荡，但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产。鸿海CPO全光交换机出货目标上调至5万台以上。台积电已启动全球首款200Gbps微环调制器量产。Lumentum产能售罄至2028年。LightCounting预测2030年CPO市场规模达100亿美元。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正在寻找CPO产业链\"新面孔\"——通信线缆方向获集中配置。光模块龙头短期调整属获利回吐。但斌转发CPO视频引发关注。明天Computex大会CPO新技术将是重要看点。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（周五TOP8）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>科技→防御大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联新方向</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>（全行业第一）</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金全面转向防御</li>\n  <li><strong>通信线缆</strong>是AI板块中唯一逆势吸金方向——亨通光电全市场第一</li>\n  <li>AI相关板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至冰点</li>\n  <li><strong>对比：</strong>周五AI板块是全市场最大\"失血\"方向，但隔夜美股反之——AI是全市场最大\"吸金\"方向。A股和美股出现阶段性背离。</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>市场</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>戴尔科技</strong></td><td>NYSE</td><td><span class=\"pill pill-up\">盘后飙升+35%<br>创历史新高</span></td><td>Q1 AI服务器营收<strong>161亿美元 同比+757%</strong>，上调全年AI预期至600亿美元。全球AI硬件最强业绩验证。</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>A股(600487)</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联新方向，资金集中追捧</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>A股(688981)</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐，昨日创新高后大幅回调，拖累AI板块</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>港股</td><td><span class=\"pill pill-up\">+22.46%</span></td><td>财报超预期，AI服务器成核心增长引擎</td></tr>\n</table>\n\n<hr>\n\n<h2>六、主力资金增仓TOP10个股（周五）</h2>\n<table>\n  <tr><th>#</th><th>个股</th><th>净流入(亿)</th><th>板块</th></tr>\n  <tr><td><strong>1</strong></td><td>亨通光电</td><td><span class=\"green\">39.76</span></td><td>通信线缆/CPO</td></tr>\n  <tr><td><strong>2</strong></td><td>长芯博创</td><td><span class=\"green\">13.31</span></td><td>光通信</td></tr>\n  <tr><td><strong>3</strong></td><td>兴森科技</td><td><span class=\"green\">12.46</span></td><td>PCB/AI服务器</td></tr>\n  <tr><td><strong>4</strong></td><td>剑桥科技</td><td><span class=\"green\">11.73</span></td><td>光模块/通信</td></tr>\n  <tr><td><strong>5</strong></td><td>宁德时代</td><td><span class=\"green\">10.48</span></td><td>新能源</td></tr>\n  <tr><td><strong>6</strong></td><td>长飞光纤</td><td><span class=\"green\">10.39</span></td><td>光纤光缆/CPO</td></tr>\n  <tr><td><strong>7</strong></td><td>中国中免</td><td><span class=\"green\">9.87</span></td><td>消费旅游</td></tr>\n  <tr><td><strong>8</strong></td><td>中天科技</td><td><span class=\"green\">9.35</span></td><td>通信线缆</td></tr>\n  <tr><td><strong>9</strong></td><td>贵州茅台</td><td><span class=\"green\">9.19</span></td><td>白酒</td></tr>\n  <tr><td><strong>10</strong></td><td>华能蒙电</td><td><span class=\"green\">8.42</span></td><td>电力</td></tr>\n</table>\n<p><strong>观察：</strong>通信线缆/光通信方向占据TOP10中的<strong>4席</strong>（亨通、长芯博创、剑桥、长飞），CPO延伸方向是周五全市场唯一获集中配置的AI相关方向。</p>\n\n<hr>\n\n<h2>七、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3已下线投入内部测试，Q2启动量产，首代目标年产能100万台。明日宇树科技IPO上会为最强催化剂：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机核心驱动</td><td>⭐⭐</td></tr>\n</table>\n<p>2026年是人形机器人<strong>从0-1量产兑现阶段</strong>。明天宇树科技IPO上会是板块标志性事件，适合<strong>逢低布局</strong>。</p>\n\n<hr>\n\n<h2>八、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股周末休市（周五高切低全线回调，科创50-5.04%）。隔夜戴尔AI营收+757%飙升35%，美股AI全线大涨。AI产业热度仍在，调整是内部筹码问题。</div></div>\n  <div
