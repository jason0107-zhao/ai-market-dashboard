class=\"info-item\"><div class=\"il\">👀 明日关键事件 6/1</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 宇树科技IPO上会</strong>——人形机器人第一股，或成板块分水岭<br><strong>2) 戴尔财报+35%传导效应</strong>——A股AI服务器/算力链有望高开<br><strong>3) Computex大会预热</strong>——6/2-6/5 AI年度最强催化</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 周一推演</div><div class=\"iv\" style=\"font-size:14px\">戴尔财报+35%和美股AI全面上涨有望带动A股AI板块<strong>高开</strong>。关键：成交量能否放大。若放量反弹则有望企稳；若缩量上冲则需警惕\"高开低走\"。通信线缆方向（亨通光电）可能延续强势。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银72-80美元区间宽幅震荡。美元走弱提供支撑。突破80美元需更强催化剂。沪银夜盘+0.64%显示国内买盘尚可。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续大额净流出。若高开但量能不足，需警惕\"高开低走\"。仓位管理第一。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>1)</strong> 关注戴尔财报对A股AI服务器/算力产业链的传导<br><strong>2)</strong> 逢低布局算力/光模块/PCB龙头，等待Computex催化<br><strong>3)</strong> 重点关注CPO通信线缆新方向（亨通/长飞/剑桥）<br><strong>4)</strong> 宇树上会结果决定机器人板块方向</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>\n"}, {"id": "mon-20260531-1807", "date": "2026-05-31 18:07", "title": "AI板块周末复盘 · 白银75美元震荡 戴尔AI营收+757%全球最强印证 下周Computex/宇树上会三重催化", "tags": ["周末复盘", "白银震荡", "戴尔财报", "Computex", "宇树科技", "高切低", "CPO通信线缆"], "summary": "A股周末休市。周五科技高切低科创50跌5%。隔夜美股AI大涨纳指新高，戴尔AI营收+757%盘后飙升35%。", "html": "\n<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX银($)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.43%</div><div class=\"lbs\">银本周涨跌</div></div>\n  <div class=\"metric-box\"><div class=\"num\">休市</div><div class=\"lbs\">A股状态</div></div>\n  <div class=\"metric-box\"><div class=\"num\">6/2→</div><div class=\"lbs\">Computex</div></div>\n</div>\n\n<h1>AI板块周末盘前复盘 · 白银75美元震荡 戴尔财报引爆全球AI情绪</h1>\n<p><strong>时间：</strong>2026-05-31 18:07（A股周末休市，下周一6月1日起恢复交易）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>当前A股处于周日休市状态。上周五科技板块全面退潮（科创50-5.04%），但隔夜美股AI全线大涨纳指新高。戴尔Q1 AI服务器营收161亿美元同比+757%盘后飙升35%，创历史新高。下周<strong>三重催化密集：6/1宇树科技IPO上会（人形机器人第一股）+ 6/2-6/5 Computex 2026大会（全球AI最强催化窗口）+ 戴尔财报传导效应</strong>，AI板块有望迎来情绪修复。COMEX白银期货报75.58美元，周跌0.81%，5月仍收涨2.1%。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">周涨跌</div><div class=\"iv\"><span class=\"pill pill-down\">-0.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">5月涨跌</div><div class=\"iv\"><span class=\"pill pill-up\">+2.1%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>约75.85 美元/盎司</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>18,280 元/千克</strong>（白银T+D）</div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.0-99.33</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金期货</div><div class=\"iv\"><strong>4,569.9 美元/盎司</strong> <span class=\"pill pill-up\">周涨+0.28%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美10年国债</div><div class=\"iv\"><strong>4.497%</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">CFTC银净多</div><div class=\"iv\">10,244手 <span class=\"pill pill-down\">周减1,517手</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>COMEX白银期货5月29日收于75.58美元/盎司（-0.43%），周跌0.81%，但5月整体仍录得<strong>+2.1%</strong>的月涨幅。白银自1月29日创下121美元历史高点后大幅回落，5月中旬经历剧烈波动——七连涨至近90美元后单日暴跌超9%至73美元，近期在<strong>72-80美元宽幅震荡区间</strong>筑底。国内白银T+D报约18,280元/千克。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元持续走弱：</strong>美元指数报99.0附近，创近期新低，对贵金属整体形成底部支撑</li>\n  <li><strong>美伊地缘风险：</strong>特朗普称即将对伊朗战事做出\"最终决定\"，中东局势不确定性维持高位</li>\n  <li><strong>通胀粘性：</strong>美国4月PCE同比+3.8%创三年新高，抗通胀资产需求升温</li>\n  <li><strong>投机情绪降温：</strong>CFTC数据显示投机净多头周减1,517手至10,244手，短线看涨情绪弱化</li>\n  <li><strong>印度加征进口税：</strong>印度将白银进口关税从6%大幅提高至15%，可能减少来自印度的实物需求</li>\n  <li><strong>供给持续短缺：</strong>全球白银供应已连续第六年短缺，2026年缺口预计扩大至4,630万盎司</li>\n  <li><strong>机构观点分化：</strong>美银看年底冲击100美元但称\"昙花一现\"，瑞银、高盛观点分歧明显</li>\n</ul>\n<blockquote>💡 白银当前处于历史高位（121美元）回落后的<strong>宽幅震荡筑底阶段</strong>（72-80美元）。短线支撑72美元（前低），上方压力80美元整数关口。波动剧烈（5月单日曾跌超9%），操作上以区间策略为主，跌破72美元需警惕深调风险。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（5月29日周五收盘回顾）</h2>\n<p>A股周五高开低走全线收跌，科创50暴跌5.04%领跌全场：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n  <div class=\"info-item\"><div class=\"il\">主力资金</div><div class=\"iv\"><span class=\"pill pill-down\">净流出831.55亿</span></div></div>\n</div>\n\n<p>全市场仅<strong>1565只上涨</strong>，3867只下跌。涨跌比约3:7。电子行业主力净流出<strong>372.05亿元</strong>居全行业第一。北向资金成交4734亿元（占两市14.26%），宁德时代/中际旭创/天孚通信为深股通成交前三。</p>\n\n<p><strong>盘面特征（极致\"高切低\"）：</strong></p>\n<ul>\n  <li><strong>食品饮料</strong>涨3.02%领涨，煤炭/公用事业涨超2%——资金全面转向防御</li>\n  <li><strong>综合</strong>跌5.39%领跌，国防军工/电子跌超4%——科技板块全面失血</li>\n  <li>周四创业板首超沪指的\"里程碑\"被周五全面退潮迅速抹平</li>\n  <li><strong>两日\"冰火两重天\"</strong>说明市场情绪极度敏感，主力资金正从高位科技抱团品种<strong>系统性撤离</strong></li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>周五AI板块全面回调，人工智能指数收跌<strong>3.06%</strong>，成交额5398亿元。</p>\n\n<p><strong>但积极信号在外盘：</strong></p>\n<ul>\n  <li><strong>美股AI全线大涨纳指新高</strong>——纳指七连涨创新高（+0.91%），费城半导体+1%</li>\n  <li><strong>戴尔财报爆表 +35%：</strong>AI服务器营收<strong>161亿美元同比+757%</strong>，上调全年AI预期至<strong>600亿美元</strong>——这是全球AI基建投资加速的最强确认信号</li>\n  <li><strong>Cerebras +89%：</strong>晶圆级AI芯片公司上市首日市值冲到750亿美元</li>\n  <li><strong>高通+6%、ARM+5%</strong>再创新高、<strong>美光+3.5%</strong>续创新高、<strong>微软+3%</strong></li>\n</ul>\n\n<p><strong>核心判断：</strong>A股AI板块的调整是<strong>交易层面的筹码消化</strong>（前期涨幅过大后的获利回吐），而非产业逻辑破坏。隔夜美股AI的全面上涨和戴尔的暴增财报提供了强有力的基本面背书。下周Computex大会+宇树上会+戴尔传导效应三重催化，AI板块有望迎来情绪修复。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">A股回调 · 美股最强 · 戴尔+35%最强背书</span></div>\n<p class=\"sn\"><strong>资金面（A股）：</strong>电子行业主力净流出372亿居全行业第一。中芯国际主力净流出31.4亿全市场第一。算力ETF全线下跌。</p>\n<p class=\"sn\"><strong>资金面（美股）：</strong>隔夜美股AI全面大涨——高通+6%、ARM+5%创新高、博通+3.2%、美光+3.5%续创新高。戴尔财报后+35%创历史新高。AI算力的全球定价仍在强化。</p>\n<p class=\"sn\"><strong>基本面（最强信号）：</strong>①戴尔AI服务器营收161亿美元+757%，上调全年至600亿美元；②Cerebras上市+89%市值750亿美元；③四大云厂商2026资本支出合计7250亿美元(+77%)；④华为推出星河AI数据中心网络方案，NPU与存储直通带宽提升8倍；⑤国产AI芯片9款获安全可靠I级认证。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周<strong>Computex 2026（6/2-6/5）</strong>以\"AI Together\"为主题，英伟达黄仁勋主题演讲预计发布Vera Rubin相关架构和AI芯片最新路线图。发改委\"人工智能+\"从深化拓展升级为全面实施。</p>\n<p class=\"sn\"><strong>情绪面：</strong>A股短期谨慎，美股情绪持续升温。戴尔财报的情绪传导效应是周一最需关注的核心变量——AI服务器/算力供应链标的（浪潮信息、工业富联、中科曙光等）有望受提振。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">全球产业景气最强环节 · 回调即布局</span></div>\n<p class=\"sn\"><strong>资金面：</strong>北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但整体方向偏流出。佰维存储逆势上涨0.94%。</p>\n<p class=\"sn\"><strong>基本面（全线超预期）：</strong>①HBM3E现货价<strong>半年暴涨超300%</strong>；②全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（+260%创历史新高）；③三星率先交付首批12层48GB HBM4E样品（性能提升超20%）；④HBM在AI芯片成本占比从52%升至63%；⑤集邦预测2026年HBM需求再增70%+；⑥美光警告内存短缺持续至2026年后；⑦闪迪CTO：AI竞赛正在变成\"拼内存\"；⑧DDR5价格较2025年中暴涨300%+。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为亮眼，但股价已充分反映涨价预期。中长期来看HBM是AI产业链中<strong>供需格局最紧张</strong>的环节，回调即分批布局机会。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">6/1宇树上会 万众瞩目</span></div>\n<p class=\"sn\"><strong>资金面：</strong>延续抛压态势但成交缩量——筹码正在消化中。奥比中光在科创AI指数中相对抗跌(+0.84%)。</p>\n<p class=\"sn\"><strong>基本面（密集催化）：</strong>①<strong>宇树科技科创板IPO 6月1日上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元；②小鹏宣布2026年完成人形机器人量产，新一代IRON三季度亮相; ③4月工业机器人出口量突破2.5万台（同比+90%）；④特斯拉Optimus Gen-3 Q2启动量产，首代目标年产100万台；⑤Figure 03机器人开启全天候包裹分拣直播。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场静待宇树科技6月1日上会结果。若顺利过会将为机器人板块注入标志性催化剂，带动板块情绪企稳回升。当前属于<strong>等待催化剂真空期</strong>的正常调整。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">唯一逆势吸金方向 · 通信线缆新方向亮眼</span></div>\n<p class=\"sn\"><strong>资金面：</strong>板块内部分化——光模块龙头中际旭创高位震荡（成交225亿A股第一），但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>① 2026年是<strong>CPO产业化元年</strong>——英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上；②台积电COUPE封装加速推进，光子互连列为最核心架构层级；③Lumentum光通信组件产能已售罄至2028年；④LightCounting预测2030年CPO市场达100亿美元；⑤中际旭创Q1营收195亿(+192%)，净利57亿(+262%)。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正寻找CPO产业链\"新面孔\"——通信线缆方向成为新焦点。但斌转发CPO视频引发市场对产业的广泛关注。光模块龙头的短期调整属获利回吐，产业逻辑不变。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（5月29日周五TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>科技→防御资金大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联新方向</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红+估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>茅台主力净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>煤炭</td><td><span class=\"green\">+10.88</span></td><td>神华净流入2.83亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出，市场整体偏弱</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>（全行业第一）——AI科技方向全面失血</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金全面转向防御方向</li>\n  <li><strong>通信线缆</strong>是AI板块中<strong>唯一逆势吸金方向</strong>——亨通光电全市场主力净流入第一</li>\n  <li>AI板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至近期冰点</li>\n  <li><strong>A股vs美股背离：</strong>A股AI是最大\"失血\"方向，美股AI是最大\"吸金\"方向，定价出现阶段性背离</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码/市场</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>戴尔科技</strong></td><td>NYSE</td><td><span class=\"pill pill-up\">盘后飙升+35%<br>创历史新高</span></td><td>Q1 AI服务器营收161亿美元同比+757%! 上调全年AI预期至600亿美元。全球最强AI硬件业绩验证。</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念新方向延伸，获主力资金集中追捧。中天科技同步走强（+9.35亿）。</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐最为严重。周四创历史新高后周五大幅回调，拖累整个AI板块情绪。</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>HK.0992</td><td><span class=\"pill pill-up\">+22.46%</span></td><td>财报超预期，AI服务器业务成为核心增长引擎，验证全球AI硬件景气度。</td></tr>\n  <tr><td><strong>博杰股份</strong></td><td>002975</td><td><span class=\"pill pill-up\">连续涨停</span></td><td>AI算力+业绩爆发（2025净利+557%），切入英伟达供应链，液冷测试设备小批量发货。</td></tr>\n</table>\n\n<hr>\n\n<h2>六、主力资金增仓TOP10个股（5月29日周五）</h2>\n<table>\n  <tr><th>#</th><th>个股</th><th>净流入(亿元)</th><th>板块归属</th></tr>\n  <tr><td><strong>1</strong></td><td>亨通光电 (600487)</td><td><span class=\"green\">39.76</span></td><td>通信线缆/CPO 🏆</td></tr>\n  <tr><td><strong>2</strong></td><td>长芯博创</td><td><span class=\"green\">13.31</span></td><td>光通信</td></tr>\n  <tr><td><strong>3</strong></td><td>兴森科技</td><td><span class=\"green\">12.46</span></td><td>PCB/AI服务器</td></tr>\n  <tr><td><strong>4</strong></td><td>剑桥科技 (603083)</td><td><span class=\"green\">11.73</span></td><td>光模块/通信</td></tr>\n  <tr><td><strong>5</strong></td><td>宁德时代 (300750)</td><td><span class=\"green\">10.48</span></td><td>新能源</td></tr>\n  <tr><td><strong>6</strong></td><td>长飞光纤 (601869)</td><td><span class=\"green\">10.39</span></td><td>光纤光缆/CPO</td></tr>\n  <tr><td><strong>7</strong></td><td>中国中免</td><td><span class=\"green\">9.87</span></td><td>消费旅游</td></tr>\n  <tr><td><strong>8</strong></td><td>中天科技 (600522)</td><td><span class=\"green\">9.35</span></td><td>通信线缆</td></tr>\n  <tr><td><strong>9</strong></td><td>贵州茅台 (600519)</td><td><span class=\"green\">9.19</span></td><td>白酒</td></tr>\n  <tr><td><strong>10</strong></td><td>华能蒙电</td><td><span class=\"green\">8.42</span></td><td>电力</td></tr>\n</table>\n<p><strong>关键观察：</strong>通信线缆/光通信方向占据TOP10中的<strong>4席</strong>（亨通光电、长芯博创、剑桥科技、长飞光纤），CPO产业链延伸方向是全市场唯一获得集中配置的AI相关方向。防御方向（电力/白酒/消费）占据另外4席。AI科技核心资产（电子/计算股）无一入围——资金从传统AI龙头向\"新面孔\"转移的特征极为明显。</p>\n\n<hr>\n\n<h2>七、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3已下线投入内部测试，Q2正式启动量产，首代目标年产能100万台。叠加宇树科技IPO上会催化，A股核心受益环节梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>伺服电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机，灵巧手核心驱动</td><td>⭐⭐</td></tr>\n</table>\n\n<p><strong>最新进展：</strong>①宇树科技6月1日IPO上会是机器人板块短期最强催化剂——若顺利过会将成A股\"人形机器人第一股\"；②特斯拉Optimus从概念走向量产的关键验证期；③小鹏2026年完成量产。2026年是<strong>人形机器人从0到1量产兑现阶段</strong>，板块适合<strong>逢低布局</strong>而非追高。</p>\n\n<hr>\n\n<h2>八、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股周末休市（周五科技高切低全线回调，科创50-5.04%）。但隔夜美股AI全线大涨，戴尔AI营收+757%盘后飙升35%。<strong>A股的调整是内部博弈而非产业逻辑破坏。</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周关键事件</div><div class=\"iv\" style=\"font-size:14px\"><strong>周一 6/1：</strong>宇树科技IPO上会（人形机器人里程碑）<br><strong>6/2-6/5：Computex 2026台北电脑展</strong><br>— 英伟达黄仁勋主题演讲（Vera Rubin架构？）<br>— 微软Copilot+ PC新进展 / AMD Zen6<br>— 戴尔AI服务器财报传导效应<br>— 美国非农数据（影响降息预期）</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 周一推演</div><div class=\"iv\" style=\"font-size:14px\"><strong>偏乐观：</strong>受戴尔财报+35%和美股AI全面上涨带动，A股AI板块有望<strong>高开</strong>。AI服务器/算力供应链（浪潮、工业富联）弹性最大。但需警惕缩量高开低走。通信线缆方向（亨通光电）可能延续强势。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银72-80美元区间震荡。美元走弱提供支撑。短线向上突破需更强催化剂（美联储鸽派信号/地缘升级/工业需求超预期）。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">①主力资金连续多日大幅净流出（电子-372亿/日），抛压消化需要时间；②若下周一高开但成交量不足，警惕\"高开低走\"；③A股vs美股AI定价背离若持续需警惕外资动向。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>1)</strong> 关注戴尔财报对A股AI服务器/算力的传导效应（周一早盘最需关注）<br><strong>2)</strong> 逢低布局算力/光模块龙头，等待Computex催化<br><strong>3)</strong> 重点关注CPO产业链通信线缆新方向（亨通、长飞、剑桥）<br><strong>4)</strong> 宇树上会结果决定机器人板块短期方向<br><strong>5)</strong> 白银以区间策略为主（72-80美元），跌破72美元需谨慎</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>\n"}, {"id": "mon-20260531-1907", "date": "2026-05-31 19:07", "title": "AI板块周末复盘 · 白银75美元震荡 戴尔Q1 AI营收+757%飙升35%三重催化来袭", "tags": ["周末复盘", "戴尔财报", "白银震荡", "Computex", "宇树科技", "高切低", "CPO通信线缆"], "summary": "A股休市。上周五科技高切低科创50跌5%。隔夜戴尔AI营收+757%飙升35%，美股AI大涨。下周宇树IPO+Computex+Dell三重催化。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">休市</div><div class=\"lbs\">A股状态</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX银($)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+2.1%</div><div class=\"lbs\">银月涨</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+35%↑</div><div class=\"lbs\">戴尔飙升</div></div>\n</div>\n\n<h1>AI板块周末盘前复盘 · 白银75美元震荡 戴尔+35%引爆全球AI 明天三重催化来袭</h1>\n<p><strong>时间：</strong>2026-05-31 19:07（A股周末休市，下周一6月1日起恢复交易）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>当前A股处于周日休市。上周五（5/29）科技板块全面退潮（科创50-5.04%），但隔夜美股AI全线大涨纳指新高。<strong>戴尔Q1 AI服务器营收161亿美元同比+757%盘后飙升+35%创历史新高</strong>——这是全球AI基建投资加速的最强信号。下周<strong>三重催化密集：6/1宇树科技IPO上会（人形机器人第一股）+ 6/2-6/5 Computex 2026大会（全球AI最强催化窗口）+ 戴尔财报传导效应</strong>，AI板块有望迎来情绪修复。COMEX白银期货报75.58美元/盎司，5月全月涨幅+2.1%收阳。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58 美元/盎司</strong> <span class=\"pill pill-down\">日内 -0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">周涨跌</div><div class=\"iv\"><span class=\"pill pill-down\">-0.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">5月涨跌</div><div class=\"iv\"><span class=\"pill pill-up\">+2.1% ✅收阳</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>约75.2-75.85 美元</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力(T+D)</div><div class=\"iv\"><strong>18,280 元/千克</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.02-99.33</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金期货</div><div class=\"iv\"><strong>4,569.9 美元/盎司</strong> <span class=\"pill pill-up\">周涨+0.28%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美10年国债</div><div class=\"iv\"><strong>4.497%</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">CFTC银净多</div><div class=\"iv\">10,244手 <span class=\"pill pill-down\">周减1,517手</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>COMEX白银5月走势剧烈震荡——月初从70美元启动七连涨至近90美元（5月13日月内高点），随后因美国CPI超预期单日暴跌超9%至73美元，月末企稳75美元附近。全月录得<strong>+2.1%</strong>的月涨幅，收出阳线。当前处于<strong>72-80美元宽幅震荡筑底</strong>阶段。白银自1月29日创下121美元历史高点后，最大回撤约38%。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元持续走弱提供底部支撑：</strong>美元指数回落至99附近近期低位，对贵金属整体形成支撑</li>\n  <li><strong>美伊地缘风险：</strong>特朗普称即将对伊朗战事做出\"最终决定\"，中东局势不确定性维持高位</li>\n  <li><strong>通胀粘性：</strong>美国4月PCE物价同比+3.8%创三年新高，抗通胀资产需求升温</li>\n  <li><strong>投机情绪降温：</strong>CFTC显示COMEX白银投机净多头周减1,517手至10,244手，短线看涨情绪弱化</li>\n  <li><strong>印度加征进口税：</strong>印度将白银进口关税从6%大幅提高至15%，可能减少来自印度的实物白银需求</li>\n  <li><strong>供给持续短缺：</strong>全球白银供应已连续第六年短缺，2026年缺口预计扩大至4,630万盎司</li>\n  <li><strong>机构观点大分化：</strong>美国银行预测Q4冲击100美元（但称\"昙花一现\"）；瑞银下调目标价至80美元端；汇丰直言\"从基本面看明显高估\"</li>\n  <li><strong>去银化压力：</strong>高价正在侵蚀工业需求，光伏领域的银包铜/电镀铜技术加速应用</li>\n</ul>\n<blockquote>💡 白银处于历史高位回落后的<strong>宽幅震荡筑底阶段</strong>（72-80美元）。短线支撑72美元（前低），上方压力80美元整数关口。5月波动率极高（单日曾跌超9%），操作以<strong>区间策略为主</strong>，72附近低吸，80附近高抛。注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（5月29日周五A股收盘回顾）</h2>\n<p>A股上周五高开低走全线收跌，科创50暴跌5.04%领跌全场：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n  <div class=\"info-item\"><div class=\"il\">主力资金</div><div class=\"iv\" style=\"color:#ef4444\"><strong>净流出831.55亿</strong></div></div>\n</div>\n\n<p>全市场仅<strong>1565只上涨</strong>，3867只下跌，涨跌比约3:7。电子行业主力净流出<strong>372.05亿元</strong>居全行业第一。北向资金成交4734亿元（占两市14.26%），宁德时代/中际旭创/天孚通信为深股通成交前三。</p>\n\n<p><strong>盘面核心特征（极致\"高切低\"）：</strong></p>\n<ul>\n  <li><strong>食品饮料</strong>涨3.02%领涨，煤炭/公用事业涨超2%——资金全面转向防御</li>\n  <li><strong>综合</strong>跌5.39%领跌，国防军工/电子跌超4%——科技板块全面失血</li>\n  <li>周四创业板首超沪指→周五全面退潮——<strong>两日\"冰火两重天\"</strong>，情绪极度敏感</li>\n  <li>但全市场成交3.32万亿并未萎缩——资金离场但未离市，而是在做结构性轮动</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>周五AI板块全面回调，人工智能指数收跌<strong>3.06%</strong>，成交额5398亿元。两日\"冰火两重天\"说明主力资金正从高位科技抱团品种系统性撤离。</p>\n\n<p><strong>但积极信号在外盘极为强劲：</strong></p>\n<ul>\n  <li>⭐ <strong>美股纳指七连涨创新高</strong>（+0.91%），费城半导体+1%创新高</li>\n  <li>⭐ <strong>戴尔Q1 AI服务器营收161亿美元 +757%</strong>，盘后飙升+35%创历史新高</li>\n  <li>⭐ <strong>Cerebras</strong>上市首日暴涨89%市值达750亿美元</li>\n  <li>⭐ <strong>高通+6%</strong>、<strong>ARM+5%</strong>再创新高、美光+3.5%续创新高</li>\n  <li>⭐ <strong>Anthropic</strong> H轮融资估值9650亿美元反超OpenAI</li>\n</ul>\n\n<p><strong>核心判断：</strong>A股AI调整是<strong>交易层面的筹码消化</strong>（前期涨幅过大后的获利回吐），而非产业逻辑破坏。美股对AI的定价与A股出现了<strong>阶段性背离</strong>——历史上这种背离往往很快会被修正。三重催化（宇树上会+Computex+戴尔传导效应）有望推动下周初情绪修复。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">A股回调 · 戴尔+35%全球最强背书</span></div>\n<p class=\"sn\"><strong>资金面（A股）：</strong>电子行业主力净流出372亿居全行业第一。中芯国际主力净流出31.4亿全市场第一。算力ETF全线下跌。但这是<strong>获利回吐</strong>而非趋势逆转——5月整月算力板块净流入规模仍居A股前列。</p>\n<p class=\"sn\"><strong>基本面（最强业绩验证）：</strong><strong>戴尔Q1 AI服务器营收161亿美元+757%</strong>，上调全年AI预期至<strong>600亿美元</strong>——全球AI硬件业绩最强确认。Cerebras上市首日+89%。四大云厂商2026年资本支出合计7250亿美元(+77%)。华为星河AI数据中心网络方案带宽提升8倍。国产AI芯片9款获安全可靠I级认证。产业面<strong>极其强劲</strong>。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周二起<strong>Computex 2026（6/2-6/5）</strong>——英伟达黄仁勋主题演讲预计发布Vera Rubin架构新细节。发改委\"人工智能+\"全面实施。工信部\"模数共振\"行动推进中。</p>\n<p class=\"sn\"><strong>情绪面：</strong>A股短期谨慎，但美股AI持续升温。戴尔财报的情绪传导效应是周一最需关注的核心变量——AI服务器/算力供应链（浪潮信息、工业富联等）有望受提振。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">全球供需最紧张环节 · HBM半年涨300%</span></div>\n<p class=\"sn\"><strong>资金面：</strong>北向在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但方向偏流出。佰维存储逆势涨0.94%是少数收红存储股。</p>\n<p class=\"sn\"><strong>基本面（全线超预期）：</strong>①HBM3E现货价<strong>半年暴涨超300%</strong>，\"有价无货一芯难求\"；②全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（+260%创历史新高）；③三星率先交付首批12层48GB HBM4E样品；④HBM在AI芯片成本占比从52%升至63%；⑤集邦预测2026年HBM需求再增70%+；⑥美光警告内存短缺持续至2026年后；⑦DDR5价格较2025年中暴涨300%+；⑧苹果计划为20周年iPhone首发HBM内存。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为亮眼但股价已充分反映涨价预期，获利资金同样兑现。HBM是AI产业链中<strong>供需格局最紧张</strong>的环节，中长期确定性极高。回调即分批布局机会。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">明天(6/1)宇树IPO上会 万众瞩目</span></div>\n<p class=\"sn\"><strong>资金面：</strong>延续抛压态势但成交缩量——筹码正在消化中。奥比中光相对抗跌。</p>\n<p class=\"sn\"><strong>基本面（明日最核心催化）：</strong>①<strong>宇树科技科创板IPO明日(6月1日)上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元；②小鹏宣布2026年完成人形机器人量产；③4月工业机器人出口量突破2.5万台（同比+90%）；④特斯拉Optimus Gen-3 Q2启动量产，首代目标年产100万台；⑤Figure 03开启全天候包裹分拣直播；⑥上海\"十五五\"规划推动10万台机器人进工厂。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场静待宇树上会结果。若顺利过会将成板块标志性催化剂。但需关注宇树Q1\"增收不增利\"（营收+68%但扣非净利-52%），上会可能面临一定挑战。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强 · 产业链新方向扩散</span></div>\n<p class=\"sn\"><strong>资金面：</strong>光模块龙头中际旭创高位震荡（单日成交225亿A股第一），但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>① 2026年是<strong>CPO产业化元年</strong>——英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上；②台积电启动全球首款200Gbps微环调制器量产；③Lumentum光通信产能售罄至2028年；④LightCounting预测2030年CPO市场达100亿美元；⑤中际旭创Q1营收195亿(+192%)净利57亿(+262%)。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正寻找CPO产业链\"新面孔\"——通信线缆方向获集中追捧。但斌转发CPO视频引发产业关注。光模块龙头短期调整属获利回吐，产业逻辑不变。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（5月29日周五TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>科技→防御资金大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联新方向 🔥</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台主力净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>煤炭</td><td><span class=\"green\">+10.88</span></td><td>神华领衔煤炭板块走强</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出。仅10个行业获净流入，21个行业净流出</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>居全行业第一——AI科技方向全面失血</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金全面从科技转向防御方向</li>\n  <li><strong>通信线缆</strong>是AI板块中<strong>唯一逆势吸金方向</strong>——亨通光电全市场主力净流入第一</li>\n  <li>AI板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至冰点</li>\n  <li><strong>关键反差：</strong>A股周五AI是全市场最大\"失血\"方向；隔夜美股AI相反——纳指新高、戴尔+35%。定价出现阶段性背离</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码/市场</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>戴尔科技</strong></td><td>NYSE</td><td><span class=\"pill pill-up\">盘后飙升+35%<br>创历史新高</span></td><td>Q1 AI服务器营收<strong>161亿美元 同比+757%</strong>，上调全年AI营收预期至600亿美元——全球AI硬件最强业绩验证</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念新方向延伸，逆势获主力资金集中追捧</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐最严重，周四创历史新高后周五大幅回调，拖累AI板块</td></tr>\n  <tr><td><strong>联想集团</strong></td><td>HK.0992</td><td><span class=\"pill pill-up\">港股暴涨22.46%</span></td><td>财报超预期，AI服务器成核心增长引擎，验证全球AI硬件景气度</td></tr>\n  <tr><td><strong>博杰股份</strong></td><td>002975</td><td><span class=\"pill pill-up\">涨停</span></td><td>AI算力+业绩爆发（2025净利+557%），切入英伟达供应链，液冷测试设备小批量发货</td></tr>\n</table>\n\n<hr>\n\n<h2>六、主力资金增仓TOP10个股（5/29周五）</h2>\n<table>\n  <tr><th>#</th><th>个股</th><th>净流入(亿)</th><th>板块</th></tr>\n  <tr><td><strong>1</strong></td><td>亨通光电(600487)</td><td><span class=\"green\">39.76</span></td><td>通信线缆/CPO 🏆</td></tr>\n  <tr><td><strong>2</strong></td><td>长芯博创</td><td><span class=\"green\">13.31</span></td><td>光通信</td></tr>\n  <tr><td><strong>3</strong></td><td>兴森科技</td><td><span class=\"green\">12.46</span></td><td>PCB/AI服务器</td></tr>\n  <tr><td><strong>4</strong></td><td>剑桥科技(603083)</td><td><span class=\"green\">11.73</span></td><td>光模块/通信</td></tr>\n  <tr><td><strong>5</strong></td><td>宁德时代(300750)</td><td><span class=\"green\">10.48</span></td><td>新能源</td></tr>\n  <tr><td><strong>6</strong></td><td>长飞光纤(601869)</td><td><span class=\"green\">10.39</span></td><td>光纤光缆/CPO</td></tr>\n  <tr><td><strong>7</strong></td><td>中国中免</td><td><span class=\"green\">9.87</span></td><td>消费旅游</td></tr>\n  <tr><td><strong>8</strong></td><td>中天科技(600522)</td><td><span class=\"green\">9.35</span></td><td>通信线缆</td></tr>\n  <tr><td><strong>9</strong></td><td>贵州茅台(600519)</td><td><span class=\"green\">9.19</span></td><td>白酒</td></tr>\n  <tr><td><strong>10</strong></td><td>华能蒙电</td><td><span class=\"green\">8.42</span></td><td>电力</td></tr>\n</table>\n<p><strong>关键观察：</strong>通信线缆/光通信方向占据TOP10中的<strong>4席</strong>（亨通光电、长芯博创、剑桥科技、长飞光纤），合计净流入约<strong>75亿元</strong>。CPO产业链向通信线缆延伸是周五全市场确定性最高的资金流向方向。</p>\n\n<hr>\n\n<h2>七、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3已下线投入内部测试，Q2正式启动量产，首代目标年产能100万台。叠加明天(6/1)宇树科技IPO上会催化，A股受益标的全梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心部件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商</td><td>⭐⭐</td></tr>\n  <tr><td><strong>伺服电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机，灵巧手核心驱动</td><td>⭐⭐</td></tr>\n  <tr><td><strong>整机</strong></td><td>宇树科技</td><td>待上市</td><td>6/1上会! A股人形机器人第一股</td><td>🔥 明关注</td></tr>\n</table>\n<p><strong>操作思路：</strong>明天(6/1)宇树科技IPO上会是机器人板块最强催化剂。若顺利过会将为板块注入强心剂。建议逢低布局核心标的（三花、绿的谐波），不追高。</p>\n\n<hr>\n\n<h2>八、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股周末休市中。上周五科技高切低全线回调（科创50-5.04%），但隔夜美股AI全线大涨纳指新高，戴尔+35%创历史新高。<strong>A股调整是内部博弈而非产业逻辑破坏。</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周三重催化</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 周一(6/1) 宇树科技IPO上会</strong>——人形机器人第一股<br><strong>2) 周二-周五(6/2-6/5) Computex 2026</strong>——全球AI最强催化窗口<br><strong>3) 戴尔财报+35%传导效应</strong>——有望提振AI服务器/算力方向</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 周一推演</div><div class=\"iv\" style=\"font-size:14px\">受戴尔财报+35%飙升和美股AI全面上涨带动，A股AI板块有望<strong>高开</strong>。AI服务器/算力供应链（浪潮、工业富联）弹性最大。但需警惕缩量高开低走。通信线缆方向（亨通光电）可能延续强势。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银72-80美元区间震荡。美元走弱+供给缺口提供底部支撑。沪银夜盘+0.64%。突破80美元需更强催化剂。5月月线+2.1%收阳。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">①主力资金连续多日大幅净流出 ②若周一高开但量能不足需防\"高开低走\" ③宇树上会若遇阻将打压机器人情绪 ④白银波动率极高注意仓位管理</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>1)</strong> 关注戴尔财报对A股AI服务器/算力的传导效应（周一早盘）<br><strong>2)</strong> 逢低布局算力/光模块/PCB龙头，等待Computex催化<br><strong>3)</strong> 重点关注CPO产业链通信线缆新方向（亨通/长飞/剑桥）<br><strong>4)</strong> 宇树上会结果决定机器人板块方向<br><strong>5)</strong> 白银区间操作：72附近低吸，80附近高抛</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260531-2007", "date": "2026-05-31 20:07", "title": "AI板块周日盘前分析 · 白银75美元震荡 明天三重催化来袭", "tags": ["周日盘前", "白银", "Computex", "宇树IPO", "戴尔+35%", "高切低"], "summary": "A股休市。上周五科技高切低科创50跌5%。隔夜戴尔AI营收+757%飙升35%创历史新高。明天宇树IPO+Computex+Dell三重催化。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">75.2</div><div class=\"lbs\">COMEX银($)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">~0%</div><div class=\"lbs\">日内波动</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.93%</div><div class=\"lbs\">周跌幅</div></div>\n  <div class=\"metric-box\"><div class=\"num\">休市中</div><div class=\"lbs\">A股状态</div></div>\n</div>\n\n<h1>📊 AI板块周日盘前分析 · 白银75美元震荡 明天三重催化：宇树上会+Computex+戴尔传导</h1>\n<p><strong>时间：</strong>2026-05-31 20:00（A股周末休市中，下周一6月1日起恢复交易）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>当前为周日休市，A股明日(6/1)即将开盘。上周五（5/29）科技板块全面退潮（科创50-5.04%），但隔夜美股AI全线大涨纳指新高。<strong>戴尔Q1 AI服务器营收161亿美元+757%盘后飙升+35%创历史新高</strong>——全球AI基建投资加速的最强信号。明天<strong>三重催化密集：6/1宇树科技IPO上会 + 6/2-6/5 Computex 2026大会 + 戴尔财报传导</strong>，AI板块有望情绪修复。COMEX白银期货报75.2美元/盎司附近，5月全月涨幅约+2.1%收阳。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>约75.2 美元/盎司</strong> <span class=\"pill pill-mid\">周末休市</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>约75.2 美元/盎司</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力(T+D)</div><div class=\"iv\"><strong>18,280 元/千克</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.03</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金期货</div><div class=\"iv\"><strong>约4,538 美元/盎司</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">周涨跌</div><div class=\"iv\"><span class=\"pill pill-down\">全周 -0.93%</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>COMEX白银5月走势剧烈震荡——月初70美元启动七连涨至近90美元（5月13日月内高点），随后因美国CPI超预期单日暴跌超9%至73美元。上周四(5/28)盘中再度急挫4.5%至72美元附近，周五(5/29)暴力反弹+3.45%至75美元上方。当前处于<strong>72-80美元宽幅震荡筑底</strong>阶段。白银自1月29日创下121美元历史高点后，最大回撤约38%。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元持续走弱支撑：</strong>美元指数回落至99附近近期低位，对贵金属整体形成支撑</li>\n  <li><strong>贵金属V型修复：</strong>上周五金价反弹1.83%，白银暴涨3.45%，多空在极短时间内完成激烈博弈</li>\n  <li><strong>通胀粘性：</strong>美国4月PCE物价同比+3.8%创三年新高，抗通胀资产需求升温</li>\n  <li><strong>美伊地缘风险反复：</strong>特朗普称即将对伊朗战事做出\"最终决定\"，中东不确定性维持高位</li>\n  <li><strong>新主席沃什鹰派立场：</strong>美联储新任主席沃什上任后明确优先控制通胀，市场对降息预期迅速冷却</li>\n  <li><strong>印度加征进口税：</strong>印度将白银进口关税从6%大幅提高至15%，可能减少实物白银需求</li>\n  <li><strong>供给持续短缺：</strong>全球白银供应已连续第六年短缺，2026年缺口预计扩大至4,630万盎司</li>\n  <li><strong>机构观点大分化：</strong>美国银行预测Q4冲击100美元（但称\"昙花一现\"）；瑞银下调目标价至80美元；汇丰直言\"从基本面看明显高估\"</li>\n</ul>\n<blockquote>💡 白银处于历史高位回落后的<strong>宽幅震荡筑底阶段</strong>（72-80美元）。短线支撑72美元（前低），上方压力80美元整数关口。5月波动率极高（单日曾跌超9%），操作以<strong>区间策略为主</strong>，72附近低吸，80附近高抛。下周关注美国非农数据和CPI数据发布。</blockquote>\n\n<hr>\n\n<h2>一、AI板块整体市场概览（盘前综述）</h2>\n<p>📌 <strong>A股今日休市，明日(6/1)开盘。</strong>上周五科技全面退潮（科创50-5.04%），电子行业主力净流出372亿元居首。但隔夜美股AI全线大涨：</p>\n<ul>\n  <li>⭐ <strong>戴尔Q1 AI服务器营收161亿美元 +757%</strong>，盘后飙升+35%创历史新高</li>\n  <li>⭐ 纳指七连涨创新高，费城半导体+1%创新高</li>\n  <li>⭐ 联想集团港股上周涨22.46%，AI服务器成核心增长引擎</li>\n</ul>\n<p><strong>核心判断：</strong>A股AI调整是<strong>交易层面的筹码消化</strong>（前期涨幅过大后的获利回吐），产业逻辑未变。美股对AI的定价与A股出现<strong>阶段性背离</strong>——历史上这种背离往往很快会被修正。明天<strong>三重催化</strong>（宇树上会+Computex+戴尔传导效应）有望推动周一情绪修复。</p>\n\n<hr>\n\n<h2>二、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">A股回调节奏 · 戴尔+35%最强背书</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五电子行业主力净流出372亿居全行业第一。中芯国际净流出31.4亿全市场第一。但这是5月持续大涨后的<strong>正常获利回吐</strong>而非趋势逆转。5月整月算力板块净流入规模仍居A股前列。</p>\n<p class=\"sn\"><strong>基本面：</strong>最强业绩验证——<strong>戴尔Q1 AI服务器营收161亿美元+757%</strong>，上调全年AI预期至<strong>600亿美元</strong>。Cerebras上市首日+89%。四大云厂商2026年资本支出7250亿美元(+77%)。华为星河AI数据中心方案带宽提升8倍。全球算力投资无减速迹象。</p>\n<p class=\"sn\"><strong>政策面：</strong>明天(6/2)起<strong>Computex 2026（6/2-6/5）</strong>——英伟达黄仁勋主题演讲预计发布Vera Rubin架构新细节。发改委\"人工智能+\"全面实施。</p>\n<p class=\"sn\"><strong>情绪面：</strong>A股短期谨慎，美股AI持续升温。戴尔财报的传导效应是周一开盘最核心变量——AI服务器/算力供应链（浪潮信息、工业富联等）有望受提振。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">全球供需最紧张环节</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五北向在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但方向偏流出。佰维存储逆势涨0.94%是少数收红存储股。</p>\n<p class=\"sn\"><strong>基本面：</strong>①HBM3E现货价<strong>半年暴涨超300%</strong>；②全球DRAM营收Q1逼近<strong>970亿美元</strong>（+260%创历史新高）；③三星率先交付首批12层48GB HBM4E样品；④HBM在AI芯片成本占比从52%升至63%；⑤集邦预测2026年HBM需求再增70%+；⑥美光警告内存短缺持续至2026年后；⑦DDR5价格暴涨300%+。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为亮眼但股价已充分反映涨价预期，获利资金同样兑现。HBM是AI产业链中<strong>供需格局最紧张</strong>的环节，中长期确定性极高。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">明天(6/1)宇树IPO上会 万众瞩目</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周延续抛压态势但成交缩量——筹码正在消化中。三花智控、绿的谐波等核心标的有望在宇树上会催化下率先企稳。</p>\n<p class=\"sn\"><strong>基本面：</strong>①<strong>宇树科技科创板IPO明日(6月1日)上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元；②小鹏宣布2026年完成人形机器人量产；③4月工业机器人出口量突破2.5万台（同比+90%）；④特斯拉Optimus Gen-3 Q2启动量产，首代目标年产100万台；⑤Figure 03开启全天候包裹分拣直播；⑥上海\"十五五\"规划推动10万台机器人进工厂。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场静待宇树上会结果。但需关注宇树Q1\"增收不增利\"（营收+68%但扣非净利-52%），上会可能面临一定挑战。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强 · 产业链新方向扩散</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五通信线缆及配套板块逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿</strong>全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。资金在CPO产业链中寻找\"新面孔\"。</p>\n<p class=\"sn\"><strong>基本面：</strong>①2026年是<strong>CPO产业化元年</strong>——英伟达Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上；②台积电启动全球首款200Gbps微环调制器量产；③Lumentum光通信产能售罄至2028年；④LightCounting预测2030年CPO市场达100亿美元；⑤中际旭创Q1营收195亿(+192%)净利57亿(+262%)。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正寻找CPO产业链\"新面孔\"——通信线缆方向获集中追捧。光模块龙头短期调整属获利回吐，产业逻辑不变。</p>\n</div>\n\n<hr>\n\n<h2>三、主流净流入板块监控（上周五 5/29 TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>科技→防御资金大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联新方向 🔥</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台主力净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>煤炭</td><td><span class=\"green\">+10.88</span></td><td>防御属性叠加高分红</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831.55亿元</strong>，仅10个行业获净流入</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>居全行业第一——AI科技方向全面失血</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金全面从科技转向防御</li>\n  <li><strong>通信线缆</strong>是AI板块中<strong>唯一逆势吸金方向</strong>——亨通光电全市场净流入第一</li>\n  <li>AI板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至冰点</li>\n  <li><strong>关键反差：</strong>A股周五AI是全市场最大\"失血\"方向；隔夜美股AI相反——纳指新高、戴尔+35%。定价出现阶段性背离，预期明天将修正</li>\n</ul>\n\n<hr>\n\n<h2>四、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码/市场</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>戴尔科技</strong></td><td>NYSE</td><td><span class=\"pill pill-up\">盘后飙升+35%<br>创历史新高</span></td><td>Q1 AI服务器营收<strong>161亿美元 同比+757%</strong>，上调全年AI营收预期至600亿美元——全球AI硬件最强业绩验证，明天将传导至A股AI服务器/算力供应链</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念新方向延伸，逆势获主力资金集中追捧，趋势有望延续</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐最严重，周四创历史新高后周五大幅回调。关注明天能否在戴尔+美股AI利好下企稳</td></tr>\n</table>\n\n<hr>\n\n<h2>五、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3已下线投入内部测试，Q2正式启动量产，首代目标年产能100万台。叠加明天(6/1)宇树科技IPO上会催化，A股受益标的全梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商，已进入特斯拉验证</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心部件</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商</td><td>⭐⭐</td></tr>\n  <tr><td><strong>伺服电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机，灵巧手核心驱动</td><td>⭐⭐</td></tr>\n  <tr><td><strong>整机</strong></td><td>宇树科技</td><td>待上市</td><td>6/1上会！A股人形机器人第一股</td><td>🔥 明关注</td></tr>\n</table>\n<p><strong>操作思路：</strong>明天(6/1)宇树科技IPO上会是机器人板块最强催化剂。若顺利过会将为板块注入强心剂。建议逢低布局核心标的（三花、绿的谐波），不追高。</p>\n\n<hr>\n\n<h2>六、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股周末休市中。上周五科技高切低全线回调（科创50-5.04%），但隔夜美股AI全线大涨纳指新高，戴尔+35%创历史新高。<strong>A股调整是内部博弈而非产业逻辑破坏。</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 明日起三重催化</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 周一(6/1) 宇树科技IPO上会</strong>——人形机器人第一股<br><strong>2) 周二-周五(6/2-6/5) Computex 2026</strong>——全球AI最强催化窗口<br><strong>3) 戴尔财报+35%传导效应</strong>——有望提振AI服务器/算力方向</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 周一推演</div><div class=\"iv\" style=\"font-size:14px\">受戴尔财报+35%飙升和美股AI全面上涨带动，A股AI板块有望<strong>高开</strong>。AI服务器/算力供应链（浪潮信息、工业富联）弹性最大。但需警惕缩量高开低走。通信线缆方向（亨通光电）可能延续强势。宇树上会结果将决定机器人板块方向。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银72-80美元区间震荡。美元走弱+供给缺口提供底部支撑。5月月线+2.1%收阳。突破80美元需更强催化剂。下周关注美国非农数据。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">①主力资金连续多日净流出 ②若周一高开但量能不足需防\"高开低走\" ③宇树上会若遇阻将打压机器人情绪 ④白银波动率极高注意仓位管理</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>1)</strong> 关注戴尔财报对A股AI服务器/算力的传导效应（周一早盘）<br><strong>2)</strong> 逢低布局算力/光模块/PCB龙头，等待Computex催化<br><strong>3)</strong> 重点关注CPO产业链通信线缆新方向（亨通/长飞/剑桥）<br><strong>4)</strong> 宇树上会结果决定机器人板块方向<br><strong>5)</strong> 白银区间操作：72附近低吸，80附近高抛</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260531-2107", "date": "2026-05-31 21:00", "title": "AI板块夜盘复盘 · 周末休市 聚焦Computex+宇树IPO最强催化 白银75美元震荡", "tags": ["周末复盘", "白银震荡", "戴尔财报", "Computex", "宇树科技", "CPO通信线缆"], "summary": "A股休市，周五科技高切低科创50-5%。戴尔AI营收+757%飙升35%创历史新高。聚焦下周Computex和宇树IPO双催化，白银72-80美元区间震荡", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">休市中</div><div class=\"lbs\">A股状态</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">周五科创50</div></div>\n  <div class=\"metric-box\"><div class=\"num\">75.58</div><div class=\"lbs\">COMEX银($)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">+35%↑</div><div class=\"lbs\">戴尔财报</div></div>\n</div>\n\n<h1>AI板块夜盘复盘 · 科技周末休整 聚焦下周Computex+宇树IPO最强催化</h1>\n<p><strong>时间：</strong>2026-05-31 21:00（A股上周五已收盘，周末休市）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>当前A股处于周末休市（上周五5/29已收盘）。周五A股上演<strong>\"高切低\"全面切换</strong>——科技全线退潮，科创50暴跌5.04%，电力/消费/通信线缆逆势吸金。但隔夜美股AI全线大涨纳指七连涨创新高，<strong>戴尔财报AI服务器营收+757%盘后飙升35%创历史新高</strong>，产业基本面强势不改。下周<strong>三重催化：①宇树科技IPO上会(6/1) ②Computex大会(6/2-6/5) ③戴尔财报传导效应</strong>，AI板块有望迎来情绪修复。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58 美元/盎司</strong> <span class=\"pill pill-down\">日内-0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>75.2美元附近</strong> <span class=\"pill pill-mid\">区间震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银主力</div><div class=\"iv\"><strong>18,280元/千克</strong> <span class=\"pill pill-up\">夜盘+0.64%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪金主力</div><div class=\"iv\"><strong>夜盘+1.61%</strong> <span class=\"pill pill-up\">金银比走阔</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>99.02-99.10</strong> <span class=\"pill pill-down\">持续走弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金期货</div><div class=\"iv\"><strong>4,569.9 美元/盎司</strong> <span class=\"pill pill-up\">+0.83%</span></div></div>\n</div>\n\n<p><strong>近期趋势判断：</strong>COMEX白银本周（5/26-5/30）走势剧烈震荡——周一77.27美元，周三深跌至73.29美元（-2.84%），周四反弹至76.08美元（+3.81%），周五回落至75.58美元（-0.43%）。周跌0.81%，5月累计仍录得约<strong>+2.1%月涨幅</strong>。整体处于<strong>72-80美元宽幅震荡区间</strong>。</p>\n\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>美元持续走弱：</strong>美元指数回落至99附近低位运行，对贵金属形成底部支撑。但金银比持续扩大（目前约60:1），白银相对黄金表现偏弱</li>\n  <li><strong>通胀粘性：</strong>美国4月PCE同比+3.8%创三年新高，抗通胀资产需求上升。黄金收涨+0.83%，白银跟涨但弹性不足</li>\n  <li><strong>美伊关系：</strong>特朗普称即将对伊朗战事做出\"最终决定\"；伊朗同意暂停60%铀浓缩换取制裁松动，霍尔木兹海峡局势不确定性仍高</li>\n  <li><strong>投机情绪降温：</strong>CFTC数据显示截至5月26日COMEX白银投机净多头减少1,517手至10,244手，短线资金看涨情绪明显降温</li>\n  <li><strong>印度关税冲击：</strong>印度将白银进口关税从6%大幅提高至15%，可能抑制全球第二大白银消费国的进口需求</li>\n  <li><strong>供需结构：</strong>全球白银连续第六年供应短缺，2026年缺口约4,630万盎司，库存已降至极低水平，中长期基本面偏多</li>\n</ul>\n\n<blockquote>💡 白银自1月29日创下121美元历史高点后已回落约38%，当前在<strong>72-80美元</strong>区间筑底震荡。短线支撑72美元（前低），上方压力80美元整数关口。机构观点严重分歧——美银看Q4冲击100美元，瑞银看年底跌至80美元，汇丰直言\"被明显高估\"。波动剧烈，注意仓位管理。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（A股5/29周五收盘回顾）</h2>\n<p>A股上周五高开低走全线收跌，科创50暴跌5.04%：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n</div>\n\n<p>全市场仅<strong>1565只上涨</strong>，3867只下跌。主力资金净流出<strong>831.55亿元</strong>。<strong>电子行业</strong>主力净流出<strong>372.05亿元</strong>居全行业第一。北向资金成交4734亿元（占两市14.26%），其中宁德时代/中际旭创/天孚通信为深股通成交前三。食品饮料(+3.02%)、煤炭(+2.13%)、公用事业(+2%+)领涨；综合(-5.39%)、国防军工(-4.23%)、电子(-4%+)领跌。</p>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>周五AI板块全面回调，人工智能指数收跌<strong>3.06%</strong>，成交额5398亿元。周三创业板首超沪指的\"里程碑\"在周五被全面退潮迅速抹平——两日\"冰火两重天\"说明市场情绪极度敏感。</p>\n\n<p><strong>但积极信号在外盘——隔夜美股AI全线大涨：</strong></p>\n<ul>\n  <li><strong>纳指七连涨创新高</strong>（+0.91%），费城半导体指数+1%创新高</li>\n  <li><strong>戴尔科技：</strong>Q1 AI服务器营收<strong>161亿美元同比+757%</strong>，上调全年AI营收目标至600亿美元，盘后飙升<strong>35%创历史新高</strong></li>\n  <li><strong>Cerebras：</strong>纽交所首日暴涨<strong>89%</strong>市值达750亿美元，验证AI算力资产的高溢价</li>\n  <li><strong>高通+6%</strong>、<strong>ARM+5%</strong>再创新高、美光+3.5%续创新高、微软+3%</li>\n  <li><strong>Snowflake暴涨36%</strong>——AI数据平台需求爆发</li>\n</ul>\n\n<p><strong>核心判断：</strong>A股AI板块的调整是<strong>交易层面的筹码消化</strong>（前期涨幅过大后的获利回吐），而非产业逻辑破坏。A股和美股对AI的定价出现阶段性背离——美股持续定价AI产业的高景气，A股因内部资金博弈短期回调。下周Computex大会和戴尔财报传导效应有望带动情绪修复。</p>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">A股回调 · 美股强势 · 戴尔财报引爆</span></div>\n<p class=\"sn\"><strong>资金面（A股）：</strong>电子行业主力净流出372亿居全行业第一。中芯国际主力净流出31.4亿全市场第一。算力ETF全线下跌。</p>\n<p class=\"sn\"><strong>资金面（美股）：</strong>隔夜美股AI全面大涨——戴尔盘后飙升35%创历史新高，高通+6%、ARM+5%创新高、博通+3.2%、英伟达+1.5%。全球资金对AI算力的定价仍在强化。</p>\n<p class=\"sn\"><strong>基本面（重磅利好）：</strong><strong>戴尔Q1 AI服务器营收161亿美元+757%</strong>，上调全年AI营收预期至<strong>600亿美元</strong>。Cerebras上市首日+89%。四大云厂商2026年资本支出合计7250亿美元（+77%+）。华为推出星河AI数据中心网络方案。联想集团港股周五大涨22.46%。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周<strong>Computex 2026（6/2-6/5）</strong>以\"AI Together\"为主题，英伟达黄仁勋主题演讲预计发布Vera Rubin架构。发改委\"人工智能+\"从\"深化拓展\"升级为\"全面实施\"。国产AI芯片9款获安全可靠I级认证。</p>\n<p class=\"sn\"><strong>情绪面：</strong>A股短期谨慎，但美股AI情绪持续升温。戴尔+35%、Cerebras+89%、纳指新高——都是AI产业热度最直接的证明。关注周一戴尔财报情绪向A股传导的可能性。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-up\">产业景气最强环节 HBM涨价超300%</span></div>\n<p class=\"sn\"><strong>资金面：</strong>北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但方向偏流出。佰维存储逆势上涨0.94%。</p>\n<p class=\"sn\"><strong>基本面（全线超预期）：</strong>全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（环比+80%，同比+260%），创历史新高。<strong>HBM3E现货价半年暴涨超300%</strong>。三星率先交付首批12层48GB HBM4E样品（性能提升超20%），规划推出8层32GB/16层64GB版本。HBM在AI芯片成本占比从52%升至63%。美光警告内存短缺将持续至2026年后。集邦预测2026年HBM需求再增70%+。闪迪CTO：AI竞赛正在变成\"拼内存\"。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强劲但股价已充分反映涨价预期，获利资金兑现。HBM仍是AI产业链中<strong>供需格局最紧张</strong>的环节，中长期确定性极高。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">等待6/1宇树上会</span></div>\n<p class=\"sn\"><strong>资金面：</strong>延续净流出，但成交缩量，抛压在消化中。5月27日板块曾净流出143亿。奥比中光抗跌（+0.84%）。</p>\n<p class=\"sn\"><strong>基本面：</strong>产业趋势加速——2026年是<strong>规模化验证关键期</strong>。<strong>宇树科技科创板IPO将于6月1日（周一）上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。4月工业机器人出口2.5万台（同比+90%）。特斯拉Optimus Gen-3 Q2启动量产，首代目标年产能100万台。小鹏宣布2026年完成人形机器人量产。Figure 03开启全天候包裹分拣直播。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场静待宇树科技上会结果。若顺利过会将成机器人板块标志性催化剂，带动情绪企稳回升。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强 全市场第一吸金方向</span></div>\n<p class=\"sn\"><strong>资金面：</strong>光模块龙头高位震荡，但<strong>通信线缆及配套</strong>板块逆势净流入<strong>39.83亿元</strong>。<strong>亨通光电主力净流入39.76亿全市场第一</strong>，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年是<strong>CPO产业化元年</strong>。英伟达Q4启动CPO量产。鸿海CPO全光交换机出货目标上调至5万台以上。台积电启动全球首款200Gbps微环调制器量产。Lumentum产能售罄至2028年。中际旭创Q1营收195亿（+192%），净利57亿（+262%）。LightCounting预测2030年CPO市场达100亿美元。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正寻找CPO产业链\"新面孔\"——通信线缆方向获集中配置。亨通光电/长飞光纤/剑桥科技/中天科技在资金流向TOP10中独占4席。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（周五TOP10）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>科技→防御资金大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联新方向（AI相关唯一逆势吸金）</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促+防御</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季+免税概念</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒（2项合计）</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台主力净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>医药生物</td><td><span class=\"green\">+52.74</span></td><td>前期滞涨+防御属性+低位</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿（全行业第一）</strong>——AI科技方向全面失血</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金全面转向防御</li>\n  <li><strong>通信线缆</strong>是AI板块中<strong>唯一逆势吸金</strong>方向——亨通光电全市场主力净流入第一</li>\n  <li>AI板块（电子+计算机+通信）合计净流出超<strong>400亿元</strong>，相对热度降至冰点</li>\n  <li><strong>中美分化明显：</strong>周五AI板块是全市场最大\"失血\"方向，但隔夜美股反之——AI是全市场最大\"吸金\"方向</li>\n</ul>\n\n<hr>\n\n<h2>五、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>市场</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>戴尔科技</strong></td><td>NYSE</td><td><span class=\"pill pill-up\">盘后飙升+35%<br>创历史新高</span></td><td>Q1 AI服务器营收<strong>161亿美元同比+757%</strong>，全年AI营收上调至600亿美元。AI硬件业绩最强验证。周一将带动A股AI服务器/算力供应链高开。</td></tr>\n  <tr><td><strong>亨通光电</strong></td><td>A股(600487)</td><td><span class=\"pill pill-up\">主力净流入39.76亿<br>全市场第一</span></td><td>通信线缆龙头，CPO/算力互联新方向，资金集中追捧</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>A股(688981)</td><td><span class=\"pill pill-down\">主力净流出31.4亿<br>全市场第一</span></td><td>半导体龙头获利回吐，昨日创历史新高后今日大幅回调</td></tr>\n</table>\n\n<hr>\n\n<h2>六、主力资金增仓TOP10个股（周五5/29）</h2>\n<table>\n  <tr><th>#</th><th>个股</th><th>净流入(亿)</th><th>板块</th><th>周涨跌幅</th></tr>\n  <tr><td><strong>1</strong></td><td>亨通光电</td><td><span class=\"green\">39.76</span></td><td>通信线缆/CPO</td><td><span class=\"green\">+9.42%</span></td></tr>\n  <tr><td><strong>2</strong></td><td>长芯博创</td><td><span class=\"green\">13.31</span></td><td>光通信</td><td>--</td></tr>\n  <tr><td><strong>3</strong></td><td>兴森科技</td><td><span class=\"green\">12.46</span></td><td>PCB/AI服务器</td><td>--</td></tr>\n  <tr><td><strong>4</strong></td><td>剑桥科技</td><td><span class=\"green\">11.73</span></td><td>光模块/通信</td><td>--</td></tr>\n  <tr><td><strong>5</strong></td><td>宁德时代</td><td><span class=\"green\">10.48</span></td><td>新能源</td><td>--</td></tr>\n  <tr><td><strong>6</strong></td><td>长飞光纤</td><td><span class=\"green\">10.39</span></td><td>光纤光缆/CPO</td><td>--</td></tr>\n  <tr><td><strong>7</strong></td><td>中国中免</td><td><span class=\"green\">9.87</span></td><td>消费旅游</td><td>--</td></tr>\n  <tr><td><strong>8</strong></td><td>中天科技</td><td><span class=\"green\">9.35</span></td><td>通信线缆</td><td>--</td></tr>\n  <tr><td><strong>9</strong></td><td>贵州茅台</td><td><span class=\"green\">9.19</span></td><td>白酒</td><td>--</td></tr>\n  <tr><td><strong>10</strong></td><td>华能蒙电</td><td><span class=\"green\">8.42</span></td><td>电力</td><td>--</td></tr>\n</table>\n<p><strong>关键观察：</strong>通信线缆/光通信方向占据TOP10中的<strong>4席</strong>（亨通、长芯博创、剑桥、长飞），CPO产业链延伸方向是周五全市场唯一获得集中配置的AI方向。亨通光电+9.42%领涨。</p>\n\n<hr>\n\n<h2>七、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3已下线投入内部测试，Q2启动正式量产，首代目标年产能100万台：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器核心供应商</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心</td><td>⭐⭐⭐</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器，国产替代空间大</td><td>⭐⭐</td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，延伸至机器人</td><td>⭐⭐</td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件</td><td>⭐⭐</td></tr>\n  <tr><td><strong>灵巧手</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机核心驱动</td><td>⭐⭐</td></tr>\n</table>\n<p><strong>最新催化剂：</strong>宇树科技6月1日（周一）IPO上会，冲刺A股\"人形机器人第一股\"。全国人形机器人安全分级标准编制工作启动。上海\"十五五\"规划推动10万台机器人进工厂。2026年是人形机器人从0到1的<strong>量产兑现阶段</strong>，板块适合<strong>逢低布局</strong>，核心仓位以三花+绿的谐波为主。</p>\n\n<hr>\n\n<h2>八、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股周末休市（周五\"高切低\"全线回调，科创50-5.04%）。隔夜美股AI全线大涨纳指七连涨，戴尔+35%创历史新高。AI产业热度仍在升温。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周关键事件</div><div class=\"iv\" style=\"font-size:14px\"><strong>周一(6/1)：</strong>宇树科技科创板IPO上会<br><strong>周二-周五(6/2-6/5)：</strong>Computex 2026台北电脑展<br>— 英伟达黄仁勋主题演讲<br>— 可能发布Vera Rubin架构细节<br>— 戴尔AI服务器财报传导效应<br>— 微软Copilot+ PC / AMD Zen6新品</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 周一推演</div><div class=\"iv\" style=\"font-size:14px\">受<strong>戴尔财报+35%</strong>和美股AI全面上涨带动，A股AI板块周一有望<strong>高开</strong>。关键看成交量：若高开后量能放大则有望企稳反弹；若缩量则需警惕\"高开低走\"。通信线缆方向（亨通光电）可能延续强势。宇树上会是全天焦点。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银72-80美元区间宽幅震荡。美元走弱提供底部支撑，沪银夜盘+0.64%。上方突破80美元需更强催化剂（美联储鸽派信号或地缘升级）。机构观点分歧极大——美银看Q4冲击100美元，瑞银看跌至80美元。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">①A股主力资金连续多日大额净流出 ②若高开但成交量不足，警惕\"高开低走\"③美伊地缘局势不确定性 ④AI板块估值仍处相对高位</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\"><strong>1)</strong> 关注戴尔财报对A股AI服务器/算力产业链的传导效应（周一早盘）<br><strong>2)</strong> 逢低布局算力/光模块/PCB龙头，等待Computex催化和宇树上会<br><strong>3)</strong> 重点关注CPO产业链通信线缆方向（亨通/长飞/剑桥）<br><strong>4)</strong> 机器人板块聚焦宇树上会结果，若顺利通过视为积极信号</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260531-2209", "date": "2026-05-31 22:09", "title": "AI板块周日夜盘复盘 · 白银窄幅震荡 聚焦下周宇树IPO/Computex超级催化", "tags": ["周日夜盘", "白银", "等待催化", "宇树IPO", "Computex", "CPO", "高切低"], "summary": "A股非交易时段，白银75美元窄幅震荡。关注明日宇树科技IPO上会和Computex大会催化。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">75.2</div><div class=\"lbs\">COMEX白银(美元)</div></div>\n  <div class=\"metric-box\"><div class=\"num\">99.03</div><div class=\"lbs\">美元指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">4068.57</div><div class=\"lbs\">上周五上证</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50</div></div>\n</div>\n\n<h1>AI板块周日夜盘复盘 · 白银窄幅震荡 关注下周超级催化</h1>\n<p><strong>时间：</strong>2026-05-31 22:00（A股非交易时段 &#8226; 周日）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>当前为A股非交易时段（周日夜晚）。上周五科技全线退潮情绪尚待修复，周末消息面相对平静。COMEX白银在75-76美元区间窄幅震荡。下周迎接超级催化周——6/1宇树科技IPO上会 + 6/2-6/5 Computex大会，将决定AI板块短期方向。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>~75.2美元/盎司</strong> <span class=\"pill pill-mid\">日内 窄幅震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银</div><div class=\"iv\"><strong>~74.98-75.25美元/盎司</strong> <span class=\"pill pill-mid\">窄幅波动</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银TD</div><div class=\"iv\"><strong>~18,280元/千克</strong></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>~99.03</strong> <span class=\"pill pill-down\">近期低位</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>~4,538美元/盎司</strong></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>COMEX白银自上周五金价的强力反弹(+3.81%)后，周末进入了<strong>窄幅震荡整固</strong>阶段，现货价格在75美元附近整理。周线来看本周COMEX白银<strong>下跌约0.93%</strong>，市场多空分歧仍然激烈。整体处于<strong>72-80美元宽幅震荡区间</strong>的中枢位。</p>\n<p><strong>驱动因素简析：</strong></p>\n<ul>\n  <li><strong>✅ 美元走弱提供支撑：</strong>美元指数报99.03，处于近期低位，对贵金属形成基础支撑</li>\n  <li><strong>⚠️ 美联储紧缩预期：</strong>新任主席沃什表态优先控制通胀，市场对降息的预期迅速冷却，甚至开始讨论加息可能性</li>\n  <li><strong>⚠️ 4月CPI超预期：</strong>美国4月CPI同比+3.8%，远超预期，强化了紧缩预期，压制白银上行空间</li>\n  <li><strong>✅ 供需缺口持续：</strong>全球白银供应已连续第六年短缺，2026年缺口预计约4630万盎司，库存处于低位</li>\n  <li><strong>✅ 工业需求故事：</strong>光伏+AI数据中心建设对白银工业需求维持高位，但高价正在侵蚀部分工业需求</li>\n  <li><strong>⚠️ 印度提高白银进口关税：</strong>从6%大幅提高至15%，可能抑制来自印度的边际需求</li>\n  <li><strong>机构观点严重分歧：</strong>美国银行看年内100美元（但称\"昙花一现\"）、瑞银下调目标至80美元、汇丰认为\"基本面明显高估\"</li>\n</ul>\n<blockquote>💡 白银当前处于72-80美元宽幅震荡区间中枢位（75美元）。短线支撑72美元，压力80美元。下周关注6/5美国非农数据对贵金属方向的指引。</blockquote>\n\n<hr>\n\n<h2>一、AI板块整体市场概览</h2>\n<p>当前为A股非交易时段（周日22:00）。上周五（5月29日）A股三大指数全线收跌——上证指数-0.73%报4068.57，深证成指-1.81%报15575.13，<strong>科创50暴跌5.04%</strong>领跌全场。</p>\n<p>上周五市场呈现极端\"高切低\"格局——科技板块全面退潮，AI/半导体高位股集体回调，主力资金单日净流出831亿元，<strong>电子行业净流出372亿元居首</strong>。电力/公用事业/消费等防御板块逆势吸金。</p>\n<p>但产业基本面并未恶化——调整属于<strong>交易层面的筹码消化</strong>，而非产业逻辑破坏。下周迎来两大关键催化：</p>\n\n<hr>\n\n<h2>二、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-mid\">调整消化中</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五电子行业净流出372亿元居全行业首位。算力ETF全线收跌，中芯国际主力净流出31.4亿居全市场第一。资金短期从高位科技品种系统出逃。</p>\n<p class=\"sn\"><strong>政策面：</strong>工信部十部门联合印发《人工智能科技伦理审查与服务办法(试行)》。国家网信办/发改委/工信部联合发布《智能体规范应用与创新发展实施意见》，为AI产业发展提供政策框架。下周<strong>6/2-6/5 Computex大会</strong>以\"AI Together\"为主题，是最重要的催化窗口。</p>\n<p class=\"sn\"><strong>基本面：</strong>Cerebras在美上市首日暴涨89%市值达750亿美元，验证AI算力赛道高景气。戴尔AI服务器营收161亿美元同比+757%。四大云厂商2026年合计资本支出7250亿美元(+77%)，AI基建投资持续超预期。华为发布韬(τ)定律，为国产算力提供理论框架。</p>\n<p class=\"sn\"><strong>情绪面：</strong>短线情绪偏谨慎，高位筹码需消化。但美股AI热度不减（纳指创新高），调整更多是A股内部资金博弈——\"高切低\"。待Computex催化释放后企稳概率大。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪中期乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五跟随半导体整体回调。北向资金在存储龙头上交投活跃——澜起科技沪股通成交42亿、兆易创新33.86亿，但方向偏流出。佰维存储盘中逆势上涨0.94%。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM景气度持续超预期——HBM3E现货价半年暴涨超300%。三星率先交付首批12层48GB HBM4E样品，传输速度14-16Gbps，带宽达3.6TB/s。美光警告内存短缺将持续至2026年后。HBM在AI芯片成本占比已升至63%。全球DRAM营收2026Q1逼近970亿美元（环比+80%，同比+260%），创历史新高。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强势，但短期股价已充分反映涨价预期。中长期来看，HBM是AI产业链中<strong>供需格局最紧张</strong>的环节之一，涨价至少持续到2027年。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-up\">关注明日IPO上会</span></div>\n<p class=\"sn\"><strong>资金面：</strong>上周五延续回调态势，5月27日单日净流出143亿元后尚未企稳。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>重大催化：明日（6月1日）宇树科技科创板IPO上会</strong>，冲刺A股\"人形机器人第一股\"，拟募资42.02亿元。2026年为规模化验证关键期。海关数据4月工业机器人出口量突破2.5万台（同比+90%）。特斯拉Optimus Gen-3已下线投入内部测试，Q2启动量产。小鹏宣布2026年完成Robotaxi和人形机器人量产。</p>\n<p class=\"sn\"><strong>情绪面：</strong>市场对宇树IPO高度关注——成功过会将为整个机器人板块注入强心剂，是短期最重要的情绪催化剂。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆方向持续关注</span></div>\n<p class=\"sn\"><strong>资金面：</strong>CPO板块内部分化——光模块龙头高位震荡，但<strong>通信线缆及配套</strong>方向逆势净流入39.83亿元。亨通光电主力净流入39.76亿居全市场第一，剑桥科技净流入11.73亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年定义<strong>CPO产业化元年</strong>。英伟达明确Q4启动CPO量产，鸿海CPO全光交换机出货目标上调至5万台以上。LightCounting预测2030年CPO市场规模达100亿美元。中际旭创2026Q1营收194.96亿元（+192%），净利润57.35亿元（+262%）。</p>\n<p class=\"sn\"><strong>情绪面：</strong>光模块龙头短期调整属获利回吐。通信线缆作为CPO新延伸方向获资金持续关注。下周Computex上英伟达Vera Rubin架构相关展示可能进一步催化CPO方向。</p>\n</div>\n\n<hr>\n\n<h2>三、主流净流入板块监控（基于5月29日数据）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿元)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>科技→防御资金大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联延伸，亨通光电领涨</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红+估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>消费复苏+618大促预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台主力净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>10</strong></td><td>免税店概念</td><td><span class=\"green\">+18.59</span></td><td>端午消费旺季+政策利好</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n</table>\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>上周五全市场主力净流出831.55亿元，连续多日净流出</li>\n  <li><strong>电力+公用事业</strong>合计净流入~85亿元；<strong>电子行业</strong>净流出372亿元居首</li>\n  <li>AI相关板块（电子+计算机+通信）合计净流出超过400亿元，相对热度降至冰点</li>\n  <li>通信线缆是AI板块中<strong>唯一的逆势吸金方向</strong>——CPO产业链资金持续活跃</li>\n  <li>北向资金成交4734亿但整体呈净流出态势，外资同步\"高切低\"</li>\n</ul>\n\n<hr>\n\n<h2>四、关键异动个股</h2>\n<table>\n  <tr><th>个股</th><th>代码</th><th>异动</th><th>逻辑</th></tr>\n  <tr><td><strong>亨通光电</strong></td><td>600487</td><td><span class=\"pill pill-up\">主力净流入39.76亿 全市场第一</span></td><td>通信线缆龙头，CPO/算力互联概念延伸受益，获主力资金集中追捧</td></tr>\n  <tr><td><strong>中芯国际</strong></td><td>688981</td><td><span class=\"pill pill-down\">主力净流出31.4亿 全市场第一</span></td><td>半导体龙头获利回吐，高开低走拖累板块</td></tr>\n  <tr><td><strong>博杰股份</strong></td><td>002975</td><td><span class=\"pill pill-up\">涨停</span></td><td>AI算力+业绩爆发(净利增557%)，切入英伟达供应链</td></tr>\n</table>\n\n<hr>\n\n<h2>五、特斯拉机器人概念股解析</h2>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>进度</th></tr>\n  <tr><td><strong>执行器</strong></td><td>三花智控</td><td>002050</td><td>线性/旋转执行器，已进入Optimus验证环节</td><td><span class=\"pill pill-up\">验证中</span></td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器国产龙头，机器人关节核心零部件</td><td><span class=\"pill pill-up\">批量供应</span></td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td><span class=\"pill pill-mid\">送样阶段</span></td></tr>\n  <tr><td><strong>电机</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动龙头，延伸至机器人领域</td><td><span class=\"pill pill-up\">研发中</span></td></tr>\n  <tr><td><strong>结构件</strong></td><td>拓普集团</td><td>601689</td><td>一体化压铸+机器人结构件，平台型扩张</td><td><span class=\"pill pill-mid\">送样阶段</span></td></tr>\n</table>\n<p>特斯拉于5月初宣布Optimus Gen-3已下线投入内部测试，Q2正式启动量产，弗里蒙特汽车产线已开启换产，目标年产能100万台。这将带动国内供应链进入放量验证期。A股核心受益标的中，<strong>三花智控</strong>（执行器）和<strong>绿的谐波</strong>（减速器）确定性最强。</p>\n\n<hr>\n\n<h2>六、总结与展望</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">📌 当前状态</div><div class=\"iv\" style=\"font-size:14px\">A股非交易时段（周日22:00）。上周五科技全面退潮情绪尚待修复，周末消息面平静。白银窄幅震荡于75美元附近。</div></div>\n  <div class=\"info-item\"><div class=\"il\">👀 下周超级催化</div><div class=\"iv\" style=\"font-size:14px\"><strong>1) 6/1 宇树科技科创板IPO上会</strong> — 人形机器人第一股，过会将注入强心剂<br><strong>2) 6/2-6/5 Computex大会</strong> — AI年度最强催化窗口，英伟达/AMD最新产品方案<br><strong>3) 6/5 美国非农数据</strong> — 影响美联储加息节奏和贵金属方向</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 美股指引</div><div class=\"iv\" style=\"font-size:14px\">上周美股三大指数齐创新高（纳指六连涨+0.91%），AI产业热度不减。A股的调整更多是<strong>内部资金博弈的高切低</strong>。若下周Computex催化落地，科技板块企稳概率大。</div></div>\n  <div class=\"info-item\"><div class=\"il\">💡 白银展望</div><div class=\"iv\" style=\"font-size:14px\">COMEX白银在72-80美元区间宽幅震荡，75美元中枢位。下周关注非农数据对美联储降息预期的指引。美元指数若继续走弱将支撑白银向上测试80美元。</div></div>\n  <div class=\"info-item\"><div class=\"il\">⚠️ 风险提示</div><div class=\"iv\" style=\"font-size:14px;color:#f59e0b\">主力资金连续多日大额净流出，若下周Computex/宇树IPO催化不及预期，AI板块调整时间和幅度可能超出预期。仓位管理是第一要务。</div></div>\n  <div class=\"info-item\"><div class=\"il\">🧭 策略建议</div><div class=\"iv\" style=\"font-size:14px\">保持核心仓位不动，利用调整<strong>逢低分批布局</strong>算力/光模块龙头。重点关注Computex大会英伟达Vera Rubin架构细节和CPO产业化时间表。CPO产业链通信线缆方向值得持续跟踪。</div></div>\n</div>\n<blockquote>⚠️ 以上分析基于公开数据整理，不构成投资建议。股市有风险，投资需谨慎。</blockquote>"}, {"id": "mon-20260531-2307", "date": "2026-05-31 23:07", "title": "AI板块周日复盘 · 周末消息汇总 聚焦下周重磅催化", "tags": ["周末复盘", "Computex", "宇树IPO", "白银", "CPO", "高切低"], "summary": "周五科技全线回调科创50暴跌5%。周末消息面平淡酝酿下周双重催化。白银震荡筑底。", "html": "<div class=\"metric-row\">\n  <div class=\"metric-box\"><div class=\"num\">4068.57</div><div class=\"lbs\">上证指数</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-0.73%</div><div class=\"lbs\">上证周跌</div></div>\n  <div class=\"metric-box\"><div class=\"num\">-5.04%</div><div class=\"lbs\">科创50周五</div></div>\n  <div class=\"metric-box\"><div class=\"num\">3.32万亿</div><div class=\"lbs\">周五成交</div></div>\n</div>\n\n<h1>AI板块周日复盘 · 周末消息汇总 聚焦下周重磅催化</h1>\n<p><strong>时间：</strong>2026-05-31 23:07（A股今日休市，非交易日）</p>\n\n<div class=\"tagline\">📌 <strong>核心基调：</strong>本周五大盘高开低走、科技全线退潮，科创50暴跌5.04%，\"高切低\"行情极致演绎。周末消息面相对平静，但下周将迎来两大重磅催化——<strong>宇树科技IPO上会（6/1）</strong>和<strong>Computex大会（6/2-6/5）</strong>，AI板块有望迎来情绪修复。COMEX白银在75-76美元区间震荡筑底，5月月线收涨约2.1%。</div>\n\n<hr>\n\n<h2>📊 零、COMEX白银期货播报</h2>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">COMEX白银期货</div><div class=\"iv\"><strong>75.58美元/盎司</strong> <span class=\"pill pill-down\">-0.43%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">现货白银（伦敦）</div><div class=\"iv\"><strong>75.2美元/盎司</strong> <span class=\"pill pill-mid\">震荡</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">沪银T+D</div><div class=\"iv\"><strong>18,280元/千克</strong> <span class=\"pill pill-mid\">折合18.3元/克</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">美元指数</div><div class=\"iv\"><strong>98.96-99.10</strong> <span class=\"pill pill-down\">持续偏弱</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">COMEX黄金</div><div class=\"iv\"><strong>4,569.9美元/盎司</strong> <span class=\"pill pill-up\">+0.83%</span></div></div>\n</div>\n<p><strong>近期趋势判断：</strong>COMEX白银期货周五（5月29日）收盘报75.58美元/盎司，日内微跌0.43%，5月月线整体上涨约<strong>2.1%</strong>。银价自5月初70美元启动后曾冲高至近90美元（5月13日），后因美国CPI数据超预期大幅回撤至73美元（5月18日），月底在75-76美元附近震荡整理。整体呈现<strong>宽幅震荡筑底</strong>格局，短期运行区间72-80美元。</p>\n<p><strong>驱动因素分析：</strong></p>\n<ul>\n  <li><strong>美元持续走弱：</strong>美元指数报99以下，为近期低位，对贵金属形成支撑</li>\n  <li><strong>通胀粘性：</strong>美国4月PCE同比+3.8%创三年新高，强化抗通胀资产需求</li>\n  <li><strong>CFTC持仓：</strong>截至5月26日当周，COMEX白银投机者净多头持仓减少1,517手至10,244手，显示投机资金短期偏谨慎</li>\n  <li><strong>工业需求：</strong>光伏+AI数据中心建设持续拉动白银工业需求，2026年全球白银供应连续第六年出现短缺，缺口预计达4,630万盎司</li>\n  <li><strong>印度进口关税：</strong>印度将白银进口关税从6%大幅提高至15%，可能减少来自印度的需求，形成短期利空</li>\n  <li><strong>大行观点分歧：</strong>美国银行预测银价Q4冲击100美元，但称涨势\"昙花一现\"，2027年Q2或重回75美元。瑞银则相对谨慎</li>\n</ul>\n<blockquote>💡 白银处于72-80美元区间震荡，短线支撑看72美元，上方压力80美元。5月累计涨约2.1%，年初从70美元附近启动，月线表现尚可。下周关注非农数据和美联储官员表态。</blockquote>\n\n<hr>\n\n<h2>一、大盘解读（周五复盘+一周回顾）</h2>\n<p>A股三大指数周五<strong>高开低走，全线收跌</strong>，科创50暴跌5.04%领跌全场：</p>\n<div class=\"info-grid\">\n  <div class=\"info-item\"><div class=\"il\">上证指数</div><div class=\"iv\">4068.57 <span class=\"pill pill-down\">-0.73%（周线基本持平）</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">深证成指</div><div class=\"iv\">15575.13 <span class=\"pill pill-down\">-1.81%（周线收跌）</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">创业板指</div><div class=\"iv\">4037.95 <span class=\"pill pill-down\">-2.11%</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">科创50</div><div class=\"iv\">1751.32 <span class=\"pill pill-down\">-5.04% 💥</span></div></div>\n  <div class=\"info-item\"><div class=\"il\">两市成交</div><div class=\"iv\"><strong>3.32万亿元</strong>（放量下跌）</div></div>\n</div>\n\n<p><strong>一周回顾：</strong></p>\n<ul>\n  <li><strong>周一至周三：</strong>科技板块持续走强，周三创业板首超沪指创里程碑，半导体全面爆发</li>\n  <li><strong>周四：</strong>\"易中天\"（新易盛/中际旭创/天孚通信）齐创历史新高，AI算力/光模块涨停潮</li>\n  <li><strong>周五：</strong>高开低走全面反转，科技全线退潮，科创50暴跌5%，电子行业净流出372亿</li>\n  <li>全周呈现极致的<strong>\"前高后低\"</strong>走势，两日\"冰火两重天\"</li>\n</ul>\n<p><strong>5月A股整体特征：</strong></p>\n<ul>\n  <li><strong>极端分化行情：</strong>584家公司股价创历史新高，近4,000家公司月线下跌，2,132家跌破2025年4月沪指3000点时价格</li>\n  <li><strong>科创50月涨超11%</strong>领跑各大宽基指数，算力/存储芯片/国产半导体是绝对主线</li>\n  <li><strong>资金极致抱团AI：</strong>机构资金在不确定性环境中对确定性的极致追求，龙头持续上涨吸引跟风资金</li>\n</ul>\n\n<hr>\n\n<h2>二、AI板块整体市场概览</h2>\n<p>周五AI板块<strong>全面回调</strong>，人工智能指数收跌<strong>3.06%</strong>，成交额5,398亿元。</p>\n<p><strong>核心判断：</strong>周五的调整是<strong>交易层面的筹码消化</strong>和<strong>\"高切低\"</strong>资金博弈，而非产业逻辑破坏。AI产业基本面（算力资本开支高增长、HBM供不应求、CPO产业化加速）未发生任何变化。</p>\n<ul>\n  <li><strong>美股指引：</strong>隔夜美股三大指数齐创新高（纳指六连涨+0.91%），费城半导体指数+1%，英伟达/微软/亚马逊上涨——美股AI热度仍在</li>\n  <li><strong>产业面：</strong>Cerebras上市首日大涨89%市值达750亿美元；戴尔AI服务器营收161亿美元(+757%)</li>\n  <li>A股调整更多是<strong>内部资金博弈</strong>和\"利好兑现\"后的获利回吐</li>\n</ul>\n\n<hr>\n\n<h2>三、细分领域动态</h2>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 算力板块 <span class=\"pill pill-down\">周五大幅回调</span> <span class=\"pill pill-mid\">情绪 谨慎偏空</span></div>\n<p class=\"sn\"><strong>资金面：</strong>电子行业周五主力净流出372亿元居全行业第一。中芯国际主力净流出31.4亿居全市场首位。算力ETF全线下跌，创业板人工智能ETF华安(159279)跌2.02%。</p>\n<p class=\"sn\"><strong>政策面：</strong>下周<strong>6/2-6/5 Computex大会</strong>以\"AI Together\"为主题，英伟达CEO黄仁勋将发表主题演讲，预计公布Vera Rubin架构最新进展。工信部等十部门联合印发《人工智能科技伦理审查与服务办法》。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年全球AI算力报告发布——AI芯片围绕GPU/TPU/NPU多元方向持续演进，异构计算加速完善。Cerebras晶圆级AI芯片上市首日大涨89%。谷歌、微软、Meta、亚马逊2026年合计资本支出7,250亿美元（+77%），创历史新高。</p>\n<p class=\"sn\"><strong>情绪面：</strong>周五获利了结情绪浓厚，但产业数据趋势向上。Computex大会前资金以观望为主，大会期间的催化剂有望带动情绪反转。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 存储板块 <span class=\"pill pill-mid\">情绪 中性偏谨慎</span></div>\n<p class=\"sn\"><strong>资金面：</strong>跟随半导体整体回调。北向资金在存储龙头上交投活跃（澜起科技沪股通成交42亿、兆易创新33.86亿），但方向偏流出。佰维存储周五逆势上涨0.94%，成为板块中少有的红盘股。</p>\n<p class=\"sn\"><strong>基本面：</strong>HBM景气度持续超预期——<strong>HBM3E现货价半年暴涨超300%</strong>，全球DRAM营收2026Q1逼近<strong>970亿美元</strong>（环比+80%，同比+260%）创历史新高。三星率先交付首批12层48GB HBM4E样品。集邦预测2026年HBM需求再增70%+。HBM已取代GPU成为AI硬件的\"第一刚需\"。</p>\n<p class=\"sn\"><strong>情绪面：</strong>产业数据极为强劲，但股价已充分反映涨价预期。中长期来看，HBM仍是整个AI产业链中<strong>供需格局最紧张</strong>的环节。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 机器人板块 <span class=\"pill pill-mid\">情绪 关注宇树上会</span></div>\n<p class=\"sn\"><strong>资金面：</strong>周五板块随大市回调，但整体跌幅小于算力/半导体。5月27日板块净流出143亿后抛压逐步消化。</p>\n<p class=\"sn\"><strong>基本面：</strong><strong>明天（6月1日）宇树科技科创板IPO上会！</strong>这是A股\"人形机器人第一股\"的历史性时刻，拟募资42.02亿元。产业趋势持续加速——4月工业机器人出口量突破2.5万台（同比+90%）。特斯拉Optimus Gen-3预计2026年7-8月启动量产，首代设计产能100万台/年。</p>\n<p class=\"sn\"><strong>情绪面：</strong>宇树科技上会结果将是下周机器人板块最强催化剂。若顺利过会，将大幅提振市场对人形机器人赛道的信心。当前调整是<strong>催化剂释放前的\"真空期\"</strong>。</p>\n</div>\n\n<div class=\"sect-card\">\n<div class=\"sh\">🔷 CPO板块 <span class=\"pill pill-up\">通信线缆逆势走强</span> <span class=\"pill pill-up\">情绪 结构性乐观</span></div>\n<p class=\"sn\"><strong>资金面：</strong>板块内部分化——光模块龙头中际旭创高位震荡，但<strong>通信线缆及配套</strong>板块周五逆势净流入<strong>39.83亿元</strong>。亨通光电主力净流入<strong>39.76亿元</strong>居全市场第一，剑桥科技净流入11.73亿、长飞光纤净流入10.39亿。</p>\n<p class=\"sn\"><strong>基本面：</strong>2026年机构定义为<strong>CPO产业化元年</strong>。英伟达明确Q4启动CPO量产，鸿海集团CPO全光交换机出货目标从此前1万台上调至5万台以上。光模块一季报亮眼——源杰科技净利润同比暴增1,153%，长光华芯涨幅超180%，光迅科技涨幅超106%。</p>\n<p class=\"sn\"><strong>情绪面：</strong>资金正在CPO产业链中寻找\"新面孔\"——通信线缆方向获集中配置。光模块龙头短期调整属获利回吐，中长期逻辑未变。下周Computex大会预计有更多CPO技术和产品展示。</p>\n</div>\n\n<hr>\n\n<h2>四、主流净流入板块监控（周五5/29）</h2>\n<table>\n  <tr><th>#</th><th>板块</th><th>净流入(亿)</th><th>驱动原因</th><th>类型</th></tr>\n  <tr><td><strong>1</strong></td><td>电力</td><td><span class=\"green\">+43.08</span></td><td>防御属性+夏季用电高峰预期</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>2</strong></td><td>公用事业</td><td><span class=\"green\">+41.74</span></td><td>资金从科技向防御方向大迁徙</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>3</strong></td><td>通信线缆及配套</td><td><span class=\"green\">+39.83</span></td><td>CPO/算力互联概念延伸</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n  <tr><td><strong>4</strong></td><td>印制电路板</td><td><span class=\"green\">+28.51</span></td><td>AI服务器PCB需求持续放量</td><td><span class=\"pill pill-up\">业绩驱动</span></td></tr>\n  <tr><td><strong>5</strong></td><td>火力发电</td><td><span class=\"green\">+24.79</span></td><td>防御+高分红估值洼地</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>6</strong></td><td>食品饮料</td><td><span class=\"green\">+21.60</span></td><td>618大促预期+消费复苏</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>7</strong></td><td>商贸零售</td><td><span class=\"green\">+20.22</span></td><td>端午消费旺季预期</td><td><span class=\"pill pill-mid\">事件驱动</span></td></tr>\n  <tr><td><strong>8</strong></td><td>白酒Ⅲ</td><td><span class=\"green\">+18.43</span></td><td>贵州茅台净流入9.19亿</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>9</strong></td><td>白酒Ⅱ</td><td><span class=\"green\">+18.43</span></td><td>消费板块资金集中涌入</td><td><span class=\"pill pill-mid\">防御配置</span></td></tr>\n  <tr><td><strong>10</strong></td><td>通信设备</td><td><span class=\"green\">+13.13</span></td><td>CPO/5G/光通信产业链</td><td><span class=\"pill pill-up\">产业驱动</span></td></tr>\n</table>\n\n<p><strong>资金流向核心发现：</strong></p>\n<ul>\n  <li>全市场主力净流出<strong>831.55亿元</strong>，连续多日净流出的态势延续</li>\n  <li><strong>电子行业</strong>净流出<strong>372.05亿</strong>居全行业第一；机械设备/电力设备均超100亿</li>\n  <li><strong>电力+公用事业</strong>合计净流入约85亿，资金从科技全面撤退至防御方向</li>\n  <li>通信线缆是AI板块中<strong>唯一的逆势吸金方向</strong></li>\n  <li>AI相关板块（电子+计算机+通信）合计净流出超过<strong>400亿元</strong></li>\n</ul>\n\n<hr>\n\n<h2>五、特斯拉机器人概念股解析</h2>\n<p>特斯拉Optimus Gen-3量产预期是2026年最确定的产业趋势之一，A股核心受益环节全面梳理：</p>\n<table>\n  <tr><th>环节</th><th>核心公司</th><th>代码</th><th>受益逻辑</th><th>优先级</th><th>订单/进展</th></tr>\n  <tr><td><strong>执行器（线性）</strong></td><td>拓普集团</td><td>601689</td><td>Optimus V3线性执行器独家（腿/腰大关节），单机约1.5万元</td><td>⭐⭐⭐</td><td>已签40亿+订单；墨西哥工厂配套全球交付</td></tr>\n  <tr><td><strong>执行器（旋转）</strong></td><td>三花智控</td><td>002050</td><td>旋转关节总成独家（14个上肢关节）+全套液冷，单机约3万元</td><td>⭐⭐⭐</td><td>锁定54亿订单</td></tr>\n  <tr><td><strong>减速器</strong></td><td>绿的谐波</td><td>688017</td><td>谐波减速器龙头，V3单台用14-20个，唯一规模化进T链</td><td>⭐⭐⭐</td><td>产能持续扩张</td></tr>\n  <tr><td><strong>滚柱丝杠</strong></td><td>五洲新春</td><td>603667</td><td>行星滚柱丝杠核心，V3单机34根，腿部关键传动</td><td>⭐⭐</td><td>受周五板块暴跌拖累封死跌停</td></tr>\n  <tr><td><strong>电机（灵巧手）</strong></td><td>鸣志电器</td><td>603728</td><td>空心杯电机独家，用于V3灵巧手，高功率密度</td><td>⭐⭐</td><td>高价值小批量</td></tr>\n  <tr><td><strong>传感器</strong></td><td>柯力传感</td><td>603662</td><td>力矩传感器潜在供应商，国产替代空间大</td><td>⭐⭐</td><td>进展中</td></tr>\n  <tr><td><strong>电机/驱动</strong></td><td>汇川技术</td><td>300124</td><td>伺服电机/驱动系统龙头，工业自动化延伸至机器人</td><td>⭐⭐</td><td>平台型公司</td></tr>\n</table>\n<p><strong>操作思路：</strong>机器人板块目前处于<strong>\"产业趋势确定但业绩尚未大规模兑现\"</strong>的阶段。核心仓位以拓普集团、三花智控、绿的谐波为主，逢低布局。明天宇树科技IPO上会结果将是板块短期方向的关键催化剂。</p>\n\n<hr>\n\n<h2>六、主力资金增仓TOP10个股（周五5/29）</h2>\n<table>\n  <tr><th>#</th><th>个股</th><th>代码</th><th>净流入(亿元)</th></tr>\n  <tr><td><strong>1</strong></td><td>亨通光电</td><td>600487</td><td><span class=\"green\">+39.76</span></td></tr>\n  <tr><td><strong>2</strong></td><td>长芯博创</td><td>—</td><td><span class=\"green\">+13
